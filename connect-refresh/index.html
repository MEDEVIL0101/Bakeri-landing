<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Returning to Bakeri…</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAF6EE;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1A130F;
    text-align: center;
  }
  .msg { padding: 24px; }
  a { color: #1A130F; }
</style>
</head>
<body>
  <div class="msg">
    <p>Your Stripe setup link expired — returning to Bakeri to start again…</p>
    <p><a href="bakeri://connect-refresh">Tap here if you're not redirected automatically</a></p>
  </div>
  <script>
    // Stripe Account Links requires a real https:// refresh_url — it can't
    // redirect straight to a custom app scheme. This page is that bridge:
    // Stripe lands here, then we immediately hand off to the app.
    window.location.href = "bakeri://connect-refresh";
  </script>
</body>
</html>
