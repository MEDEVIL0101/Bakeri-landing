    document.getElementById('sf-root').classList.toggle('square', design.corners === 'square');
  }

  // Per-card colour overrides (entry.colors / design.identity.colors):
  // background, title, button. Text, muted text and dividers follow the
  // background automatically so a dark card stays readable.
  function applyCardColors(el, colors) {
    if (!el) return;
    ['--card-bg', '--card-text', '--card-muted', '--card-line', '--card-title', '--btn-bg', '--btn-fg'].forEach(function (v) {
      el.style.removeProperty(v);
    });
    if (!colors || typeof colors !== 'object') return;
    const bg = validHex(colors.background);
    let darkBg = false;
    if (bg) {
      darkBg = readableOn(bg) === '#ffffff';
      el.style.setProperty('--card-bg', bg);
      el.style.setProperty('--card-text', darkBg ? '#ffffff' : '#201e1d');
      el.style.setProperty('--card-muted', darkBg ? 'rgba(255,255,255,.78)' : '#444141');
      el.style.setProperty('--card-line', darkBg ? 'rgba(255,255,255,.18)' : 'rgba(32,30,29,.12)');
    }
    const text = validHex(colors.text);
    if (text) {
      el.style.setProperty('--card-text', text);
      const rgb = hexRgb(text);
      el.style.setProperty('--card-muted', 'rgba(' + rgb.join(',') + ',.82)');
    }
    const title = validHex(colors.title);
    if (title) el.style.setProperty('--card-title', title);
    else if (darkBg) el.style.setProperty('--card-title', '#ffffff');
    const btn = validHex(colors.button);
    if (btn) {
      el.style.setProperty('--btn-bg', btn);
      el.style.setProperty('--btn-fg', readableOn(btn));
    }
  }

  // ══════════════════════ Background ══════════════════════
  //
  // storefront_design.background.mode:
  //   'theme'      — theme background colour + pattern (theme.js layer)
  //   'image_top'  — image across the top, always fading into a base colour
  //   'image_full' — image covering the whole page
  //   unset        — 'image_top' if the baker has a header image, else
  //                  'theme'. This is how every existing baker's header
  //                  photo becomes their faded top at launch with no data
  //                  migration: same Storage path, new treatment.
  // Fade/base colour = background.fade_color, else the theme background.

  let bgToken = 0;
  let bgRatio = 0;
  let bgMode = 'theme';
  // The photo currently painted, so a re-render with the same photo doesn't
  // blank it to the theme colour first.
  let bgShownUrl = null;

  // The page's base colour: what the top image fades into, the frame's fill
  // and everything outside the frame (photo modes) / the theme background
  // (theme mode). Baker's choice, else the theme bg.
  function baseColor() {
    const b = (design.background && typeof design.background === 'object') ? design.background : {};
    return validHex(b.color) || validHex(b.fade_color) || themeBgLight();
  }

  function themeBgLight() {
    const T = currentTheme();
    return (T && T.bg && T.bg.light) || '#FAF6EE';
  }

  // Only the bold two-colour stripes/gingham are dark enough behind the
  // shop name to need white text; every other pattern is a pale texture
  // (it gets the white halo instead — see name-on-photo).
  function themePatternIsBusy() {
    const T = currentTheme() || {};
    const pattern = (profile && profile.background_pattern) || 'Standard';
    if (pattern === 'Stripes') return !!T.bold;
    if (pattern === 'Gingham') return !!T.bold && !T.legacyGingham;
    return false;
  }

  function setNameOnDark(onDark) {
    document.getElementById('sf-root').classList.toggle('name-on-dark', !!onDark);
  }

  // pendingPhoto: a header photo is on its way — paint the plain base colour
  // (theme tokens, no pattern layer) so visitors don't see the theme pattern
  // flash up before the photo swaps in. The pattern only appears if the
  // photo fails to load.
  function useThemeBackground(pendingPhoto) {
    bgMode = 'theme';
    bgShownUrl = null;
    document.getElementById('sf-bg-top').classList.add('hidden');
    document.getElementById('sf-bg-full').classList.add('hidden');
    document.documentElement.style.background = baseColor();
    if (window.BakeriTheme) window.BakeriTheme.apply(profile, { forceLight: true, suppressPatternLayer: !!pendingPhoto });
    // Full-width theme: theme.js's fixed full-screen pattern layer stays
    // where it is and the photo frame is hidden (see .bg-theme).
    document.getElementById('sf-root').classList.add('bg-theme');
    const patterned = ((profile && profile.background_pattern) || 'Standard') !== 'Standard';
    document.getElementById('sf-root').classList.toggle('name-on-photo', patterned);
    setNameOnDark(themePatternIsBusy());
  }

  function renderBackground() {
    const b = (design.background && typeof design.background === 'object') ? design.background : {};
    const fade = baseColor();
    document.documentElement.style.setProperty('--fade-base', fade);
    const token = ++bgToken;
    const url = b.mode === 'theme' ? null : (b.image_url || (profile && profile.__preview_header_data_url) ||
      assetURL('/storefront-headers/' + resolvedBakerId.toUpperCase() + '/header.jpg'));
    if (url && url === bgShownUrl) {
      // Same photo already on screen (the builder re-renders on every colour
      // or focus change): keep it up and just refresh the fade colour —
      // repainting the theme first flashed the whole page in that colour.
      document.documentElement.style.background = fade;
    } else {
      useThemeBackground(!!url); // paints immediately; swapped out below once an image loads
    }
    if (!url) return;

    const img = new Image();
    // No photo after all (none uploaded, or it failed): show the full theme.
    img.onerror = function () { if (token === bgToken) useThemeBackground(); };
    img.onload = function () {
      if (token !== bgToken) return; // a newer render already replaced this
      const full = b.mode === 'image_full';
      bgMode = full ? 'image_full' : 'image_top';
      bgShownUrl = url;
      bgRatio = img.naturalHeight / img.naturalWidth;
      const layer = document.getElementById('theme-pattern-layer');
      if (layer) layer.remove();
      document.documentElement.style.background = fade;
      const on = document.getElementById(full ? 'sf-bg-full' : 'sf-bg-top');
      const off = document.getElementById(full ? 'sf-bg-top' : 'sf-bg-full');
      on.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
      // Faded top keeps the image's top edge pinned (that's what fades);
      // full-page crops around the subject.
      const bgFocus = b.focus || designFocus('background');
      on.style.backgroundPosition = full
        ? focusPosition(bgFocus, img.naturalWidth, img.naturalHeight)
        : (bgFocus ? focusPosition(bgFocus).split(' ')[0] + ' top' : 'center top');
      // Full-page photo raised by b.raise % of the screen height (0–30), so a
      // face that sits low in the photo clears the shop name. The photo keeps
      // its size (no extra enlarging) and slides up; its bottom edge fades
      // into the page colour behind the cards. On a phone a square or
      // landscape photo has no spare height, so focus alone can't move it up.
      const frameW = document.getElementById('sf-frame').clientWidth || window.innerWidth;
      const soft = full && img.naturalWidth > 0 && frameW > img.naturalWidth * 1.25;
      on.classList.toggle('soft', soft);
      // Logo turned off, but on a wide screen the photo is only a soft
      // backdrop, so the same photo shows sharp in the logo circle instead
      // (the phone keeps the full photo and no circle).
      if (full && design.identity && design.identity.logo === 'none') {
        const av = document.getElementById('pb-avatar');
        document.getElementById('sf-root').classList.toggle('no-logo', !soft);
        av.classList.toggle('hidden', !soft);
        if (soft && !av.querySelector('img[data-bg-portrait]')) {
          av.querySelectorAll('img').forEach(function (n) { n.remove(); });
          const pic = document.createElement('img');
          pic.dataset.bgPortrait = '1';
          pic.alt = '';
          pic.src = url;
          pic.style.display = 'block';
          av.appendChild(pic);
          document.getElementById('pb-avatar-letter').style.display = 'none';
        }
      }
      const raise = full && !soft ? Math.max(0, Math.min(30, Number(b.raise) || 0)) : 0;
      const raiseMask = raise ? 'linear-gradient(180deg, #000 0, #000 calc(100% - ' + (raise + 12) + 'svh), transparent calc(100% - ' + raise + 'svh))' : '';
      on.style.transform = soft ? 'scale(1.12)' : (raise ? 'translateY(-' + raise + 'svh)' : '');
      on.style.webkitMaskImage = raiseMask;
      on.style.maskImage = raiseMask;
      on.classList.remove('hidden');
      off.classList.add('hidden');
      document.getElementById('sf-root').classList.add('name-on-photo');
      document.getElementById('sf-root').classList.remove('bg-theme');
      sizeTopBackground();
      sampleImageIsDark(url, full, function (dark) { if (token === bgToken) setNameOnDark(dark); });
    };
    img.src = url;
  }

  // Full width at the image's natural ratio (scaled), cropped to a taller
  // minimum on narrow screens so a landscape photo still reads as a
  // backdrop behind the logo and name.
  function sizeTopBackground() {
    if (bgMode !== 'image_top' || !bgRatio) return;
    const top = document.getElementById('sf-bg-top');
    const w = document.getElementById('sf-frame').clientWidth;
    const compact = document.getElementById('sf-root').classList.contains('compact');
    top.style.height = Math.round(Math.max(w * bgRatio, compact ? 440 : 360)) + 'px';
  }

  // Average luminance of the part of the photo behind the logo + name
  // (the upper-middle band for a top image, the upper half for full-page).
  // Needs a CORS-clean read; if the canvas is tainted we assume dark, since
  // white text with a heavy shadow is the safe default on a photo.
  function sampleImageIsDark(url, full, done) {
    const probe = new Image();
    probe.crossOrigin = 'anonymous';
    probe.onload = function () {
      try {
        const c = document.createElement('canvas');
        c.width = 24; c.height = 24;
        const ctx = c.getContext('2d');
        const sh = probe.naturalHeight * (full ? 0.5 : 0.45);
        const sy = probe.naturalHeight * (full ? 0 : 0.1);
        ctx.drawImage(probe, probe.naturalWidth * 0.2, sy, probe.naturalWidth * 0.6, sh, 0, 0, 24, 24);
        const d = ctx.getImageData(0, 0, 24, 24).data;
        let sum = 0;
        for (let i = 0; i < d.length; i += 4) sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
        done(sum / (d.length / 4) < 0.6);
      } catch (e) { done(true); }
    };
    probe.onerror = function () { done(true); };
    probe.src = url;
  }

  // ══════════════════════ Builder tap-to-select bridge ══════════════════════
  //
  // Preview-mode only. Same messages as index.html ({type:'select',
  // blockType} / {type:'rects'}) using the v1 block types today's iOS
  // builder understands — a merged v2 card reports whichever v1 part was
  // tapped (data-bt), so the right existing editor opens.
  const BLOCK_CONTAINER_IDS = {
    menu:     ['feed'],
    physical: ['physical-feed'],
    digital:  ['digital-feed'],
    links:    ['links-feed'],
    about:    ['pb-about'],
    faq:      ['faq-col'],
    policies: ['pb-policies'],
    hours:    ['hours-card'],
    emailCapture: ['email-capture', 'sf-magnet']
  };
  let builderTapTargetsWired = false;
  let rectReportScheduled = false;

  function bakeriBridgePost(message) {
    if (!isPreviewMode) return;
    if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.bakeriBridge) return;
    window.webkit.messageHandlers.bakeriBridge.postMessage(message);
  }

  function firstVisibleBt(card, fallback) {
    const parts = card.querySelectorAll('[data-bt]');
    for (let i = 0; i < parts.length; i++) {
      if (!parts[i].classList.contains('hidden')) return parts[i].dataset.bt;
    }
    return fallback;
  }

  function builderTypeFor(card, target) {
    const block = card.dataset.block;
    if (isBuilderV2) return block;
    if (block === 'products' || block === 'info') {
      const part = target.closest && target.closest('[data-bt]');
      if (part && card.contains(part)) return part.dataset.bt;
      return firstVisibleBt(card, block === 'products' ? 'physical' : 'policies');
    }
    if (block === 'leadMagnet') return leadFromCapture ? 'emailCapture' : 'leadMagnet';
    return block;
  }

  function wireBuilderTapTargets() {
    return; // demo page: no builder, taps act normally
    builderTapTargetsWired = true;
    document.querySelectorAll('[data-block]').forEach(function (card) {
      card.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        bakeriBridgePost({ type: 'select', blockType: builderTypeFor(card, e.target) });
      }, { capture: true });
    });
    if (isBuilderV2) {
      // The profile is the logo, shop name and intro card; a tap anywhere
      // else that isn't a card (the page background, the gaps between
      // cards) opens the site-wide Design sheet.
      document.addEventListener('click', function (e) {
        const t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('[data-block]') || t.closest('.scrim') || t.closest('#bk-layer, .bk-box, .bk-pill')) return;
        e.preventDefault();
        e.stopPropagation();
        const isProfile = t.closest('#sf-intro-card, #pb-avatar, #shop-name');
        bakeriBridgePost({ type: 'select', blockType: isProfile ? 'identity' : 'design' });
      }, { capture: true });
      return;
    }
    const hero = document.getElementById('profile-block');
    if (hero) {
      hero.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        bakeriBridgePost({ type: 'select', blockType: 'identity' });
      }, { capture: true });
    }
  }

  function scheduleRectReport() {
    if (!isPreviewMode || rectReportScheduled) return;
    rectReportScheduled = true;
    requestAnimationFrame(function () {
      rectReportScheduled = false;
      reportAllRects();
    });
  }

  function unionRect(a, b) {
    if (!a) return b;
    if (!b) return a;
    const x = Math.min(a.x, b.x);
    const y = Math.min(a.y, b.y);
    return {
      x: x, y: y,
      width: Math.max(a.x + a.width, b.x + b.width) - x,
      height: Math.max(a.y + a.height, b.y + b.height) - y,
    };
  }

  function visibleRect(el) {
    if (!el || el.classList.contains('hidden') || el.closest('.hidden')) return null;
    const b = el.getBoundingClientRect();
    if (b.width === 0 && b.height === 0) return null;
    return { x: b.left, y: b.top, width: b.width, height: b.height };
  }

  function reportAllRects() {
    if (!isPreviewMode) return;
    const rects = {};
    Object.keys(BLOCK_CONTAINER_IDS).forEach(function (blockType) {
      let r = null;
      BLOCK_CONTAINER_IDS[blockType].forEach(function (id) {
        r = unionRect(r, visibleRect(document.getElementById(id)));
      });
      if (r) rects[blockType] = r;
    });
    const hero = visibleRect(document.getElementById('profile-block'));
    if (hero) rects['identity'] = hero;
    const form = visibleRect(document.getElementById('form-storefront'));
    if (form) rects['form'] = form;
    bakeriBridgePost({ type: 'rects', rects: rects, scrollY: window.scrollY });
  }

  if (isPreviewMode) {
    window.addEventListener('scroll', scheduleRectReport, { passive: true });
    window.addEventListener('resize', scheduleRectReport);
  }

  // ══════════════════════ Photo focus (smart cropping) ══════════════════════
  //
  // Every photo here is cropped with object-fit / background-size: cover,
  // which by default centres the crop — on a portrait photo of a person
  // that's their torso, and as the box changes shape the crop slides down
  // to their knees. So:
  //   1. an explicit focal point wins — {x, y} in % (0–100), set by the
  //      baker in the builder ("tap the subject"): storefront_design.focus
  //      .about / .background / .logo / .items[listingId], and
  //      storefront_design.links[linkId].focus
  //   2. otherwise a portrait-shaped photo is anchored toward its upper part
  //      (where faces almost always are); landscape/square stay centred.
  function focusPosition(focus, w, h) {
    if (focus && typeof focus === 'object' && isFinite(focus.x) && isFinite(focus.y)) {
      const c = function (v) { return Math.max(0, Math.min(100, Number(v))); };
      return c(focus.x) + '% ' + c(focus.y) + '%';
    }
    if (w && h && h > w * 1.05) return '50% 22%';
    return '50% 50%';
  }
  function designFocus(key) {
    const f = design && design.focus;
    return (f && typeof f === 'object') ? f[key] : null;
  }
  function itemFocus(item) {
    const items = designFocus('items');
    if (!items || typeof items !== 'object' || !item) return null;
    return items[String(item.id).toLowerCase()] || items[String(item.id).toUpperCase()] || null;
  }
  // Per-link look stored in storefront_design.links[linkId] (outline_color,
  // focus) — kept out of baker_links so the live page/app never see it.
  function linkDesign(l) {
    const all = design && design.links;
    if (!all || typeof all !== 'object' || !l || !l.id) return {};
    return all[String(l.id).toLowerCase()] || all[String(l.id).toUpperCase()] || {};
  }
  function focusImage(img, focus) {
    img.style.objectPosition = focusPosition(focus, img.naturalWidth, img.naturalHeight);
  }
  // For CSS background images (link cards): measure, then position.
  function focusBackground(el, url, focus) {
    const probe = new Image();
    probe.onload = function () { el.style.backgroundPosition = focusPosition(focus, probe.naturalWidth, probe.naturalHeight); };
    probe.src = url;
  }

  // ══════════════════════ Profile top ══════════════════════

  function renderAvatar(name) {
    // Preview mode: a just-picked logo not yet uploaded comes through as a
    // data: URI so the canvas reflects the draft.
    const logoURL = (profile && profile.__preview_logo_data_url)
      || assetURL('/business-logos/' + resolvedBakerId.toUpperCase() + '/logo.jpg');
    const el = document.getElementById('pb-avatar');
    const noLogo = !!(design && design.identity && design.identity.logo === 'none');
    document.getElementById('sf-root').classList.toggle('no-logo', noLogo);
    el.classList.toggle('hidden', noLogo);
    if (noLogo) return;
    const letterEl = document.getElementById('pb-avatar-letter');
    letterEl.textContent = name.charAt(0).toUpperCase();
    // Every builder re-render (each edit, autosave, sync) runs this — keep the
    // logo that's already showing when it's the same image, instead of
    // swapping back to the letter and reloading it (the logo flashed).
    const existing = el.querySelector('img');
    if (existing && existing.dataset.src === logoURL) {
      focusImage(existing, designFocus('logo'));
      return;
    }
    letterEl.style.display = '';
    el.querySelectorAll('img').forEach(function (n) { n.remove(); });
    const img = document.createElement('img');
    img.alt = name;
    img.onload = function () { focusImage(img, designFocus('logo')); img.style.display = 'block'; letterEl.style.display = 'none'; };
    img.dataset.src = logoURL;
    img.src = logoURL;
    el.appendChild(img);
  }

  // Guesses the platform from the URL's hostname — the baker only enters a
  // plain URL in her "Social" link section. Shown as text links under the
  // nav (handoff), not icons.
  function socialPlatform(url) {
    // Email (mailto:) — a customer taps the envelope to write to the vendor.
    if (/^mailto:/i.test(String(url || '').trim())) return { label: 'Email', icon: 'email' };
    let host = '';
    try { host = new URL(url).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { /* generic */ }
    if (host.indexOf('instagram') !== -1) return { label: 'Instagram', icon: 'instagram' };
    if (host.indexOf('tiktok') !== -1) return { label: 'TikTok', icon: 'tiktok' };
    if (host.indexOf('facebook') !== -1) return { label: 'Facebook', icon: 'facebook' };
    if (host === 'x.com' || host.indexOf('twitter') !== -1) return { label: 'X', icon: 'x' };
    if (host.indexOf('pinterest') !== -1) return { label: 'Pinterest', icon: 'pinterest' };
    if (host.indexOf('linkedin') !== -1) return { label: 'LinkedIn', icon: 'linkedin' };
    if (host.indexOf('whatsapp') !== -1 || host === 'wa.me') return { label: 'WhatsApp', icon: 'whatsapp' };
    return { label: host || 'Link', icon: null };
  }

  function linkSections() {
    const seen = [];
    allLinks.forEach(function (l) {
      if (l.section && seen.indexOf(l.section) === -1) seen.push(l.section);
    });
    return seen;
  }
  function isSocialSection(section) { return (section || '').trim().toLowerCase() === 'social'; }

  function renderSocialIcons() {
    const wrap = document.getElementById('social-icons');
    const items = allLinks.filter(function (l) { return isSocialSection(l.section); });
    wrap.classList.toggle('hidden', items.length === 0);
    wrap.innerHTML = items.map(function (l) {
      const platform = socialPlatform(l.url);
      const inner = platform.icon
        ? '<span class="social-icon-mask" style="-webkit-mask-image:url(../assets/social/' + platform.icon + '.png);mask-image:url(../assets/social/' + platform.icon + '.png)"></span>'
        : '<span class="social-icon-fallback">' + ARROW_UR_SVG + '</span>';
      // mailto: opens the mail app — a new tab would just be left blank.
      const newTab = platform.icon === 'email' ? '' : ' target="_blank" rel="noopener noreferrer"';
      return '<a class="social-icon" data-track="social_click" data-track-ref="' + escapeHtml(l.id) + '" href="' + escapeHtml(l.url) + '"' + newTab + ' ' +
        'title="' + escapeHtml(platform.label) + '" aria-label="' + escapeHtml(platform.label) + '">' + inner + '</a>';
    }).join('');
  }

  // ══════════════════════ Lead magnet (Free download) ══════════════════════

  function leadMagnetConfig() {
    const c = blockCfg.leadMagnet || {};
    const p = profile || {};
    const listingId = c.listing_id || (leadFromCapture ? p.email_capture_deliverable_listing_id : null) || null;
    const heading = String(c.title || c.heading || (leadFromCapture ? p.email_capture_heading : '') || '').trim() || 'Free download';
    const body = String(c.body || (leadFromCapture ? p.email_capture_body : '') || '').trim();
    return { listingId: listingId, heading: heading, body: body };
  }

  // The optional picture on a rich capture card (entry.image_url, uploaded
  // from the builder); the Free download card falls back to its file's
  // listing photo.
  function fillRichMedia(box, url, fallbackUrl) {
    box.innerHTML = '';
    const src = url || fallbackUrl;
    if (!src) return;
    const img = document.createElement('img');
    img.alt = '';
    img.onload = function () { focusImage(img, null); };
    img.onerror = function () {
      if (fallbackUrl && img.src !== fallbackUrl && src !== fallbackUrl) { img.src = fallbackUrl; return; }
      box.innerHTML = '';
    };
    img.src = src;
    box.appendChild(img);
  }

  function renderLeadMagnet() {
    const card = document.getElementById('sf-magnet');
    const cfg = leadMagnetConfig();
    if (!cfg.listingId) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-magnet-title').textContent = cfg.heading;
    document.getElementById('sf-magnet-body').textContent = cfg.body;
    fillRichMedia(document.getElementById('sf-magnet-thumb'),
      (blockCfg.leadMagnet || {}).image_url, itemImgURL({ id: String(cfg.listingId) }));

    const action = document.getElementById('sf-magnet-action');
    action.innerHTML = captureFormMarkup('magnet', 'Send it to me');
    wireCaptureForm(document.getElementById('magnet-form'), 'lead_magnet', cfg.listingId, function () {
      action.innerHTML = '<div class="sf-capture-done">' + CHECK_SVG + '<span>Check your inbox — it\'s on its way.</span></div>';
    });
  }

  // ══════════════════════ Menu (Shop my Menu) ══════════════════════

  function menuListings() { return allListings.filter(function (l) { return l.listing_kind !== 'digital' && l.listing_kind !== 'physical'; }); }
  function digitalListings() { return allListings.filter(function (l) { return l.listing_kind === 'digital'; }); }
  function physicalListings() { return allListings.filter(function (l) { return l.listing_kind === 'physical'; }); }

  function slugify(str) {
    return (str || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'other';
  }
  function titleCase(str) {
    return (str || '').toLowerCase().replace(/\b([a-z])/g, function (m, c) { return c.toUpperCase(); });
  }
  // Listing sections: each listing's free-text category ("Halloween", "Gift
  // boxes"), in the order the vendor set (storefront_design.section_order,
  // matched case-insensitively), then alphabetically. Listings with no
  // section form the last group.
  function sectionRank(name) {
    const order = (design && Array.isArray(design.section_order)) ? design.section_order : [];
    const i = order.findIndex(function (n) { return String(n).trim().toLowerCase() === name.trim().toLowerCase(); });
    return i === -1 ? Infinity : i;
  }
  function groupByCategory(items, fallbackName) {
    const map = {}, names = {};
    items.forEach(function (item) {
      const raw = (item.category || '').trim();
      const key = raw ? raw.toLowerCase() : '\u0000none';
      if (!map[key]) { map[key] = []; names[key] = raw || fallbackName; }
      map[key].push(item);
    });
    return Object.keys(map).sort(function (a, b) {
      if (a === '\u0000none' || b === '\u0000none') return a === '\u0000none' ? 1 : -1;
      const ra = sectionRank(names[a]), rb = sectionRank(names[b]);
      return ra !== rb ? ra - rb : names[a].localeCompare(names[b]);
    }).map(function (key) {
      return { category: names[key], slug: slugify(names[key]), items: map[key], unsectioned: key === '\u0000none' };
    });
  }
  // Groups worth a heading: 2+ groups (one lone section, or none, reads as before).
  function sectionGroups(items, fallbackName) {
    const groups = groupByCategory(items, fallbackName);
    return groups.length >= 2 ? groups : null;
  }

  function listingsForTab(t) {
    if (t === 'all') return menuListings();
    const kind = t === 'now' ? 'ready_now' : (t === 'pre' ? 'preorder' : 'custom');
    return menuListings().filter(function (l) { return l.listing_kind === kind; });
  }

  function menuSubline(items) {
    const kinds = {};
    items.forEach(function (l) { kinds[l.listing_kind] = true; });
    const parts = [];
    if (kinds.ready_now) parts.push('Ready now');
    if (kinds.preorder) parts.push('Pre-order');
    if (kinds.custom) parts.push('Made to order');
    return parts.join(' · ');
  }

  function renderMenuCard() {
    const card = document.getElementById('feed');
    const items = menuListings();
    if (sfListing || items.length === 0) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('feed-title').textContent = cardTitle('menu');
    document.getElementById('feed-sub').textContent = menuSubline(items);
    if (items.length === 1) {
      document.getElementById('filter-strip').innerHTML = '';
      const body = document.getElementById('product-grid');
      body.innerHTML = '';
      body.appendChild(buildWideTile(items[0]));
      return;
    }
    renderFilterBar();
    renderGrid();
  }

  // Chips only once they can actually split something (2+ kinds).
  function renderFilterBar() {
    const bar = document.getElementById('filter-strip');
    const distinctKinds = new Set(menuListings().map(function (l) { return l.listing_kind; }));
    if (distinctKinds.size <= 1) { bar.innerHTML = ''; tab = 'all'; return; }
    const filters = FILTERS.filter(function (f) { return f.key === 'all' || listingsForTab(f.key).length > 0; });
    if (!filters.some(function (f) { return f.key === tab; })) tab = 'all';
    bar.innerHTML = filters.map(function (f) {
      return '<button type="button" class="sf-chip' + (f.key === tab ? ' active' : '') + '" data-tab="' + f.key + '">' + f.label + '</button>';
    }).join('');
    bar.querySelectorAll('.sf-chip').forEach(function (btn) {
      btn.addEventListener('click', function () { setTab(btn.dataset.tab); });
    });
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('#filter-strip .sf-chip').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
    renderGrid();
  }

  function renderGrid() {
    const body = document.getElementById('product-grid');
    const listings = listingsForTab(tab);
    body.innerHTML = '';
    if (listings.length === 0) {
      body.innerHTML = '<div class="empty-state">No items in this category.</div>';
      return;
    }
    const groups = sectionGroups(listings, 'More');
    if (!groups) {
      const grid = document.createElement('div');
      grid.className = 'sf-grid';
      listings.forEach(function (item) { grid.appendChild(buildTile(item)); });
      body.appendChild(grid);
      return;
    }
    // Every section shares one grid so tiles fill the whole line on a wide
    // screen: each cell is a heading over its tile. A section's heading shows
    // over its first tile; the rest keep an invisible copy so tiles in a row
    // still line up.
    const grid = document.createElement('div');
    grid.className = 'sf-grid';
    groups.forEach(function (g) {
      g.items.forEach(function (item, i) {
        const cell = document.createElement('div');
        cell.className = 'sf-single-section';
        const h = document.createElement('h3');
        h.className = 'sf-group-title' + (i ? ' sf-group-spacer' : '');
        h.textContent = g.category;
        if (i) h.setAttribute('aria-hidden', 'true');
        cell.appendChild(h);
        cell.appendChild(buildTile(item));
        grid.appendChild(cell);
      });
    });
    body.appendChild(grid);
  }

  // ══════════════════════ Form takeover ══════════════════════
  //
  // profiles.storefront_listing_id → the intake form replaces the MENU
  // card (in Menu's slot); every other card stays (spec). Mounted in-page —
  // no redirect to custom-order.html.
  let mountedFormKey = null;
  let formRowsKey = null;

  function formTitle(listing) {
    return (listing.storefront_intro_title || '').trim() || listing.name || 'Order';
  }
  function formDesign(listing) {
    const all = design && design.forms;
    if (!all || typeof all !== 'object' || !listing) return {};
    return all[String(listing.id).toLowerCase()] || all[String(listing.id).toUpperCase()] || {};
  }
  function formRowId(listing) { return 'sf-formrow-' + String(listing.id).toLowerCase(); }
  function formLeadText(listing) {
    return listing.lead_time_note ? ('Lead time: ' + listing.lead_time_note) : 'Request a quote';
  }

  // The form block's settings live on the menu block entry (the form takes
  // the menu's slot): forms_order (listing ids) and forms_expanded (a listing
  // id, or 'none'). Unset: one form shows open; several start collapsed.
  function formsCfg(designJSON) {
    const blocks = designJSON && Array.isArray(designJSON.blocks) ? designJSON.blocks : [];
    const entry = blocks.find(function (b) { return b && b.type === 'menu'; }) || {};
    return entry;
  }
  function orderForms(list, primaryId, designJSON) {
    const order = (formsCfg(designJSON).forms_order || []).map(function (x) { return String(x).toLowerCase(); });
    return list.slice().sort(function (a, b) {
      const ia = order.indexOf(String(a.id).toLowerCase()), ib = order.indexOf(String(b.id).toLowerCase());
      if (ia !== ib) return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib);
      const pa = String(a.id).toLowerCase() === primaryId, pb = String(b.id).toLowerCase() === primaryId;
      if (pa !== pb) return pa ? -1 : 1;
      return String(a.name || '').localeCompare(String(b.name || ''));
    });
  }
  function expandedFormId() {
    const pick = formsCfg(design).forms_expanded;
    if (pick === 'none') return null;
    if (pick && sfForms.some(function (f) { return String(f.id).toLowerCase() === String(pick).toLowerCase(); })) {
      return String(pick).toLowerCase();
    }
    return sfForms.length === 1 ? String(sfForms[0].id).toLowerCase() : null;
  }

  function mountForm(container, listing) {
    if (!window.BakeriIntakeForm) return;
    window.BakeriIntakeForm.mount({
      container: container,
      supabaseUrl: SUPABASE_URL,
      anonKey: ANON_KEY,
      bakerId: resolvedBakerId,
      itemId: listing.id,
      formId: listing.intake_form_id,
      itemName: listing.name,
      standalone: false
    });
  }

  function openFormRow(rowId) {
    const row = document.getElementById(rowId);
    if (!row || row.classList.contains('open')) return;
    row.classList.add('open');
    const mount = row.querySelector('.sf-formrow-mount');
    if (mount && !mount.dataset.mounted) {
      mount.dataset.mounted = '1';
      const listing = sfForms.find(function (f) { return formRowId(f) === rowId; });
      if (listing) mountForm(mount, listing);
    }
  }

  // profiles.storefront_listing_id (+ any other forms on the site) → the
  // form(s) replace the MENU card (in Menu's slot); every other card stays
  // (spec). Mounted in-page — no redirect to custom-order.html. One form
  // shows as before; several stack as rows that open in place.
  function renderFormStorefront() {
    const card = document.getElementById('form-storefront');
    card.classList.remove('hidden');
    document.getElementById('sf-form-title').textContent = cardTitle('form');
    const intro = document.getElementById('sf-form-intro');
    const mount = document.getElementById('sf-form-mount');
    const expanded = expandedFormId();
    const asCards = !(sfForms.length === 1 && expanded);
    mount.classList.toggle('sf-formrows', asCards);

    if (sfForms.length === 1 && expanded) {
      const listing = sfForms[0];
      formRowsKey = null;
      document.getElementById('sf-form-sub').textContent = formLeadText(listing);
      const introBody = (listing.storefront_intro_body || '').trim();
      document.getElementById('sf-intro-body').textContent = introBody;
      intro.classList.toggle('hidden', !introBody);
      // Preview re-renders on every draft edit — don't wipe a half-filled
      // form unless it's actually a different form now.
      const key = listing.id + ':' + listing.intake_form_id;
      if (mountedFormKey === key) return;
      mountedFormKey = key;
      mount.innerHTML = '';
      mountForm(mount, listing);
      return;
    }

    mountedFormKey = null;
    intro.classList.add('hidden');
    document.getElementById('sf-form-sub').textContent =
      sfForms.length > 1 ? sfForms.length + ' forms · tap one to start' : formLeadText(sfForms[0]);
    // Same reasoning as above: only rebuild the rows when the set of forms,
    // their order or the open pick changed, so a half-filled form survives a
    // preview re-render. Titles and intros still refresh in place.
    const key = sfForms.map(function (f) { return f.id + ':' + f.intake_form_id; }).join('|') + '#' + (expanded || '');
    if (formRowsKey !== key) {
      formRowsKey = key;
      mount.innerHTML = '';
      sfForms.forEach(function (listing) {
        const row = document.createElement('div');
        row.className = 'sf-formrow';
        row.id = formRowId(listing);
        row.innerHTML =
          '<button type="button" class="sf-link rich noimg sf-formrow-head" aria-expanded="false">' +
            '<span class="sf-link-text"><span class="sf-link-title"></span><span class="sf-link-domain"></span></span>' + PLUS_SVG +
          '</button>' +
          '<div class="sf-formrow-body"><p class="sf-formrow-intro"></p><div class="sf-formrow-mount"></div></div>';
        row.querySelector('.sf-formrow-head').addEventListener('click', function () {
          if (row.classList.contains('open')) row.classList.remove('open');
          else { openFormRow(row.id); trackVisit('form_open', listing.id); }
          this.setAttribute('aria-expanded', row.classList.contains('open') ? 'true' : 'false');
        });
        mount.appendChild(row);
        // The listing's photo, if it has one — otherwise the card stays
        // text only (no placeholder). Same storage path as product tiles.
        const probe = new Image();
        probe.onload = function () {
          const head = row.querySelector('.sf-formrow-head');
          if (!head || head.querySelector('.sf-link-img')) return;
          const img = document.createElement('span');
          img.className = 'sf-link-img';
          img.style.backgroundImage = 'url(' + probe.src + ')';
          focusBackground(img, probe.src, itemFocus(listing));
          head.insertBefore(img, head.firstChild);
          head.classList.remove('noimg');
        };
        probe.src = itemImgURL(listing);
      });
      if (expanded) openFormRow('sf-formrow-' + expanded);
    }
    sfForms.forEach(function (listing) {
      const row = document.getElementById(formRowId(listing));
      if (!row) return;
      row.querySelector('.sf-link-title').textContent = formTitle(listing);
      row.querySelector('.sf-link-domain').textContent = formLeadText(listing);
      // Each form card has its own look, like a link card:
      // storefront_design.forms[listingId] = { border, border_color, glow,
      // glow_color, background, text, shake }.
      const fd = formDesign(listing);
      const head = row.querySelector('.sf-formrow-head');
      const styleAttr = cardLookStyle('rich', fd, null);
      head.setAttribute('style', styleAttr ? styleAttr.slice(8, -1) : '');
      head.classList.toggle('shake', fd.shake === true);
      const introBody = (listing.storefront_intro_body || '').trim();
      const p = row.querySelector('.sf-formrow-intro');
      p.textContent = introBody;
      p.style.display = introBody ? '' : 'none';
    });
  }

  // ══════════════════════ Products (Shop my Products) ══════════════════════
  //
  // Physical goods (photo grid, category chips) and digital downloads (list
  // rows) in ONE card. The v1 'physical' / 'digital' entries can still hide
  // either half on its own.

  function physicalShown() { return physicalListings().length > 0 && subHidden.physical !== true; }
  function digitalShown() { return digitalListings().length > 0 && subHidden.digital !== true; }

  function renderProductsCard() {
    const card = document.getElementById('sf-products');
    const phys = physicalShown(), dig = digitalShown();
    if (!phys && !dig) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-products-title').textContent = cardTitle('products');
    document.getElementById('sf-products-sub').textContent =
      phys && dig ? 'Ships to you · instant downloads' : (phys ? 'Ships to you' : 'Instant downloads');
    renderPhysicalFeed();
    renderDigitalFeed();
  }

  function renderPhysicalFeed() {
    const wrap = document.getElementById('physical-feed');
    const chips = document.getElementById('sf-products-filters');
    const items = physicalListings();
    wrap.innerHTML = '';
    chips.innerHTML = '';
    if (!physicalShown()) { wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    if (items.length === 1) { wrap.appendChild(buildWideTile(items[0])); return; }

    const groups = groupByCategory(items, 'Ships to You');
    if (groups.length > 1) {
      if (physTab !== 'all' && !groups.some(function (g) { return g.slug === physTab; })) physTab = 'all';
      chips.innerHTML = [{ slug: 'all', category: 'All' }].concat(groups).map(function (g) {
        return '<button type="button" class="sf-chip' + (g.slug === physTab ? ' active' : '') + '" data-slug="' + g.slug + '">' +
          escapeHtml(g.slug === 'all' ? 'All' : titleCase(g.category)) + '</button>';
      }).join('');
      chips.querySelectorAll('.sf-chip').forEach(function (btn) {
        btn.addEventListener('click', function () { physTab = btn.dataset.slug; renderPhysicalFeed(); });
      });
    } else {
      physTab = 'all';
    }

    const group = groups.find(function (g) { return g.slug === physTab; });
    const list = group ? group.items : items;
    const collapsible = list.length > PHYSICAL_PREVIEW_COUNT;
    const expanded = !!physicalExpanded[physTab];
    const shown = (collapsible && !expanded) ? list.slice(0, PHYSICAL_PREVIEW_COUNT) : list;
    const grid = document.createElement('div');
    grid.className = 'sf-grid';
    shown.forEach(function (item) { grid.appendChild(buildTile(item)); });
    wrap.appendChild(grid);
    if (collapsible) {
      const more = document.createElement('div');
      more.className = 'sf-more';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = expanded ? 'Show fewer' : 'View all ' + list.length;
      btn.addEventListener('click', function () {
        physicalExpanded[physTab] = !expanded;
        renderPhysicalFeed();
        if (expanded) document.getElementById('sf-products').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      more.appendChild(btn);
      wrap.appendChild(more);
    }
  }

  // Also called by toggleDigitalCartItem (carried-over cart code) after
  // every add/remove, so it must stay self-contained.
  function renderDigitalFeed() {
    const wrap = document.getElementById('digital-feed');
    const items = digitalListings();
    wrap.innerHTML = '';
    if (!digitalShown()) { wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    const physOn = physicalShown();
    wrap.classList.toggle('solo', !physOn);

    if (!physOn && items.length === 1) {
      const body = document.createElement('div');
      body.className = 'sf-card-body';
      body.appendChild(buildWideTile(items[0]));
      wrap.appendChild(body);
      return;
    }

    const collapsible = items.length > DIGITAL_PREVIEW_COUNT;
    if (physOn || collapsible) {
      const head = document.createElement('div');
      head.className = 'sf-dl-head';
      head.innerHTML = '<div class="titles">' +
        (physOn ? '<h3>Digital downloads</h3>' : '') +
        '<span class="sf-sub">Instant download · ' + items.length + ' design' + (items.length === 1 ? '' : 's') + '</span></div>';
      wrap.appendChild(head);
    }

    const list = document.createElement('div');
    list.className = 'sf-dl-list';
    if (!physOn && !collapsible) list.style.paddingTop = 'var(--cpad2)';
    // In section order (with a heading per section once there are 2+);
    // the collapsed preview is the first few of that order.
    const groups = sectionGroups(items, 'More');
    const ordered = groups ? [].concat.apply([], groups.map(function (g) { return g.items; })) : items;
    const shown = (collapsible && !digitalExpanded) ? ordered.slice(0, DIGITAL_PREVIEW_COUNT) : ordered;
    let lastGroup = null;
    shown.forEach(function (item) {
      if (groups) {
        const g = groups.find(function (x) { return x.items.indexOf(item) !== -1; });
        if (g !== lastGroup) {
          lastGroup = g;
          const h = document.createElement('h4');
          h.className = 'sf-group-title sf-dl-group';
          h.textContent = g.category;
          list.appendChild(h);
        }
      }
      list.appendChild(buildDigitalRow(item));
    });
    wrap.appendChild(list);

    if (collapsible) {
      const more = document.createElement('div');
      more.className = 'sf-dl-more';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sf-dl-morebtn';
      btn.innerHTML = (digitalExpanded ? 'Show fewer' : 'View all ' + items.length + ' downloads') + (digitalExpanded ? '' : ' ' + ARROW_SVG);
      btn.addEventListener('click', function () {
        digitalExpanded = !digitalExpanded;
        renderDigitalFeed();
        if (!digitalExpanded) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      more.appendChild(btn);
      wrap.appendChild(more);
    }
  }

  function digitalInCart(item) {
    if (item.has_variants) return digitalVariantCartLines.some(function (l) { return l.menuItemId === item.id; });
    return digitalCart.indexOf(item.id) !== -1;
  }

  function refreshDigitalPills() {
    document.querySelectorAll('.sf-dl-add[data-dl-id]').forEach(function (btn) {
      const item = allListings.find(function (l) { return l.id === btn.dataset.dlId; });
      if (!item) return;
      const inCart = digitalInCart(item);
      btn.classList.toggle('added', inCart);
      btn.textContent = inCart ? 'Added ✓' : 'Add';
    });
  }

  function buildDigitalRow(item) {
    const row = document.createElement('div');
    row.className = 'sf-dl-row';
    row.addEventListener('click', function () { openItemSheet(item); });

    const thumb = document.createElement('div');
    thumb.className = 'sf-dl-thumb';
    appendPhoto(thumb, item);

    const info = document.createElement('div');
    info.className = 'sf-dl-info';
    info.innerHTML = '<span class="sf-dl-name">' + escapeHtml(item.name) + '</span>' +
      '<span class="sf-dl-price tabular">' + priceHTML(item.original_price, item.price, { from: priceIsFrom(item) }) + '</span>';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sf-dl-add';
    btn.dataset.dlId = item.id;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (item.has_variants) openItemSheet(item);
      else toggleDigitalCartItem(item);
    });

    row.appendChild(thumb);
    row.appendChild(info);
    row.appendChild(btn);
    // Sets the pill's label from cart state.
    setTimeout(refreshDigitalPills, 0);
    return row;
  }

  // ══════════════════════ Links (More from …) ══════════════════════

  // Links card, built like the Digital downloads card (2026-11-05). One
  // section: compact rows inline (folded behind "View all" when long). Two
  // or more sections: a directory — featured links (big-photo style) stay
  // on the page, and each section is a tile that opens as a sheet of rows.
  // Plain button links ('list' style) keep their pill look.
  const LINK_SECTION_FOLD = 8;   // a single long list folds…
  const LINK_SECTION_SHOW = 6;   // …to this many rows until "View all"
  let linksExpanded = false;

  function renderLinkSections() {
    const card = document.getElementById('links-feed');
    const items = allLinks.filter(function (l) { return !isSocialSection(l.section); });
    const list = document.getElementById('sf-links-list');
    if (items.length === 0) { card.classList.add('hidden'); list.innerHTML = ''; return; }
    card.classList.remove('hidden');
    document.getElementById('sf-links-title').textContent = cardTitle('links');

    const sections = [];
    items.forEach(function (l) { const s = (l.section || '').trim(); if (sections.indexOf(s) === -1) sections.push(s); });

    if (sections.length > 1) {
      // Featured links (big-photo style) lead; sections with 3+ other links
      // become directory tiles; smaller sections stay as short lists.
      const featured = items.filter(function (l) { return l.style === 'richCard'; });
      const rest = function (s) { return items.filter(function (l) { return (l.section || '').trim() === s && l.style !== 'richCard'; }); };
      const tileSections = sections.filter(function (s) { return rest(s).length >= 3; });
      const listSections = sections.filter(function (s) { const n = rest(s).length; return n > 0 && n < 3; });
      const tiles = tileSections.map(function (s) {
        const rows = rest(s);
        const cover = (rows.find(function (l) { return l.image_url; }) || {}).image_url;
        const allFree = rows.every(function (l) { return l.target_listing_is_lead_magnet; });
        const count = rows.length + ' ' + (allFree ? 'free downloads' : 'items');
        return '<button type="button" class="lk-dir-tile' + (cover ? '' : ' noimg') + '" data-section="' + escapeHtml(s) + '"' +
          (cover ? ' style="background-image:url(' + escapeHtml(cover) + ')"' : '') + '>' +
          '<span class="lk-dir-text"><span class="lk-dir-name">' + escapeHtml(s || 'More') + '</span><span class="lk-dir-count">' + count + '</span></span></button>';
      }).join('');
      list.innerHTML = featured.map(renderLinkRow).join('') +
        (tiles ? '<div class="lk-dir">' + tiles + '</div>' : '') +
        listSections.map(function (s) {
          return (s ? '<h4 class="sf-group-title lk-group">' + escapeHtml(s) + '</h4>' : '') + rest(s).map(renderLinkRow).join('');
        }).join('');
      list.querySelectorAll('.lk-dir-tile').forEach(function (t) {
        t.addEventListener('click', function () { openLinkSection(t.dataset.section); });
      });
    } else {
      const folds = items.length > LINK_SECTION_FOLD;
      const shown = folds && !linksExpanded ? items.slice(0, LINK_SECTION_SHOW) : items;
      list.innerHTML = shown.map(renderLinkRow).join('') + (folds
        ? '<button type="button" class="sf-dl-morebtn lk-more">' + (linksExpanded ? 'Show fewer' : 'View all ' + items.length + ' ' + ARROW_SVG) + '</button>'
        : '');
      const more = list.querySelector('.lk-more');
      if (more) more.addEventListener('click', function () {
        linksExpanded = !linksExpanded;
        renderLinkSections();
        if (!linksExpanded) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
    wireLinkRows(list);
  }

  // A section from the directory, as a sheet of rows.
  function openLinkSection(section) {
    let scrim = document.getElementById('links-scrim');
    if (!scrim) {
      scrim = document.createElement('div');
      scrim.className = 'scrim';
      scrim.id = 'links-scrim';
      scrim.innerHTML = '<div class="sheet"><div style="position:relative;"><button class="sheet-close" id="links-sheet-close">✕</button></div>' +
        '<div id="links-sheet-body" style="padding:24px 20px 28px;"></div></div>';
      document.body.appendChild(scrim);
      scrim.addEventListener('click', function (e) { if (e.target === scrim) closeLinkSection(); });
      document.getElementById('links-sheet-close').addEventListener('click', closeLinkSection);
    }
    const rows = allLinks.filter(function (l) { return !isSocialSection(l.section) && (l.section || '').trim() === section && l.style !== 'richCard'; });
    const body = document.getElementById('links-sheet-body');
    body.innerHTML = '<h2 style="font-family:var(--display);font-weight:var(--dw);font-size:26px;line-height:1.1;color:var(--head-ink);padding-right:40px;">' +
      escapeHtml(section || 'More') + '</h2><div class="sf-links">' +
      rows.map(function (l) { return renderLinkRow(Object.assign({}, l, { style: l.style === 'list' ? 'list' : 'photoCard' })); }).join('') + '</div>';
    wireLinkRows(body);
    scrim.classList.add('open');
  }
  function closeLinkSection() {
    const scrim = document.getElementById('links-scrim');
    if (scrim) scrim.classList.remove('open');
  }

  function wireLinkRows(root) {
    root.querySelectorAll('[data-img]').forEach(function (el) {
      const l = allLinks.find(function (x) { return String(x.id) === el.dataset.linkId; });
      focusBackground(el, el.dataset.img, l && linkDesign(l).focus);
    });
    root.querySelectorAll('.sf-link[data-listing-id]').forEach(function (row) {
      if (row.dataset.leadMagnet === 'true') {
        const link = allLinks.find(function (x) { return String(x.linked_listing_id || '').toLowerCase() === String(row.dataset.listingId).toLowerCase(); });
        row.addEventListener('click', function () { closeLinkSection(); if (link) openLeadPage(link); });
        return;
      }
      const item = allListings.find(function (x) { return String(x.id).toLowerCase() === String(row.dataset.listingId).toLowerCase(); });
      if (item) row.addEventListener('click', function () { closeLinkSection(); openItemSheet(item); });
      else row.classList.add('disabled');
    });
  }

  function linkDomain(l) {
    if (l.target_type === 'file') return 'Download';
    if (l.target_type === 'product') return l.target_listing_is_lead_magnet ? 'Free download' : 'In my shop';
    try { return new URL(l.url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  // baker_links.style → v2 look:
  //   'list' (default)  → pill button, same look as the top nav
  //   'photoCard'       → handoff link card (96×72 thumbnail + title + domain)
  //   'richCard'        → big image on top, title below
  // outline_style 'border' | 'glow' (+ optional outline_color) and shake
  // decorate the LINK CARD itself, never the section card.
  // Border, glow, fill and text colour for a link-style card (links and
  // order-form cards). ld = the card's design entry; legacy = baker_links'
  // own outline_style / outline_color, used when ld doesn't say.
  function cardLookStyle(kind, ld, legacy) {
    legacy = legacy || {};
    const legacyColor = validHex(ld.outline_color) || validHex(legacy.color);
    const hasBorder = typeof ld.border === 'boolean' ? ld.border : legacy.style === 'border';
    const hasGlow = typeof ld.glow === 'boolean' ? ld.glow : legacy.style === 'glow';
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#201e1d';
    const borderColor = validHex(ld.border_color) || legacyColor || validHex(accent) || '#201e1d';
    const glowColor = validHex(ld.glow_color) || legacyColor || validHex(accent) || '#201e1d';
    const fill = validHex(ld.background);
    const ink = validHex(ld.text) || (fill ? readableOn(fill) : null);
    const css = [];
    const shadows = [];
    if (hasBorder) {
      if (kind === 'pill') css.push('border-color:' + borderColor);
      else shadows.push('0 0 0 2px ' + borderColor);
    }
    if (hasGlow) {
      const rgb = hexRgb(glowColor);
      // One soft layer only — a tight inner halo read as a border.
      shadows.push('0 0 20px 5px rgba(' + rgb.join(',') + ',.7)');
    }
    if (shadows.length) css.push('box-shadow:' + shadows.join(','));
    if (fill) css.push('background:' + fill);
    if (fill && !hasBorder) css.push('border-color:' + fill);
    if (ink) css.push('color:' + ink, '--link-sub:' + ink);
    return css.length ? ' style="' + css.join(';') + '"' : '';
  }

  function renderLinkRow(l) {
    const kind = l.style === 'photoCard' ? 'rich' : (l.style === 'richCard' ? 'photo' : 'pill');
    const classes = ['sf-link', kind === 'pill' ? 'pill' : (kind === 'photo' ? 'lk-feature' : 'lk-row')];
    if (l.shake) classes.push('shake');
    // Border and glow are independent — either, both or neither — each with
    // its own colour (storefront_design.links[id].border / .glow). Without
    // a v2 setting, fall back to baker_links.outline_style (one or the other).
    const style = cardLookStyle(kind, linkDesign(l), { style: l.outline_style, color: l.outline_color });

    const isFile = l.target_type === 'file' && l.url;
    const icon = isFile ? DOWNLOAD_SVG : (l.target_type === 'product' ? ARROW_SVG : ARROW_UR_SVG);
    const label = escapeHtml(l.label);
    const img = l.image_url
      ? ' data-img="' + escapeHtml(l.image_url) + '" data-link-id="' + escapeHtml(l.id) + '" style="background-image:url(' + escapeHtml(l.image_url) + ')"'
      : '';
    const emoji = l.image_url ? '' : (isFile ? '📄' : '🔗');

    // Under the title: the description, then the linked product's price (or
    // a Free tag for a free download); a plain web link with neither shows
    // its domain.
    const sub = l.subtitle ? '<span class="lk-sub">' + escapeHtml(l.subtitle) + '</span>' : '';
    let meta = '';
    if (l.target_type === 'product') {
      const target = allListings.find(function (x) { return String(x.id).toLowerCase() === String(l.linked_listing_id || '').toLowerCase(); });
      if (l.target_listing_is_lead_magnet) meta = '<span class="lk-meta"><span class="sf-link-free">Free</span></span>';
      else if (target) meta = '<span class="lk-meta tabular">' + priceHTML(target.original_price, target.price, { from: priceIsFrom(target) }) + '</span>';
    }
    const domain = linkDomain(l);
    const domainLine = !sub && !meta && domain && l.target_type !== 'product' ? '<span class="lk-sub">' + escapeHtml(domain) + '</span>' : '';
    // The vendor's own button wording, else a plain verb for what the link does.
    const ctaText = l.button_label ||
      (isFile ? 'Download' : l.target_type === 'product' ? (l.target_listing_is_lead_magnet ? 'Get it' : 'View') : 'Open');

    let inner;
    if (kind === 'pill') {
      inner = '<span class="sf-link-label">' + label + '</span>' + icon;
    } else if (kind === 'rich') {
      inner = '<span class="sf-dl-thumb lk-thumb"' + img + '>' + emoji + '</span>' +
        '<span class="sf-dl-info"><span class="sf-dl-name lk-title">' + label + '</span>' + sub + meta + domainLine + '</span>' +
        '<span class="sf-dl-add lk-cta">' + escapeHtml(ctaText) + '</span>';
    } else {
      inner = '<span class="lk-feature-img"' + img + '>' + emoji + '</span>' +
        '<span class="lk-feature-body"><span class="lk-title lk-feature-title">' + label + '</span>' + sub + meta + domainLine +
        '<span class="lk-cta-solid">' + escapeHtml(ctaText) + ' ' + ARROW_SVG + '</span></span>';
    }

    // File target: Storage's ?download= forces Content-Disposition with the
    // original filename (the `download` attribute is ignored cross-origin).
    if (isFile) {
      const fileName = decodeURIComponent(l.url.split('?')[0].split('/').pop() || '');
      const href = l.url.split('?')[0] + '?download=' + encodeURIComponent(fileName);
      return '<a class="' + classes.join(' ') + '"' + style + ' data-track="link_click" data-track-ref="' + escapeHtml(l.id) + '" href="' + escapeHtml(href) +
        '" download="' + escapeHtml(fileName) + '" rel="noopener noreferrer">' + inner + '</a>';
    }
    if (l.target_type === 'product' && l.linked_listing_id) {
      return '<button type="button" class="' + classes.join(' ') + '"' + style + ' data-listing-id="' +
        escapeHtml(l.linked_listing_id) + '" data-lead-magnet="' +
        (l.target_listing_is_lead_magnet ? 'true' : 'false') + '">' + inner + '</button>';
    }
    return '<a class="' + classes.join(' ') + '"' + style + ' data-track="link_click" data-track-ref="' + escapeHtml(l.id) + '" href="' + escapeHtml(l.url) +
      '" target="_blank" rel="noopener noreferrer">' + inner + '</a>';
  }

  // ══════════════════════ About ══════════════════════

  // Bakerï Referral card: the vendor's referral code (10% off a maker's
  // first 3 months on Bakerï). The code comes from storefront_referral_code,
  // which only answers for a published, switched-on card — so in the
  // builder's preview a not-yet-published card shows a sample code.
  let referralCode = null;
  let referralLoading = false;
  function fillReferralCard(code) {
    const card = document.getElementById('sf-referral');
    const cfg = blockCfg.referral;
    if (!cfg || cfg.hidden || !code) { card.classList.add('hidden'); return; }
    document.getElementById('sf-referral-title').textContent = cardTitle('referral');
    document.getElementById('sf-referral-desc').innerHTML =
      'Use code <span id="sf-referral-code">' + escapeHtml(code) + '</span> to get 10% off your shop for the first 3 months.';
    const btn = document.getElementById('sf-referral-btn');
    btn.innerHTML = '<span>Get 10% off</span>' + ARROW_UR_SVG;
    btn.href = 'https://bakeriapp.com/?ref=' + encodeURIComponent(code) + '&utm_source=storefront&utm_medium=referral';
    card.classList.remove('hidden');
  }
  function renderReferralCard() {
    const cfg = blockCfg.referral;
    if (!cfg || cfg.hidden) { fillReferralCard(null); return; }
    // In the builder's preview the builder passes the vendor's own code (the
    // public lookup only answers for a published, switched-on card).
    if (isPreviewMode && profile && profile.__preview_referral_code) { fillReferralCard(String(profile.__preview_referral_code)); return; }
    if (!profile || !profile.id) { fillReferralCard(isPreviewMode ? 'YOURCODE' : null); return; }
    if (referralCode) { fillReferralCard(referralCode); return; }
    fillReferralCard(isPreviewMode ? 'YOURCODE' : null);
    if (referralLoading) return;
    referralLoading = true;
    fetch(SUPABASE_URL + '/rest/v1/rpc/storefront_referral_code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ p_profile_id: profile.id })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (code) {
      referralLoading = false;
      if (typeof code === 'string' && code) referralCode = code;
      fillReferralCard(referralCode || (isPreviewMode ? 'YOURCODE' : null));
      if (blockCfg.referral && blockCfg.referral.hidden) document.getElementById('sf-referral').classList.add('hidden');
      renderSectionNav();
    }).catch(function () { referralLoading = false; });
  }

  function renderAbout(p) {
    const card = document.getElementById('pb-about');
    if (!p.about_story) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    const heading = cardTitle('about');
    document.getElementById('pb-about-heading').textContent = heading;
    document.getElementById('pb-about-kicker').classList.toggle('hidden', ['about', 'about the baker'].includes(heading.trim().toLowerCase()));
    document.getElementById('pb-about-text').innerHTML = String(p.about_story).split(/\n\s*\n/).map(function (para) {
      return '<p>' + escapeHtml(para.trim()) + '</p>';
    }).join('');
    const photo = document.getElementById('pb-about-photo');
    const img = document.getElementById('pb-about-portrait');
    img.alt = p.business_name || '';
    img.onload = function () { focusImage(img, designFocus('about')); photo.classList.remove('hidden'); };
    img.onerror = function () { photo.classList.add('hidden'); };
    img.src = (p.__preview_portrait_data_url) || assetURL('/baker-portraits/' + resolvedBakerId.toUpperCase() + '/portrait.jpg');
  }

  // ══════════════════════ Before you order ══════════════════════
  //
  // Store policies + FAQ as independent accordions, pickup hours beside
  // them. Each part can still be hidden by its own v1 entry.

  function hasConfiguredHours(hoursJSON) {
    return !!(hoursJSON && WEEKDAY_ORDER.some(function (k) { return hoursJSON[k] && hoursJSON[k].closed === false; }));
  }

  function accordionHTML(title, body, open) {
    return '<details class="sf-acc"' + (open ? ' open' : '') + '><summary>' + escapeHtml(title) + PLUS_SVG + '</summary>' +
      '<div class="sf-acc-body">' + escapeHtml(body) + '</div></details>';
  }

  function renderInfoCard(p) {
    const card = document.getElementById('sf-info');
    const hasPol = !!(p.store_policies && String(p.store_policies).trim()) && subHidden.policies !== true;
    const hasFaq = allFaqs.length > 0 && subHidden.faq !== true;
    const hasHours = hasConfiguredHours(p.pickup_hours_json) && subHidden.hours !== true;
    if (!hasPol && !hasFaq && !hasHours) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-info-title').textContent = cardTitle('info');
    const parts = [];
    if (hasPol) parts.push('Policies');
    if (hasFaq) parts.push('FAQ');
    if (hasHours) parts.push('Pickup hours');
    document.getElementById('sf-info-sub').textContent = parts.join(' · ');

    const pol = document.getElementById('pb-policies');
    pol.classList.toggle('hidden', !hasPol);
    pol.innerHTML = hasPol ? accordionHTML('Store policies', p.store_policies, true) : '';

    const faq = document.getElementById('faq-col');
    faq.classList.toggle('hidden', !hasFaq);
    faq.innerHTML = hasFaq ? allFaqs.map(function (f) { return accordionHTML(f.question, f.answer); }).join('') : '';
    document.getElementById('sf-info-acc').classList.toggle('hidden', !hasPol && !hasFaq);

    const hours = document.getElementById('hours-card');
    hours.classList.toggle('hidden', !hasHours);
    document.getElementById('hours-rows').innerHTML = !hasHours ? '' : WEEKDAY_ORDER.map(function (key) {
      const day = p.pickup_hours_json[key];
      const time = (!day || day.closed) ? 'Closed' : (formatTime12h(day.open) + '–' + formatTime12h(day.close));
      return '<div class="sf-hours-row"><span class="day">' + WEEKDAY_LABELS[key] + '</span><span>' + time + '</span></div>';
    }).join('');
  }

  // ══════════════════════ Email capture (Join my list) ══════════════════════
  //
  // Voluntary mailing-list signup. inline: the form sits in the card;
  // popup: a button opens #capture-scrim. Both, plus the header signup
  // pill, post to capture-storefront-email → baker_contacts.

  function captureFormMarkup(idPrefix, buttonLabel, opts) {
    opts = opts || {};
    return '<form class="sf-capture-form' + (opts.stacked ? ' stacked' : '') + '" id="' + idPrefix + '-form" novalidate>' +
      (opts.name ? '<input type="text" autocomplete="given-name" placeholder="Your name" aria-label="Your name" id="' + idPrefix + '-name" />' : '') +
      '<input type="email" required autocomplete="email" placeholder="you@email.com" aria-label="Email address" id="' + idPrefix + '-email" />' +
      '<button type="submit" class="sf-btn">' + escapeHtml(buttonLabel) + '</button>' +
      consentMarkup(idPrefix) +
      '<div class="sf-capture-status" id="' + idPrefix + '-status" role="status"></div>' +
      '</form>';
  }
  // ══════════════════════ Consent + rich text ══════════════════════

  function shopTerms() { return String((profile && profile.store_policies) || '').trim(); }

  // Consent boxes under a sign-up form. The marketing box is optional and
  // starts unticked; the terms box appears only when the shop has terms and
  // must be ticked.
  function consentMarkup(idPrefix) {
    const shop = escapeHtml((profile && (profile.business_name || profile.user_name)) || 'this shop');
    return '<div class="sf-consents">' +
      '<label class="sf-consent"><input type="checkbox" id="' + idPrefix + '-mkt" />' +
        '<span id="' + idPrefix + '-mkt-text">Send me emails from ' + shop + '. Unsubscribe any time.</span></label>' +
      (shopTerms()
        ? '<label class="sf-consent"><input type="checkbox" id="' + idPrefix + '-terms" />' +
          '<span>I agree to the <button type="button" class="sf-consent-link" data-terms="1">Terms &amp; Conditions</button></span></label>'
        : '') +
      '</div>';
  }

  // Plain text written in an app or pasted from another site → paragraphs,
  // short heading lines, and lists for ✔️ / • / - / 📌 lines.
  function richText(text) {
    const lines = String(text || '').split(/\n/).map(function (l) { return l.trim(); });
    const bullet = /^(?:[-•*·]|✔️|✔|✅|☑️|📌|📍|⭐|🍫)\s*/;
    let html = '', inList = false;
    lines.forEach(function (l, i) {
      if (!l) { if (inList) { html += '</ul>'; inList = false; } return; }
      if (bullet.test(l)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + escapeHtml(l) + '</li>';
        return;
      }
      if (inList) { html += '</ul>'; inList = false; }
      const next = lines.slice(i + 1).find(function (x) { return x; });
      const heading = l.length <= 70 && !/[.,;:!]$/.test(l) && !!next;
      html += heading ? '<h4>' + escapeHtml(l) + '</h4>' : '<p>' + escapeHtml(l) + '</p>';
    });
    return html + (inList ? '</ul>' : '');
  }

  // A free download as its own page: photo, title, description, and the
  // sign-up form that sends it.
  function openLeadPage(l) {
    const img = l.page_image_url || l.image_url || itemImgURL({ id: String(l.linked_listing_id) });
    const desc = String(l.target_listing_description || '').trim();
    document.getElementById('capture-sheet-body').innerHTML =
      '<div class="lead-page-img" style="background-image:url(' + escapeHtml(img) + ')"></div>' +
      '<h2 style="font-family:var(--display);font-weight:var(--dw);font-size:26px;line-height:1.1;color:var(--head-ink);padding-right:40px;">' + escapeHtml(l.label) + '</h2>' +
      (desc ? '<div class="rich-desc" style="font-size:15px;line-height:1.55;color:var(--n800);margin-top:10px;">' + richText(desc) + '</div>' : '') +
      '<p class="lead-page-note">Free · sent straight to your inbox</p>' +
      captureFormMarkup('popup-capture', l.button_label || 'Send it to me', { name: true, stacked: true });
    wireCaptureForm(document.getElementById('popup-capture-form'), 'lead_magnet', String(l.linked_listing_id));
    document.getElementById('capture-scrim').classList.add('open');
  }


  function wireCaptureForm(formEl, source, deliverableListingId, onDone) {
    if (!formEl) return;
    formEl.addEventListener('submit', function (e) {
      e.preventDefault();
      const idPrefix = formEl.id.replace(/-form$/, '');
      const emailInput = document.getElementById(idPrefix + '-email');
      const statusEl = document.getElementById(idPrefix + '-status');
      const submitBtn = formEl.querySelector('button[type="submit"]');
      const email = (emailInput.value || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        statusEl.textContent = 'Please enter a valid email address.';
        emailInput.focus();
        return;
      }
      const termsBox = document.getElementById(idPrefix + '-terms');
      if (termsBox && !termsBox.checked) {
        statusEl.textContent = 'Please agree to the Terms & Conditions.';
        return;
      }
      const mktBox = document.getElementById(idPrefix + '-mkt');
      const nameInput = document.getElementById(idPrefix + '-name');
      const consent = {
        name: nameInput ? (nameInput.value || '').trim() : '',
        marketing_consent: !!(mktBox && mktBox.checked),
        terms_accepted: !!(termsBox && termsBox.checked),
        consent_text: (document.getElementById(idPrefix + '-mkt-text') || {}).textContent || ''
      };
      if (isPreviewMode) {
        submitBtn.disabled = true;
        statusEl.textContent = 'Sending…';
        setTimeout(function () {
          submitBtn.disabled = false;
          if (onDone) { onDone({ ok: true, downloadUrl: null }); return; }
          statusEl.textContent = 'Check your email — your download is on its way!';
          emailInput.value = '';
        }, 700);
        return;
      }
      submitBtn.disabled = true;
      statusEl.textContent = 'Sending…';
      submitCapture(email, source, deliverableListingId, consent)
        .then(function (result) {
          if (result.ok) {
            if (onDone) { onDone(result); return; }
            statusEl.textContent = result.downloadUrl ? 'Check your email — your download is on its way!' : "You're on the list!";
            emailInput.value = '';
          } else {
            statusEl.textContent = result.error || 'Something went wrong.';
          }
        })
        .finally(function () { submitBtn.disabled = false; });
    });
  }

  function submitCapture(email, source, deliverableListingId, consent) {
    const payload = Object.assign({ user_id: resolvedBakerId, email: email, source: source }, consent || {});
    if (!payload.name) delete payload.name;
    const listingId = deliverableListingId || (designBlocksMode ? null : profile.email_capture_deliverable_listing_id);
    if (listingId) payload.deliverable_listing_id = listingId;
    return fetch(SUPABASE_URL + '/functions/v1/capture-storefront-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (data) { return { httpOk: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.httpOk) return { ok: false, error: res.data.error };
        return { ok: true, downloadUrl: res.data.download_url || null };
      })
      .catch(function () { return { ok: false, error: 'Network error — please try again.' }; });
  }

  function renderEmailCapture(p) {
    const card = document.getElementById('email-capture');
    const heading = (p.email_capture_heading || '').trim();
    // Configured with a file to deliver → it's the lead magnet card instead.
    if (!heading || leadFromCapture) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-capture-title').textContent = cardTitle('emailCapture');
    document.getElementById('sf-capture-desc').textContent = (p.email_capture_body || '').trim();
    fillRichMedia(document.getElementById('sf-capture-media'), (blockCfg.emailCapture || {}).image_url, null);
    const wrap = document.getElementById('sf-capture-body');
    if (p.email_capture_display_style === 'popup') {
      wrap.innerHTML = '<button type="button" class="sf-btn" id="email-capture-open" style="gap:14px;">Join the list ' + ARROW_SVG + '</button>';
      document.getElementById('email-capture-open').addEventListener('click', function () { openCaptureSheet('popup'); });
      return;
    }
    wrap.innerHTML = captureFormMarkup('inline-capture', 'Join');
    wireCaptureForm(document.getElementById('inline-capture-form'), 'inline', null, function () {
      wrap.innerHTML = '<div class="sf-capture-done">' + CHECK_SVG + '<span>You\'re on the list — thank you!</span></div>';
    });
  }

  function renderHeaderSignupButton(p) {
    const existing = document.getElementById('header-signup-btn');
    if (!p.header_signup_enabled) { if (existing) existing.remove(); return; }
    const label = (p.header_signup_label || 'Sign up').trim() || 'Sign up';
    const btn = existing || document.createElement('button');
    btn.type = 'button';
    btn.id = 'header-signup-btn';
    btn.className = 'sf-pill-btn';
    btn.textContent = label;
    if (!existing) {
      btn.addEventListener('click', function () { openCaptureSheet('header'); });
      const actions = document.getElementById('sf-top-actions');
      actions.insertBefore(btn, actions.firstChild);
    }
  }

  function openCaptureSheet(source, deliverableListingId, headingOverride) {
    const heading = (headingOverride || profile.email_capture_heading || 'Join my list').trim() || 'Join my list';
    const body = headingOverride ? '' : (profile.email_capture_body || '').trim();
    document.getElementById('capture-sheet-body').innerHTML =
      '<h2 style="font-family:var(--display);font-weight:var(--dw);font-size:26px;line-height:1.1;color:var(--head-ink);margin-bottom:8px;padding-right:40px;">' + escapeHtml(heading) + '</h2>' +
      (body ? '<p style="font-size:15px;line-height:1.5;color:var(--n800);margin-bottom:16px;">' + escapeHtml(body) + '</p>' : '<div style="height:8px"></div>') +
      captureFormMarkup('popup-capture', deliverableListingId ? 'Send it to me' : 'Join', { stacked: true });
    wireCaptureForm(document.getElementById('popup-capture-form'), deliverableListingId ? 'lead_magnet' : source, deliverableListingId);
    document.getElementById('capture-scrim').classList.add('open');
  }
  function closeCaptureSheet() { document.getElementById('capture-scrim').classList.remove('open'); }

  // ══════════════════════ Tiles + single-item feature ══════════════════════

  function appendPhoto(box, item) {
    const ph = photoFallback(item);
    box.appendChild(ph);
    const img = document.createElement('img');
    img.alt = item.name || '';
    // No loading="lazy": the img stays display:none until it loads, and
    // Safari/WKWebView never lazy-loads an image that isn't laid out — the
    // photo would never appear in the iOS builder.
    img.onload = function () { focusImage(img, itemFocus(item)); img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);
    box.appendChild(img);
  }

  // Only stock status gets a badge. The kind (Ships, Pre-order, Custom…)
  // isn't labelled: the cards already group items by kind.
  function tileBadge(item) {
    if (!isSoldOut(item)) return null;
    if (item.listing_kind === 'preorder') return 'Ordering closed';
    if (item.listing_kind === 'ready_now') return 'Sold out today';
    return 'Sold out';
  }

  function appendTileBadge(photo, item) {
    const text = tileBadge(item);
    if (!text) return;
    const badge = document.createElement('span');
    badge.className = 'sf-badge';
    badge.textContent = text;
    photo.appendChild(badge);
  }

  function buildTile(item) {
    const art = document.createElement('article');
    art.className = 'sf-tile';
    art.addEventListener('click', function () { openItemSheet(item); });

    const photo = document.createElement('div');
    photo.className = 'sf-tile-img';
    appendPhoto(photo, item);
    appendTileBadge(photo, item);

    const body = document.createElement('div');
    body.className = 'sf-tile-body';
    if (item.promo) {
      const sale = document.createElement('span');
      sale.className = 'p-sale-badge';
      sale.textContent = item.promo.label;
      body.appendChild(sale);
    }
    const nameEl = document.createElement('span');
    nameEl.className = 'sf-tile-name';
    nameEl.textContent = item.name;
    body.appendChild(nameEl);
    const meta = subtitleFor(item);
    if (meta) {
      const metaEl = document.createElement('span');
      metaEl.className = 'sf-tile-meta';
      metaEl.textContent = meta;
      body.appendChild(metaEl);
    }
    const priceRow = document.createElement('div');
    priceRow.className = 'sf-price-row';
    const priceEl = document.createElement('span');
    priceEl.className = 'sf-price tabular';
    priceEl.innerHTML = priceHTML(item.original_price, item.price, { from: priceIsFrom(item) });
    priceRow.appendChild(priceEl);
    priceRow.appendChild(buildAddControl(item));
    body.appendChild(priceRow);

    art.appendChild(photo);
    art.appendChild(body);
    return art;
  }

  // A card holding just one item shows it as the regular tile laid out
  // side by side — photo left; name, details, a short description, price
  // and the add control right — rather than a full-width hero.
  function buildWideTile(item) {
    const art = buildTile(item);
    art.classList.add('sf-tile-wide');
    const desc = (item.item_description || '').trim();
    if (desc && desc !== subtitleFor(item)) {
      const d = document.createElement('p');
      d.className = 'sf-tile-desc';
      d.textContent = desc;
      const body = art.querySelector('.sf-tile-body');
      body.insertBefore(d, body.querySelector('.sf-price-row'));
    }
    return art;
  }

  function buildAddControl(item) {
    const wrap = document.createElement('div');
    wrap.dataset.itemId = item.id;
    refreshAddControl(wrap, item);
    return wrap;
  }

  function refreshAddControl(wrap, item) {
    wrap.dataset.trackItem = item.id;
    wrap.innerHTML = '';
    if (item.listing_kind === 'custom') {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '→';
      btn.setAttribute('aria-label', 'Request a custom order');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        window.location.href = customOrderURL(item);
      });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'digital' && item.has_variants) {
