      // A digital listing with variants (e.g. one file, four print sizes)
      // always routes to the item sheet's picker — same "no direct card
      // stepper" reasoning as is_assorted_box below, just for a single-select
      // option list instead of a flavor mix.
      const picked = digitalVariantCartLines.filter(function (l) { return l.menuItemId === item.id; }).length;
      const btn = document.createElement('button');
      btn.className = 'add-btn' + (picked > 0 ? ' added' : '');
      btn.textContent = picked > 0 ? String(picked) : '+';
      btn.setAttribute('aria-label', 'Choose an option');
      btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'digital') {
      // Digital purchases skip the pickup cart (no qty/dates/tiers to
      // track) but do get their own small cart — see digitalCart — so
      // multiple downloads can check out together instead of one at a time.
      const inCart = digitalCart.indexOf(item.id) !== -1;
      const btn = document.createElement('button');
      btn.className = 'add-btn' + (inCart ? ' added' : '');
      btn.textContent = inCart ? '✓' : '+';
      btn.setAttribute('aria-label', inCart ? 'Remove from download cart' : 'Add to download cart');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleDigitalCartItem(item);
      });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'physical' && item.has_variants) {
      // A physical listing with variants (e.g. a cookie-cutter set in
      // Small/Medium/Large/XL, each with its own stock) always routes to
      // the item sheet's picker, same reasoning as digital has_variants
      // above — a card-level stepper can't represent "which size."
      const qty = shipVariantCartLines.filter(function (l) { return l.menuItemId === item.id; })
        .reduce(function (s, l) { return s + l.qty; }, 0);
      const anyStock = (item.listing_variants || []).some(function (v) { return (v.stock_qty || 0) > 0; });
      const btn = document.createElement('button');
      btn.className = 'add-btn' + (qty > 0 ? ' added' : '');
      if (!anyStock || !stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
        btn.title = stripeReady ? 'Sold out' : (ordersPaused ? 'Not taking orders right now' : 'Ordering isn\'t live yet');
      } else {
        btn.textContent = qty > 0 ? String(qty) : '+';
        btn.setAttribute('aria-label', 'Choose an option');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'physical') {
      // Ships items skip the pickup cart too, same reasoning as digital —
      // but unlike digital they're stock-bound, so this is a qty stepper
      // (see shipCart) clamped at available_qty_today rather than a plain
      // in/out toggle.
      const qty = shipCart[item.id] || 0;
      const max = item.available_qty_today || 0;
      if (max <= 0 || !stripeReady) {
        const btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.style.opacity = '.4'; btn.disabled = true;
        btn.textContent = '—';
        btn.title = stripeReady ? 'Sold out' : (ordersPaused ? 'Not taking orders right now' : 'Ordering isn\'t live yet');
        wrap.appendChild(btn);
        return;
      }
      if (qty === 0) {
        const btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Add to ship cart');
        btn.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, 1); });
        wrap.appendChild(btn);
      } else {
        const stepper = document.createElement('div');
        stepper.className = 'qty-stepper';
        const minus = document.createElement('button');
        minus.textContent = '−';
        minus.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, -1); });
        const qtyEl = document.createElement('span');
        qtyEl.className = 'qty';
        qtyEl.textContent = qty;
        const plus = document.createElement('button');
        plus.textContent = '+';
        // Clamped at stock on hand — the real, atomic check happens
        // server-side at charge time (decrement_menu_item_stock_batch);
        // this is just so a buyer never sees a total they can't pay for.
        if (qty >= max) { plus.disabled = true; plus.style.opacity = '.35'; }
        plus.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, 1); });
        stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
        wrap.appendChild(stepper);
      }
      return;
    }
    if (item.is_assorted_box) {
      // Boxes don't track a plain sold-out quantity — building the flavor
      // mix always happens in the sheet, never a direct card stepper.
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      if (!stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
      } else {
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Build your box');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'preorder') {
      // Always routes through the sheet — even single-date/weekday/lead-time
      // modes benefit from showing the ready date there, and a multi-date
      // listing requires picking one before it can be added at all.
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      if (isSoldOut(item) || !stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
        btn.title = stripeReady ? 'Ordering closed' : (ordersPaused ? 'Not taking orders right now' : 'Ordering isn\'t live yet');
      } else {
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Choose pickup date');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    const qty = cart[item.id] || 0;
    if (isSoldOut(item) || !stripeReady) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.style.opacity = '.4'; btn.disabled = true;
      btn.textContent = '—';
      btn.title = stripeReady ? 'Sold out for today' : (ordersPaused ? 'Not taking orders right now' : 'Ordering isn\'t live yet');
      wrap.appendChild(btn);
      return;
    }
    if (qty === 0) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '+';
      btn.setAttribute('aria-label', 'Add to order');
      btn.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      wrap.appendChild(btn);
    } else {
      const stepper = document.createElement('div');
      stepper.className = 'qty-stepper';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, -1); });
      const qtyEl = document.createElement('span');
      qtyEl.className = 'qty';
      qtyEl.textContent = qty;
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
      wrap.appendChild(stepper);
    }
  }

  function changeQty(item, delta) {
    lastAddedItemId = item.id;
    const current = cart[item.id] || 0;
    const next = Math.max(0, current + delta);
    if (next === 0) { delete cart[item.id]; } else { cart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateCartUI();
  }

  // Every cart type — pickup/preorder/box, digital downloads, ships-to-you
  // — counted and totalled together. A buyer shouldn't have to parse
  // separate mini-carts just because the storefront's own plumbing tracks
  // pickup/digital/ship as distinct arrays internally; that split is our
  // problem to manage, not something to surface as three competing
  // banners. The cart sheet (renderCartStepOrder) is still the one place
  // per-vertical detail — sections, shipping fee, etc. — belongs.
  function cartCombinedCount() {
    const plainCount = Object.values(cart).reduce(function (s, q) { return s + q; }, 0);
    const boxCount = boxCartLines.reduce(function (s, l) { return s + l.qty; }, 0);
    const preorderCount = preorderCartLines.reduce(function (s, l) { return s + l.qty; }, 0);
    const digitalCount = digitalCartItems().length;
    const shipCount = shipCartItems().reduce(function (s, l) { return s + l.qty; }, 0);
    return plainCount + boxCount + preorderCount + digitalCount + shipCount;
  }
  // Item subtotal only, across every vertical — no shipping fee, no tax.
  // Not customary for a mini-cart banner to show a fees-inclusive figure
  // before the buyer has even reached checkout, and the three separate
  // subtotal helpers below already exclude each other's fees by construction.
  function cartCombinedSubtotal() {
    return cartSubtotal() + digitalCartTotal() + shipCartItemsSubtotal();
  }

  // Header cart icon (mobile 🛒 badge + desktop "Cart · N" pill) — kept in
  // sync by having updateCartUI/updateDigitalCartUI/updateShipCartUI all
  // call this (and updateCartActionBar below) whenever any cart changes.
  function updateHeaderCartBadge() {
    document.getElementById('cart-btn-count').textContent = String(cartCombinedCount());
    refreshDigitalPills();
  }

  // The one bottom-of-screen cart banner (#action-bar-cart) — see the HTML
  // comment above it for why this used to be up to three stacked banners.
  // Deliberately just "View Cart" + the subtotal, no item count — nothing
  // else on the page needed a per-vertical breakdown at this level either.
  // Sticky bottom bar (handoff #9): "{n} in cart · $total" + Checkout.
  function updateCartActionBar() {
    const bar = document.getElementById('sf-cartbar');
    const count = cartCombinedCount();
    bar.classList.toggle('hidden', count === 0);
    if (count > 0) {
      document.getElementById('sf-cartbar-label').textContent =
        count + ' in cart · $' + formatPrice(cartCombinedSubtotal());
    }
  }

  // updateCartUI/updateDigitalCartUI/updateShipCartUI are called from
  // every place that mutates their respective cart (changeQty,
  // toggleDigitalCartItem, changeShipQty, etc.) — kept as three distinctly-
  // named entry points (rather than renaming every call site to one shared
  // function) but all converging on the same header badge + single banner.
  function updateCartUI() {
    updateHeaderCartBadge();
    updateCartActionBar();
  }

  // Returns every digital cart entry — both the plain in/out picks
  // (digitalCart, bare ids) and variant picks (digitalVariantCartLines,
  // since the same base item can appear more than once with a different
  // option chosen) — normalized to one shape via Object.assign: every
  // field the base listing has (id, category, etc., for itemImgURL and
  // friends) plus lineKey (unique per cart line, used for removal —
  // equal to the base item id for a plain pick, so existing single-pick
  // behavior is unchanged) and, for a variant pick, an overridden
  // price/name and the variantId/variantLabel that picked it.
  function digitalCartItems() {
    const plain = digitalCart.map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? Object.assign({}, item, { lineKey: item.id, variantId: null, variantLabel: null }) : null;
    }).filter(Boolean);
    const variantLines = digitalVariantCartLines.map(function (ln) {
      const base = allListings.find(function (l) { return l.id === ln.menuItemId; });
      if (!base) return null;
      return Object.assign({}, base, {
        lineKey: ln.lineId, price: ln.price, variantId: ln.variantId, variantLabel: ln.variantLabel,
        name: base.name + ' — ' + ln.variantLabel
      });
    }).filter(Boolean);
    return plain.concat(variantLines);
  }
  function digitalCartTotal() {
    return digitalCartItems().reduce(function (s, i) { return s + i.price; }, 0);
  }
  function toggleDigitalCartItem(item) {
    const idx = digitalCart.indexOf(item.id);
    if (idx === -1) digitalCart.push(item.id); else digitalCart.splice(idx, 1);
    saveCart();
    renderDigitalFeed();
    updateDigitalCartUI();
  }
  // A digital item with variants always adds/removes through the item
  // sheet's picker (see refreshAddControl's has_variants check), toggling
  // one specific option in or out — same in/out feel as
  // toggleDigitalCartItem, just keyed by (item, variant) instead of item alone.
  function toggleDigitalVariantCartLine(item, variant) {
    const idx = digitalVariantCartLines.findIndex(function (l) { return l.menuItemId === item.id && l.variantId === variant.id; });
    if (idx !== -1) {
      digitalVariantCartLines.splice(idx, 1);
    } else {
      digitalVariantCartLines.push({
        lineId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()),
        menuItemId: item.id, variantId: variant.id, variantLabel: variant.label, price: variant.price
      });
    }
    saveCart();
    updateDigitalCartUI();
  }
  // Single removal entry point for the cart sheet's ✕ button — works for
  // either a plain pick or a variant line without the caller needing to
  // know which one a given lineKey belongs to.
  function removeDigitalCartLine(lineKey) {
    const idx = digitalCart.indexOf(lineKey);
    if (idx !== -1) { digitalCart.splice(idx, 1); saveCart(); return; }
    digitalVariantCartLines = digitalVariantCartLines.filter(function (l) { return l.lineId !== lineKey; });
    saveCart();
  }
  function updateDigitalCartUI() {
    updateHeaderCartBadge();
    updateCartActionBar();
  }
  // itemId, or itemId~variantId for a variant pick — parsed back out by
  // digital-checkout.html.
  function digitalCartLineToken(entry) {
    return entry.variantId ? (entry.id + '~' + entry.variantId) : entry.id;
  }
  function digitalCartCheckoutURL() {
    const tokens = digitalCartItems().map(digitalCartLineToken);
    return '/baker/digital-checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&items=' + encodeURIComponent(tokens.join(',')) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  // Ships (physical) cart — a { itemId: qty } map for plain items, so
  // those lines carry a real stepper (see refreshAddControl's 'physical'
  // branch and the cart sheet's 'ship' line kind); variant picks live in
  // shipVariantCartLines instead (same reasoning as digitalVariantCartLines
  // above — the same base item can appear more than once with a different
  // option chosen). shipCartItems() normalizes both into one list of
  // { item, qty } pairs, with the variant line's own price/lineKey/
  // variantId/variantLabel folded into `item` via Object.assign so every
  // existing consumer that reads l.item.price/l.item.id etc. picks up the
  // right value automatically without needing to know which source a
  // given line came from.
  function shipCartItems() {
    const plain = Object.keys(shipCart).map(function (id) {
      const base = allListings.find(function (l) { return l.id === id; });
      if (!base) return null;
      return { item: Object.assign({}, base, { lineKey: base.id, variantId: null, variantLabel: null }), qty: shipCart[id] };
    }).filter(Boolean);
    const variantLines = shipVariantCartLines.map(function (ln) {
      const base = allListings.find(function (l) { return l.id === ln.menuItemId; });
      if (!base) return null;
      return {
        item: Object.assign({}, base, {
          lineKey: ln.lineId, price: ln.price, variantId: ln.variantId, variantLabel: ln.variantLabel,
          name: base.name + ' — ' + ln.variantLabel
        }),
        qty: ln.qty
      };
    }).filter(Boolean);
    return plain.concat(variantLines);
  }
  function shipCartItemsSubtotal() {
    return shipCartItems().reduce(function (s, l) { return s + l.item.price * l.qty; }, 0);
  }
  // Shipping fee is a flat per-listing amount (set by the baker, see
  // WebShopShippingSheet) charged once per distinct BASE item in the cart
  // (deduped by the item's real id, not lineKey — two different options of
  // the same cookie-cutter-set listing still only pay the fee once), not
  // once per unit. Real carrier-computed rates are a later integration;
  // this is just the manual placeholder for it. A baker can also set a
  // storefront-wide "free shipping over $X"
  // (profile.shipping_free_over_threshold) that waives every item's fee
  // once the ship-cart's item subtotal alone clears it.
  //
  // Combined-shipping: among the distinct base items in the cart, the one
  // with the highest shipping_fee charges in full; every other distinct
  // item charges round(shipping_fee * shipping_additional_item_percent /
  // 100) instead of its own full fee, unless it has
  // shipping_always_full_price set (always full fee regardless of rank).
  // shipping_additional_item_percent defaults to 100 (no discount) — same
  // "sum of full fees" behavior as before this existed. See
  // finalize-guest-physical-order for the authoritative server-side
  // recompute of this exact same rule.
  function shipCartShippingFees() {
    const threshold = (profile && profile.shipping_free_over_threshold) || 0;
    if (threshold > 0 && shipCartItemsSubtotal() >= threshold) return 0;
    const additionalPercent = (profile && profile.shipping_additional_item_percent != null)
      ? profile.shipping_additional_item_percent : 100;
    const seen = {};
    const distinct = [];
    shipCartItems().forEach(function (l) {
      if (seen[l.item.id]) return;
      seen[l.item.id] = true;
      distinct.push(l.item);
    });
    if (distinct.length === 0) return 0;
    let highestIdx = 0;
    distinct.forEach(function (item, idx) {
      if ((item.shipping_fee || 0) > (distinct[highestIdx].shipping_fee || 0)) highestIdx = idx;
    });
    let fee = 0;
    distinct.forEach(function (item, idx) {
      if (idx === highestIdx) fee += (item.shipping_fee || 0);
      else if (item.shipping_always_full_price) fee += (item.shipping_fee || 0);
      else fee += Math.round((item.shipping_fee || 0) * additionalPercent / 100 * 100) / 100;
    });
    return fee;
  }
  function shipCartTotal() {
    return shipCartItemsSubtotal() + shipCartShippingFees();
  }
  // Plain (non-variant) physical items only — a has_variants item always
  // goes through the item sheet's picker/stepper instead (see
  // refreshAddControl and changeShipVariantLineQty below).
  function changeShipQty(item, delta) {
    const current = shipCart[item.id] || 0;
    const max = item.available_qty_today || 0;
    const next = Math.max(0, Math.min(max, current + delta));
    if (next === 0) { delete shipCart[item.id]; } else { shipCart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateShipCartUI();
  }
  // Adds one unit of a specific variant to the ship cart, merging into an
  // existing line for the same (item, variant) pair rather than creating a
  // duplicate — clamped at that variant's own stock, re-resolved live from
  // allListings rather than trusted from whatever the sheet had open.
  function addShipVariantToCart(item, variant) {
    const base = allListings.find(function (l) { return l.id === item.id; }) || item;
    const liveVariant = (base.listing_variants || []).find(function (v) { return v.id === variant.id; }) || variant;
    const max = liveVariant.stock_qty || 0;
    const existing = shipVariantCartLines.find(function (l) { return l.menuItemId === item.id && l.variantId === variant.id; });
    if (existing) {
      existing.qty = Math.min(max, existing.qty + 1);
    } else if (max > 0) {
      shipVariantCartLines.push({
        lineId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()),
        menuItemId: item.id, variantId: liveVariant.id, variantLabel: liveVariant.label, price: liveVariant.price, qty: 1
      });
    }
    saveCart();
    updateShipCartUI();
  }
  function changeShipVariantLineQty(lineId, delta) {
    const line = shipVariantCartLines.find(function (l) { return l.lineId === lineId; });
    if (!line) return;
    const base = allListings.find(function (l) { return l.id === line.menuItemId; });
    const variant = base && (base.listing_variants || []).find(function (v) { return v.id === line.variantId; });
    const max = variant ? (variant.stock_qty || 0) : line.qty;
    line.qty = Math.max(0, Math.min(max, line.qty + delta));
    if (line.qty === 0) { shipVariantCartLines = shipVariantCartLines.filter(function (l) { return l.lineId !== lineId; }); }
    saveCart();
    updateShipCartUI();
  }
  // Single "change qty by delta" entry point for the cart sheet's
  // −/+ buttons — routes to the plain or variant path without the caller
  // needing to know which one a given lineKey belongs to.
  function changeShipCartLine(lineKey, delta) {
    if (Object.prototype.hasOwnProperty.call(shipCart, lineKey)) {
      const item = allListings.find(function (l) { return l.id === lineKey; });
      if (item) changeShipQty(item, delta);
    } else {
      changeShipVariantLineQty(lineKey, delta);
    }
  }
  function updateShipCartUI() {
    updateHeaderCartBadge();
    updateCartActionBar();
  }
  // itemId:qty, or itemId:qty:variantId for a variant pick — parsed back
  // out by physical-checkout.html.
  function shipCartLineToken(l) {
    return l.item.id + ':' + l.qty + (l.item.variantId ? ':' + l.item.variantId : '');
  }
  function shipCartCheckoutURL() {
    const pairs = shipCartItems().map(shipCartLineToken);
    return '/baker/physical-checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&items=' + encodeURIComponent(pairs.join(',')) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  function cartLines() {
    const plain = Object.keys(cart).map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? { kind: 'plain', item: item, qty: cart[id] } : null;
    }).filter(Boolean);
    const boxed = boxCartLines.map(function (bl) {
      const item = allListings.find(function (l) { return l.id === bl.menuItemId; }) ||
        { id: bl.menuItemId, name: bl.itemName, tax_category: bl.taxCategory, unit_weight_grams: bl.unitWeightGrams };
      return { kind: 'box', item: item, line: bl, qty: bl.qty };
    });
    const preordered = preorderCartLines.map(function (pl) {
      const item = allListings.find(function (l) { return l.id === pl.menuItemId; });
      return item ? { kind: 'preorder', item: item, line: pl, qty: pl.qty } : null;
    }).filter(Boolean);
    return plain.concat(boxed).concat(preordered);
  }

  function cartSubtotal() {
    return cartLines().reduce(function (sum, l) {
      const price = l.kind === 'box' ? l.line.price : l.item.price;
      return sum + price * l.qty;
    }, 0);
  }

  // Guest checkout: the customer pays exactly the item subtotal (+ tax) —
  // Bakeri's service charge comes out of the baker's side instead, so it's
  // never shown or added to this preview. Mirrors create-payment-intent's
  // guest branch in supabase/functions/create-payment-intent/index.ts.

  // Sales tax is calculated by Stripe Tax at checkout (create-payment-intent),
  // from the vendor's own tax registrations and where the order is picked up
  // or shipped — the cart can't know it yet, so a vendor who collects tax
  // gets a note instead (profile.is_gst_registered = collects sales tax).
  function cartTotal() { return cartSubtotal(); }

  // ══════════════════════ Item Sheet ══════════════════════


  // ══════════════════════ Product share links ══════════════════════
  //
  // bakeriapp.com/<slug>?item=<first 8 hex of the listing id> opens the
  // storefront straight onto that product (404.html forwards ?item= through
  // the clean-URL redirect). The open item sheet keeps the address bar on
  // that link, and its Share button hands it to the phone's share sheet (or
  // copies it). Same block in index.html and next.html.
  let sheetItem = null;
  function itemShareCode(item) { return String(item.id).toLowerCase().replace(/-/g, '').slice(0, 8); }
  function itemShareURL(item) {
    const s = (profile && profile.profile_slug) || slug;
    return 'https://bakeriapp.com/' + encodeURIComponent(s) + '?item=' + itemShareCode(item);
  }
  function findItemByShareCode(code) {
    const c = String(code || '').toLowerCase().replace(/[^0-9a-f]/g, '');
    if (c.length < 6) return null;
    return allListings.find(function (l) { return String(l.id).toLowerCase().replace(/-/g, '').indexOf(c) === 0; }) || null;
  }
  function setItemInAddressBar(item) {
    if (isPreviewMode || !window.history || !window.history.replaceState) return;
    try {
      const u = new URL(window.location.href);
      if (item) u.searchParams.set('item', itemShareCode(item)); else u.searchParams.delete('item');
      window.history.replaceState(window.history.state, '', u.pathname + u.search + u.hash);
    } catch (e) { /* older browsers: the link still works from the Share button */ }
  }
  function shareItem(item) {
    if (!item) return;
    const url = itemShareURL(item);
    const shop = (profile && (profile.business_name || profile.user_name)) || 'Bakeri';
    if (navigator.share) {
      navigator.share({ title: item.name, text: item.name + ' from ' + shop, url: url }).catch(function () {});
      return;
    }
    const done = function () { showToast('Link copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { window.prompt('Copy this link:', url); });
    else window.prompt('Copy this link:', url);
  }
  function openSharedItemFromURL() {
    const code = params.get('item');
    if (!code || isPreviewMode) return;
    const item = findItemByShareCode(code);
    if (item) openItemSheet(item);
    else { setItemInAddressBar(null); showToast('That item isn’t available right now.'); }
  }

  function openItemSheet(item) {
    sheetItem = item;
    lastAddedItemId = item.id;
    trackVisit('item_view', item.id);
    setItemInAddressBar(item);
    document.getElementById('item-sheet-name').textContent = item.name;
    document.getElementById('item-sheet-price').innerHTML = priceHTML(item.original_price, item.price, { from: priceIsFrom(item) });
    const descEl = document.getElementById('item-sheet-desc');
    const descToggle = document.getElementById('item-sheet-desc-toggle');
    const longDigital = item.listing_kind === 'digital' && String(item.item_description || '').length > 240;
    descEl.classList.toggle('rich-desc', longDigital);
    if (longDigital) {
      // A course or recipe book: the description is the sales page, shown
      // in full and formatted rather than clamped behind "Read more".
      descEl.innerHTML = richText(item.item_description);
      descEl.classList.remove('clamped');
    } else {
      descEl.textContent = item.item_description || '';
      descEl.classList.add('clamped');
    }
    // Tapping the (clamped) text itself or "Read more" both open the full
    // description in its own popup rather than expanding inline — reading
    // a long one then never means scrolling the item sheet at all.
    const openFullDesc = function () { openDescSheet(item.name, item.item_description || ''); };
    descEl.onclick = openFullDesc;
    descToggle.onclick = openFullDesc;

    // Sold-out-aware badge — the one place a "Sold Out" label appears,
    // matching the app's dedicated item-detail treatment rather than
    // swapping the grid's badge (which stays the plain kind label there).
    const badge = badgeInfo(item);
    const badgeEl = document.getElementById('item-sheet-badge');
    badgeEl.style.background = badge.bg;
    badgeEl.innerHTML = '<span class="dot"></span>' + badge.label;

    const ph = document.getElementById('item-sheet-ph');
    ph.textContent = categoryEmoji(item);
    ph.style.display = 'flex';
    const img = document.getElementById('item-sheet-img');
    img.style.display = 'none';
    img.onload = function () { focusImage(img, itemFocus(item)); img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);

    const specs = [];
    if (item.lead_time_note) specs.push({ k: 'Lead time', v: item.lead_time_note });
    if (item.allergens) specs.push({ k: 'Allergens', v: item.allergens });
    document.getElementById('item-sheet-specs').innerHTML = specs.map(function (s) {
      return '<div class="spec-row"><span>' + s.k + '</span><b>' + escapeHtml(s.v) + '</b></div>';
    }).join('');

    const cta = document.getElementById('item-sheet-cta');
    const boxEl = document.getElementById('item-sheet-box');
    boxState = null;
    preorderState = null;
    variantState = null;

    if (item.is_assorted_box) {
      boxEl.style.display = 'block';
      openBoxPicker(item);
    } else if (item.listing_kind === 'preorder') {
      openPreorderPicker(item);
    } else if (item.has_variants) {
      boxEl.style.display = 'block';
      openVariantPicker(item);
    } else {
      boxEl.style.display = 'none';
      boxEl.innerHTML = '';
      if (item.listing_kind === 'custom') {
        cta.textContent = 'Request a Custom Order';
        cta.disabled = false;
        cta.style.opacity = '1';
        cta.onclick = function () { window.location.href = customOrderURL(item); };
      } else if (item.listing_kind === 'digital') {
        const inCart = digitalCart.indexOf(item.id) !== -1;
        cta.textContent = (inCart ? 'Remove from Cart ✓ — $' : 'Add to Cart — $') + formatPrice(item.price);
        cta.disabled = !stripeReady;
        cta.style.opacity = stripeReady ? '1' : '.5';
        cta.onclick = stripeReady ? function () {
          toggleDigitalCartItem(item);
          closeItemSheet();
          showToast(inCart ? 'Removed from your download cart' : 'Added to your download cart');
        } : null;
      } else if (item.listing_kind === 'physical') {
        if (isSoldOut(item) || !stripeReady) {
          cta.textContent = isSoldOut(item) ? 'Sold Out' : (ordersPaused ? 'Not Taking Orders' : 'Ordering Opens Soon');
          cta.disabled = true;
          cta.style.opacity = '.5';
        } else {
          cta.textContent = 'Add to Cart — $' + formatPrice(item.price);
          cta.disabled = false;
          cta.style.opacity = '1';
          cta.onclick = function () {
            changeShipQty(item, 1);
            closeItemSheet();
            showToast('Added to your ship cart');
          };
        }
      } else if (isSoldOut(item)) {
        cta.textContent = 'Sold Out';
        cta.disabled = true;
        cta.style.opacity = '.5';
      } else if (!stripeReady) {
        cta.textContent = (ordersPaused ? 'Not Taking Orders' : 'Ordering Opens Soon');
        cta.disabled = true;
        cta.style.opacity = '.5';
      } else {
        cta.textContent = 'Add to Order';
        cta.disabled = false;
        cta.style.opacity = '1';
        cta.onclick = function () {
          changeQty(item, 1);
          closeItemSheet();
          showToast('Added to your order');
        };
      }
    }

    document.getElementById('item-scrim').classList.add('open');

    // CSS aspect-ratio on a flex item has inconsistent cross-browser
    // support for constraining height (notably iOS Safari) — set the
    // photo's height explicitly from its own resolved width instead of
    // relying on the browser to reconcile aspect-ratio with flex sizing.
    // clientWidth forces a synchronous layout, so this reads correctly
    // right after the sheet becomes visible.
    const photoEl = document.getElementById('item-sheet-photo');
    photoEl.style.height = photoEl.clientWidth + 'px';

    // Only now (sheet visible, clamp applied) do scrollHeight/clientHeight
    // reflect real layout — measuring this before .open is added would
    // read 0/0 off a display:none subtree and never show the toggle. A
    // short description that doesn't overflow isn't clickable at all —
    // opening a popup to show the exact same text it's already showing
