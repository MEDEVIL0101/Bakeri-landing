<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<base href="https://bakeriapp.com/baker/">
<script>
// PRIVATE PREVIEW for a pitch: nothing leaves this page. Every network call
// (checkout, sign-ups, analytics) is refused; images load as normal tags.
window.fetch = function () { return Promise.reject(new Error('Preview: offline')); };
navigator.sendBeacon = function () { return false; };
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri</title>
  <meta name="description" content="View this shop's storefront on Bakerï." />
  <!-- Same page as index.html, kept at this path for the app's builder
       (StorefrontDesignStore.shellURL) and old links. Not indexed — index.html
       is the canonical storefront. -->
  
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" />
  <script src="theme.js"></script>
  <script src="intake-form.js"></script>

  <style>
    :root {
      /* theme.js writes these from profiles.selected_theme (light palette
         only — see forceLight); applyDesignTokens() then derives the
         storefront's own roles from them unless the baker overrode them. */
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-gold:      #C49A6C;
      --theme-button-fg: #FFFFFF;

      /* Seller roles (handoff "Design Tokens" → seller theme). */
      --accent:     #1C1C1E;
      --accent-600: #111113;
      --accent-fg:  #FFFFFF;
      --head-ink:   #1C1C1E;   /* handoff `ink` — headings/prices on white */
      --tint:       #F1EFEC;

      /* Fixed, Bakeri-owned. */
      --text:  #201e1d;
      --n800:  #444141;
      --n700:  #605d5d;
      --n300:  #d7d3d3;
      --n200:  #eae7e7;
      --n100:  #f8f4f4;
      --shadow-sm: 0 1px 2px rgba(45,43,43,.14);
      --shadow-md: 0 3px 10px rgba(45,43,43,.16);
      --shadow-lg: 0 12px 32px rgba(45,43,43,.22);
      --r: 18px; --rs: 12px; --rp: 999px;
      --body: "Archivo", -apple-system, system-ui, sans-serif;
      --display: "Archivo", -apple-system, system-ui, sans-serif;
      --dw: 800;

      /* Names the carried-over sheet/cart/picker CSS below still uses. */
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --ink: var(--text);
      --bio: var(--n800);
      --muted: var(--n700);
      --line: var(--n200);
      --line-soft: var(--n100);
      --ready: #3FA672; --preorder: #C79A3D; --custom: #A66A5B; --digital: #5F92E6; --physical: #7A8C5C;
      --error: #C0392B;
      /* Promotions (banner, sale prices, discount tag) — set from the theme
         accent or storefront_design.colors.sale in applyDesignTokens(). */
      --sale: var(--error); --sale-fg: #fff; --sale-ink: var(--sale);
      --sans: var(--body);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* html carries the page's base colour (theme bg / fade base) — body
       stays transparent so theme.js's z-index:-1 pattern layer and the
       background-image layers still paint above it (see the long note in
       index.html on why body must not get its own background). */
    html { background: var(--theme-bg); }
    body { font-family: var(--body); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    button, input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ph-fallback { background: var(--n100); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }

    /* ══════════════ Background layers (see renderBackground) ══════════════
       The photo / fade / pattern lives in #sf-frame: a panel centred behind
       the cards, 50px wider than the card column on each side, full page
       height, with a soft edge shadow. Outside it the page is the plain
       base colour (html background) — so on a wide monitor the photo never
       stretches to the screen edges. Below ~1180px wide the frame is simply
       the full width. */
    #sf-root { position: relative; }
    #sf-frame {
      position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100%, 1180px); z-index: -1; pointer-events: none;
      /* clip, not hidden: hidden makes the frame a scroll container, which
         stops #sf-bg-full sticking to the screen (the photo scrolled away). */
      overflow: hidden; overflow: clip;
      background: var(--fade-base, var(--theme-bg));
      box-shadow: 0 0 0 1px rgba(45,43,43,.04), 0 10px 40px rgba(45,43,43,.14);
    }
    /* Theme background (no photo): the theme's colour + pattern fill the
       whole screen — no centred panel. theme.js's own full-screen fixed
       pattern layer is left as-is; the frame just disappears. */
    #sf-root.bg-theme #sf-frame { display: none; }
    #sf-bg-top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1;
      background-position: center top; background-size: cover; background-repeat: no-repeat;
    }
    /* The fade: image fully visible down to 60% of its rendered height,
       then into the solid base colour by 100% (handoff photo-with-fade). */
    #sf-bg-top::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 0, transparent 60%, var(--fade-base, var(--theme-bg)) 100%);
    }
    /* Full-page photo: a viewport-tall layer stuck to the top of the frame
       while it scrolls, so the photo is sized to the screen, not to the
       (very tall) page. */
    #sf-bg-full {
      position: sticky; top: 0; height: 100vh; height: 100lvh; z-index: 1;
      background-position: center; background-size: cover; background-repeat: no-repeat;
    }
    /* A photo stretched well past its own width (a phone-sized photo on a
       desktop) would look soft and pixelated, so it becomes a blurred
       backdrop instead, like a link-in-bio page on a computer. */
    #sf-bg-full.soft { filter: blur(26px) saturate(1.05); }

    /* ══════════════ Page column + responsive tokens ══════════════
       Compact mode is driven by the column's own width (ResizeObserver →
       .compact), not a viewport media query — same as the handoff. */
    #sf-root {
      --pad: 40px; --padb: 64px; --gap: 22px; --cpad: 36px; --cpad2: 32px;
      --logo: 168px; --proftop: 24px; --h1: 60px; --h2: 34px; --h3: 32px; --h3m: 30px;
      --h2a: 46px; --ggap: 16px; --apad: 44px;
      width: 100%;
    }
    #sf-root.compact {
      --pad: 10px; --padb: 28px; --gap: 12px; --cpad: 16px; --cpad2: 18px;
      --logo: 120px; --proftop: 56px; --h1: 36px; --h2: 24px; --h3: 24px; --h3m: 22px;
      --h2a: 30px; --ggap: 10px; --apad: 20px;
    }
    #page-shell {
      max-width: 1160px; margin: 0 auto; padding: var(--pad) var(--pad) var(--padb);
      display: flex; flex-direction: column; gap: var(--gap);
    }

    #announcement-banner {
      align-self: center; max-width: 100%; text-align: center;
      padding: 9px 18px; border-radius: var(--rp); background: #fff; box-shadow: var(--shadow-sm);
      font-size: 13px; font-weight: 700; color: var(--head-ink);
    }
    #announcement-banner.promo { background: var(--sale); color: var(--sale-fg); }

    /* ══════════════ 1. Profile top ══════════════ */
    #profile-block {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: var(--proftop) 0 8px; text-align: center;
    }
    #sf-top-actions { position: absolute; top: 0; right: 0; display: flex; gap: 8px; z-index: 2; }
    .sf-pill-btn {
      height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0 16px; border: 0; background: #fff; border-radius: var(--rp); box-shadow: var(--shadow-md);
      color: var(--text); font: 700 14px var(--body); cursor: pointer;
    }
    .sf-pill-btn.icon { padding: 0; width: 44px; }
    #pb-avatar {
      width: var(--logo); height: var(--logo); border-radius: 50%; border: 6px solid #fff; background: var(--accent);
      box-shadow: var(--shadow-lg); overflow: hidden; position: relative; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-fg); font: var(--dw) calc(var(--logo) * .42) var(--display);
    }
    #pb-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #fff; }
    /* Logo turned off (storefront_design.identity.logo = 'none'): no circle;
       the background photo carries the header, so the name sits lower and
       the photo shows above it. */
    #sf-root.no-logo #shop-name { margin-top: max(calc(var(--logo) * 1.15), 52vh); margin-top: max(calc(var(--logo) * 1.15), 52svh); }
    #shop-name {
      font-family: var(--title-font, var(--display)); font-weight: var(--title-w, var(--dw));
      font-size: calc(var(--h1) * var(--title-scale, 1)); line-height: 1.2; letter-spacing: 0;
      /* Always one line — fitShopName() shrinks a name that won't fit. */
      margin: 4px 0 0; max-width: 100%; white-space: nowrap;
      color: var(--head-ink); text-shadow: none;
    }
    /* Shadows stay tight (1–2px): wide glows and halos made the name look
       out of focus (2026-11-05). */
    #sf-root.name-on-dark #shop-name { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
    /* A baker-chosen name colour (profile card → Titles) keeps a neutral
       shadow so it stays legible on photos and patterns. */
    #sf-root #shop-name.custom-color { text-shadow: 0 1px 2px rgba(0,0,0,.22) !important; }
    /* On a light PHOTO (not a flat theme colour) the handoff's 1px white
       shadow isn't enough against busy detail — a soft white halo is. */
    #sf-root.name-on-photo:not(.name-on-dark) #shop-name {
      text-shadow: 0 1px 1px rgba(255,255,255,.85);
    }
    #sf-root.name-on-photo.name-on-dark #shop-name { text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 1px rgba(0,0,0,.45); }
    #sf-intro-card {
      width: 100%; max-width: 620px; margin-top: 6px; padding: var(--cpad2);
      background: var(--card-bg, #fff); color: var(--card-text, var(--text));
      border-radius: var(--r); box-shadow: var(--shadow-md);
      display: flex; flex-direction: column; gap: 12px;
    }
    #shop-meta { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--card-text, var(--text)); }
    #shop-bio { margin: 0 0 6px; font-size: 16px; line-height: 1.55; text-wrap: pretty; white-space: pre-line; }
    /* Wide pages (desktop, ≥ 860px of column): logo + name on the left,
       the menu card on the right, instead of all stacked. #sf-root.wide is
       set from the column's own width, like .compact. */
    #sf-root.wide #profile-block {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      grid-template-areas: "avatar card" "name card";
      column-gap: 48px; row-gap: 16px; align-items: center;
      padding-top: calc(var(--proftop) + 52px); /* clear the share/cart pills */
    }
    #sf-root.wide #pb-avatar { grid-area: avatar; justify-self: center; align-self: end; }
    #sf-root.wide #shop-name { grid-area: name; justify-self: center; align-self: start; margin: 0; }
    #sf-root.wide #sf-intro-card { grid-area: card; max-width: none; margin-top: 0; align-self: center; }
    #sf-nav { display: flex; flex-direction: column; gap: 10px; }
    #sf-nav:empty { display: none; }
    /* Nav buttons + plain-pill links share one look. */
    .sf-navbtn {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 0 20px; border-radius: var(--rp); border: 2px solid var(--n300);
      background: #fff; color: var(--text); font: 800 16px var(--body); text-decoration: none; text-align: left;
      cursor: pointer; width: 100%;
    }
    .sf-navbtn:hover { filter: brightness(.96); }
    .sf-navbtn.primary { background: var(--btn-bg, var(--accent)); border-color: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); }
    .sf-navbtn svg { flex: none; }
    /* Social icons — Bakeri's own icon set (assets/social/*.png) used as a
       mask, so the accent colour paints the round badge and the logo shape
       is cut out of it (same treatment as index.html). 44px tap targets. */
    #social-icons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding-top: 6px; }
    .social-icon {
      position: relative; width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      background: var(--card-bg, #fff); color: var(--btn-bg, var(--accent));
      box-shadow: var(--shadow-sm); transition: transform .15s;
    }
    .social-icon:hover { transform: translateY(-1px); }
    .social-icon-mask {
      position: absolute; inset: 0; background: var(--btn-bg, var(--accent));
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      -webkit-mask-size: cover; mask-size: cover;
    }
    .social-icon-fallback { width: 100%; height: 100%; border-radius: 50%; background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); display: flex; align-items: center; justify-content: center; }

    /* ══════════════ Shared section card ══════════════ */
    .sf-card {
      background: var(--card-bg, #fff); color: var(--card-text, var(--text));
      border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-md); scroll-margin-top: 16px;
    }
    .sf-card-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
      padding: var(--cpad2) var(--cpad) 16px; border-bottom: 1px solid var(--card-line, var(--n200));
    }
    .sf-card-head .titles { display: flex; flex-direction: column; gap: 4px; margin-right: auto; min-width: 0; }
    .sf-card-head h2 {
      font-family: var(--display); font-weight: var(--dw); font-size: var(--h2); line-height: 1.05; margin: 0;
      color: var(--card-title, var(--head-ink)); overflow-wrap: anywhere;
    }
    .sf-sub { font-size: 14px; font-weight: 600; color: var(--card-muted, var(--n800)); }
    .sf-sub:empty { display: none; }
    .sf-card-body { padding: var(--cpad); }
    .sf-kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--card-title, var(--head-ink)); }

    .sf-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .sf-chips:empty { display: none; }
    .sf-chip {
      padding: 8px 14px; min-height: 38px; border-radius: var(--rp); border: 1.5px solid var(--n300);
      font: 700 13px var(--body); cursor: pointer; background: #fff; color: var(--text);
    }
    .sf-chip.active { background: var(--btn-bg, var(--accent)); border-color: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); }

    .sf-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 50px; padding: 15px 20px; border: 0; border-radius: var(--rp);
      background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg));
      font: 800 16px var(--body); cursor: pointer; text-decoration: none;
    }
    .sf-btn:hover { filter: brightness(.96); }
    .sf-btn:active { background: var(--accent-600); }
    .sf-btn[disabled] { opacity: .45; cursor: default; filter: none; }

    /* ══════════════ Product tiles (Menu + Products grids) ══════════════ */
    .sf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px var(--ggap); }
    .sf-tile { display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-width: 0; }
    .sf-tile-img { aspect-ratio: 1/1; position: relative; border-radius: var(--rs); overflow: hidden; background: var(--n100); }
    .sf-tile-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .sf-badge {
      position: absolute; left: 8px; bottom: 8px; padding: 5px 10px; border-radius: var(--rp);
      background: #fff; color: var(--text); font-size: 11px; font-weight: 800; box-shadow: var(--shadow-sm);
      max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sf-tile-body { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .sf-tile-name { font-size: 15px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-tile-meta { font-size: 12px; color: var(--card-muted, var(--n700)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-price-row { margin-top: auto; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sf-price { font-size: 18px; font-weight: 800; color: var(--card-title, var(--head-ink)); }
    .sf-price .from { font-size: 12px; font-weight: 600; margin-right: 4px; color: var(--card-muted, var(--n700)); }
    .sf-price:has(.orig) { color: var(--sale-ink); }
    .orig { text-decoration: line-through; color: var(--n700); font-weight: 400; margin-right: 6px; font-size: .8em; }
    .p-sale-badge {
      display: inline-flex; align-self: flex-start; font-size: 10px; font-weight: 800; letter-spacing: .02em;
      padding: 3px 9px; border-radius: var(--rp); background: var(--sale); color: var(--sale-fg);
    }

    /* Carried-over add control (refreshAddControl), restyled to the
       handoff's 44px round primary button. */
    .add-btn, .qty-stepper { height: 44px; flex-shrink: 0; }
    .add-btn {
      width: 44px; border-radius: var(--rp); border: none; background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg));
      font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .add-btn.added { font-size: 15px; }
    .qty-stepper {
      display: flex; align-items: center; border: 1.5px solid var(--n300); border-radius: var(--rp); overflow: hidden; background: #fff;
      animation: popIn .16s ease-out;
    }
    .qty-stepper button { width: 34px; height: 100%; border: none; background: transparent; color: var(--text); font-size: 17px; cursor: pointer; }
    .qty-stepper .qty { font-size: 14px; font-weight: 700; padding: 0 2px; color: var(--text); min-width: 14px; text-align: center; }
    @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    .sf-more { margin-top: 18px; display: flex; justify-content: center; }
    .sf-more button {
      min-height: 44px; padding: 0 20px; border-radius: var(--rp); border: 1.5px solid var(--n300); background: #fff;
      font: 700 14px var(--body); color: var(--text); cursor: pointer;
    }

    /* ── Single item: the regular tile laid out side by side (photo left,
       details right), like the current storefront's product row. ── */
    .sf-tile-wide { flex-direction: row; align-items: stretch; gap: 16px; }
    .sf-tile-wide .sf-tile-img { flex: 0 0 42%; max-width: 300px; align-self: flex-start; }
    .sf-tile-wide .sf-tile-body { gap: 6px; padding: 2px 0; }
    .sf-tile-wide .sf-tile-name { font-size: 18px; }
    .sf-tile-wide .sf-tile-meta { font-size: 13px; }
    .sf-tile-desc { font-size: 13.5px; line-height: 1.45; color: var(--card-muted, var(--n700)); white-space: pre-line;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-tile-wide .sf-price-row { padding-top: 10px; justify-content: flex-start; gap: 16px; }
    .sf-tile-wide .sf-price { font-size: 18px; }
    /* Listing section headings (Halloween, Gift boxes…) inside a card. */
    .sf-group-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; color: var(--card-title, var(--head-ink)); letter-spacing: .01em; }
    .sf-group-title:first-child { margin-top: 0; }
    .sf-group-spacer { visibility: hidden; }
    .sf-single-section { display: flex; flex-direction: column; min-width: 0; }
    .sf-single-section > .sf-group-title { margin: 0 0 10px; }
    .sf-single-section > :last-child { flex: 1; }
    /* Section headings inside the downloads list span every column and sit
       flush with the rows below them. */
    .sf-dl-list .sf-group-title { grid-column: 1 / -1; margin: 20px 0 0; padding: 0; }
    .sf-dl-list .sf-group-title:first-child { margin-top: 8px; }
    /* "View all" — a full-width button under the list, not a corner link. */
    .sf-dl-more { padding: 6px var(--cpad) var(--cpad2); }
    .sf-dl-morebtn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px;
      border: 0; border-radius: var(--rp); background: var(--card-bg, #fff); cursor: pointer;
      box-shadow: inset 0 0 0 1.5px var(--card-line, var(--n300));
      font: 800 15px var(--body); color: var(--card-title, var(--head-ink));
    }
    .sf-dl-morebtn:hover { box-shadow: inset 0 0 0 1.5px var(--card-title, var(--head-ink)); }
    @media (min-width: 560px) { .sf-tile-wide .sf-tile-name { font-size: 20px; } .sf-tile-desc { -webkit-line-clamp: 5; } }

    /* ══════════════ 2. Lead magnet ══════════════ */
    /* Rich capture card — shared by Free download (#sf-magnet) and the
       mailing-list signup (#email-capture): optional picture, title, short
       description, and the email form, side by side on wide screens and
       stacked on phones. */
    .sf-rich {
      display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; padding: var(--cpad2) var(--cpad);
      background: var(--card-bg, #fff); color: var(--card-text, var(--text));
      border-radius: var(--r); box-shadow: var(--shadow-md); scroll-margin-top: 16px;
    }
    #sf-magnet.sf-rich { background: var(--card-bg, var(--tint)); }
    .sf-rich.hidden { display: none; }
    #sf-referral-code { font-weight: 800; letter-spacing: .06em; }
    .sf-referral-mark { display: block; width: 96px; height: auto; margin-bottom: 4px; }
    .sf-rich-media {
      width: 96px; height: 96px; border-radius: var(--rs); background: var(--n100); transform: rotate(-4deg);
      box-shadow: var(--shadow-md); overflow: hidden; flex: none; position: relative;
    }
    .sf-rich-media:empty { display: none; }
    .sf-rich-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .sf-rich-text { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .sf-rich-text h3 {
      font-family: var(--display); font-weight: var(--dw); font-size: var(--h3m); line-height: 1.1; margin: 0;
      color: var(--card-title, var(--head-ink)); overflow-wrap: anywhere;
    }
    .sf-rich-text p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--card-muted, var(--n800)); white-space: pre-line; }
    .sf-rich-text p:empty { display: none; }
    .sf-rich-action { flex: 1 1 300px; min-width: 0; display: flex; }
    .sf-capture-form { width: 100%; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* Consent (2026-11-05): an optional, unticked marketing box on every
       sign-up, plus a required terms box when the shop has terms. */
    .sf-consents { flex: 1 1 100%; display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
    .sf-consent { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; line-height: 1.4; color: var(--card-muted, var(--n800)); text-align: left; cursor: pointer; }
    /* Beats the form's text-field rules (.sf-capture-form input and the
       compact-screen one), which otherwise turned the boxes into 50px pills. */
    #sf-root .sf-capture-form .sf-consent input[type="checkbox"],
    .sf-capture-form .sf-consent input[type="checkbox"] {
      flex: none; width: 18px; height: 18px; min-width: 0; margin: 1px 0 0; padding: 0;
      border: 0; border-radius: 4px; background: none; box-shadow: none; accent-color: var(--btn-bg, var(--accent));
    }
    .sf-consent span { flex: 1; min-width: 0; }
    /* Sheets (free downloads, the header sign-up): one column, every field
       and the button the same full width. */
    .sf-capture-form.stacked { flex-direction: column; align-items: stretch; gap: 10px; }
    #sf-root .sf-capture-form.stacked input:not([type="checkbox"]),
    .sf-capture-form.stacked input:not([type="checkbox"]) { flex: none; width: 100%; }
    .sf-capture-form.stacked .sf-btn { width: 100%; justify-content: center; }
    .sf-capture-form.stacked .sf-consents { margin-top: 2px; }
    .sf-consent-link { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }
    /* A free download's own page: photo, title, description, then the form. */
    .lead-page-img { width: 100%; aspect-ratio: 4/3; border-radius: var(--rs); background: var(--tint) center / cover no-repeat; margin-bottom: 16px; }
    .lead-page-note { font-size: 13px; font-weight: 700; color: var(--card-title, var(--head-ink)); margin: 10px 0 14px; }
    /* Long descriptions (a course, a recipe book) shown in full, formatted. */
    .rich-desc p { margin: 0 0 10px; }
    .rich-desc h4 { font-size: 15px; font-weight: 800; color: var(--card-title, var(--head-ink)); margin: 16px 0 6px; }
    .rich-desc ul { margin: 0 0 10px; padding-left: 0; list-style: none; }
    .rich-desc li { margin: 0 0 6px; padding-left: 0; }

    .sf-capture-form input {
      flex: 1 1 180px; min-width: 0; height: 50px; padding: 0 18px; background: #fff; border: 0; border-radius: var(--rp);
      font-size: 15px; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--n300);
    }
    #sf-magnet .sf-capture-form input { box-shadow: none; }
    /* Phones: email field and button each take the full width when stacked. */
    #sf-root.compact .sf-capture-form input,
    #sf-root.compact .sf-capture-form .sf-btn { flex: 1 1 100%; }
    .sf-capture-form .sf-btn { flex: 0 0 auto; height: 50px; min-height: 0; padding: 0 22px; font-size: 15px; justify-content: center; }
    .sf-capture-status { flex-basis: 100%; font-size: 13px; color: var(--card-muted, var(--n800)); min-height: 0; }
    .sf-capture-status:empty { display: none; }
    .sf-capture-done {
      flex: 1 1 320px; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 18px;
      background: #fff; color: var(--text); border-radius: var(--rp); font-size: 15px; font-weight: 700;
    }

    /* ══════════════ 4. Products: downloads sub-section ══════════════ */
    #digital-feed { border-top: 1px solid var(--card-line, var(--n200)); }
    #digital-feed.solo { border-top: 0; }
    .sf-dl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: var(--cpad2) var(--cpad) 4px; }
    .sf-dl-head .titles { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
    .sf-dl-head h3 { font-size: 20px; font-weight: 800; line-height: 1.2; margin: 0; }
    .sf-viewall { display: flex; align-items: center; gap: 6px; font: 800 14px var(--body); color: var(--card-title, var(--head-ink)); background: none; border: 0; cursor: pointer; }
    .sf-dl-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      column-gap: 32px; padding: 4px var(--cpad) 12px;
    }
    .sf-dl-row {
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--card-line, var(--n200)); cursor: pointer;
    }
    .sf-dl-thumb { width: 56px; height: 56px; border-radius: var(--rs); background: var(--n100); overflow: hidden; position: relative; }
    .sf-dl-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .sf-dl-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .sf-dl-name { font-size: 14px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-dl-price { font-size: 14px; font-weight: 800; color: var(--card-title, var(--head-ink)); }
    .sf-dl-price:has(.orig) { color: var(--sale-ink); }
    .sf-dl-add {
      min-height: 40px; padding: 0 14px; border-radius: var(--rp); border: 1.5px solid var(--n300); background: #fff;
      font: 700 13px var(--body); color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .sf-dl-add:hover { border-color: var(--accent); color: var(--head-ink); }
    .sf-dl-add.added { background: var(--tint); border-color: var(--tint); color: var(--head-ink); }

    /* ══════════════ 5. Links ══════════════ */
    /* A link's glow may spill past the card edge rather than being cut off. */
    #links-feed { overflow: visible; }
    #links-feed .sf-card-head { border-radius: var(--r) var(--r) 0 0; }
    /* Same grid as Digital downloads: one column on a phone, two when wide. */
    .sf-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); column-gap: 32px; row-gap: 0; align-items: start; }
    .sf-links .lk-group { grid-column: 1 / -1; margin: 22px 0 2px; padding: 0; }
    .sf-links .lk-group:first-child { margin-top: 0; }
    .sf-links .lk-more { grid-column: 1 / -1; margin-top: 14px; }
    .sf-link { position: relative; text-decoration: none; color: var(--text); font: inherit; text-align: left; border: 0; cursor: pointer; }
    /* Row: a Digital downloads row, with the vendor's button wording in the pill. */
    .sf-link.lk-row {
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center;
      width: 100%; padding: 10px 0; background: none; border-radius: 0; border-bottom: 1px solid var(--card-line, var(--n200));
    }
    .lk-thumb { background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .lk-sub { font-size: 12.5px; line-height: 1.35; color: var(--link-sub, var(--card-muted, var(--n700))); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lk-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 14px; font-weight: 800; color: var(--card-title, var(--head-ink)); }
    .lk-meta .orig { font-weight: 600; opacity: .55; text-decoration: line-through; margin-right: 6px; }
    .sf-link-free { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: var(--rp); background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); }
    .lk-cta { display: inline-flex; align-items: center; justify-content: center; }
    .lk-row:hover .lk-cta { border-color: var(--accent); color: var(--head-ink); }
    /* Feature: a big-photo link across the full width — photo beside the
       text on wider screens, stacked on a phone. */
    .sf-link.lk-feature {
      grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
      margin: 6px 0 8px; padding: 12px; border-radius: var(--r); background: var(--tint);
    }
    #sf-root:not(.compact) .sf-link.lk-feature { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 28px; padding: 14px; }
    .lk-feature-img { aspect-ratio: 16/9; border-radius: var(--rs); background: var(--n100) center / cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 34px; }
    .lk-feature-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 0 4px 4px; }
    .lk-feature-title { font-size: 21px; font-weight: 800; line-height: 1.2; color: var(--card-title, var(--head-ink)); overflow-wrap: anywhere; }
    .lk-feature .lk-sub { font-size: 14px; -webkit-line-clamp: 3; }
    .lk-cta-solid {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
      min-height: 46px; padding: 0 22px; border-radius: var(--rp);
      background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); font: 800 15px var(--body);
    }
    .lk-cta-solid svg { width: 16px; height: 16px; }
    #sf-root.compact .lk-cta-solid { align-self: stretch; justify-content: center; }
    /* Plain button links ('list' style). */
    .sf-link.pill { border-radius: var(--rp); }
    .sf-link.pill {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 0 20px; border: 2px solid var(--n300); background: #fff;
      color: var(--text); font: 800 16px var(--body); margin: 6px 0;
    }
    .sf-link.pill:hover { filter: brightness(.96); }
    /* Order-form rows (renderFormStorefront, several forms on one site) use
       the original link-card look; link cards themselves are .lk-row /
       .lk-feature above. */
    .sf-link.rich {
      display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center;
      padding: 8px 16px 8px 8px; background: var(--n100); border-radius: var(--r);
    }
    .sf-link.rich:hover { background: var(--tint); }
    .sf-link-img { width: 96px; height: 72px; border-radius: var(--rs); background: var(--tint); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .sf-link-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .sf-link-title { font-size: 15px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .sf-link-domain { font-size: 12px; color: var(--link-sub, var(--n700)); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Link directory: one tile per section (cover photo, name, count); a
       tap opens the section as a sheet of rows. */
    .sf-links .lk-dir { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 190px), 1fr)); gap: 12px; margin-top: 4px; }
    .lk-dir-tile {
      position: relative; aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; overflow: hidden;
      border-radius: var(--r); background: var(--tint) center / cover no-repeat; text-align: left; font: inherit;
    }
    .lk-dir-tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.62) 100%); }
    .lk-dir-tile.noimg::after { display: none; }
    .lk-dir-text { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; display: flex; flex-direction: column; gap: 2px; color: #fff; }
    .lk-dir-tile.noimg .lk-dir-text { color: var(--card-title, var(--head-ink)); }
    .lk-dir-name { font-size: 17px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
    .lk-dir-count { font-size: 12.5px; font-weight: 700; opacity: .9; }
    .lk-dir-tile:hover { filter: brightness(1.04); }
    #links-sheet-body .sf-links { margin-top: 6px; }
    .sf-link-label { min-width: 0; overflow-wrap: anywhere; }
    .sf-link.disabled { opacity: .45; pointer-events: none; }
    /* Stroke / glow / shake — on the link card itself, never the section card. */
    /* Border / glow are inline styles per link — see renderLinkRow. */
    @keyframes sf-shake {
      0%, 80%, 100% { transform: rotate(0); }
      83% { transform: rotate(-2deg); } 86% { transform: rotate(2deg); }
      89% { transform: rotate(-1.5deg); } 92% { transform: rotate(1.5deg); } 95% { transform: rotate(-.5deg); }
    }
    .sf-link.shake, .sf-navbtn.shake { animation: sf-shake 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .sf-link.shake, .sf-navbtn.shake { animation: none; } }

    /* ══════════════ 6. About ══════════════ */
    #pb-about { display: flex; flex-wrap: wrap; }
    #pb-about.hidden { display: none; }
    #pb-about-photo { flex: 1 1 280px; min-height: 320px; position: relative; background: var(--tint); }
    #pb-about-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #pb-about-body { flex: 2 1 360px; padding: var(--apad); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    #pb-about-heading { font-family: var(--display); font-weight: var(--dw); font-size: var(--h2a); line-height: 1.05; margin: 0; color: var(--card-title, var(--head-ink)); overflow-wrap: anywhere; }
    #pb-about-text p { margin: 0 0 12px; font-size: 16px; line-height: 1.65; max-width: 60ch; text-wrap: pretty; }
    #pb-about-text p:last-child { margin-bottom: 0; }

    /* ══════════════ 7. Before you order ══════════════ */
    #sf-info-body { display: flex; flex-wrap: wrap; gap: 12px 48px; padding: 4px var(--cpad) var(--cpad2); }
    #sf-info-acc { flex: 2 1 380px; min-width: 0; }
    #sf-info-acc:empty { display: none; }
    .sf-acc { border-bottom: 1px solid var(--card-line, var(--n200)); }
    .sf-acc > summary {
      list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      min-height: 54px; font-size: 16px; font-weight: 800;
    }
    .sf-acc > summary::-webkit-details-marker { display: none; }
    .sf-acc > summary svg { flex: none; transition: transform .2s; }
    .sf-acc[open] > summary svg { transform: rotate(45deg); }
    .sf-acc .sf-acc-body { margin: 0 0 16px; font-size: 15px; line-height: 1.6; max-width: 64ch; white-space: pre-line; }
    #hours-card { flex: 1 1 240px; display: flex; flex-direction: column; padding-top: 14px; }
    #hours-card .sf-kicker { padding-bottom: 6px; }
    .sf-hours-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--card-line, var(--n200)); font-size: 15px; }
    .sf-hours-row .day { font-weight: 700; }

    /* ══════════════ Form takeover card ══════════════ */
    #sf-form-intro { padding: var(--cpad) var(--cpad) 0; }
    #sf-form-intro p { font-size: 15px; line-height: 1.6; white-space: pre-wrap; max-width: 70ch; }
    #sf-form-mount { padding: var(--cpad); }
    /* More than one form on the site: each is a collapsible row in the one
       form card, so the block stays a reasonable size (renderFormStorefront). */
    .sf-link.rich.noimg { grid-template-columns: minmax(0, 1fr) auto; padding: 16px 18px 16px 20px; }
    #sf-form-mount.sf-formrows { display: flex; flex-direction: column; gap: var(--ggap); }
    .sf-formrow { scroll-margin-top: 16px; }
    .sf-formrow-head { width: 100%; }
    .sf-formrow-head svg { flex: none; transition: transform .2s; }
    .sf-formrow.open .sf-formrow-head svg { transform: rotate(45deg); }
    .sf-formrow-body { display: none; padding-top: 14px; }
    .sf-formrow.open .sf-formrow-body { display: block; }
    .sf-formrow-body .sf-formrow-intro { font-size: 15px; line-height: 1.6; white-space: pre-wrap; max-width: 70ch; margin: 0 0 8px; }

    /* ══════════════ Email capture card ══════════════ */

    /* ══════════════ 8. Footer ══════════════ */
    #site-footer {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 14px 20px;
      background: #fff; border-radius: var(--rp); box-shadow: var(--shadow-sm); font-size: 13px; color: var(--n800);
    }
    #footer-copy { margin-right: auto; }
    #site-footer a { color: inherit; }
    #site-footer .made { font-weight: 700; text-decoration: none; }

    /* ══════════════ 9. Sticky cart bar ══════════════ */
    #sf-cartbar {
      position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40;
      display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 20px;
      background: var(--text); color: #fff; border-radius: var(--rp); box-shadow: var(--shadow-lg);
      animation: popIn .18s ease-out;
    }
    #sf-cartbar-label { font-size: 15px; font-weight: 700; margin-right: auto; }
    #sf-cartbar .sf-btn { min-height: 44px; padding: 0 20px; font-size: 15px; }

    /* Square corners option (storefront_design.corners = 'square'). */
    #sf-root.square { --r: 0px; --rs: 0px; --rp: 0px; }

    /* ══════════════ Sheets / modal / toast (carried over) ══════════════ */
    .scrim {
      position: fixed; inset: 0; background: rgba(20,15,10,.55); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .scrim.open { display: flex; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 480px; max-height: 90%; overflow: auto;
      overscroll-behavior: contain;
      border-radius: 24px 24px 0 0; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
      animation: riseIn .22s ease-out;
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sheet-share { right: 56px !important; }
    .sheet-close {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(20,15,10,.5); color: #fff; border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 9999px; border: none; cursor: pointer; font-weight: 700; font-size: 15px;
      text-decoration: none; font-family: var(--body);
    }
    .btn-primary { height: 50px; background: var(--accent); color: var(--accent-fg); }
    .btn-outline { height: 48px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
    #item-sheet { display: flex; flex-direction: column; overflow: hidden; height: 96%; max-height: 96%; }
    #item-sheet-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #item-sheet-photo { position: relative; aspect-ratio: 1/1; background: var(--line-soft); flex: none; min-height: 0; overflow: hidden; touch-action: none; }
    #item-sheet-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .p-badge {
      position: absolute; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 9999px; color: #fff; font-size: 11px; font-weight: 700;
    }
    .p-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
    #item-sheet-body { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 14px 20px 14px; }
    #item-sheet-fixed { flex: none; }
    #item-sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    #item-sheet-name { font-size: 20px; font-weight: 800; color: var(--ink); margin-top: 6px; }
    #item-sheet-price { font-size: 16px; font-weight: 800; color: var(--head-ink); margin-top: 2px; }
    #item-sheet-price:has(.orig) { color: var(--sale-ink); }
    #item-sheet-desc { font-size: 14px; line-height: 1.6; color: var(--bio); margin-top: 10px; }
    #item-sheet-desc.clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #item-sheet-desc.tappable { cursor: pointer; }
    #item-sheet-desc-toggle {
      display: none; background: none; border: none; padding: 0; margin-top: 8px;
      font-size: 13px; font-weight: 700; color: var(--head-ink); cursor: pointer; font-family: inherit;
    }
    .spec-list { margin-top: 8px; }
    .spec-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); color: var(--muted); }
    .spec-row b { color: var(--ink); font-weight: 600; }
    #item-sheet-body .btn { width: 100%; height: 46px; margin-top: 12px; }
    #item-sheet-box { margin-top: 12px; }
    .box-step-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin-bottom: 6px; }
    .box-tiers { display: flex; gap: 8px; margin-bottom: 10px; }
    .box-tier {
      flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 14px; background: transparent;
      padding: 8px 6px; text-align: center; cursor: pointer;
    }
    .box-tier.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .box-tier.disabled { opacity: .45; cursor: not-allowed; }

  function assetURL(path) {

        shipCart = raw.shipCart || {};
        shipVariantCartLines = raw.shipVariantLines || [];
        digitalVariantCartLines = raw.digitalVariantLines || [];

        preorderCartLines = [];

        shipCart = {};
        shipVariantCartLines = [];
        digitalVariantCartLines = [];

      shipVariantCartLines = []; digitalVariantCartLines = [];

  //
  // Used by the iOS block builder's live preview (StorefrontPreviewView) —
  // loads this exact page (same CSS/JS, same rendering as the real public
  // site — guaranteed no drift, since it IS the real site) but skips the
  // network fetch entirely and waits for the native host to push the
  // baker's in-progress DRAFT state instead of her last-published one.
  // Everything below this block (render, renderFeed, etc.) is completely
  // unchanged and unaware preview mode even exists — this only decides
  // what calls render() and with what data.
  const isPreviewMode = true;

  // ══════════════════════ Visit analytics ══════════════════════
  //
  // First-party numbers for the vendor's Insights (log_storefront_event,
  // migration 20261030000002) — no third-party service. A random visitor id
  // in localStorage, a per-tab session id and where the visit came from.
  // Never counted in builder previews, or in the vendor's own browser
  // (?self=1, which the app's "View my site" adds, marks it for good).
  const ANALYTICS_SOURCES = [
    ['instagram', /(^|\.)instagram\.com$/], ['facebook', /(^|\.)(facebook\.com|fb\.com|fb\.me|messenger\.com)$/],
    ['tiktok', /(^|\.)tiktok\.com$/], ['pinterest', /(^|\.)pinterest\./], ['google', /(^|\.)google\./],
    ['bing', /(^|\.)bing\.com$/], ['youtube', /(^|\.)(youtube\.com|youtu\.be)$/], ['x', /(^|\.)(twitter\.com|x\.com|t\.co)$/]
  ];
  const IN_APP_SOURCES = [['instagram', /Instagram/], ['facebook', /FBAN|FBAV|FB_IAB/], ['tiktok', /musical_ly|Bytedance|TikTok/i]];
  function analyticsRemember(store, key, make) {
    try {
      let v = store.getItem(key);
      if (!v) { v = make(); if (v) store.setItem(key, v); }
      return v;
    } catch (e) { return make(); }
  }
  function analyticsSource() {
    return analyticsRemember(sessionStorage, 'bakeri_visit_src', function () {
      const q = new URLSearchParams(location.search);
      if (q.get('utm_source')) return q.get('utm_source').toLowerCase().slice(0, 60);
      // The /<slug> pages redirect here, so they pass the real referrer on as ?from=.
      let host = '';
      try { host = new URL(q.get('from') || document.referrer).hostname.replace(/^www\./, ''); } catch (e) {}
      if (host && host !== location.hostname) {
        const hit = ANALYTICS_SOURCES.find(function (s) { return s[1].test(host); });
        return hit ? hit[0] : host;
      }
      // In-app browsers often send no referrer, but say who they are.
      const app = IN_APP_SOURCES.find(function (s) { return s[1].test(navigator.userAgent); });
      return app ? app[0] : 'direct';
    }) || 'direct';
  }
  // Analytics must never break the page: any error in here is swallowed.
  function trackVisit(event, ref) {
    try { sendVisitEvent(event, ref); } catch (e) {}
  }
  function sendVisitEvent(event, ref) {
    if (isPreviewMode || !resolvedBakerId) return;
    const selfKey = 'bakeri_self_' + resolvedBakerId;
    try {
      if (new URLSearchParams(location.search).get('self') === '1') localStorage.setItem(selfKey, '1');
      if (localStorage.getItem(selfKey) === '1') return;
    } catch (e) {}
    const newId = function () { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : ''; };
    fetch(SUPABASE_URL + '/rest/v1/rpc/log_storefront_event', {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        p_shop: resolvedBakerId,
        p_event: event,
        p_ref: ref ? String(ref).toLowerCase() : null,
        p_source: analyticsSource(),
        p_session: analyticsRemember(sessionStorage, 'bakeri_visit_session', newId),
        p_visitor: analyticsRemember(localStorage, 'bakeri_visitor', newId) || null
      })
    }).catch(function () {});
  }
  window.__bakeriTrack = trackVisit;
  // Link and social icon clicks (data-track on the element), and which item a
  // tile's add control belongs to (data-track-item) so its add is credited.
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    const item = e.target.closest('[data-track-item]');
    if (item) lastAddedItemId = item.dataset.trackItem;
    const el = e.target.closest('[data-track]');
    if (el) trackVisit(el.dataset.track, el.dataset.trackRef);
  }, true);
  // Anything added to any cart: saveCart() compares the cart's size.
  function cartSize() {
    const n = function (x) {
      if (Array.isArray(x)) return x.reduce(function (t, l) { return t + (Number(l && l.qty) || 1); }, 0);
      if (x && typeof x === 'object') return Object.keys(x).reduce(function (t, k) { return t + (Number(x[k]) || (x[k] ? 1 : 0)); }, 0);
      return 0;
    };
    return n(cart) + n(boxCartLines) + n(preorderCartLines) + n(digitalCart) + n(shipCart) + n(shipVariantCartLines) + n(digitalVariantCartLines);
  }
  let lastCartSize = null;
  // builder=2: the new iOS builder — the tap bridge reports v2 card types
  // (menu, products, info, leadMagnet, …) instead of today's v1 ones.
  const isBuilderV2 = isPreviewMode && new URLSearchParams(location.search).get('builder') === '2';

  window.__bakeriRenderPreview = function (payload) {
    profile = payload.profile;
    resolvedBakerId = profile.id || 'preview';
    render(profile, payload.listings || [], payload.faqs || [], payload.links || []);
  };

  if (isPreviewMode) {
    loadCart();
    // Native host calls window.__bakeriRenderPreview(...) once the WebView
    // finishes loading, then again on every subsequent draft edit — no
    // fetch, nothing left to do here until then.
  } else {

  if (!slug && !bakerID) {
    showNotFound('No shop specified', 'This link appears to be invalid.');
    return;
  }

  const rpcName = slug ? 'get_baker_web_profile_by_slug' : 'get_baker_web_profile_by_id';
  const rpcBody = slug ? { p_slug: slug } : { p_user_id: bakerID };

  fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpcName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify(rpcBody)
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    // A shop whose Bakeri plan has lapsed stays visible with ordering off
    // (vendor_plans / effective_plan_tier). Any failure here — including the
    // function not existing yet — leaves the shop open, never blocks it.
    // On since paid plans launched (2026-10-31); every account from before
    // then is grandfathered on free Starter, so only lapsed new shops pause.
    if (!VENDOR_PLANS_ENABLED || !data || !data.profile || !data.profile.id) return data;
    return fetch(SUPABASE_URL + '/rest/v1/rpc/effective_plan_tier', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ p_user_id: data.profile.id })
    })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (tier) { data.profile.__plan_paused = tier === 'none'; return data; }, function () { return data; });
  })
  .then(function (data) {
    if (!data || !data.profile) { showNotFound('Shop not found', 'No shop found at this link.'); return; }
    profile = data.profile;
    resolvedBakerId = profile.id;

    loadCart();
    render(profile, data.listings || [], data.faqs || [], data.links || []);
    lastCartSize = cartSize();
    trackVisit('page_view');
    openSharedItemFromURL();
    if (isCleanRedirect && slug && window.history && window.history.replaceState) {
      // Keep a shared product's ?item= on the clean URL.
      window.history.replaceState(null, '', '/' + slug + (params.get('item') ? '?item=' + encodeURIComponent(params.get('item')) : ''));
    }
  })
  .catch(function () { showNotFound('Something went wrong', 'Could not load this profile. Try again later.'); });

  } // end !isPreviewMode

  // ══════════════════════ Render (storefront v2) ══════════════════════
  //
  // Everything from here to buildTile/buildWideTile is the v2 "Profile
  // layout" — see STOREFRONT_V2_SPEC.md and the Claude Design handoff. The
  // cart / item sheet / pickers / checkout code below it is carried over
  // from index.html unchanged.

  // Auto-generated from the baker's own shipping settings (or a promotion's
  // banner) — unchanged from index.html.
  function updateAnnouncementBanner(profile, listings) {
    const banner = document.getElementById('announcement-banner');
    if (!banner) return;
    const promoBanner = (profile.promo_banner || '').trim();
    if (promoBanner) {
      banner.textContent = promoBanner;
      banner.classList.add('promo');
      banner.classList.remove('hidden');
      return;
    }
    banner.classList.remove('promo');
    const threshold = profile.shipping_free_over_threshold || 0;
    const hasPhysical = listings.some(function (l) { return l.listing_kind === 'physical'; });
    if (threshold <= 0 || !hasPhysical) {
      banner.classList.add('hidden');
      banner.textContent = '';
      return;
    }
    let text = 'Free shipping over $' + threshold.toFixed(2);
    const percent = profile.shipping_additional_item_percent;
    if (percent != null && percent < 100 && percent > 0) {
      text += ' · ' + Math.round(100 - percent) + '% off shipping on extra items';
    } else if (percent === 0) {
      text += ' · Free shipping on every extra item';
    }
    banner.textContent = text;
    banner.classList.remove('hidden');
  }

  let allFaqs = [];
  let design = {};          // profiles.storefront_design — page-level look
  let blockCfg = {};        // v2 block type → its layout entry (title, nav, colors…)
  let blockOrder = [];      // v2 block types, in page order
  let subHidden = {};       // v1 sub-types the baker hid (physical/digital/faq/policies/hours)
  let leadFromCapture = false;
  let physTab = 'all';
  let staticWired = false;

  function render(p, listings, faqs, links) {
    // A custom listing with no intake form has no working way to collect a
    // request — left out entirely (same rule as index.html).
    allListings = listings.filter(function (l) { return l.listing_kind !== 'custom' || l.intake_form_id; });
    allListings.forEach(applyListingPromo);
    allLinks = links || [];
    allFaqs = faqs || [];
    design = (p.storefront_design && typeof p.storefront_design === 'object') ? p.storefront_design : {};
    // Case-insensitive: Swift's uuidString is uppercase, PostgREST's is
    // lowercase, and the builder preview payload can carry either.
    const sfId = String(p.storefront_listing_id || '').toLowerCase();
    const formListings = allListings.filter(function (l) {
      return l.intake_form_id && (l.is_storefront_form === true || String(l.id).toLowerCase() === sfId);
    });
    // Only a site that has a primary form (storefront_listing_id) is a form
    // site; the other forms join it.
    sfForms = formListings.some(function (l) { return String(l.id).toLowerCase() === sfId; })
      ? orderForms(formListings, sfId, p.storefront_design)
      : [];
    sfListing = sfForms[0] || null;

    updateAnnouncementBanner(p, listings);
    const name = p.business_name || p.user_name || 'Vendor';
    const place = p.neighbourhood || p.pickup_city || '';
    // Skip the province when the place already ends with it ("Bay Minette, AL").
    const prov = (p.pickup_province || '').trim();
    // The Location the baker typed in the header editor wins; without one
    // the page falls back to her pickup neighbourhood / city.
    const location = String(p.location || '').trim() || (place
      ? (prov && !new RegExp('(^|[ ,])' + prov.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i').test(place.trim()) ? place + ', ' + prov : place)
      : '');

    document.title = name + ' on Bakeri';
    document.querySelector('meta[name="description"]').content = name + ' — handcrafted bakes on Bakeri. ' + (p.bio || '');
    ordersPaused = !!p.__plan_paused;
    stripeReady = p.stripe_connect_onboarding_complete === true && !ordersPaused;

    resolveBlocks(p);
    applyDesignTokens();
    renderBackground();

    renderAvatar(name);
    document.getElementById('shop-name').textContent = name;
    const metaEl = document.getElementById('shop-meta');
    document.getElementById('shop-meta-text').textContent = location;
    metaEl.classList.toggle('hidden', !location);
    const bioEl = document.getElementById('shop-bio');
    bioEl.textContent = p.bio || '';
    bioEl.classList.toggle('hidden', !p.bio);
    // Profile card colours (background, text, buttons) apply to the intro
    // card. The shop name above it uses the site-wide Titles & prices colour
    // (design.colors.ink) — when the baker has set one it wins even over a
    // dark photo, otherwise the name adapts to the background.
    const identityColors = (design.identity && design.identity.colors) || null;
    const introCard = document.getElementById('sf-intro-card');
    applyCardColors(introCard, identityColors);
    introCard.style.removeProperty('--card-title');
    const nameColor = validHex(design.colors && design.colors.ink);
    const nameEl = document.getElementById('shop-name');
    nameEl.style.color = nameColor || '';
    nameEl.classList.toggle('custom-color', !!nameColor);
    applyTitleEffect(nameEl);
    fitShopName();
    renderSocialIcons();

    renderLeadMagnet(p);
    renderMenuCard();
    if (sfListing) renderFormStorefront();
    else document.getElementById('form-storefront').classList.add('hidden');
    renderProductsCard();
    renderLinkSections();
    renderAbout(p);
    renderInfoCard(p);
    renderEmailCapture(p);
    renderReferralCard();
    renderHeaderSignupButton(p);
    document.getElementById('footer-copy').textContent = '© ' + new Date().getFullYear() + ' ' + name;

    applyStorefrontBlockLayout();
    renderSectionNav();
    updateCartUI();
    wireStaticOnce();

    wireBuilderTapTargets();
    scheduleRectReport();
  }

  function wireStaticOnce() {
    if (staticWired) return;
    staticWired = true;
    document.getElementById('share-btn').addEventListener('click', shareLink);
    document.getElementById('cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('sf-cartbar-btn').addEventListener('click', openCartSheet);
    document.getElementById('item-sheet-close').addEventListener('click', closeItemSheet);
    document.getElementById('item-sheet-share').addEventListener('click', function (e) { e.stopPropagation(); shareItem(sheetItem); });
    document.getElementById('cart-sheet-close').addEventListener('click', closeCartSheet);
    document.getElementById('desc-sheet-close').addEventListener('click', closeDescSheet);
    document.getElementById('item-scrim').addEventListener('click', function (e) { if (e.target === this) closeItemSheet(); });
    document.getElementById('cart-scrim').addEventListener('click', function (e) { if (e.target === this) closeCartSheet(); });
    document.getElementById('desc-scrim').addEventListener('click', function (e) { if (e.target === this) closeDescSheet(); });
    document.addEventListener('click', function (e) {
      const t = e.target && e.target.closest && e.target.closest('[data-terms]');
      if (!t) return;
      e.preventDefault();
      openDescSheet('Terms & Conditions', shopTerms());
    });
    document.getElementById('capture-sheet-close').addEventListener('click', closeCaptureSheet);
    document.getElementById('capture-scrim').addEventListener('click', function (e) { if (e.target === this) closeCaptureSheet(); });

    // Compact mode follows the column's own width (handoff: < 640px),
    // not a viewport media query — the builder canvas and a phone both
    // land here naturally.
    const root = document.getElementById('sf-root');
    const onResize = function () {
      root.classList.toggle('compact', root.clientWidth < 640);
      root.classList.toggle('wide', root.clientWidth >= 860);
      sizeTopBackground();
      fitShopName();
    };
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(onResize).observe(root);
    else window.addEventListener('resize', onResize);
    onResize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitShopName);
  }

  // ══════════════════════ Blocks: order, titles, nav ══════════════════════
  //
  // profiles.storefront_block_layout is shared with the live index.html and
  // today's iOS builder, which still write the v1 types (menu, physical,
  // digital, links, about, faq, policies, hours, emailCapture). v2 merges
  // some of them into one card each — physical + digital → Products,
  // faq + policies + hours → Before you order — at the position of the
  // first one in the baker's order. Extra keys on an entry (title, nav,
  // nav_label, colors, …) are v2-only; index.html ignores them.

  const V2_DEFAULT_ORDER = ['leadMagnet', 'menu', 'products', 'links', 'about', 'info', 'emailCapture'];
  const V1_TO_V2 = {
    menu: 'menu', physical: 'products', digital: 'products', products: 'products',
    links: 'links', about: 'about', faq: 'info', policies: 'info', hours: 'info', info: 'info',
    emailCapture: 'emailCapture', leadMagnet: 'leadMagnet'
  };
  const CARD_IDS = {
    leadMagnet: 'sf-magnet', menu: 'feed', form: 'form-storefront', products: 'sf-products',
    links: 'links-feed', about: 'pb-about', info: 'sf-info', emailCapture: 'email-capture',
    // Bakerï Referral — never a default card (not in V2_DEFAULT_ORDER): it
    // shows only where the vendor's design includes it switched on.
    referral: 'sf-referral'
  };
  // Default nav set (spec): the shopping/info cards; About, Lead magnet and
  // Email capture only when the baker turns their button on (entry.nav).
  const NAV_DEFAULT = {
    menu: true, form: true, products: true, links: true, info: true,
    about: false, leadMagnet: false, emailCapture: false, referral: false
  };

  // V2 layout — written ONLY by the new builder, into
  // storefront_design.blocks (a column today's page and app never read), as
  // v2 types directly: leadMagnet, menu, products, links, about, info,
  // emailCapture. A merged card's parts can be hidden individually with
  // parts_hidden (['physical'|'digital'] / ['faq'|'policies'|'hours']).
  // When present it wins outright; otherwise we derive from the shared v1
  // storefront_block_layout below.
  let designBlocksMode = false;
  function resolveDesignBlocks(list) {
    const order = [];
    const cfg = {};
    const sub = {};
    list.forEach(function (b) {
      if (!b || !b.type || CARD_IDS[b.type] === undefined || b.type === 'form' || cfg[b.type]) return;
      cfg[b.type] = Object.assign({}, b, { hidden: !!b.hidden });
      order.push(b.type);
      (Array.isArray(b.parts_hidden) ? b.parts_hidden : []).forEach(function (part) { sub[part] = true; });
    });
    V2_DEFAULT_ORDER.forEach(function (t) {
      if (cfg[t]) return;
      cfg[t] = { type: t, hidden: false };
      order.push(t);
    });
    blockOrder = order;
    blockCfg = cfg;
    subHidden = sub;
  }

  function resolveBlocks(p) {
    designBlocksMode = Array.isArray(design.blocks) && design.blocks.length > 0;
    if (designBlocksMode) {
      // The v2 lead magnet card is configured on its own block, and the
      // email card is a plain signup — no carrying over the v1 deliverable.
      leadFromCapture = false;
      resolveDesignBlocks(design.blocks);
      return;
    }
    const raw = Array.isArray(p.storefront_block_layout) && p.storefront_block_layout.length ? p.storefront_block_layout : [];
    // An Email Capture block configured to deliver a file IS a lead magnet
    // in v2 — shown as the Free download card, in the email block's slot —
    // until the baker has a real leadMagnet block of her own.
    leadFromCapture = !!p.email_capture_deliverable_listing_id &&
      !raw.some(function (b) { return b && b.type === 'leadMagnet'; });
    const order = [];
    const cfg = {};
    const sub = {};
    raw.forEach(function (b) {
      if (!b || !b.type) return;
      let t = V1_TO_V2[b.type];
      if (!t) return; // unknown/future type — ignore rather than throw
      if (t === 'emailCapture' && leadFromCapture) t = 'leadMagnet';
      sub[b.type] = !!b.hidden;
      if (!cfg[t]) {
        cfg[t] = Object.assign({}, b, { type: t, hidden: true });
        order.push(t);
      } else {
        Object.keys(b).forEach(function (k) { if (cfg[t][k] === undefined) cfg[t][k] = b[k]; });
      }
      // A merged card stays visible while any of its parts is visible.
      if (!b.hidden) cfg[t].hidden = false;
    });
    // Types the baker's layout doesn't mention go where the default order
    // would put them (right after the nearest earlier default type present).
    V2_DEFAULT_ORDER.forEach(function (t, i) {
      if (cfg[t]) return;
      cfg[t] = { type: t, hidden: false };
      let at = 0;
      for (let j = i - 1; j >= 0; j--) {
        const k = order.indexOf(V2_DEFAULT_ORDER[j]);
        if (k !== -1) { at = k + 1; break; }
      }
      order.splice(at, 0, t);
    });
    blockOrder = order;
    blockCfg = cfg;
    subHidden = sub;
  }

  function firstName() {
    const n = ((profile && profile.user_name) || '').trim().split(/\s+/)[0];
    return n || (profile && profile.business_name) || 'me';
  }

  // Every card title is renamable (entry.title); these are the defaults.
  function cardTitle(type) {
    const key = type === 'form' ? 'menu' : type;
    const custom = ((blockCfg[key] && blockCfg[key].title) || '').trim();
    if (custom) return custom;
    switch (type) {
      case 'menu': return 'Shop my Menu';
      case 'products': return 'Shop my Products';
      case 'links': return 'More from ' + firstName();
      case 'info': return 'Before you order';
      case 'about': return ((profile && profile.about_heading) || '').trim() || 'Meet ' + firstName();
      case 'emailCapture': return ((profile && profile.email_capture_heading) || '').trim() || 'Join my list';
      case 'leadMagnet': return leadMagnetConfig().heading;
      case 'referral': return 'Start your own shop on Bakerï!';
      case 'form':
        if (sfForms.length > 1) return 'Order forms';
        return (sfListing && formTitle(sfListing)) || 'Order';
    }
    return '';
  }

  function cardElement(type) {
    if (type === 'menu' && sfListing) return document.getElementById(CARD_IDS.form);
    return document.getElementById(CARD_IDS[type]);
  }

  // Moves already-rendered cards into the baker's order and applies hide +
  // per-card colours. Never un-hides a card its renderer left hidden
  // (nothing to show).
  function applyStorefrontBlockLayout() {
    const shell = document.getElementById('page-shell');
    const footer = document.getElementById('site-footer');
    if (sfListing) document.getElementById('feed').classList.add('hidden');
    blockOrder.forEach(function (t) {
      const el = cardElement(t);
      if (!el) return;
      shell.insertBefore(el, footer);
      if (blockCfg[t].hidden) el.classList.add('hidden');
      applyCardColors(el, blockCfg[t].colors);
    });
  }

  function scrollToSection(id) {
    const target = document.getElementById(id);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  const ARROW_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
  const ARROW_UR_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>';
  const DOWNLOAD_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
  const PLUS_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="flex:none"><path d="M12 5v14M5 12h14"/></svg>';
  const CHECK_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="20 6 9 17 4 12"/></svg>';

  // The intro card's stacked buttons ARE the site nav: one per visible
  // block, in block order (reorder the blocks to reorder these). Each can
  // be hidden (entry.nav = false) or relabelled (entry.nav_label); the
  // first one shown is the solid accent button.
  function renderSectionNav() {
    const nav = document.getElementById('sf-nav');
    nav.innerHTML = '';
    let first = true;
    blockOrder.forEach(function (t) {
      const key = (t === 'menu' && sfListing) ? 'form' : t;
      const el = cardElement(t);
      if (!el || el.classList.contains('hidden')) return;
      const c = blockCfg[t] || {};
      // A section the vendor hid never gets a menu button.
      if (c.hidden) return;
      const show = typeof c.nav === 'boolean' ? c.nav : NAV_DEFAULT[key];
      if (!show) return;
      const label = (c.nav_label || '').trim() || cardTitle(key);
      const btn = document.createElement('a');
      btn.href = '#' + el.id;
      btn.className = 'sf-navbtn' + (first ? ' primary' : '');
      // Each menu button: own fill, text colour, border (with its own
      // colour) and shake — entry.nav_color / nav_text_color /
      // nav_border + nav_border_color / nav_shake.
      const navColor = validHex(c.nav_color);
      const navText = validHex(c.nav_text_color);
      if (navColor) {
        btn.style.background = navColor;
        btn.style.borderColor = navColor;
      }
      if (navText || navColor) btn.style.color = navText || readableOn(navColor);
      if (c.nav_border === true) {
        btn.style.borderColor = validHex(c.nav_border_color) || navText || 'currentColor';
      } else if (c.nav_border === false && !navColor) {
        btn.style.borderColor = 'transparent';
      }
      if (c.nav_shake === true) btn.classList.add('shake');
      btn.innerHTML = '<span>' + escapeHtml(label) + '</span>' + ARROW_SVG;
      btn.addEventListener('click', function (e) { e.preventDefault(); scrollToSection(el.id); });
      nav.appendChild(btn);
      first = false;
    });
  }

  // ══════════════════════ Colour + type tokens ══════════════════════

  const DISPLAY_FONTS = {
    'Archivo':            { w: 800, gf: null },
    'Shrikhand':          { w: 400, gf: 'Shrikhand' },
    'Cormorant Garamond': { w: 700, gf: 'Cormorant+Garamond:wght@700' },
    'Fraunces':           { w: 700, gf: 'Fraunces:opsz,wght@9..144,700' },
    'Playfair Display':   { w: 700, gf: 'Playfair+Display:wght@700' },
    'DM Serif Display':   { w: 400, gf: 'DM+Serif+Display' },
    'Abril Fatface':      { w: 400, gf: 'Abril+Fatface' },
    'Lilita One':         { w: 400, gf: 'Lilita+One' },
    'Pacifico':           { w: 400, gf: 'Pacifico' },
    'Baloo 2':            { w: 800, gf: 'Baloo+2:wght@800' },
    'EB Garamond':        { w: 500, gf: 'EB+Garamond:wght@500' },
    'Libre Baskerville':  { w: 400, gf: 'Libre+Baskerville' },
    'Bodoni Moda':        { w: 600, gf: 'Bodoni+Moda:opsz,wght@6..96,600' },
    'Lora':               { w: 600, gf: 'Lora:wght@600' },
    'Yeseva One':         { w: 400, gf: 'Yeseva+One' },
    'Gloock':             { w: 400, gf: 'Gloock' },
    'Montserrat':         { w: 700, gf: 'Montserrat:wght@700' },
    'Poppins':            { w: 700, gf: 'Poppins:wght@700' },
    'Josefin Sans':       { w: 600, gf: 'Josefin+Sans:wght@600' },
    'Quicksand':          { w: 700, gf: 'Quicksand:wght@700' },
    'Fredoka':            { w: 600, gf: 'Fredoka:wght@600' },
    'Chewy':              { w: 400, gf: 'Chewy' },
    'Righteous':          { w: 400, gf: 'Righteous' },
    'Bungee':             { w: 400, gf: 'Bungee' },
    'Cherry Bomb One':    { w: 400, gf: 'Cherry+Bomb+One' },
    'Dancing Script':     { w: 700, gf: 'Dancing+Script:wght@700' },
    'Great Vibes':        { w: 400, gf: 'Great+Vibes' },
    'Satisfy':            { w: 400, gf: 'Satisfy' },
    'Caveat':             { w: 700, gf: 'Caveat:wght@700' }
  };
  const loadedFonts = {};
  function loadDisplayFont(name) {
    const f = DISPLAY_FONTS[name];
    if (!f || !f.gf || loadedFonts[name]) return;
    loadedFonts[name] = true;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + f.gf + '&display=swap';
    // The shop name is measured to fit one line — re-fit once the real font arrives.
    link.onload = function () {
      if (document.fonts && document.fonts.load) document.fonts.load(f.w + ' 40px "' + name + '"').then(fitShopName, fitShopName);
    };
    document.head.appendChild(link);
  }

  // Baker-chosen outline / drop shadow / glow on the shop name
  // (design.title_effect). Any of them replaces the automatic legibility
  // shadow, so what she picks is exactly what shows.
  function applyTitleEffect(el) {
    const fx = (design.title_effect && typeof design.title_effect === 'object') ? design.title_effect : {};
    const stroke = validHex(fx.stroke), shadow = validHex(fx.shadow), glow = validHex(fx.glow);
    const w = Math.min(8, Math.max(1, Number(fx.stroke_width) || 2));
    // The stroke straddles the glyph edge and the fill covers its inner
    // half (paint-order), so double it for the visible width.
    el.style.webkitTextStroke = stroke ? (w * 2) + 'px ' + stroke : '';
    el.style.paintOrder = stroke ? 'stroke fill' : '';
    const shadows = [];
    if (shadow) shadows.push('0 3px 2px ' + hexAlpha(shadow, 0.45), '0 6px 16px ' + hexAlpha(shadow, 0.5));
    if (glow) shadows.push('0 0 3px ' + glow, '0 0 8px ' + glow, '0 0 16px ' + glow, '0 0 30px ' + hexAlpha(glow, 0.9));
    if (stroke || shadow || glow) el.style.setProperty('text-shadow', shadows.length ? shadows.join(', ') : 'none', 'important');
    else el.style.removeProperty('text-shadow');
  }
  function hexAlpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // The shop name stays on one line: at the baker's chosen size when it
  // fits, otherwise scaled down to the column width.
  function fitShopName() {
    const el = document.getElementById('shop-name');
    if (!el) return;
    el.style.fontSize = '';
    if (el.scrollWidth <= el.clientWidth + 1) return;
    const size = parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(12, Math.floor(size * el.clientWidth / el.scrollWidth * 0.94)) + 'px';
  }

  function validHex(v) {
    if (typeof v !== 'string') return null;
    const s = v.trim();
    if (/^#[0-9a-f]{6}$/i.test(s)) return s;
    if (/^#[0-9a-f]{3}$/i.test(s)) return '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
    return null;
  }
  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgbHex(rgb) {
    return '#' + rgb.map(function (c) { return Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0'); }).join('');
  }
  // t = how far toward `b` (0 → a, 1 → b)
  function mixHex(a, b, t) {
    const x = hexRgb(a), y = hexRgb(b);
    return rgbHex([0, 1, 2].map(function (i) { return x[i] + (y[i] - x[i]) * t; }));
  }
  function relLum(hex) {
    const c = hexRgb(hex).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrast(a, b) {
    const la = relLum(a), lb = relLum(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }
  function readableOn(bg) { return contrast(bg, '#ffffff') >= contrast(bg, '#201e1d') ? '#ffffff' : '#201e1d'; }
  // Handoff `ink`: a deeper shade of the accent for headings/prices on
  // white — darkened until it clears 4.5:1 against white.
  function inkFor(accent) {
    for (let i = 3; i <= 20; i++) {
      const c = mixHex(accent, '#000000', i * 0.05);
      if (contrast(c, '#ffffff') >= 4.5) return c;
    }
    return '#201e1d';
  }

  function currentTheme() {
    const T = window.BakeriTheme && window.BakeriTheme.THEMES;
    if (!T) return null;
    return T[(profile && profile.selected_theme) || 'Classic'] || T['Classic'];
  }

  // Seller roles default to the baker's theme; any colour she set
  // explicitly (storefront_design.colors) wins.
  function applyDesignTokens() {
    const T = currentTheme();
    const themePrimary = (T && T.primary && T.primary.light) || '#1C1C1E';
    const themeBtnFg = (T && T.buttonFg && T.buttonFg.light) || '#FFFFFF';
    const c = design.colors || {};
    const accent = validHex(c.accent) || themePrimary;
    const accentFg = validHex(c.accent) ? readableOn(accent) : themeBtnFg;
    const root = document.documentElement.style;
    root.setProperty('--accent', accent);
    root.setProperty('--accent-600', mixHex(accent, '#000000', 0.1));
    root.setProperty('--accent-fg', validHex(c.button_text) || accentFg);
    // Card titles and prices follow each card's own title colour, falling
    // back to the theme — design.colors.ink is now the shop name's colour
    // only (renderIdentity), not a site-wide "titles & prices" colour.
    root.setProperty('--head-ink', inkFor(accent));
    root.setProperty('--tint', validHex(c.tint) || mixHex(accent, '#ffffff', 0.88));
    // Promotions follow the theme accent unless she picked a sale colour.
    const sale = validHex(c.sale) || accent;
    root.setProperty('--sale', sale);
    root.setProperty('--sale-fg', readableOn(sale));
    root.setProperty('--sale-ink', inkFor(sale));

    const fontName = DISPLAY_FONTS[design.display_font] ? design.display_font : 'Archivo';
    loadDisplayFont(fontName);
    root.setProperty('--display', '"' + fontName + '", "Archivo", -apple-system, system-ui, sans-serif');
    root.setProperty('--dw', String(DISPLAY_FONTS[fontName].w));
    // Shop name: its own font (default: the heading font) and size (% of the default).
    const titleName = DISPLAY_FONTS[design.title_font] ? design.title_font : fontName;
    loadDisplayFont(titleName);
    root.setProperty('--title-font', '"' + titleName + '", "Archivo", -apple-system, system-ui, sans-serif');
    root.setProperty('--title-w', String(DISPLAY_FONTS[titleName].w));
    const titleSize = Number(design.title_size);
    root.setProperty('--title-scale', String(titleSize >= 50 && titleSize <= 200 ? titleSize / 100 : 1));
