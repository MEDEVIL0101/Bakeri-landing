<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy — Bakeri</title>
  <meta name="description" content="Buy a physical item directly from a baker on Bakeri." />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="https://js.stripe.com/v3/"></script>
  <script src="theme.js"></script>

  <style>
    :root {
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-button-fg: #FFFFFF;

      --bg:        var(--theme-bg);
      --accent:    var(--theme-primary);
      --accent-fg: var(--theme-button-fg);

      --ink:       #241712;
      --muted:     #948577;
      --bio:       #4A3E33;
      --line:      rgba(36,23,18,0.08);
      --error:     #C0392B;
      --green:     #4CAF82;

      --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --theme-bg: #17110C; --ink: #F6F1E6; --bio: #E4D9C8; --muted: #A69B8C; --line: rgba(246,241,230,0.10); }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--bio); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    button, input { font-family: inherit; }

    #page { width: 100%; max-width: 480px; margin: 0 auto; padding: 28px 20px 60px; box-sizing: border-box; }
    @media (min-width: 640px) { #page { padding: 48px 24px 60px; } }

    /* An opaque card, not bare text floating on the page — the storefront's
       background pattern can be a bold, full-saturation Stripes/Gingham for
       some themes (not a pale wash), so text with nothing behind it but the
       pattern read as illegible. */
    #content {
      background: var(--bg);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 14px 34px -16px rgba(0,0,0,.3);
    }

    .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); }
    .heading { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 4px; }

    .order-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .order-line .n { font-size: 14.5px; font-weight: 600; color: var(--ink); }
    .order-line .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .order-line .p { font-size: 14.5px; font-weight: 600; color: var(--ink); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .sold-out-tag {
      font-size: 12px; font-weight: 700; color: var(--error); background: rgba(192,57,43,0.1);
      padding: 4px 10px; border-radius: 9999px; align-self: center;
    }

    .totals-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--bio); font-variant-numeric: tabular-nums; }
    .totals-row.grand { font-weight: 700; color: var(--ink); font-size: 17px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }

    .field { margin-top: 14px; }
    .field.half { display: inline-block; width: calc(50% - 5px); }
    .field.half + .field.half { margin-left: 10px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
      background: #fff; color: var(--ink); padding: 0 14px; font-size: 14px;
    }
    .field select { appearance: auto; }

    #payment-element { margin-top: 20px; }

    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 52px; margin-top: 22px;
      background: var(--accent); color: var(--accent-fg);
      font-size: 15px; font-weight: 700;
      border-radius: 9999px; border: none; cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .submit-status { margin-top: 12px; text-align: center; font-size: 13px; color: var(--error); min-height: 16px; }

    .success-state { text-align: center; padding: 30px 0; }
    .success-state .icon {
      width: 54px; height: 54px; border-radius: 50%; background: var(--green); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto;
    }
    .success-state h2 { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 16px; }
    .success-state p { font-size: 14px; color: var(--bio); margin-top: 10px; line-height: 1.6; }
    .success-state .receipt { text-align: left; margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }

    .not-found { text-align: center; color: var(--muted); padding: 40px 0; }
    .not-found h2 { font-size: 18px; margin-bottom: 8px; color: var(--ink); }

    .footer-links { margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); }
    .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>

<div id="page">
  <div id="content"><div class="eyebrow">Loading…</div></div>
  <div class="footer-links">
    <a href="https://bakeriapp.com">bakeriapp.com</a> · <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STRIPE_PK    = 'pk_live_51TdqbXRpI8DhqX3Ful2hqNWdNtdd4Rt0QQC6IZVhxA5Du89YIEo1638vSaJmBmk5XqRbfxcbqiYJCsMJgpRWvzoP00NUFyirgh';

  // Common shipping destinations for a small home bakery, US/Canada first
  // since that's the overwhelming majority, rest alphabetical. No pre-selected
  // value — the baker's own country was previously (wrongly) hardcoded here,
  // see the "Don't pre-fill guest checkout's shipping country as Canada" fix.
  const COUNTRIES = [
    'United States', 'Canada',
    'Australia', 'Austria', 'Belgium', 'Brazil', 'Denmark', 'Finland', 'France',
    'Germany', 'Ireland', 'Italy', 'Japan', 'Mexico', 'Netherlands', 'New Zealand',
    'Norway', 'Poland', 'Portugal', 'Singapore', 'South Korea', 'Spain', 'Sweden',
    'Switzerland', 'United Arab Emirates', 'United Kingdom'
  ];
  function countrySelectHtml(id) {
    return '<select id="' + id + '" autocomplete="country">' +
      '<option value="" disabled selected>Select country</option>' +
      COUNTRIES.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') +
      '</select>';
  }

  const params  = new URLSearchParams(window.location.search);
  const bakerID = (params.get('baker') || '').trim();
  // items=id1:2,id2:1:variantId — id:qty pairs (a ship cart, unlike the
  // digital cart, can hold more than one of the same stock-bound item), with
  // an optional third :variantId segment for a has_variants listing (see
  // shipCartLineToken in baker/index.html). A bare id with no ":qty"
  // defaults to 1, so a single "buy now" link (?items=id) still works. Kept
  // as a plain array of lines (not deduped/keyed by id) since two different
  // variants of the same base listing are two separate lines here, same as
  // everywhere else this feature touches.
  const requestedLines = (params.get('items') || params.get('item') || '')
    .split(',').map(function (s) { return s.trim(); }).filter(Boolean)
    .map(function (pair) {
      const parts = pair.split(':');
      return { id: parts[0], qty: Math.max(1, parseInt(parts[1], 10) || 1), variantId: parts[2] || null };
    });
  const itemIDs = [...new Set(requestedLines.map(function (l) { return l.id; }))];
  const content = document.getElementById('content');

  if (window.BakeriTheme) {
    window.BakeriTheme.apply({ selected_theme: params.get('theme') || 'Classic', background_pattern: params.get('pattern') || 'Standard' });
  }

  if (!bakerID || itemIDs.length === 0) {
    showMessage('Link not found', 'This item link looks incomplete.');
    return;
  }

  let items = [];
  // Only the actually-purchasable subset of `items` — everything charged,
  // sent to create-payment-intent, and finalized reads from this instead of
  // `items` directly, so a sold-out line never silently rides along in a
  // request it has no business being in.
  let purchasableItems = [];
  let total = 0;
  let shippingFeeTotal = 0;
  let shipAddress = null;

  fetch(SUPABASE_URL + '/rest/v1/rpc/get_baker_web_profile_by_id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify({ p_user_id: bakerID })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data || !data.profile) { showMessage('Not found', 'This storefront could not be found.'); return; }
    // Drop any line whose base listing has since vanished/been unlisted
    // entirely, or (for a variant line) whose picked option no longer
    // exists at all — those genuinely have nothing to show. A sold-out
    // item/option (exists, just no stock) is kept and flagged instead of
    // dropped, so the buyer sees what they clicked on marked unavailable
    // rather than the whole page going blank. The real atomic stock check
    // still happens server-side at charge time (see create-payment-intent)
    // regardless of what's shown here.
    items = requestedLines
      .map(function (line) {
        const base = (data.listings || []).find(function (l) { return l.id === line.id && l.listing_kind === 'physical'; });
        if (!base) return null;
        if (line.variantId) {
          const variant = (base.listing_variants || []).find(function (v) { return v.id === line.variantId; });
          if (!variant) return null;
          const soldOut = (variant.stock_qty || 0) <= 0;
          return Object.assign({}, base, {
            qty: soldOut ? line.qty : Math.min(line.qty, variant.stock_qty), price: variant.price,
            variantId: variant.id, variantLabel: variant.label, name: base.name + ' — ' + variant.label,
            soldOut: soldOut
          });
        }
        const soldOut = (base.available_qty_today || 0) <= 0;
        return Object.assign({}, base, {
          qty: soldOut ? line.qty : Math.min(line.qty, base.available_qty_today),
          variantId: null, variantLabel: null, soldOut: soldOut
        });
      })
      .filter(Boolean);
    if (items.length === 0) { showMessage('Not found', 'This item link looks invalid.'); return; }
    purchasableItems = items.filter(function (i) { return !i.soldOut; });
    // Guest checkout: buyer pays the listed price(s) plus shipping —
    // Bakeri's service charge still only comes out of the baker's side.
    // Waived entirely once the item subtotal alone clears the baker's
    // storefront-wide free-shipping threshold (0 = no such rule, see
    // WebShopShippingSheet). Sold-out lines never contribute to any of this.
    //
    // Combined-shipping: among the distinct base items here, the one with
    // the highest shipping_fee charges in full; every other distinct item
    // charges round(shipping_fee * shipping_additional_item_percent / 100)
    // instead of its own full fee, unless it has shipping_always_full_price
    // set (always full fee regardless of rank). Same rule as
    // baker/index.html's shipCartShippingFees() and
    // finalize-guest-physical-order's authoritative recompute.
    const itemsSubtotal = purchasableItems.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
    const freeOverThreshold = (data.profile && data.profile.shipping_free_over_threshold) || 0;
    const additionalPercent = (data.profile && data.profile.shipping_additional_item_percent != null)
      ? data.profile.shipping_additional_item_percent : 100;
    if (freeOverThreshold > 0 && itemsSubtotal >= freeOverThreshold) {
      shippingFeeTotal = 0;
    } else {
      const seen = {};
      const distinct = [];
      purchasableItems.forEach(function (i) { if (!seen[i.id]) { seen[i.id] = true; distinct.push(i); } });
      let highestIdx = 0;
      distinct.forEach(function (item, idx) {
        if ((item.shipping_fee || 0) > (distinct[highestIdx].shipping_fee || 0)) highestIdx = idx;
      });
      shippingFeeTotal = distinct.reduce(function (s, item, idx) {
        if (idx === highestIdx) return s + (item.shipping_fee || 0);
        if (item.shipping_always_full_price) return s + (item.shipping_fee || 0);
        return s + Math.round((item.shipping_fee || 0) * additionalPercent / 100 * 100) / 100;
      }, 0);
    }
    total = itemsSubtotal + shippingFeeTotal;
    renderForm();
  })
  .catch(function () { showMessage('Something went wrong', 'Could not load this item. Please try again later.'); });

  function renderForm() {
    const lines = items.map(function (i) {
      if (i.soldOut) {
        return '<div class="order-line"><div><div class="n">' + escapeHtml(i.name) + '</div>' +
          '<div class="m">No longer in stock</div></div>' +
          '<span class="p sold-out-tag">Sold Out</span></div>';
      }
      return '<div class="order-line"><div><div class="n">' + i.qty + '× ' + escapeHtml(i.name) + '</div>' +
        '<div class="m">Ships in ' + (i.lead_days || 3) + ' day' + (i.lead_days === 1 ? '' : 's') + '</div></div>' +
        '<span class="p">$' + (i.price * i.qty).toFixed(2) + '</span></div>';
    }).join('');

    if (purchasableItems.length === 0) {
      // Every requested item/option is sold out — show exactly what was
      // requested, clearly marked, rather than either silently vanishing
      // (the old behaviour) or offering a payment form for nothing.
      content.innerHTML =
        '<div class="eyebrow">Buy</div>' +
        '<div class="heading">' + (items.length === 1 ? escapeHtml(items[0].name) : items.length + ' Items') + '</div>' +
        lines +
        '<p style="margin-top:18px;font-size:13.5px;color:var(--muted);text-align:center;">' +
          (items.length === 1 ? 'This item is' : 'These items are') + ' sold out — check back later, or ask the baker directly.' +
        '</p>';
      return;
    }

    content.innerHTML =
      '<div class="eyebrow">Buy</div>' +
      '<div class="heading">' + (items.length === 1 ? escapeHtml(items[0].name) : items.length + ' Items') + '</div>' +
      lines +
      (shippingFeeTotal > 0 ? '<div class="totals-row"><span>Shipping</span><span>$' + shippingFeeTotal.toFixed(2) + '</span></div>' : '') +
      '<div class="totals-row grand"><span>Total</span><span>$' + total.toFixed(2) + '</span></div>' +
      '<div class="field"><label>Name</label><input id="f-name" type="text" autocomplete="name" /></div>' +
      '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" /></div>' +
      '<div class="field"><label>Confirm email</label><input id="f-email-confirm" type="email" autocomplete="email" onpaste="return false" oncopy="return false" oncut="return false" /></div>' +
      '<div style="font-size:12.5px;color:var(--muted,#6B5F54);margin-top:6px;">Your order confirmation is sent to this address — please make sure it\'s typed correctly.</div>' +
      '<div class="eyebrow" style="margin-top:20px;">Shipping address</div>' +
      '<div class="field"><label>Full name</label><input id="s-name" type="text" autocomplete="name" /></div>' +
      '<div class="field"><label>Address line 1</label><input id="s-line1" type="text" autocomplete="address-line1" /></div>' +
      '<div class="field"><label>Address line 2 (optional)</label><input id="s-line2" type="text" autocomplete="address-line2" /></div>' +
      '<div class="field half"><label>City</label><input id="s-city" type="text" autocomplete="address-level2" /></div>' +
      '<div class="field half"><label>Province</label><input id="s-province" type="text" autocomplete="address-level1" /></div>' +
      '<div class="field half"><label>Postal code</label><input id="s-postal" type="text" autocomplete="postal-code" /></div>' +
      '<div class="field half"><label>Country</label>' + countrySelectHtml('s-country') + '</div>' +
      '<button class="btn-primary" id="continue-btn">Continue to Payment</button>' +
      '<div class="submit-status" id="submit-status"></div>';

    document.getElementById('continue-btn').addEventListener('click', goToPayment);
  }

  function goToPayment() {
    const name = document.getElementById('f-name').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const emailConfirm = document.getElementById('f-email-confirm').value.trim();
    const status = document.getElementById('submit-status');
    if (!name || !email || !emailConfirm) {
      status.textContent = 'Please fill in your name and email (twice, to confirm).';
      return;
    }
    // The order confirmation only ever goes to this address — a single
    // mistyped character in the domain still looks like a valid email, so a
    // plain regex can't catch it. Requiring it twice does.
    if (email.toLowerCase() !== emailConfirm.toLowerCase()) {
      status.textContent = "Those emails don't match — please check for typos.";
      return;
    }
    const sName = document.getElementById('s-name').value.trim();
    const sLine1 = document.getElementById('s-line1').value.trim();
    const sCity = document.getElementById('s-city').value.trim();
    const sProvince = document.getElementById('s-province').value.trim();
    const sPostal = document.getElementById('s-postal').value.trim();
    const sCountry = document.getElementById('s-country').value.trim();
    if (!sName || !sLine1 || !sCity || !sProvince || !sPostal || !sCountry) {
      status.textContent = 'Please fill in the full shipping address.';
      return;
    }
    shipAddress = {
      name: sName, line1: sLine1,
      line2: document.getElementById('s-line2').value.trim(),
      city: sCity, province: sProvince, postal_code: sPostal, country: sCountry
    };

    const btn = document.getElementById('continue-btn');
    btn.disabled = true;
    status.textContent = '';

    fetch(SUPABASE_URL + '/functions/v1/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        items: purchasableItems.map(function (i) {
          return { listing_id: i.id, baker_id: bakerID, name: i.name, quantity: i.qty, price_from: i.price, listing_kind: 'physical', variant_id: i.variantId || null };
        }),
        currency: 'cad',
        shipping_fee_cents: Math.round(shippingFeeTotal * 100)
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error || !data.client_secret) {
        status.textContent = data.error || 'Something went wrong. Please try again.';
        btn.disabled = false;
        return;
      }
      renderPayment(data.client_secret, name, email, data.stripe_connect_account_id);
    })
    .catch(function () {
      status.textContent = 'Something went wrong. Please check your connection and try again.';
      btn.disabled = false;
    });
  }

  function renderPayment(clientSecret, name, email, connectedAccountId) {
    content.innerHTML =
      '<div class="eyebrow">Pay</div>' +
      '<div class="heading">$' + total.toFixed(2) + '</div>' +
      '<div id="payment-element"></div>' +
      '<button class="btn-primary" id="pay-btn">Pay $' + total.toFixed(2) + '</button>' +
      '<div class="submit-status" id="submit-status"></div>';

    // A direct charge's PaymentIntent lives on the baker's own connected
    // account — Stripe.js must be told that account to confirm against it,
    // or the Payment Element mounts with no fields (see checkout.html).
    const stripe = connectedAccountId ? Stripe(STRIPE_PK, { stripeAccount: connectedAccountId }) : Stripe(STRIPE_PK);
    const elements = stripe.elements({ clientSecret: clientSecret });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    document.getElementById('pay-btn').addEventListener('click', function () {
      const btn = document.getElementById('pay-btn');
      const status = document.getElementById('submit-status');
      btn.disabled = true;
      status.textContent = '';

      stripe.confirmPayment({ elements: elements, redirect: 'if_required' }).then(function (result) {
        if (result.error) {
          status.textContent = result.error.message || 'Payment failed. Please try again.';
          btn.disabled = false;
          return;
        }
        const intent = result.paymentIntent;
        if (!intent || intent.status !== 'succeeded') {
          status.textContent = 'Payment did not complete. Please try again.';
          btn.disabled = false;
          return;
        }
        finalize(intent.id, name, email);
      });
    });
  }

  function finalize(paymentIntentId, name, email) {
    fetch(SUPABASE_URL + '/functions/v1/finalize-guest-physical-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        payment_intent_id: paymentIntentId,
        items: purchasableItems.map(function (i) { return { menu_item_id: i.id, quantity: i.qty, variant_id: i.variantId || null }; }),
        customer_name: name,
        customer_email: email,
        shipping_address: shipAddress
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) {
        const status = document.getElementById('submit-status');
        if (status) status.textContent = data.error;
        return;
      }
      renderSuccess(data);
    });
  }

  function renderSuccess(data) {
    // Stops the bfcache-restore reload in theme.js from throwing this paid
    // state away — see digital-checkout.html for the equivalent fix.
    document.body.setAttribute('data-bakeri-no-reload', '1');
    const lines = (data.items || purchasableItems).map(function (i) {
      const qty = i.quantity || i.qty || 1;
      const name = i.item_name || i.name;
      const price = i.price_per_unit != null ? i.price_per_unit : i.price;
      return '<div class="order-line"><div class="n">' + qty + '× ' + escapeHtml(name) + '</div>' +
        '<span class="p">$' + (price * qty).toFixed(2) + '</span></div>';
    }).join('');
    content.innerHTML =
      '<div class="success-state">' +
        '<div class="icon">✓</div>' +
        '<h2>Your order will ship soon</h2>' +
        '<p>Thanks for your purchase' + (data.baker_name ? ' from ' + escapeHtml(data.baker_name) : '') + '. A confirmation with your shipping address was emailed to you.</p>' +
        '<div class="receipt">' + lines +
          '<div class="totals-row grand"><span>Total</span><span>$' + total.toFixed(2) + '</span></div>' +
        '</div>' +
      '</div>';
  }

  function showMessage(title, subtitle) {
    content.innerHTML =
      '<div class="not-found">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(subtitle) + '</p>' +
      '</div>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
})();
</script>
</body>
</html>
