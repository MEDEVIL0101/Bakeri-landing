<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy &amp; Download — Bakeri</title>
  <meta name="description" content="Buy a digital download directly from a baker on Bakeri." />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="https://js.stripe.com/v3/"></script>
  <script src="theme.js"></script>

  <style>
    :root {
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-button-fg: #FFFFFF;

      --bg:        var(--theme-bg);
      --accent:    var(--theme-primary);
      --accent-fg: var(--theme-button-fg);

      --ink:       #241712;
      --muted:     #948577;
      --bio:       #4A3E33;
      --line:      rgba(36,23,18,0.08);
      --error:     #C0392B;
      --green:     #4CAF82;

      --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --theme-bg: #17110C; --ink: #F6F1E6; --bio: #E4D9C8; --muted: #A69B8C; --line: rgba(246,241,230,0.10); }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--bio); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    button, input { font-family: inherit; }

    #page { width: 100%; max-width: 480px; margin: 0 auto; padding: 28px 20px 60px; box-sizing: border-box; }
    @media (min-width: 640px) { #page { padding: 48px 24px 60px; } }

    /* An opaque card, not bare text floating on the page — the storefront's
       background pattern can be a bold, full-saturation Stripes/Gingham for
       some themes (not a pale wash), so text with nothing behind it but the
       pattern read as illegible. */
    #content {
      background: var(--bg);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 14px 34px -16px rgba(0,0,0,.3);
    }

    .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); }
    .heading { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 4px; }

    .order-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .order-line .n { font-size: 14.5px; font-weight: 600; color: var(--ink); }
    .order-line .p { font-size: 14.5px; font-weight: 600; color: var(--ink); flex-shrink: 0; font-variant-numeric: tabular-nums; }

    .promo-row { display: flex; gap: 8px; margin-top: 14px; }
    .promo-row input { flex: 1; min-width: 0; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface, #fff); color: var(--ink); padding: 0 12px; font-size: 14px; text-transform: uppercase; }
    .promo-row button { flex-shrink: 0; height: 42px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; }
    .promo-status { font-size: 12.5px; margin-top: 6px; min-height: 1em; }
    .promo-status.ok { color: #3FA672; font-weight: 600; }
    .promo-status.err { color: #C0392B; }
    .totals-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--bio); font-variant-numeric: tabular-nums; }
    .totals-row.grand { font-weight: 700; color: var(--ink); font-size: 17px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }

    .field { margin-top: 14px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 6px; }
    .field input {
      width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
      background: #fff; color: var(--ink); padding: 0 14px; font-size: 14px;
    }

    #payment-element { margin-top: 20px; }

    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 52px; margin-top: 22px;
      background: var(--accent); color: var(--accent-fg);
      font-size: 15px; font-weight: 700;
      border-radius: 9999px; border: none; cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .submit-status { margin-top: 12px; text-align: center; font-size: 13px; color: var(--error); min-height: 16px; }

    .success-state { text-align: center; padding: 10px 0; }
    .success-state h2 { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 0; }
    .success-state p { font-size: 14px; color: var(--bio); margin-top: 10px; line-height: 1.6; }
    .btn-download {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 52px; margin-top: 20px;
      background: var(--green); color: #fff; text-decoration: none;
      font-size: 15px; font-weight: 700; border-radius: 9999px;
    }

    .not-found { text-align: center; color: var(--muted); padding: 40px 0; }
    .not-found h2 { font-size: 18px; margin-bottom: 8px; color: var(--ink); }

    .footer-links { margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); }
    .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>

<div id="page">
  <div id="content"><div class="eyebrow">Loading…</div></div>
  <div class="footer-links">
    <a href="https://bakeriapp.com">bakeriapp.com</a> · <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STRIPE_PK    = 'pk_live_51TdqbXRpI8DhqX3Ful2hqNWdNtdd4Rt0QQC6IZVhxA5Du89YIEo1638vSaJmBmk5XqRbfxcbqiYJCsMJgpRWvzoP00NUFyirgh';

  const params  = new URLSearchParams(window.location.search);
  const bakerID = (params.get('baker') || '').trim();
  // items=id1,id2,id3~variantId is the current shape (a download cart — see
  // baker/index.html's digitalCart/digitalCartLineToken) — a bare id for a
  // plain pick, or id~variantId for a has_variants listing's chosen option.
  // item=id (singular) is kept working for any link shared before carts
  // existed, or already saved by a buyer. Kept as a plain array of lines
  // (not deduped/keyed by id) since two different variants of the same
  // base listing are two separate lines, same as everywhere else this
  // feature touches.
  const requestedLines = (params.get('items') || params.get('item') || '')
    .split(',').map(function (s) { return s.trim(); }).filter(Boolean)
    .map(function (token) {
      const parts = token.split('~');
      return { id: parts[0], variantId: parts[1] || null };
    });
  const itemIDs = [...new Set(requestedLines.map(function (l) { return l.id; }))];
  const content = document.getElementById('content');

  if (window.BakeriTheme) {
    window.BakeriTheme.apply({ selected_theme: params.get('theme') || 'Classic', background_pattern: params.get('pattern') || 'Standard' });
  }

  if (!bakerID || itemIDs.length === 0) {
    showMessage('Link not found', 'This item link looks incomplete.');
    return;
  }

  let items = [];
  let total = 0;

  fetch(SUPABASE_URL + '/rest/v1/rpc/get_baker_web_profile_by_id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify({ p_user_id: bakerID })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data || !data.profile) { showMessage('Not found', 'This storefront could not be found.'); return; }
    // Drop any line whose base listing has since vanished/been unlisted, or
    // (for a variant line) whose picked option is gone — rather than failing
    // the whole cart — better to let the buyer still check out with what's
    // still there than block them over one bad item (matches the "still
    // deliver what we can" bias in finalize-guest-digital-order).
    // Effective (post-promotion) unit price for display — the same percent-off
    // the edge functions apply authoritatively server-side. `sale_price` is
    // pre-computed for the base listing; variant prices get the same percent.
    function promoAdjust(base, raw) {
      var p = base && base.promo;
      if (p && p.discount_type === 'percent') return Math.round(raw * (100 - p.discount_value)) / 100;
      return raw;
    }
    items = requestedLines
      .map(function (line) {
        const base = (data.listings || []).find(function (l) { return l.id === line.id && l.listing_kind === 'digital'; });
        if (!base) return null;
        if (line.variantId) {
          const variant = (base.listing_variants || []).find(function (v) { return v.id === line.variantId; });
          if (!variant) return null;
          return Object.assign({}, base, { price: promoAdjust(base, variant.price), originalPrice: variant.price, variantId: variant.id, variantLabel: variant.label, name: base.name + ' — ' + variant.label });
        }
        return Object.assign({}, base, { price: (base.sale_price != null ? base.sale_price : base.price), originalPrice: base.price, variantId: null, variantLabel: null });
      })
      .filter(Boolean);
    if (items.length === 0) { showMessage('Not found', 'These items are no longer available.'); return; }
    // Automatic-sale price per line, before any promo code — the baseline a
    // code discount is re-applied from (or reverted to).
    items.forEach(function (i) { i.autoPrice = i.price; });
    // Guest checkout: buyer pays exactly the listed price(s) — no fee added
    // on top (Bakeri's service charge comes out of the baker's side).
    total = items.reduce(function (s, i) { return s + i.price; }, 0);
    renderForm();
  })
  .catch(function () { showMessage('Something went wrong', 'Could not load this item. Please try again later.'); });

  // ── Promo code ──
  var appliedCode = null;         // set once a code validates
  var codeDiscount = 0;           // dollars off, across all lines
  function promoItemsPayload() {
    return items.map(function (i) {
      return { menu_item_id: i.id, listing_kind: 'digital',
               unit_price: (i.originalPrice != null ? i.originalPrice : i.price), qty: 1 };
    });
  }
  function applyPromoCode() {
    var input = document.getElementById('promo-input');
    var st = document.getElementById('promo-status');
    var code = (input.value || '').trim();
    if (!code) { return; }
    items.forEach(function (i) { i.price = i.autoPrice; }); // revert any prior code
    st.textContent = 'Checking…'; st.className = 'promo-status';
    fetch(SUPABASE_URL + '/rest/v1/rpc/resolve_effective_prices', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ p_user_id: bakerID, p_items: promoItemsPayload(), p_code: code })
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var STATUS = { invalid: "That code isn't valid.", expired: 'That code has expired.',
        not_started: "That code isn't active yet.", used_up: 'That code has been fully redeemed.' };
      if (!res || res.code_status !== 'valid') {
        appliedCode = null; codeDiscount = 0;
        st.textContent = (res && STATUS[res.code_status]) || "That code isn't valid.";
        st.className = 'promo-status err';
        recomputeTotal(); return;
      }
      appliedCode = code.toUpperCase();
      (res.lines || []).forEach(function (ln, idx) {
        if (items[idx] && ln.effective_unit_price != null) items[idx].price = parseFloat(ln.effective_unit_price);
      });
      codeDiscount = parseFloat(res.total_discount || 0);
      st.textContent = 'Code ' + appliedCode + ' applied — $' + codeDiscount.toFixed(2) + ' off';
      st.className = 'promo-status ok';
      recomputeTotal();
    })
    .catch(function () { st.textContent = "Couldn't check that code — try again."; st.className = 'promo-status err'; });
  }
  function recomputeTotal() {
    total = items.reduce(function (s, i) { return s + i.price; }, 0);
    var g = document.getElementById('grand-total');
    if (g) g.textContent = '$' + total.toFixed(2);
    var ll = document.getElementById('order-lines');
    if (ll) ll.innerHTML = orderLinesHTML();
  }
  function orderLinesHTML() {
    return items.length > 1 ? items.map(function (i) {
      return '<div class="order-line"><span class="n">' + escapeHtml(i.name) + '</span><span class="p">$' + i.price.toFixed(2) + '</span></div>';
    }).join('') : '';
  }

  function renderForm() {
    content.innerHTML =
      '<div class="eyebrow">Buy &amp; Download</div>' +
      '<div class="heading">' + (items.length === 1 ? escapeHtml(items[0].name) : items.length + ' Digital Downloads') + '</div>' +
      '<div id="order-lines">' + orderLinesHTML() + '</div>' +
      '<div class="promo-row"><input id="promo-input" type="text" placeholder="Promo code" autocapitalize="characters" autocomplete="off" />' +
      '<button type="button" id="promo-apply">Apply</button></div>' +
      '<div class="promo-status" id="promo-status"></div>' +
      '<div class="totals-row grand"><span>Total</span><span id="grand-total">$' + total.toFixed(2) + '</span></div>' +
      '<div class="field"><label>Name</label><input id="f-name" type="text" autocomplete="name" /></div>' +
      '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" /></div>' +
      '<div class="field"><label>Confirm email</label><input id="f-email-confirm" type="email" autocomplete="email" onpaste="return false" oncopy="return false" oncut="return false" /></div>' +
      '<div style="font-size:12.5px;color:var(--muted,#6B5F54);margin-top:6px;">Your download link is sent to this address — please make sure it\'s typed correctly.</div>' +
      '<button class="btn-primary" id="continue-btn">Continue to Payment</button>' +
      '<div class="submit-status" id="submit-status"></div>';

    document.getElementById('continue-btn').addEventListener('click', goToPayment);
    document.getElementById('promo-apply').addEventListener('click', applyPromoCode);
  }

  function goToPayment() {
    const name = document.getElementById('f-name').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const emailConfirm = document.getElementById('f-email-confirm').value.trim();
    const status = document.getElementById('submit-status');
    if (!name || !email || !emailConfirm) {
      status.textContent = 'Please fill in your name and email (twice, to confirm).';
      return;
    }
    // The download link only ever goes to this address — a single mistyped
    // character in the domain still looks like a valid email, so a plain
    // regex can't catch it. Requiring it twice does.
    if (email.toLowerCase() !== emailConfirm.toLowerCase()) {
      status.textContent = "Those emails don't match — please check for typos.";
      return;
    }

    const btn = document.getElementById('continue-btn');
    btn.disabled = true;
    status.textContent = '';

    fetch(SUPABASE_URL + '/functions/v1/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        items: items.map(function (i) {
          return { listing_id: i.id, baker_id: bakerID, name: i.name, quantity: 1, price_from: (i.originalPrice != null ? i.originalPrice : i.price), listing_kind: 'digital', variant_id: i.variantId || null };
        }),
        currency: 'cad',
        promo_code: appliedCode
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error || !data.client_secret) {
        status.textContent = data.error || 'Something went wrong. Please try again.';
        btn.disabled = false;
        return;
      }
      renderPayment(data.client_secret, name, email, data.stripe_connect_account_id);
    })
    .catch(function () {
      status.textContent = 'Something went wrong. Please check your connection and try again.';
      btn.disabled = false;
    });
  }

  function renderPayment(clientSecret, name, email, connectedAccountId) {
    content.innerHTML =
      '<div class="eyebrow">Pay</div>' +
      '<div class="heading">$' + total.toFixed(2) + '</div>' +
      '<div id="payment-element"></div>' +
      '<button class="btn-primary" id="pay-btn">Pay $' + total.toFixed(2) + '</button>' +
      '<div class="submit-status" id="submit-status"></div>';

    // A direct charge's PaymentIntent lives on the baker's own connected
    // account — Stripe.js must be told that account to confirm against it,
    // or the Payment Element mounts with no fields (see checkout.html).
    const stripe = connectedAccountId ? Stripe(STRIPE_PK, { stripeAccount: connectedAccountId }) : Stripe(STRIPE_PK);
    const elements = stripe.elements({ clientSecret: clientSecret });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    document.getElementById('pay-btn').addEventListener('click', function () {
      const btn = document.getElementById('pay-btn');
      const status = document.getElementById('submit-status');
      btn.disabled = true;
      status.textContent = '';

      stripe.confirmPayment({ elements: elements, redirect: 'if_required' }).then(function (result) {
        if (result.error) {
          status.textContent = result.error.message || 'Payment failed. Please try again.';
          btn.disabled = false;
          return;
        }
        const intent = result.paymentIntent;
        if (!intent || intent.status !== 'succeeded') {
          status.textContent = 'Payment did not complete. Please try again.';
          btn.disabled = false;
          return;
        }
        finalize(intent.id, name, email);
      });
    });
  }

  function finalize(paymentIntentId, name, email) {
    fetch(SUPABASE_URL + '/functions/v1/finalize-guest-digital-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        payment_intent_id: paymentIntentId,
        items: items.map(function (i) { return { id: i.id, variant_id: i.variantId || null }; }),
        customer_name: name,
        customer_email: email
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) {
        const status = document.getElementById('submit-status');
        if (status) status.textContent = data.error;
        return;
      }
      // The delivery email is sent server-side by finalize-guest-digital-order
      // now — a browser fire-and-forget here never fired if the tab closed or
      // an in-app browser tore the page down first (SUPPORT_LOG 2026-09-06).
      renderSuccess(data);
    });
  }

  function renderSuccess(data) {
    // Stops the bfcache-restore reload in theme.js from throwing this paid
    // state away — otherwise clicking a download link then pressing Back
    // reloads the page back to the pre-payment "Continue to Payment" form.
    document.body.setAttribute('data-bakeri-no-reload', '1');
    const downloads = data.downloads || [];
    const links = downloads.map(function (d) {
      return '<a class="btn-download" href="' + d.download_url + '">' +
        (downloads.length > 1 ? 'Download ' + escapeHtml(d.item_name) : 'Download now') + '</a>';
    }).join('');
    content.innerHTML =
      '<div class="success-state">' +
        '<h2>Your download' + (downloads.length > 1 ? 's are' : ' is') + ' ready</h2>' +
        '<p>Thanks for your purchase' + (data.baker_name ? ' from ' + escapeHtml(data.baker_name) : '') + '. ' + (downloads.length > 1 ? 'Copies of these links were' : 'A copy of this link was') + ' also emailed to you.</p>' +
        links +
      '</div>';
  }

  function showMessage(title, subtitle) {
    content.innerHTML =
      '<div class="not-found">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(subtitle) + '</p>' +
      '</div>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
})();
</script>
</body>
</html>
