<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri</title>
  <meta name="description" content="View this baker's storefront on Bakeri." />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="theme.js"></script>

  <style>
    :root {
      /* Overwritten at runtime by theme.js from the baker's chosen in-app
         theme (profiles.selected_theme) — pre-load fallback. */
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-gold:      #C49A6C;
      --theme-button-fg: #FFFFFF;

      /* Baker-adaptive */
      --bg:        var(--theme-bg);
      --accent:    var(--theme-primary);
      --accent-fg: var(--theme-button-fg);

      /* Fixed tokens from BakeriTheme.swift's storefront profile redesign
         (bakeriProfileInk/Muted/Bio/ChipText, bakeriProfileBadge*) — the
         same values used for the in-app baker profile, so the web page
         reads as the same product. */
      --surface:    #FFFFFF;
      --ink:        #241712;
      --muted:      #948577;
      --bio:        #4A3E33;
      --chip-text:  #7A6C5D;
      --line:       rgba(36,23,18,0.08);
      --line-soft:  rgba(36,23,18,0.06);
      --ready:      #3FA672;
      --preorder:   #C79A3D;
      --custom:     #A66A5B;
      --digital:    #5F92E6;
      --error:      #C0392B;

      --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --theme-bg: #17110C;
        --surface:  #241A14;
        --ink:      #F6F1E6;
        --bio:      #E4D9C8;
        --muted:    #A69B8C;
        --chip-text:#C2B29E;
        --line:     rgba(246,241,230,0.10);
        --line-soft:rgba(246,241,230,0.08);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--bio);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }
    .hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── Photo placeholder (used until a real image loads) ── */
    .ph-fallback {
      background: var(--line-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }

    /* ══════════════════════ Page shell ══════════════════════
       Everything (header through footer) lives in one width-constrained,
       opaque column — matches the in-app screen anatomy (flat cream band,
       white filter strip, then the pattern behind the product grid) and
       keeps every section the same width instead of some bleeding full-
       width and others not. The fixed pattern layer (theme.js) sits behind
       this whole shell, so on desktop it only shows in the side margins;
       on mobile the shell fills the viewport, so no margin — no pattern. */
    #page-shell { max-width: 720px; margin: 0 auto; background: var(--bg); position: relative; }

    #site-header {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      padding: 14px 16px; background: var(--bg);
    }
    .circle-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(36,23,18,.08), 0 6px 16px rgba(36,23,18,.06);
    }
    #cart-btn { position: relative; }
    #cart-btn-count {
      position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 3px;
      border-radius: 9999px; background: var(--accent); color: var(--accent-fg);
      font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    #cart-btn-count:empty { display: none; }

    /* ══════════════════════ Header image ══════════════════════
       Full-width dynamic banner — falls back to a plain theme-colored
       gradient when the baker hasn't set one (img.onerror below), same
       convention as the about-portrait fallback. The business logo (avatar)
       overlaps its bottom edge by half, cover-photo/profile-photo style. */
    #storefront-header {
      position: relative; width: 100%; aspect-ratio: 21/9; overflow: hidden;
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
      margin-bottom: -64px;
    }
    #storefront-header img { width: 100%; height: 100%; object-fit: cover; display: none; }

    #profile-block { text-align: center; padding: 8px 20px 22px; position: relative; z-index: 1; }
    #profile-block .avatar {
      width: 128px; height: 128px; font-size: 42px; margin: 0 auto;
      box-shadow: 0 0 0 4px var(--bg), 0 2px 6px rgba(36,23,18,.15);
    }
    #shop-name { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 14px; }
    #shop-meta {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
      background: var(--line-soft); padding: 5px 12px; border-radius: 9999px;
    }
    #shop-meta span { font-size: 12.5px; font-weight: 500; color: var(--chip-text); }
    #shop-bio {
      font-size: 14.5px; line-height: 1.6; color: var(--bio);
      margin: 14px auto 0; max-width: 440px;
    }

    /* About the baker / Store policies — plain expandable rows, no card. */
    #profile-extras { max-width: 440px; margin: 4px auto 0; text-align: left; }
    .profile-sub { border-top: 1px solid var(--line); }
    .profile-sub-head {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: none; border: none; cursor: pointer; padding: 14px 0;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    }
    .profile-sub-head .ind { font-size: 10px; transition: transform .15s ease; }
    .profile-sub.open .profile-sub-head .ind { transform: rotate(180deg); }
    .profile-sub-body { max-height: 0; overflow: hidden; transition: max-height .2s ease-out; }
    .profile-sub.open .profile-sub-body { max-height: 600px; padding-bottom: 16px; }
    .profile-about-inner { display: flex; gap: 14px; align-items: flex-start; }
    .about-portrait { width: 60px; height: 76px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--line-soft); }
    .profile-sub p { font-size: 13.5px; line-height: 1.65; color: var(--bio); }
    .about-signature { font-style: italic; font-size: 13.5px; margin-top: 8px; color: var(--ink); }

    /* ══════════════════════ Filter strip — white band ══════════════════ */
    #filter-strip { background: var(--surface); border-bottom: 1px solid var(--line); }
    #filter-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px;
      justify-content: center; scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; padding: 8px 16px; border-radius: 9999px; border: 1.5px solid var(--line);
      background: var(--bg); color: var(--ink); cursor: pointer;
      font-family: var(--sans); font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .filter-chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* ══════════════════════ Section nav — circular avatar row ══════════
       Full-width, horizontally scrollable — Menu (pinned first) + Courses
       (auto, if any digital listings) + one per distinct baker_links
       section, each shown as a photo circle + label underneath rather than
       a flat pill tab. */
    #section-nav-wrap { background: var(--surface); padding: 16px 0 4px; }
    #section-nav {
      display: flex; gap: 18px; overflow-x: auto; padding: 0 20px 8px;
      scrollbar-width: none;
      /* On a full-viewport-width bar, keep the tab row itself aligned with
         the same centered column as the rest of the content below it. */
      max-width: 720px; margin: 0 auto;
    }
    #section-nav::-webkit-scrollbar { display: none; }
    .section-tab {
      flex-shrink: 0; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer; font-family: var(--sans);
    }
    .section-tab .circle {
      width: 56px; height: 56px; border-radius: 50%; overflow: hidden; position: relative;
      background: var(--line-soft); border: 2px solid transparent;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .section-tab.active .circle { border-color: var(--accent); }
    .section-tab .circle img { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; inset: 0; }
    .section-tab .label {
      font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap;
      max-width: 64px; overflow: hidden; text-overflow: ellipsis;
    }
    .section-tab.active .label { color: var(--ink); }

    /* ══════════════════════ Links feed ══════════════════════ */
    #links-feed { background: var(--surface); padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
    .link-row {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px;
      background: var(--bg); text-decoration: none; cursor: pointer;
    }
    .link-row .circle {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--line-soft);
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--muted);
    }
    .link-row .label { font-size: 14.5px; font-weight: 600; color: var(--ink); flex: 1; }
    .link-row .arrow { color: var(--muted); font-size: 14px; }

    /* ══════════════════════ Product Grid ══════════════════════
       Matches the app's own Market (listings) card exactly: photo with an
       overlaid kind badge, name + availability, a divider, then price +
       action on their own row — not an invented layout. The baker's
       chosen background pattern shows behind these cards (theme.js's
       #theme-pattern-layer). */
    #feed { background: var(--surface); padding: 18px 20px 8px; }
    #product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .p-card {
      cursor: pointer; background: var(--surface); border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 5px rgba(36,23,18,.08);
    }
    .p-card .p-photo { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--bg); }
    .p-card .p-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .p-badge {
      position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 9999px; color: #fff;
    }
    .p-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; }
    .p-body { padding: 10px 12px 11px; }
    .p-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
    .p-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .p-divider { border-top: 1px solid var(--line); margin-top: 9px; padding-top: 8px; }
    .p-price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .p-price { font-size: 13.5px; font-weight: 700; color: var(--accent); }
    .p-price .from { font-size: 9.5px; font-weight: 400; color: var(--muted); display: block; }

    .add-btn, .qty-stepper { height: 32px; flex-shrink: 0; }
    .add-btn {
      width: 32px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-fg);
      font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .qty-stepper {
      display: flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 9999px; overflow: hidden;
      animation: popIn .16s ease-out;
    }
    .qty-stepper button {
      width: 26px; height: 100%; border: none; background: transparent; color: var(--ink);
      font-size: 14px; cursor: pointer;
    }
    .qty-stepper .qty { font-size: 12px; padding: 0 2px; color: var(--ink); min-width: 12px; text-align: center; }
    @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }

    /* ══════════════════════ Good To Know / FAQ ══════════════════════ */
    #info-section { background: var(--surface); max-width: 440px; margin: 0 auto; padding: 8px 20px 30px; display: flex; flex-direction: column; gap: 6px; }
    #info-section h2 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
    .faq-row { border-bottom: 1px solid var(--line); }
    .faq-row:last-child { border-bottom: none; }
    .faq-q {
      width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between;
      background: none; border: none; text-align: left; cursor: pointer; padding: 10px 0;
      font-size: 14.5px; font-weight: 600; color: var(--ink);
    }
    .faq-q .ind { color: var(--muted); font-size: 18px; }
    .faq-a { max-height: 0; overflow: hidden; transition: max-height .2s ease-out; }
    .faq-a p { font-size: 13.5px; line-height: 1.7; color: var(--bio); padding-bottom: 14px; }
    .faq-row.open .faq-a { max-height: 400px; }

    #hours-card { border-top: 1px solid var(--line); padding-top: 14px; }
    #hours-card .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    #hours-card .day { color: var(--muted); }
    #hours-card .time { color: var(--ink); }

    /* ══════════════════════ Footer ══════════════════════ */
    #site-footer { background: var(--surface); padding: 20px 20px 120px; text-align: center; }
    #footer-contact { font-size: 12.5px; line-height: 1.7; color: var(--muted); }
    #footer-contact a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    #footer-credit { margin-top: 18px; font-size: 12px; color: var(--muted); }
    #footer-credit a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

    /* ══════════════════════ Fixed Bottom Bar — only ever shows once the
       cart has something in it; an empty-cart CTA here would just repeat
       the page itself. ══════════════════════ */
    #action-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    }
    #action-bar-cart {
      display: none; align-items: center; justify-content: space-between; height: 56px;
      background: var(--accent); color: var(--accent-fg); border-radius: 9999px; padding: 0 8px 0 20px; cursor: pointer;
      border: none; width: 100%; box-shadow: 0 10px 30px -8px rgba(0,0,0,.35);
      animation: popIn .18s ease-out;
    }
    #action-bar-cart .l { text-align: left; }
    #action-bar-cart .l .t { font-size: 14.5px; font-weight: 700; }
    #action-bar-cart .l .s { font-size: 11px; color: var(--accent-fg); opacity: .75; margin-top: 2px; }
    #action-bar-cart .r {
      font-size: 14px; font-weight: 700; background: var(--surface); color: var(--ink);
      border-radius: 9999px; padding: 10px 16px;
    }

    /* ══════════════════════ Sheets / Modal / Toast ══════════════════════ */
    .scrim {
      position: fixed; inset: 0; background: rgba(20,15,10,.55); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .scrim.open { display: flex; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 480px; max-height: 90%; overflow: auto;
      border-radius: 24px 24px 0 0; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
      animation: riseIn .22s ease-out;
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sheet-close {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(20,15,10,.5); color: #fff; border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 9999px; border: none; cursor: pointer; font-weight: 700; font-size: 15px;
      text-decoration: none; font-family: var(--sans);
    }
    .btn-primary { height: 50px; background: var(--accent); color: var(--accent-fg); }
    .btn-outline { height: 48px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

    #item-sheet-photo { position: relative; aspect-ratio: 4/3; background: var(--line-soft); }
    #item-sheet-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    #item-sheet-body { padding: 18px 20px 22px; }
    #item-sheet-name { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 10px; }
    #item-sheet-price { font-size: 17px; font-weight: 700; color: var(--accent); margin-top: 4px; }
    #item-sheet-desc { font-size: 14px; line-height: 1.7; color: var(--bio); margin-top: 12px; }
    .spec-list { margin-top: 14px; }
    .spec-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 7px 0; border-top: 1px solid var(--line); color: var(--muted); }
    .spec-row b { color: var(--ink); font-weight: 600; }
    #item-sheet-body .btn { width: 100%; height: 50px; margin-top: 18px; }

    #cart-sheet-body { padding: 18px 20px 24px; }
    #cart-step-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin-bottom: 8px; }
    .cart-line { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cart-line .thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--line-soft); flex-shrink: 0; overflow: hidden; }
    .cart-line .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-line .info { flex: 1; min-width: 0; }
    .cart-line .info .n { font-size: 14px; font-weight: 600; color: var(--ink); }
    .cart-line .info .m { font-size: 11px; color: var(--muted); }
    .cart-line .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 9999px; height: 36px; }
    .cart-line .stepper button { width: 28px; height: 100%; border: none; background: none; font-size: 15px; cursor: pointer; color: var(--ink); }
    .cart-line .stepper .qty { font-size: 12px; min-width: 16px; text-align: center; }
    .cart-line .total { font-size: 13px; color: var(--ink); width: 56px; text-align: right; }

    .cart-financial-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--bio); }
    .cart-financial-row.total { font-weight: 700; color: var(--ink); font-size: 16px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
    .cart-note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 10px; }

    .field { margin-top: 12px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 14px;
    }

    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 9999px; font-size: 13px;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .avatar {
      border-radius: 50%; background: var(--theme-secondary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; overflow: hidden; position: relative;
      box-shadow: 0 2px 6px rgba(36,23,18,.15);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }

    /* ══════════════════════ Desktop ══════════════════════ */
    @media (min-width: 860px) {
      /* Stands the column off the patterned backdrop showing in the side
         margins — on mobile the shell fills the viewport edge to edge, so
         there's no backdrop to separate from and no shadow needed there. */
      #page-shell { box-shadow: 0 8px 40px rgba(20,15,10,.14); }

      /* Header image + section nav break out of the shell's 720px column to
         span the true viewport width — everything else (profile info, feed,
         links, about/policies) stays in the centered column. As the window
         grows, the header/nav keep stretching edge to edge while the
         content column itself stays put in the middle. */
      #storefront-header, #section-nav-wrap {
        width: 100vw; position: relative; left: 50%; margin-left: -50vw;
      }
      /* Uncapped, a 21:9 band at true viewport width gets absurdly tall on
         a wide desktop screen — cap it and keep the crop centered. */
      #storefront-header { max-height: 380px; }
      #storefront-header img { object-position: center; }

      #info-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: none; }
      #product-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
      .p-card:hover .p-photo { opacity: .92; }

      #action-bar { display: none; }
      #desktop-cart-btn { display: flex !important; }
      #cart-btn { display: none; }

      .scrim { align-items: center; }
      #item-sheet, #cart-sheet { max-width: 800px; width: 90%; border-radius: 24px; max-height: 88vh; }
      #item-sheet-inner { display: grid; grid-template-columns: 1fr 1fr; }
      #item-sheet-photo { aspect-ratio: auto; height: 100%; }

      #cart-sheet { max-width: 440px; margin-left: auto; margin-right: 0; height: 100%; max-height: 100%; border-radius: 0; box-shadow: -20px 0 50px -20px rgba(0,0,0,.4); }
      .scrim:has(#cart-sheet) { justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div id="page-shell">

<header id="site-header">
  <button class="circle-btn" id="share-btn" aria-label="Share">
    <svg width="16" height="19" viewBox="0 0 17 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8.5 1V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M4.5 5L8.5 1L12.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1.5 9V17.5C1.5 18.3284 2.17157 19 3 19H14C14.8284 19 15.5 18.3284 15.5 17.5V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <span id="footer-copy"></span> · <a href="https://bakeriapp.com">bakeriapp.com</a> · <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
  </div>

<div id="action-bar">
  <button id="action-bar-cart">
    <div class="l">
      <div class="t">Checkout</div>
      <div class="s" id="cart-bar-sub"></div>

    </div>
    <div id="cart-sheet-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STORAGE_URL  = SUPABASE_URL + '/storage/v1/object/public';

  const params  = new URLSearchParams(window.location.search);
  const slug    = (params.get('slug') || '').trim().toLowerCase();
  const bakerID = (params.get('id')   || '').trim();
  const isCleanRedirect = params.get('clean') === '1';

  const WEEKDAY_LABELS = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };
  const WEEKDAY_ORDER  = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  const FILTERS = [
    { key: 'all',     label: 'All' },
    { key: 'now',     label: 'Ready Now' },
    { key: 'pre',     label: 'Pre-order' },
    { key: 'custom',  label: 'Custom' }
  ];

  let profile = null;
  let allListings = [];
  let allLinks = [];
  let resolvedBakerId = bakerID;
  let tab = 'all';
  let sectionTab = 'menu'; // 'menu' | 'courses' | a baker_links section name
  let cart = {}; // { itemId: qty }
  let cartStep = 0; // 0 order, 1 pickup&payment, 2 confirmed
  let toastTimer = null;
  // Direct checkout (ready_now / preorder) needs the baker's Stripe Connect
  // payout wired up; custom-quote inquiries don't touch payment at intake
  // time (submit-custom-order-inquiry lands a pending_quote lead), so those
  // stay open even before onboarding finishes.
  let stripeReady = false;

  // ── Cart persistence — keyed per baker so a visitor's cart from one
  // storefront never bleeds into another's. ──
  function cartStorageKey() { return 'bakeri_cart_' + resolvedBakerId; }
  function loadCart() {
    try { cart = JSON.parse(sessionStorage.getItem(cartStorageKey()) || '{}'); } catch (e) { cart = {}; }
  }
  function saveCart() {
    try { sessionStorage.setItem(cartStorageKey(), JSON.stringify(cart)); } catch (e) {}
  }

  if (!slug && !bakerID) {
    showNotFound('No baker specified', 'This link appears to be invalid.');
    return;
  }

  const rpcName = slug ? 'get_baker_web_profile_by_slug' : 'get_baker_web_profile_by_id';
  const rpcBody = slug ? { p_slug: slug } : { p_user_id: bakerID };

  fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpcName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify(rpcBody)
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data || !data.profile) { showNotFound('Baker not found', 'No baker found at this link.'); return; }
    profile = data.profile;
    resolvedBakerId = profile.id;
    loadCart();
    if (window.BakeriTheme) window.BakeriTheme.apply(profile);
    render(profile, data.listings || [], data.faqs || [], data.links || []);
    if (isCleanRedirect && slug && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '/' + slug);
    }
  })
  .catch(function () { showNotFound('Something went wrong', 'Could not load this profile. Try again later.'); });

  // ══════════════════════ Render ══════════════════════

  function render(profile, listings, faqs, links) {
    allListings = listings;
    allLinks = links;
    const name = profile.business_name || profile.user_name || 'Baker';
    const location = profile.neighbourhood
      ? [profile.neighbourhood, profile.pickup_province].filter(Boolean).join(', ')
      : [profile.pickup_city, profile.pickup_province].filter(Boolean).join(', ') || profile.location || '';

    document.title = name + ' on Bakeri';
    document.querySelector('meta[name="description"]').content = name + ' — handcrafted bakes on Bakeri. ' + (profile.bio || '');

    stripeReady = profile.stripe_connect_onboarding_complete === true;

    renderAvatar(name);
    renderHeaderImage(name);

    document.getElementById('shop-name').textContent = name;
    if (location) {
      document.getElementById('shop-meta-text').textContent = location;
      document.getElementById('shop-meta').classList.remove('hidden');
    }

    if (profile.bio) {
      document.getElementById('shop-bio').textContent = profile.bio;
      document.getElementById('shop-bio').classList.remove('hidden');
    }

    renderHours(profile.pickup_hours_json);
    renderAboutAndPolicies(profile, name);
    renderFAQ(faqs);
    renderFooter(profile, name);

    document.getElementById('share-btn').addEventListener('click', shareLink);

    renderSectionNav();
    applySectionTab();
    updateCartUI();

    document.getElementById('cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('desktop-cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('action-bar-cart').addEventListener('click', openCartSheet);
    document.getElementById('item-sheet-close').addEventListener('click', closeItemSheet);
    document.getElementById('cart-sheet-close').addEventListener('click', closeCartSheet);
    document.getElementById('item-scrim').addEventListener('click', function (e) { if (e.target === this) closeItemSheet(); });
    document.getElementById('cart-scrim').addEventListener('click', function (e) { if (e.target === this) closeCartSheet(); });
  }

  function renderAvatar(name) {
    const logoURL = STORAGE_URL + '/business-logos/' + resolvedBakerId.toUpperCase() + '/logo.jpg';
    const initial = name.charAt(0).toUpperCase();
    const el = document.getElementById('pb-avatar');
    const letterEl = document.getElementById('pb-avatar-letter');
    letterEl.textContent = initial;
    const img = document.createElement('img');
    img.alt = name;
    img.onload = function () { img.style.display = 'block'; letterEl.style.display = 'none'; };
    img.src = logoURL;
    el.appendChild(img);
  }

  // Falls back to the plain gradient already set on #storefront-header if
  // the baker hasn't uploaded one — same onerror-hide convention as the
  // about-portrait image.
  // No banner uploaded → the whole band collapses (display:none), not a
  // decorative gradient placeholder — a display:none element's negative
  // margin-bottom doesn't apply either, so the avatar overlap cancels
  // automatically and the profile block falls back to its plain centered
  // layout, same as before this feature existed.
  function renderHeaderImage(name) {
    const header = document.getElementById('storefront-header');
    const img = document.getElementById('header-img');
    img.alt = name;
    img.onerror = function () { header.classList.add('hidden'); };
    img.onload = function () { header.classList.remove('hidden'); img.style.display = 'block'; };
    img.src = STORAGE_URL + '/storefront-headers/' + resolvedBakerId.toUpperCase() + '/header.jpg';
  }

  // Only renders if the baker has actually configured hours in the app (the
  // Pickup & Hours editor) — an untouched profile has an empty object, and
  // showing a fake "closed every day" table would be worse than showing
  // nothing at all.
  function renderHours(hoursJSON) {
    // The native "Pickup & Hours" editor always encodes all 7 days (every
    // unedited day defaults to closed:true) — so a key merely existing
    // doesn't mean the baker actually set anything. Only treat this as
    // "configured" once at least one day is explicitly marked open.
    const hasHours = hoursJSON && WEEKDAY_ORDER.some(function (k) { return hoursJSON[k] && hoursJSON[k].closed === false; });
    if (!hasHours) {
      document.getElementById('hours-card').classList.add('hidden');
      updateInfoSectionVisibility();
      return;
    }
    document.getElementById('hours-card').classList.remove('hidden');
    updateInfoSectionVisibility();
    const rowsHTML = WEEKDAY_ORDER.map(function (key) {
      const day = hoursJSON[key];
      const label = WEEKDAY_LABELS[key];
      const time = (!day || day.closed) ? 'Closed' : (day.open + '–' + day.close);
      return '<div class="row"><span class="day">' + label + '</span><span class="time">' + time + '</span></div>';
    }).join('');
    document.getElementById('hours-rows').innerHTML = rowsHTML;
    // A link back up to the one place hours actually live, not a second
    // copy of the same data.
    const footerContact = document.getElementById('footer-contact');
    footerContact.innerHTML = '<a href="#hours-card">See pickup hours ↑</a>';
    footerContact.classList.remove('hidden');
  }

  // About the baker + Store policies fold into the profile block itself,
  // as collapsed disclosure rows — independently no-ops if the baker hasn't
  // filled in that field.
  function renderAboutAndPolicies(profile, name) {
    if (profile.about_story) {
      document.getElementById('pb-about').classList.remove('hidden');
      document.getElementById('pb-about-text').textContent = profile.about_story;
      document.getElementById('pb-about-signature').textContent = '— ' + name;
      const img = document.getElementById('pb-about-portrait');
      img.alt = name;
      img.onerror = function () { img.style.display = 'none'; };
      img.src = STORAGE_URL + '/baker-portraits/' + resolvedBakerId.toUpperCase() + '/portrait.jpg';
    }
    if (profile.store_policies) {
      document.getElementById('pb-policies').classList.remove('hidden');
      document.getElementById('pb-policies-text').textContent = profile.store_policies;
    }

    document.querySelectorAll('.profile-sub .profile-sub-head').forEach(function (btn) {
      btn.addEventListener('click', function () { btn.closest('.profile-sub').classList.toggle('open'); });
    });
  }

  // #info-section holds both the FAQ column and the hours card — each
  // self-hides independently (checked again after renderHours), and the
  // whole section only hides if neither has anything to show.
  function updateInfoSectionVisibility() {
    const hasFAQ = !document.getElementById('faq-col').classList.contains('hidden');
    const hasHours = !document.getElementById('hours-card').classList.contains('hidden');
    document.getElementById('info-section').classList.toggle('hidden', !hasFAQ && !hasHours);
  }

  function renderFAQ(faqs) {
    if (!faqs || faqs.length === 0) {
      document.getElementById('faq-col').classList.add('hidden');
      updateInfoSectionVisibility();
      return;
    }
    document.getElementById('faq-col').classList.remove('hidden');
    updateInfoSectionVisibility();
    const list = document.getElementById('faq-list');
    list.innerHTML = '';
    faqs.forEach(function (faq, i) {
      const row = document.createElement('div');
      row.className = 'faq-row' + (i === 0 ? ' open' : '');
      row.innerHTML =
        '<button class="faq-q"><span>' + escapeHtml(faq.question) + '</span><span class="ind">' + (i === 0 ? '−' : '+') + '</span></button>' +
        '<div class="faq-a"><p>' + escapeHtml(faq.answer) + '</p></div>';
      row.querySelector('.faq-q').addEventListener('click', function () {
        const willOpen = !row.classList.contains('open');
        list.querySelectorAll('.faq-row').forEach(function (r) {
          r.classList.remove('open');
          r.querySelector('.ind').textContent = '+';
        });
        if (willOpen) {
          row.classList.add('open');
          row.querySelector('.ind').textContent = '−';
        }
      });
      list.appendChild(row);
    });
  }

  function renderFooter(profile, name) {
    document.getElementById('footer-copy').textContent = '© ' + new Date().getFullYear() + ' ' + name;
  }

  // ══════════════════════ Section Nav (Menu / Courses / Links) ══════════
  // Top-level: Menu (pinned first, everything sellable except digital
  // goods) + Courses (auto-added only if any digital listings exist) + one
  // tab per distinct baker_links section, in first-seen order. Today's
  // Ready-Now/Pre-order/Custom chips live one level deeper, inside Menu only.

  function menuListings() { return allListings.filter(function (l) { return l.listing_kind !== 'digital'; }); }
  function courseListings() { return allListings.filter(function (l) { return l.listing_kind === 'digital'; }); }

  function linkSections() {
    const seen = [];
    allLinks.forEach(function (l) {
      if (l.section && seen.indexOf(l.section) === -1) seen.push(l.section);
    });
    return seen;
  }

  function sectionTabs() {
    const tabs = [{ key: 'menu', label: 'Menu' }];
    if (courseListings().length > 0) tabs.push({ key: 'courses', label: 'Courses' });
    linkSections().forEach(function (s) { tabs.push({ key: 'link:' + s, label: s }); });
    return tabs;
  }

  // A representative photo for a tab's circle — first item's photo for
  // Menu/Courses, first link's own section has no baker-uploaded image (the
  // links table is plain url/label), so those get a plain icon instead.
  function sectionTabThumb(t) {
    if (t.key === 'menu') { const first = menuListings()[0]; return first ? itemImgURL(first) : null; }
    if (t.key === 'courses') { const first = courseListings()[0]; return first ? itemImgURL(first) : null; }
    return null;
  }

  function renderSectionNav() {
    const wrap = document.getElementById('section-nav-wrap');
    const tabs = sectionTabs();
    if (tabs.length <= 1) { wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    const nav = document.getElementById('section-nav');
    nav.innerHTML = '';
    tabs.forEach(function (t) {
      const btn = document.createElement('button');
      btn.className = 'section-tab' + (t.key === sectionTab ? ' active' : '');
      btn.dataset.key = t.key;
      const thumbURL = sectionTabThumb(t);
      const icon = t.key === 'courses' ? '📚' : (t.key.indexOf('link:') === 0 ? '🔗' : '🧁');
      btn.innerHTML =
        '<span class="circle">' + (thumbURL ? '' : icon) +
          (thumbURL ? '<img alt="" src="' + thumbURL + '" onload="this.style.display=\'block\'" onerror="this.style.display=\'none\'" />' : '') +
        '</span>' +
        '<span class="label">' + escapeHtml(t.label) + '</span>';
      btn.addEventListener('click', function () { setSectionTab(t.key); });
      nav.appendChild(btn);
    });
  }

  function setSectionTab(key) {
    sectionTab = key;
    document.querySelectorAll('.section-tab').forEach(function (b) { b.classList.toggle('active', b.dataset.key === key); });
    applySectionTab();
  }

  function applySectionTab() {
    const isLinkTab = sectionTab.indexOf('link:') === 0;
    document.getElementById('filter-strip').classList.toggle('hidden', sectionTab !== 'menu');
    document.getElementById('feed').classList.toggle('hidden', isLinkTab);
    document.getElementById('links-feed').classList.toggle('hidden', !isLinkTab);
    if (isLinkTab) {
      renderLinksFeed(sectionTab.slice('link:'.length));
    } else {
      renderFilterBar();
      renderGrid();
    }
  }

  function renderLinksFeed(section) {
    const feed = document.getElementById('links-feed');
    const items = allLinks.filter(function (l) { return l.section === section; });
    if (items.length === 0) {
      feed.innerHTML = '<div class="empty-state">No links in this section yet.</div>';
      return;
    }
    feed.innerHTML = items.map(function (l) {
      return '<a class="link-row" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="circle">🔗</span>' +
        '<span class="label">' + escapeHtml(l.label) + '</span>' +
        '<span class="arrow">→</span>' +
      '</a>';
    }).join('');
  }

  // ══════════════════════ Filter / Feed (within Menu) ══════════════════

  function listingsForTab(t) {
    if (t === 'all') return menuListings();
    const kind = t === 'now' ? 'ready_now' : (t === 'pre' ? 'preorder' : 'custom');
    return menuListings().filter(function (l) { return l.listing_kind === kind; });
  }

  function renderFilterBar() {
    const bar = document.getElementById('filter-bar');
    if (sectionTab !== 'menu' || menuListings().length === 0) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    bar.innerHTML = FILTERS.map(function (f) {
      return '<button class="filter-chip' + (f.key === tab ? ' active' : '') + '" data-tab="' + f.key + '">' + f.label + '</button>';
    }).join('');
    bar.querySelectorAll('.filter-chip').forEach(function (btn) {
      btn.addEventListener('click', function () { setTab(btn.dataset.tab); });
    });
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('.filter-chip').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('product-grid');
    const listings = sectionTab === 'courses' ? courseListings() : listingsForTab(tab);
    const emptyMessage = sectionTab === 'courses' ? 'No courses listed yet.' : 'No items listed yet.';
    if (allListings.length === 0) {
      grid.innerHTML = '<div class="empty-state">' + emptyMessage + '</div>';
      return;
    }
    if (listings.length === 0) {
      grid.innerHTML = '<div class="empty-state">No items in this category.</div>';
      return;
    }
    grid.innerHTML = '';
    listings.forEach(function (item) {
      grid.appendChild(buildCard(item));
    });
  }

  function buildCard(item) {
    const card = document.createElement('div');
    card.className = 'p-card';
    card.addEventListener('click', function () { openItemSheet(item); });

    const photo = document.createElement('div');
    photo.className = 'p-photo';
    photo.appendChild(photoFallback(item));
    const img = document.createElement('img');
    img.alt = item.name;
    img.onload = function () { img.style.display = 'block'; };
    img.src = itemImgURL(item);
    photo.appendChild(img);

    // Plain kind badge overlaid on the photo — matches the app's own
    // Market listing card exactly (a sold-out ready_now item keeps its
    // normal badge, distinguished only by the lighter meta text below).
    const kind = kindBadgeInfo(item);
    const badge = document.createElement('div');
    badge.className = 'p-badge';
    badge.style.background = kind.bg;
    badge.innerHTML = '<span class="dot"></span>' + kind.label;
    photo.appendChild(badge);

    const body = document.createElement('div');
    body.className = 'p-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'p-name';
    nameEl.textContent = item.name;
    const metaEl = document.createElement('div');
    metaEl.className = 'p-meta';
    metaEl.textContent = subtitleFor(item);

    const divider = document.createElement('div');
    divider.className = 'p-divider';
    const priceRow = document.createElement('div');
    priceRow.className = 'p-price-row';
    const priceEl = document.createElement('div');
    priceEl.className = 'p-price tabular';
    priceEl.innerHTML = priceIsFrom(item) ? '<span class="from">from</span>$' + formatPrice(item.price) : '$' + formatPrice(item.price);
    priceRow.appendChild(priceEl);
    priceRow.appendChild(buildAddControl(item));
    divider.appendChild(priceRow);

    body.appendChild(nameEl);
    body.appendChild(metaEl);
    body.appendChild(divider);
    card.appendChild(photo);
    card.appendChild(body);
    return card;
  }

  function buildAddControl(item) {
    const wrap = document.createElement('div');
    wrap.dataset.itemId = item.id;
    refreshAddControl(wrap, item);
    return wrap;
  }

  function refreshAddControl(wrap, item) {
    wrap.innerHTML = '';
    if (item.listing_kind === 'custom') {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '→';
      btn.setAttribute('aria-label', 'Request a custom order');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        window.location.href = customOrderURL(item);
      });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'digital') {
      // Digital purchases skip the pickup cart entirely — a solo Buy &
      // Download flow, not qty+cart.
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '→';
      btn.setAttribute('aria-label', 'Buy & download');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        window.location.href = digitalCheckoutURL(item);
      });
      wrap.appendChild(btn);
      return;
    }
    const qty = cart[item.id] || 0;
    if (isSoldOut(item) || !stripeReady) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.style.opacity = '.4'; btn.disabled = true;
      btn.textContent = '—';
      btn.title = stripeReady ? 'Sold out for today' : 'Ordering isn\'t live yet';
      wrap.appendChild(btn);
      return;
    }
    if (qty === 0) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '+';
      btn.setAttribute('aria-label', 'Add to order');
      btn.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      wrap.appendChild(btn);
    } else {
      const stepper = document.createElement('div');
      stepper.className = 'qty-stepper';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, -1); });
      const qtyEl = document.createElement('span');
      qtyEl.className = 'qty';
      qtyEl.textContent = qty;
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
      wrap.appendChild(stepper);
    }
  }

  function changeQty(item, delta) {
    const current = cart[item.id] || 0;
    const next = Math.max(0, current + delta);
    if (next === 0) { delete cart[item.id]; } else { cart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateCartUI();
  }

  function updateCartUI() {
    const count = Object.values(cart).reduce(function (s, q) { return s + q; }, 0);
    document.getElementById('cart-btn-count').textContent = count > 0 ? count : '';
    const total = cartSubtotal();
    document.getElementById('desktop-cart-label').textContent = count > 0 ? ('Cart · ' + count) : 'Cart';

    if (count > 0) {
      document.getElementById('action-bar-cart').style.display = 'flex';
      document.getElementById('cart-bar-sub').textContent = count + (count === 1 ? ' item' : ' items') +
        (profile && profile.pickup_city ? ' · pickup in ' + profile.pickup_city : ' · pickup');
      document.getElementById('cart-bar-total').textContent = '$' + formatPrice(total);
    } else {
      document.getElementById('action-bar-cart').style.display = 'none';
    }
  }

  function cartLines() {
    return Object.keys(cart).map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? { item: item, qty: cart[id] } : null;
    }).filter(Boolean);
  }

  function cartSubtotal() {
    return cartLines().reduce(function (sum, l) { return sum + l.item.price * l.qty; }, 0);
  }

  // ══════════════════════ Item Sheet ══════════════════════

  function openItemSheet(item) {
    document.getElementById('item-sheet-name').textContent = item.name;
    document.getElementById('item-sheet-price').innerHTML = (priceIsFrom(item) ? 'from ' : '') + '$' + formatPrice(item.price);
    document.getElementById('item-sheet-desc').textContent = item.item_description || '';

    // Sold-out-aware badge — the one place a "Sold Out" label appears,
    // matching the app's dedicated item-detail treatment rather than
    // swapping the grid's badge (which stays the plain kind label there).
    const badge = badgeInfo(item);
    const badgeEl = document.getElementById('item-sheet-badge');
    badgeEl.style.background = badge.bg;
    badgeEl.innerHTML = '<span class="dot"></span>' + badge.label;

    const ph = document.getElementById('item-sheet-ph');
    ph.textContent = categoryEmoji(item.category);
    ph.style.display = 'flex';
    const img = document.getElementById('item-sheet-img');
    img.style.display = 'none';
    img.onload = function () { img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);

    const specs = [];
    if (item.lead_time_note) specs.push({ k: 'Lead time', v: item.lead_time_note });
    if (item.allergens) specs.push({ k: 'Allergens', v: item.allergens });
    document.getElementById('item-sheet-specs').innerHTML = specs.map(function (s) {
      return '<div class="spec-row"><span>' + s.k + '</span><b>' + escapeHtml(s.v) + '</b></div>';
    }).join('');

    const cta = document.getElementById('item-sheet-cta');
    if (item.listing_kind === 'custom') {
      cta.textContent = 'Request a Custom Order';
      cta.disabled = false;
      cta.style.opacity = '1';
      cta.onclick = function () { window.location.href = customOrderURL(item); };
    } else if (item.listing_kind === 'digital') {
      cta.textContent = 'Buy & Download — $' + formatPrice(item.price);
      cta.disabled = !stripeReady;
      cta.style.opacity = stripeReady ? '1' : '.5';
      cta.onclick = stripeReady ? function () { window.location.href = digitalCheckoutURL(item); } : null;
    } else if (isSoldOut(item)) {
      cta.textContent = 'Sold Out';
      cta.disabled = true;
      cta.style.opacity = '.5';
    } else if (!stripeReady) {
      cta.textContent = 'Ordering Opens Soon';
      cta.disabled = true;
      cta.style.opacity = '.5';
    } else {
      cta.textContent = 'Add to Order';
      cta.disabled = false;
      cta.style.opacity = '1';
      cta.onclick = function () {
        changeQty(item, 1);
        closeItemSheet();
        showToast('Added to your order');
      };
    }

    document.getElementById('item-scrim').classList.add('open');
  }
  function closeItemSheet() { document.getElementById('item-scrim').classList.remove('open'); }

  // ══════════════════════ Cart / Checkout Sheet ══════════════════════

  function openCartSheet() {
    cartStep = 0;
    renderCartSheet();
    document.getElementById('cart-scrim').classList.add('open');
  }
  function closeCartSheet() { document.getElementById('cart-scrim').classList.remove('open'); }

  function renderCartSheet() {
    const body = document.getElementById('cart-sheet-body');
    if (cartStep === 0) body.innerHTML = renderCartStepOrder();
    else if (cartStep === 1) body.innerHTML = renderCartStepPickup();
    else body.innerHTML = renderCartStepConfirmed();
    wireCartStepEvents();
  }

  function renderCartStepOrder() {
    const lines = cartLines();
    if (lines.length === 0) {
      return '<div id="cart-step-label">Your order</div>' +
        '<div class="empty-state">Your order is empty.</div>' +
        '<button class="btn btn-outline" id="cart-see-ready" style="width:100%;margin-top:12px;">Browse the menu</button>';
    }
    const rows = lines.map(function (l) {
      return '<div class="cart-line" data-line-id="' + l.item.id + '">' +
        '<div class="thumb"><img src="' + itemImgURL(l.item) + '" alt="" onerror="this.style.display=\'none\'" /></div>' +
        '<div class="info"><div class="n">' + escapeHtml(l.item.name) + '</div><div class="m">' + escapeHtml(subtitleFor(l.item)) + '</div></div>' +
        '<div class="stepper"><button class="line-minus">−</button><span class="qty">' + l.qty + '</span><button class="line-plus">+</button></div>' +
        '<div class="total tabular">$' + formatPrice(l.item.price * l.qty) + '</div>' +
        '</div>';
    }).join('');
    const subtotal = cartSubtotal();
    return '<div id="cart-step-label">Your order</div>' +
      rows +
      '<div class="cart-financial-row"><span>Subtotal</span><span class="tabular">$' + formatPrice(subtotal) + '</span></div>' +
      '<div class="cart-financial-row"><span>Pickup — no delivery fee</span><span class="tabular">$0.00</span></div>' +
      '<div class="cart-financial-row total"><span>Total</span><span class="tabular">$' + formatPrice(subtotal) + '</span></div>' +
      '<button class="btn btn-primary" id="cart-continue" style="width:100%;">Continue to pickup details</button>' +
      '<div class="cart-note">Pay in app · address emailed on confirmation</div>';
  }

  function renderCartStepPickup() {
    const hours = (profile && profile.pickup_hours_json) || {};
    const openDays = WEEKDAY_ORDER.filter(function (k) { return hours[k] && !hours[k].closed; });
    const windowOptions = openDays.length
      ? openDays.map(function (k) { return '<option>' + WEEKDAY_LABELS[k] + ' ' + hours[k].open + '–' + hours[k].close + '</option>'; }).join('')
      : '<option>By arrangement</option>';
    return '<div id="cart-step-label">Pickup &amp; payment</div>' +
      '<div class="field"><label>Pickup window</label><select id="f-window">' + windowOptions + '</select></div>' +
      '<div class="field"><label>Name</label><input id="f-name" type="text" autocomplete="name" /></div>' +
      '<div class="field"><label>Mobile</label><input id="f-phone" type="tel" autocomplete="tel" /></div>' +
      '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" /></div>' +
      '<div class="cart-financial-row total"><span>Total</span><span class="tabular">$' + formatPrice(cartSubtotal()) + '</span></div>' +
      '<div id="pay-error" style="color:var(--error);font-size:13px;margin-top:6px;"></div>' +
      '<button class="btn btn-primary" id="cart-pay" style="width:100%;">Pay $' + formatPrice(cartSubtotal()) + '</button>' +
      '<button class="btn" id="cart-back" style="width:100%;height:auto;padding:10px;text-decoration:underline;background:none;color:var(--muted);">Back to order</button>';
  }

  function renderCartStepConfirmed() {
    return '<div style="text-align:center;padding:20px 0;">' +
      '<div style="width:54px;height:54px;border-radius:50%;background:var(--ready);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto;">✓</div>' +
      '<div style="font-size:20px;font-weight:700;color:var(--ink);margin-top:16px;">Order confirmed</div>' +
      '<p style="font-size:14px;color:var(--bio);margin-top:10px;">The pickup address and window are in your email.</p>' +
      '<button class="btn btn-outline" id="cart-keep-shopping" style="width:100%;margin-top:20px;">Keep shopping</button>' +
      '</div>';
  }

  function wireCartStepEvents() {
    const seeReady = document.getElementById('cart-see-ready');
    if (seeReady) seeReady.addEventListener('click', function () { closeCartSheet(); });
    document.querySelectorAll('.line-minus, .line-plus').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.closest('.cart-line').dataset.lineId;
        const item = allListings.find(function (l) { return l.id === id; });
        changeQty(item, btn.classList.contains('line-plus') ? 1 : -1);
        renderCartSheet();
      });
    });
    const cont = document.getElementById('cart-continue');
    if (cont) cont.addEventListener('click', function () { cartStep = 1; renderCartSheet(); });
    const back = document.getElementById('cart-back');
    if (back) back.addEventListener('click', function () { cartStep = 0; renderCartSheet(); });
    const pay = document.getElementById('cart-pay');
    if (pay) pay.addEventListener('click', goToCheckout);
    const keep = document.getElementById('cart-keep-shopping');
    if (keep) keep.addEventListener('click', function () {
      cart = {}; saveCart(); updateCartUI(); closeCartSheet();
    });
  }

  // Hands the whole cart off to checkout.html as a sessionStorage payload —
  // avoids an unbounded query string for a multi-item order.
  function goToCheckout() {
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const errEl = document.getElementById('pay-error');
    if (!name || !phone || !email) {
      errEl.textContent = 'Please fill in your name, mobile and email.';
      return;
    }
    const payload = {
      baker: resolvedBakerId,
      theme: profile.selected_theme,
      pattern: profile.background_pattern,
      gstRegistered: profile.is_gst_registered ? '1' : '0',
      province: profile.pickup_province || '',
      customer: { name: name, phone: phone, email: email },
      items: cartLines().map(function (l) {
        return {
          id: l.item.id, name: l.item.name, qty: l.qty, price: l.item.price,
          taxCategory: l.item.tax_category, unitWeightGrams: l.item.unit_weight_grams,
          listingKind: l.item.listing_kind, dropDate: l.item.preorder_drop_date || '',
          maxQty: l.item.max_preorder_quantity || 0, availQty: l.item.available_qty_today || 0
        };
      })
    };
    sessionStorage.setItem('bakeri_checkout_cart', JSON.stringify(payload));
    window.location.href = '/baker/checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&theme=' + encodeURIComponent(profile.selected_theme || '') +
      '&pattern=' + encodeURIComponent(profile.background_pattern || '');
  }

  // ══════════════════════ Helpers ══════════════════════

  function shareLink() {
    const url = window.location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
    showToast('Link copied — ' + window.location.host + window.location.pathname);
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  function isSoldOut(item) {
    return item.listing_kind === 'ready_now' && (item.available_qty_today || 0) <= 0;
  }

  // Plain kind badge — used on grid cards. A sold-out ready_now item keeps
  // its normal "Ready Now" tag, distinguished only by lighter subtitle
  // text below (see subtitleFor) — swapping the tag itself in a dense
  // grid would read as a second, competing badge type.
  function kindBadgeInfo(item) {
    if (item.listing_kind === 'ready_now') return { bg: 'var(--ready)', label: 'Ready Now' };
    if (item.listing_kind === 'preorder')  return { bg: 'var(--preorder)', label: 'Pre-order' };
    if (item.listing_kind === 'digital')   return { bg: 'var(--digital)', label: 'Digital' };
    return { bg: 'var(--custom)', label: 'Custom' };
  }

  // Sold-out-aware badge — used only in the item detail sheet.
  function badgeInfo(item) {
    if (isSoldOut(item)) return { bg: 'var(--muted)', label: 'Sold Out' };
    return kindBadgeInfo(item);
  }

  function subtitleFor(item) {
    if (item.listing_kind === 'custom') return item.lead_time_note || 'Request a custom quote';
    if (item.listing_kind === 'digital') return 'Instant digital download';
    if (isSoldOut(item)) return 'Sold out for today';
    if (item.listing_kind === 'ready_now' && item.available_qty_today > 0) return item.available_qty_today + ' available today';
    if (item.listing_kind === 'preorder') return item.lead_time_note || 'Order ahead';
    return item.item_description || '';
  }

  function priceIsFrom(item) { return item.listing_kind === 'custom'; }
  function formatPrice(v) { return parseFloat(v).toFixed(2); }

  function photoFallback(item) {
    const ph = document.createElement('div');
    ph.className = 'ph-fallback';
    ph.style.position = 'absolute'; ph.style.inset = '0';
    ph.textContent = categoryEmoji(item.category);
    return ph;
  }

  function itemImgURL(item) {
    return STORAGE_URL + '/menu-item-images/' + resolvedBakerId.toUpperCase() + '/' + item.id.toUpperCase() + '.jpg';
  }

  function customOrderURL(item) {
    return '/baker/custom-order.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&item=' + encodeURIComponent(item.id) +
      '&form=' + encodeURIComponent(item.intake_form_id || '') +
      '&name=' + encodeURIComponent(item.name) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  function digitalCheckoutURL(item) {
    return '/baker/digital-checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&item=' + encodeURIComponent(item.id) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  function categoryEmoji(cat) {
    const map = {
      'Cakes': '🎂', 'Cookies': '🍪', 'Bread': '🍞', 'Pastries': '🥐',
      'Cupcakes': '🧁', 'Pies': '🥧', 'Donuts': '🍩', 'Macarons': '🫶',
      'Muffins': '🧁', 'Bars': '🍫'
    };
    return map[cat] || '🍰';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function showNotFound(title, subtitle) {
    document.body.innerHTML = '<div class="empty-state"><h2 style="color:var(--ink);margin-bottom:8px;font-size:18px;">' + escapeHtml(title) + '</h2><p>' + escapeHtml(subtitle) + '</p></div>';
  }
})();
</script>
</body>
</html>
