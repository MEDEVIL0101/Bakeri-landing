<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri</title>
  <meta name="description" content="View this baker's profile on Bakeri." />
  <link rel="icon" href="../1024.png" />
  <link rel="apple-touch-icon" href="../1024.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream:    #FAF5EE;
      --cream-2:  #F3EAD8;
      --cream-3:  #E9DAC4;
      --ink:      #1A0808;
      --ink-2:    #3A1212;
      --muted:    #8C7B6E;
      --gold:     #C9963A;
      --gold-lt:  #E5BB74;
      --display:  'Playfair Display', Georgia, serif;
      --sans:     'Nunito', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 8px 40px rgba(26,8,8,0.10), 0 2px 8px rgba(26,8,8,0.06);
      padding: 48px 36px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .wordmark {
      font-family: var(--display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
      margin-bottom: 32px;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--cream-2);
      border: 2px solid var(--cream-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-size: 2rem;
      color: var(--muted);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .handle {
      font-family: var(--sans);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .tagline {
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .btn-primary {
      display: block;
      width: 100%;
      background: var(--ink);
      color: #fff;
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 700;
      padding: 15px 24px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s, transform 0.12s;
      margin-bottom: 12px;
    }
    .btn-primary:hover { background: #3a1212; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 0.92rem;
      font-weight: 600;
      padding: 13px 24px;
      border-radius: 50px;
      border: 1.5px solid var(--cream-3);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .btn-secondary:hover { border-color: var(--muted); background: var(--cream); }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--cream-3);
    }
    .divider span {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .app-store-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .app-store-badge {
      height: 44px;
      width: auto;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    .footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

    .status-msg {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 14px;
      min-height: 18px;
      transition: opacity 0.3s;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0e0808; }
      .card { background: #1a1010; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
      .wordmark { color: var(--cream); }
      .handle { color: var(--cream); }
      .avatar { background: #2a1a1a; border-color: #3a2020; }
      .btn-primary { background: var(--cream); color: var(--ink); }
      .btn-primary:hover { background: var(--cream-2); }
      .btn-secondary { border-color: #3a2020; color: var(--cream); }
      .btn-secondary:hover { background: #2a1a1a; border-color: #5a3a3a; }
      .divider::before, .divider::after { background: #3a2020; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="wordmark">Bakeri</div>

  <div class="avatar" id="avatar">🧁</div>

  <div class="handle" id="handle-display">@baker</div>
  <div class="tagline" id="tagline">View this baker's profile on Bakeri</div>

  <a class="btn-primary" id="open-btn" href="#">Open in Bakeri</a>

  <div class="status-msg" id="status-msg"></div>

  <div class="divider"><span>DON'T HAVE THE APP?</span></div>

  <div class="app-store-row">
    <a href="https://apps.apple.com/app/bakeri/id6745506861" id="store-link">
      <img
        class="app-store-badge"
        src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
        alt="Download on the App Store"
      />
    </a>
  </div>
</div>

<div class="footer">
  <a href="https://bakeriapp.com">bakeriapp.com</a> &nbsp;·&nbsp;
  <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
</div>

<script>
  (function () {
    // Extract handle from query param ?h=sweethavenbakery
    const params  = new URLSearchParams(window.location.search);
    const handle  = (params.get('h') || '').trim().replace(/^@/, '');

    if (!handle) {
      document.getElementById('handle-display').textContent = 'Baker not found';
      document.getElementById('tagline').textContent = 'This link appears to be invalid.';
      document.getElementById('open-btn').style.display = 'none';
      return;
    }

    // Update UI with handle info
    const displayHandle = '@' + handle;
    document.title = displayHandle + ' on Bakeri';
    document.querySelector('meta[name="description"]').content =
      'View ' + displayHandle + "'s profile on Bakeri — the home baker community.";
    document.getElementById('handle-display').textContent = displayHandle;
    document.getElementById('tagline').textContent =
      'View their bakes, menu, and posts on Bakeri.';

    // Avatar initial
    document.getElementById('avatar').textContent = handle.charAt(0).toUpperCase();

    // Deep link URL
    const deepLink = 'bakeri://baker/' + encodeURIComponent(handle);

    // Wire up open button
    const openBtn   = document.getElementById('open-btn');
    const statusMsg = document.getElementById('status-msg');

    openBtn.addEventListener('click', function (e) {
      e.preventDefault();
      attemptDeepLink();
    });

    // Auto-attempt on load for mobile
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      attemptDeepLink();
    }

    function attemptDeepLink() {
      statusMsg.textContent = 'Opening Bakeri…';
      window.location.href = deepLink;

      // If still here after 1.8s, the app isn't installed
      setTimeout(function () {
        statusMsg.textContent = 'App not installed? Download below.';
      }, 1800);
    }
  })();
</script>
</body>
</html>
