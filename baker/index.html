<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri</title>
  <meta name="description" content="View this baker's storefront on Bakeri." />
  <link rel="icon" href="../1024.png" />
  <link rel="apple-touch-icon" href="../1024.png" />
  <script src="theme.js"></script>

  <style>
    :root {
      /* Overwritten at runtime by theme.js from the baker's chosen in-app
         theme (profiles.selected_theme) — these are just the pre-load /
         no-theme-set fallback (matches the old fixed palette exactly). */
      --theme-primary:   #241712;
      --theme-secondary: #F2A6C6;
      --theme-bg:        #F6F1E6;
      --theme-gold:      #C49A6C;
      --theme-button-fg: #FFFFFF;

      --bg:      var(--theme-bg);
      --white:   #FFFFFF;
      --ink:     #241712;
      --muted:   #948577;
      --bio:     #4A3E33;
      --chip:    #7A6C5D;
      --line:    rgba(36,23,18,0.08);
      --line-2:  rgba(36,23,18,0.14);
      --ready:   #3FA672;
      --custom:  #A66A5B;
      --preorder:#C79A3D;
      --sans:    -apple-system, "SF Pro Text", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    #page { width: 100%; box-sizing: border-box; }

    /* ── Wordmark ── */
    .wordmark-row { text-align: center; }
    .wordmark { height: 42px; width: auto; display: inline-block; }

    /* ── Profile card ── */
    .profile-card {
      background: var(--white);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 2px 8px rgba(36,23,18,0.06), 0 12px 32px rgba(36,23,18,0.06);
      box-sizing: border-box;
    }
    .profile-inner { display: flex; flex-direction: column; align-items: center; text-align: center; }

    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--theme-secondary);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(36,23,18,0.12);
      flex-shrink: 0; overflow: hidden; position: relative;
    }
    .avatar-letter { font-size: 34px; font-weight: 700; color: #fff; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }

    .baker-name { font-size: 24px; font-weight: 800; color: var(--ink); margin-top: 18px; letter-spacing: -0.3px; }

    .location-chip {
      margin-top: 8px; display: inline-flex; align-items: center; gap: 5px;
      background: rgba(36,23,18,0.06); padding: 5px 12px; border-radius: 9999px;
    }
    .location-chip span { font-size: 12.5px; color: var(--chip); font-weight: 500; }

    .baker-bio { margin-top: 18px; font-size: 14.5px; line-height: 1.6; color: var(--bio); }
    .baker-policies { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-2); font-size: 12.5px; line-height: 1.6; color: var(--muted); }
    .baker-policies .policies-label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 4px; color: var(--muted); }

    .btn-open {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 48px; margin-top: 26px;
      background: var(--theme-primary); color: var(--theme-button-fg);
      font-family: var(--sans); font-size: 15px; font-weight: 700;
      border-radius: 9999px; border: none; cursor: pointer; text-decoration: none;
    }
    .btn-open:active { opacity: 0.85; }
    .btn-open.btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--line-2); margin-top: 12px; }
    .pickup-note { margin-top: 14px; text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    /* ── Menu section ── */
    .menu-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .menu-title { font-size: 19px; font-weight: 800; color: var(--ink); }

    .view-toggle { display: flex; background: rgba(36,23,18,0.06); border-radius: 9999px; padding: 3px; gap: 2px; }
    .view-toggle button {
      width: 34px; height: 30px; border-radius: 9999px; border: none; background: transparent;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .view-toggle button.active { background: var(--ink); }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .menu-card {
      background: var(--white); border-radius: 20px; overflow: hidden; cursor: pointer;
      box-shadow: 0 1px 3px rgba(36,23,18,0.06), 0 6px 18px rgba(36,23,18,0.05);
      -webkit-tap-highlight-color: transparent;
    }
    .menu-card-photo { position: relative; width: 100%; aspect-ratio: 1 / 1; background: rgba(36,23,18,0.05); overflow: hidden; }
    .menu-card-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .menu-card-photo .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .badge-overlay {
      position: absolute; top: 10px; right: 10px; padding: 5px 12px; border-radius: 9999px;
      font-size: 11.5px; font-weight: 700; color: #fff;
    }
    .avail-overlay {
      position: absolute; bottom: 10px; left: 10px; background: rgba(20,15,10,0.72);
      padding: 5px 10px; border-radius: 9999px; display: flex; align-items: center; gap: 5px;
    }
    .avail-overlay .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ready); }
    .avail-overlay span { font-size: 11.5px; font-weight: 600; color: #fff; }
    .menu-card-body { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .menu-card-name { font-size: 16px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-card-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-card-price { font-size: 17px; font-weight: 800; color: var(--ink); flex-shrink: 0; text-align: right; }
    .menu-card-price .from-label { font-size: 11px; color: var(--muted); font-weight: 400; }

    .menu-list { background: var(--white); border-radius: 20px; box-shadow: 0 1px 3px rgba(36,23,18,0.06), 0 6px 18px rgba(36,23,18,0.05); overflow: hidden; }
    .menu-row { padding: 18px 20px; border-bottom: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .menu-row:last-child { border-bottom: none; }
    .menu-row-top { display: flex; align-items: baseline; gap: 8px; }
    .menu-row-name { font-size: 16.5px; font-weight: 700; color: var(--ink); white-space: nowrap; }
    .menu-row-leader { flex: 1; border-bottom: 1.5px dotted rgba(36,23,18,0.25); margin-bottom: 4px; }
    .menu-row-price { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; }
    .menu-row-desc { font-size: 13.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
    .badge-inline {
      display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 9999px;
      font-size: 10.5px; font-weight: 700; color: #fff;
    }

    /* ── Product detail modal ── */
    .modal-scrim {
      position: fixed; inset: 0; background: rgba(20,15,10,0.55);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-scrim.open { display: flex; }
    .modal-card {
      background: var(--white); border-radius: 28px; max-width: 420px; width: 100%;
      max-height: 88vh; overflow: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    }
    .modal-photo { position: relative; width: 100%; aspect-ratio: 1 / 1; background: rgba(36,23,18,0.05); }
    .modal-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .modal-close {
      position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(20,15,10,0.55); display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }
    .modal-body { padding: 22px 24px 26px; }
    .modal-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .modal-name { font-size: 21px; font-weight: 800; color: var(--ink); }
    .modal-price { font-size: 20px; font-weight: 800; color: var(--ink); flex-shrink: 0; text-align: right; }
    .modal-price .from-label { font-size: 11px; color: var(--muted); font-weight: 400; }
    .modal-subtitle { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .modal-desc { font-size: 14.5px; line-height: 1.6; color: var(--bio); margin-top: 14px; }
    .modal-body .btn-open { margin-top: 22px; }

    /* ── Footer ── */
    .footer-wrap { text-align: center; }
    .footer-links { margin-top: 26px; font-size: 12.5px; color: var(--muted); }
    .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

    /* ── Skeleton / not-found ── */
    .skeleton {
      background: linear-gradient(90deg, rgba(36,23,18,0.06) 25%, rgba(36,23,18,0.1) 50%, rgba(36,23,18,0.06) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .not-found { text-align: center; color: var(--muted); padding: 20px 0; }
    .not-found h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--ink); }

    @media (prefers-color-scheme: dark) {
      :root { --theme-bg: #17110C; --theme-secondary: #4A2E38; }
      .profile-card, .menu-card, .menu-list, .modal-card { background: #241A14; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
      .wordmark { filter: invert(1); }
      .baker-name, .menu-title, .menu-card-name, .menu-row-name, .modal-name, .not-found h2 { color: #F6F1E6; }
      .btn-open.btn-outline { background: transparent; color: #F6F1E6; border-color: rgba(246,241,230,0.24); }
    }
  </style>
</head>
<body>

<div id="page">
  <div class="wordmark-row" id="wordmark-row">
    <img class="wordmark" src="../wordmark.png" alt="Bakeri" />
  </div>

  <div id="layout">
    <div id="profile-col">
      <div class="profile-card" id="profile-card">
        <div class="profile-inner">
          <div class="avatar" id="avatar"><span class="avatar-letter" id="avatar-letter">🧁</span></div>
          <div class="baker-name" id="baker-name" style="min-width:160px;min-height:28px;"></div>
          <div class="location-chip" id="location-chip" style="display:none;">
            <svg width="10" height="13" viewBox="0 0 10 13" fill="none"><path d="M5 12.5S9.5 7.8 9.5 4.7A4.5 4.5 0 000.5 4.7C0.5 7.8 5 12.5 5 12.5Z" stroke="#7A6C5D" stroke-width="1.2"/><circle cx="5" cy="4.6" r="1.5" stroke="#7A6C5D" stroke-width="1.2"/></svg>
            <span id="location-text"></span>
          </div>
          <div class="baker-bio" id="baker-bio" style="display:none;"></div>
          <div class="baker-policies" id="baker-policies" style="display:none;"></div>
        </div>
        <div class="pickup-note">📍 Exact pickup address is provided by email once your order is confirmed.</div>
      </div>
    </div>

    <div id="menu-col" style="display:none;">
      <div class="menu-header">
        <div class="menu-title">Menu</div>
        <div class="view-toggle">
          <button id="grid-btn" class="active" aria-label="Grid view">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="0.5" y="0.5" width="5.5" height="5.5" rx="1.2" fill="#fff"/><rect x="8" y="0.5" width="5.5" height="5.5" rx="1.2" fill="#fff"/><rect x="0.5" y="8" width="5.5" height="5.5" rx="1.2" fill="#fff"/><rect x="8" y="8" width="5.5" height="5.5" rx="1.2" fill="#fff"/></svg>
          </button>
          <button id="list-btn" aria-label="List view">
            <svg width="15" height="14" viewBox="0 0 15 14" fill="none"><rect x="0" y="1" width="15" height="2.2" rx="1.1" fill="#948577"/><rect x="0" y="5.9" width="15" height="2.2" rx="1.1" fill="#948577"/><rect x="0" y="10.8" width="15" height="2.2" rx="1.1" fill="#948577"/></svg>
          </button>
        </div>
      </div>
      <div class="menu-grid" id="menu-grid"></div>
      <div class="menu-list" id="menu-list" style="display:none;"></div>
    </div>
  </div>

  <div class="footer-wrap" id="footer-wrap">
    <div class="footer-links">
      <a href="https://bakeriapp.com">bakeriapp.com</a> &nbsp;·&nbsp;
      <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
    </div>
  </div>
</div>

<!-- Product detail modal -->
<div class="modal-scrim" id="modal-scrim">
  <div class="modal-card" id="modal-card"></div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STORAGE_URL  = SUPABASE_URL + '/storage/v1/object/public';

  const params  = new URLSearchParams(window.location.search);
  const slug    = (params.get('slug') || '').trim().toLowerCase();
  const bakerID = (params.get('id')   || '').trim();
  // Set by 404.html when it redirected a clean bakeriapp.com/<slug> URL here —
  // once the profile actually resolves, swap the address bar back to that
  // clean form so it's what stays in the user's history/reload/share sheet.
  const isCleanRedirect = params.get('clean') === '1';

  const page       = document.getElementById('page');
  const layout     = document.getElementById('layout');
  const profileCol = document.getElementById('profile-col');
  const menuCol    = document.getElementById('menu-col');
  const wordmarkRow= document.getElementById('wordmark-row');
  const footerWrap = document.getElementById('footer-wrap');
  const menuGrid   = document.getElementById('menu-grid');
  const menuList   = document.getElementById('menu-list');
  const gridBtn    = document.getElementById('grid-btn');
  const listBtn    = document.getElementById('list-btn');

  let viewMode = 'grid';
  let currentListings = [];
  let resolvedBakerId = bakerID;
  let resolvedTheme = 'Classic';
  let resolvedPattern = 'Standard';
  let resolvedGstRegistered = false;
  let resolvedProvince = '';

  // ── Responsive layout — tracked in JS per design spec, not a CSS media query ──
  function applyLayout() {
    const isDesktop = window.innerWidth >= 860;
    page.style.padding = isDesktop ? '56px 40px' : '32px 18px';
    wordmarkRow.style.marginBottom = isDesktop ? '40px' : '28px';
    layout.style.display = 'flex';
    layout.style.flexDirection = isDesktop ? 'row' : 'column';
    layout.style.gap = isDesktop ? '48px' : '28px';
    layout.style.maxWidth = isDesktop ? '1120px' : '560px';
    layout.style.margin = '0 auto';
    layout.style.alignItems = 'flex-start';
    if (isDesktop) {
      profileCol.style.width = '380px';
      profileCol.style.flexShrink = '0';
      profileCol.style.position = 'sticky';
      profileCol.style.top = '32px';
      menuCol.style.flex = '1';
      menuCol.style.minWidth = '0';
      menuCol.style.width = '';
    } else {
      profileCol.style.width = '100%';
      profileCol.style.position = 'static';
      menuCol.style.width = '100%';
      menuCol.style.flex = '';
    }
    menuGrid.style.gap = isDesktop ? '20px' : '14px';
    footerWrap.style.maxWidth = isDesktop ? '560px' : '100%';
    footerWrap.style.margin = '40px auto 0';
  }
  applyLayout();
  window.addEventListener('resize', applyLayout);

  if (!slug && !bakerID) {
    showNotFound('No baker specified', 'This link appears to be invalid.');
    return;
  }

  gridBtn.addEventListener('click', function () { setViewMode('grid'); });
  listBtn.addEventListener('click', function () { setViewMode('list'); });

  function setViewMode(mode) {
    viewMode = mode;
    gridBtn.classList.toggle('active', mode === 'grid');
    listBtn.classList.toggle('active', mode === 'list');
    gridBtn.querySelectorAll('rect').forEach(function (r) { r.setAttribute('fill', mode === 'grid' ? '#fff' : '#948577'); });
    listBtn.querySelectorAll('rect').forEach(function (r) { r.setAttribute('fill', mode === 'list' ? '#fff' : '#948577'); });
    menuGrid.style.display = mode === 'grid' ? 'grid' : 'none';
    menuList.style.display = mode === 'list' ? 'block' : 'none';
  }

  const rpcName = slug ? 'get_baker_web_profile_by_slug' : 'get_baker_web_profile_by_id';
  const rpcBody = slug ? { p_slug: slug } : { p_user_id: bakerID };

  fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpcName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify(rpcBody)
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data || !data.profile) { showNotFound('Baker not found', 'No baker found at this link.'); return; }
    renderProfile(data.profile, data.listings || []);
    if (isCleanRedirect && slug && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '/' + slug);
    }
  })
  .catch(function () { showNotFound('Something went wrong', 'Could not load this profile. Try again later.'); });

  function renderProfile(profile, listings) {
    resolvedBakerId = profile.id;
    resolvedTheme = profile.selected_theme || 'Classic';
    resolvedPattern = profile.background_pattern || 'Standard';
    resolvedGstRegistered = profile.is_gst_registered === true;
    resolvedProvince = profile.pickup_province || '';
    if (window.BakeriTheme) window.BakeriTheme.apply(profile);
    const name     = profile.business_name || profile.user_name || 'Baker';
    const location = [profile.pickup_city, profile.pickup_province].filter(Boolean).join(', ') || profile.location || '';

    document.title = name + ' on Bakeri';
    document.querySelector('meta[name="description"]').content = name + ' — handcrafted bakes on Bakeri. ' + (profile.bio || '');

    const logoURL = STORAGE_URL + '/business-logos/' + profile.id.toUpperCase() + '/logo.jpg';
    const avatarEl = document.getElementById('avatar');
    const avatarImg = document.createElement('img');
    avatarImg.alt = name;
    avatarImg.onload = function () {
      avatarImg.style.display = 'block';
      document.getElementById('avatar-letter').style.display = 'none';
    };
    avatarImg.src = logoURL;
    avatarEl.appendChild(avatarImg);
    document.getElementById('avatar-letter').textContent = name.charAt(0).toUpperCase();

    document.getElementById('baker-name').textContent = name;

    if (location) {
      document.getElementById('location-chip').style.display = 'inline-flex';
      document.getElementById('location-text').textContent = location;
    }

    const bioEl = document.getElementById('baker-bio');
    if (profile.bio) { bioEl.style.display = 'block'; bioEl.textContent = profile.bio; }

    const policiesEl = document.getElementById('baker-policies');
    if (profile.store_policies) {
      policiesEl.style.display = 'block';
      policiesEl.innerHTML = '<span class="policies-label">Good to know</span>';
      const textEl = document.createElement('span');
      textEl.textContent = profile.store_policies;
      policiesEl.appendChild(textEl);
    }

    if (profile.stripe_connect_onboarding_complete !== true) {
      menuCol.style.display = 'block';
      menuGrid.innerHTML = '';
      menuList.innerHTML = '';
      const notice = document.createElement('div');
      notice.className = 'not-found';
      notice.innerHTML = '<h2>Opening soon</h2><p>' + name + ' is still finishing setup and isn\'t taking orders here yet. Check back soon!</p>';
      menuCol.appendChild(notice);
      return;
    }

    currentListings = listings;
    if (listings.length > 0) {
      menuCol.style.display = 'block';
      renderGrid(listings);
      renderList(listings);
    }
  }

  // Only ready_now items ever go to zero — preorder/custom aren't tied to a
  // daily count. available_qty_today is still just a baker-set number (no
  // real inventory system decrements it), but 0 specifically means the
  // baker marked today's batch as gone, which is worth honoring as sold out
  // rather than silently letting someone "buy" it.
  function isSoldOut(item) {
    return item.listing_kind === 'ready_now' && (item.available_qty_today || 0) <= 0;
  }

  // Plain kind badge — used in the grid/list cards. Matches the app's own
  // baker-profile-grid treatment (BakerPublicProfileView): a sold-out
  // ready_now item keeps its normal "Ready Now" badge there, distinguished
  // only by lighter subtitle text (see subtitleFor) — swapping the badge
  // itself in a dense grid reads as clutter/a new badge type per item.
  function kindBadgeInfo(item) {
    if (item.listing_kind === 'ready_now') return { bg: 'var(--ready)', label: 'Ready Now' };
    if (item.listing_kind === 'preorder')  return { bg: 'var(--preorder)', label: 'Pre-order' };
    return { bg: 'var(--custom)', label: 'Custom' };
  }

  // Sold-out-aware badge — used only in the item detail modal, matching
  // the app's dedicated SoldOutBadge treatment on its item detail page: a
  // single, more prominent signal once someone has actually opened the
  // item, not a second badge type competing for attention in the grid.
  function badgeInfo(item) {
    if (isSoldOut(item)) return { bg: 'var(--muted)', label: 'Sold Out' };
    return kindBadgeInfo(item);
  }

  function subtitleFor(item) {
    if (item.listing_kind === 'custom') return 'Request a custom quote';
    if (isSoldOut(item)) return 'Sold out for today';
    if (item.listing_kind === 'ready_now' && item.available_qty_today > 0) return item.available_qty_today + ' available today';
    if (item.listing_kind === 'preorder') return 'Reserve yours today';
    return item.item_description || '';
  }

  function priceIsFrom(item) { return item.listing_kind === 'custom'; }

  function canBuyNow(item) {
    if (isSoldOut(item)) return false;
    return item.listing_kind === 'ready_now' || item.listing_kind === 'preorder';
  }

  function itemImgURL(bakerIdVal, item) {
    return STORAGE_URL + '/menu-item-images/' + bakerIdVal.toUpperCase() + '/' + item.id.toUpperCase() + '.jpg';
  }

  function renderGrid(listings) {
    menuGrid.innerHTML = '';
    listings.forEach(function (item, idx) {
      const badge = kindBadgeInfo(item);
      const card = document.createElement('div');
      card.className = 'menu-card';
      card.addEventListener('click', function () { openModal(idx); });

      const photo = document.createElement('div');
      photo.className = 'menu-card-photo';
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = categoryEmoji(item.category);
      const img = document.createElement('img');
      img.alt = item.name;
      img.onload = function () { img.style.display = 'block'; ph.style.display = 'none'; };
      img.src = itemImgURL(resolvedBakerId, item);
      photo.appendChild(ph);
      photo.appendChild(img);

      const badgeEl = document.createElement('div');
      badgeEl.className = 'badge-overlay';
      badgeEl.style.background = badge.bg;
      badgeEl.textContent = badge.label;
      photo.appendChild(badgeEl);

      if (item.listing_kind === 'ready_now' && item.available_qty_today > 0) {
        const avail = document.createElement('div');
        avail.className = 'avail-overlay';
        avail.innerHTML = '<div class="dot"></div><span>' + item.available_qty_today + ' left</span>';
        photo.appendChild(avail);
      }

      const body = document.createElement('div');
      body.className = 'menu-card-body';
      const left = document.createElement('div');
      left.style.minWidth = '0';
      const nameEl = document.createElement('div');
      nameEl.className = 'menu-card-name';
      nameEl.textContent = item.name;
      const subEl = document.createElement('div');
      subEl.className = 'menu-card-subtitle';
      subEl.textContent = subtitleFor(item);
      left.appendChild(nameEl);
      left.appendChild(subEl);

      const priceEl = document.createElement('div');
      priceEl.className = 'menu-card-price';
      const priceVal = '$' + parseFloat(item.price).toFixed(0);
      priceEl.innerHTML = priceIsFrom(item)
        ? '<div class="from-label">from</div>' + priceVal
        : priceVal;

      body.appendChild(left);
      body.appendChild(priceEl);
      card.appendChild(photo);
      card.appendChild(body);
      menuGrid.appendChild(card);
    });
  }

  function renderList(listings) {
    menuList.innerHTML = '';
    listings.forEach(function (item, idx) {
      const badge = kindBadgeInfo(item);
      const row = document.createElement('div');
      row.className = 'menu-row';
      row.addEventListener('click', function () { openModal(idx); });

      const top = document.createElement('div');
      top.className = 'menu-row-top';
      const nameEl = document.createElement('span');
      nameEl.className = 'menu-row-name';
      nameEl.textContent = item.name;
      const leader = document.createElement('span');
      leader.className = 'menu-row-leader';
      const priceEl = document.createElement('span');
      priceEl.className = 'menu-row-price';
      priceEl.textContent = (priceIsFrom(item) ? 'from ' : '') + '$' + parseFloat(item.price).toFixed(0);
      top.appendChild(nameEl);
      top.appendChild(leader);
      top.appendChild(priceEl);

      const desc = document.createElement('div');
      desc.className = 'menu-row-desc';
      desc.textContent = item.item_description || subtitleFor(item);

      const badgeEl = document.createElement('div');
      badgeEl.className = 'badge-inline';
      badgeEl.style.background = badge.bg;
      badgeEl.textContent = badge.label;

      row.appendChild(top);
      row.appendChild(desc);
      row.appendChild(badgeEl);
      menuList.appendChild(row);
    });
  }

  const modalScrim = document.getElementById('modal-scrim');
  const modalCard  = document.getElementById('modal-card');
  modalScrim.addEventListener('click', function (e) { if (e.target === modalScrim) closeModal(); });

  function openModal(idx) {
    const item = currentListings[idx];
    const badge = badgeInfo(item);
    const priceVal = '$' + parseFloat(item.price).toFixed(0);

    modalCard.innerHTML =
      '<div class="modal-photo">' +
        '<div class="ph" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.5rem;">' + categoryEmoji(item.category) + '</div>' +
        '<img alt="' + escapeHtml(item.name) + '" src="' + itemImgURL(resolvedBakerId, item) + '" onload="this.style.display=\'block\';this.previousElementSibling.style.display=\'none\';" />' +
        '<button class="modal-close" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></button>' +
        '<div class="badge-overlay" style="left:12px;top:12px;right:auto;background:' + badge.bg + ';">' + badge.label + '</div>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="modal-top-row">' +
          '<div class="modal-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="modal-price">' + (priceIsFrom(item) ? '<div class="from-label">from</div>' : '') + priceVal + '</div>' +
        '</div>' +
        '<div class="modal-subtitle">' + escapeHtml(subtitleFor(item)) + '</div>' +
        (item.item_description ? '<div class="modal-desc">' + escapeHtml(item.item_description) + '</div>' : '') +
        (item.intake_form_id
          ? '<button class="btn-open btn-outline" id="modal-custom-order-btn">Request a Custom Order</button>'
          : '') +
        (canBuyNow(item)
          ? '<button class="btn-open" id="modal-buy-now-btn">Buy Now</button>'
          : isSoldOut(item)
          ? '<button class="btn-open" disabled style="opacity:0.5;cursor:not-allowed;">Sold Out</button>'
          : '') +
      '</div>';

    modalCard.querySelector('.modal-close').addEventListener('click', closeModal);
    const customOrderBtn = modalCard.querySelector('#modal-custom-order-btn');
    if (customOrderBtn) {
      customOrderBtn.addEventListener('click', function () {
        // Absolute path, not relative — after a clean-URL redirect (see
        // isCleanRedirect above) the address bar reads /sweetsouthern, not
        // /baker/, so a relative 'custom-order.html' link would 404.
        const url = '/baker/custom-order.html?baker=' + encodeURIComponent(resolvedBakerId) +
          '&item=' + encodeURIComponent(item.id) +
          '&form=' + encodeURIComponent(item.intake_form_id) +
          '&name=' + encodeURIComponent(item.name) +
          '&theme=' + encodeURIComponent(resolvedTheme) +
          '&pattern=' + encodeURIComponent(resolvedPattern);
        window.location.href = url;
      });
    }
    const buyNowBtn = modalCard.querySelector('#modal-buy-now-btn');
    if (buyNowBtn) {
      buyNowBtn.addEventListener('click', function () {
        const url = '/baker/checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
          '&item=' + encodeURIComponent(item.id) +
          '&name=' + encodeURIComponent(item.name) +
          '&price=' + encodeURIComponent(item.price) +
          '&kind=' + encodeURIComponent(item.listing_kind) +
          '&dropDate=' + encodeURIComponent(item.listing_kind === 'preorder' && item.preorder_drop_date ? item.preorder_drop_date : '') +
          '&maxQty=' + encodeURIComponent(item.listing_kind === 'preorder' ? (item.max_preorder_quantity || 0) : 0) +
          '&availQty=' + encodeURIComponent(item.listing_kind === 'ready_now' ? (item.available_qty_today || 0) : 0) +
          '&taxCategory=' + encodeURIComponent(item.tax_category || 'sweetened_single_serving') +
          '&unitWeightGrams=' + encodeURIComponent(item.unit_weight_grams != null ? item.unit_weight_grams : '') +
          '&gstRegistered=' + (resolvedGstRegistered ? '1' : '0') +
          '&province=' + encodeURIComponent(resolvedProvince) +
          '&theme=' + encodeURIComponent(resolvedTheme) +
          '&pattern=' + encodeURIComponent(resolvedPattern);
        window.location.href = url;
      });
    }
    modalScrim.classList.add('open');
  }

  function closeModal() { modalScrim.classList.remove('open'); }

  function categoryEmoji(cat) {
    const map = {
      'Cakes': '🎂', 'Cookies': '🍪', 'Bread': '🍞', 'Pastries': '🥐',
      'Cupcakes': '🧁', 'Pies': '🥧', 'Donuts': '🍩', 'Macarons': '🫶',
      'Muffins': '🧁', 'Bars': '🍫'
    };
    return map[cat] || '🍰';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function showNotFound(title, subtitle) {
    document.getElementById('profile-card').innerHTML =
      '<div class="not-found"><h2>' + title + '</h2><p>' + subtitle + '</p></div>';
    menuCol.style.display = 'none';
  }
})();
</script>
</body>
</html>
