<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri</title>
  <meta name="description" content="View this baker's storefront on Bakeri." />
  <link rel="icon" href="../1024.png" />
  <link rel="apple-touch-icon" href="../1024.png" />
  <script src="theme.js"></script>

  <style>
    :root {
      /* Overwritten at runtime by theme.js from the baker's chosen in-app
         theme (profiles.selected_theme) — pre-load fallback. */
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-gold:      #C49A6C;
      --theme-button-fg: #FFFFFF;

      /* Baker-adaptive */
      --bg:         var(--theme-bg);
      --accent:     var(--theme-primary);
      --accent-fg:  var(--theme-button-fg);

      /* Fixed "shop" identity — same in every theme, only bg/accent shift */
      --surface:         #FFFDF9;
      --surface-sunken:  #F6EFE4;
      --avatar-fill:     #F1E8DA;
      --ink:             #1B1714;
      --ink-secondary:   #3A322A;
      --body-text:       #57503f;
      --muted:           #6E655A;
      --faint:           #9C9284;
      --line:            #E7DDCE;
      --line-strong:     #D8CCBA;
      --ready:           #3F6B4A;
      --preorder:        #A8762B;
      --custom:          #6E655A;
      --error:           #B4552F;

      --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface:        #241A14;
        --surface-sunken: #2C2119;
        --avatar-fill:    #3A2C22;
        --ink:            #F3EADC;
        --ink-secondary:  #C9BCA8;
        --body-text:      #C9BCA8;
        --muted:          #A69B8C;
        --faint:          #8B7F6E;
        --line:           #3D352C;
        --line-strong:    #4A4030;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--body-text);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }

    .mono { font-family: var(--mono); }
    .eyebrow {
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .hidden { display: none !important; }

    /* ── Photo placeholder (used until a real image loads) ── */
    .ph-fallback {
      background: repeating-linear-gradient(135deg, var(--surface-sunken) 0 9px, var(--surface) 9px 18px);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }

    /* ══════════════════════ Sticky Header ══════════════════════ */
    #site-header {
      position: sticky; top: 0; z-index: 40; height: 56px;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px; background: color-mix(in srgb, var(--bg) 96%, transparent);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    #header-id { min-width: 0; flex: 1; }
    #header-name {
      font-weight: 700; font-size: 15px; line-height: 1.1; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #header-avail {
      font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
      color: var(--ready); margin-top: 2px;
    }
    .icon-btn {
      min-width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--line-strong);
      background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
    }
    #cart-btn {
      min-width: 44px; height: 44px; padding: 0 12px; border-radius: 4px; border: none;
      background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
    }
    #cart-btn .n { font-family: var(--mono); }

    /* ══════════════════════ Profile Block ══════════════════════ */
    #profile-block { padding: 28px 20px 22px; text-align: center; }
    #profile-block .avatar { width: 76px; height: 76px; font-size: 30px; margin: 0 auto; }
    #shop-name {
      font-size: 36px; font-weight: 700; letter-spacing: -.01em; line-height: 1;
      color: var(--ink); margin-top: 14px;
    }
    #shop-meta {
      font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-top: 10px;
    }
    #shop-bio {
      font-size: 15px; line-height: 1.6; color: var(--body-text);
      max-width: 300px; margin: 14px auto 0;
    }
    #profile-ctas { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin-left: auto; margin-right: auto; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 4px; border: none; cursor: pointer; font-weight: 700; font-size: 15px;
      text-decoration: none; font-family: var(--sans);
    }
    .btn-primary { height: 52px; background: var(--ink); color: var(--bg); }
    .btn-primary .n { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 500; }
    .btn-outline { height: 50px; background: transparent; color: var(--ink); border: 1px solid var(--ink); }

    /* ══════════════════════ Sticky Filter Bar ══════════════════════ */
    #filter-bar {
      position: sticky; top: 56px; z-index: 35; display: flex; gap: 8px;
      padding: 10px 20px; background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .filter-btn {
      flex: 1; min-height: 42px; border-radius: 4px; border: 1px solid var(--line-strong);
      background: var(--bg); color: var(--ink-secondary); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-family: var(--sans); font-size: 13px; font-weight: 600;
    }
    .filter-btn .n { font-family: var(--mono); font-size: 10px; opacity: .7; font-weight: 400; }
    .filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    /* ══════════════════════ Product Feed ══════════════════════ */
    #feed { padding: 22px 20px 8px; }
    .feed-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
    .feed-title { font-size: 26px; font-weight: 700; color: var(--ink); }
    #feed-note {
      font-size: 13px; line-height: 1.5; color: var(--muted); background: var(--surface-sunken);
      border-radius: 4px; padding: 10px 12px; margin-bottom: 14px;
    }

    #product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .p-card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .p-card .p-photo { position: relative; aspect-ratio: 1/1; background: var(--surface-sunken); cursor: pointer; }
    .p-card .p-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .p-badge {
      position: absolute; top: 8px; left: 8px; font-family: var(--mono); font-size: 9px;
      letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; color: #fff;
    }
    .p-body { padding: 11px; display: flex; flex-direction: column; gap: 6px; }
    .p-name { font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
    .p-meta { font-family: var(--mono); font-size: 10px; color: var(--faint); flex: 1; }
    .p-price-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
    .p-price { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--ink); }
    .p-price .from { font-size: 9px; color: var(--faint); display: block; }

    .add-btn, .qty-stepper { width: 44px; height: 44px; flex-shrink: 0; }
    .add-btn {
      border-radius: 4px; border: none; background: var(--ink); color: var(--bg);
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .add-btn.custom-btn { background: var(--accent); color: var(--accent-fg); font-size: 16px; }
    .qty-stepper {
      display: flex; align-items: center; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden;
      animation: popIn .16s ease-out;
    }
    .qty-stepper button {
      width: 14px; flex: 1; height: 100%; border: none; background: transparent; color: var(--ink);
      font-size: 15px; cursor: pointer;
    }
    .qty-stepper button.plus { background: var(--ink); color: var(--bg); }
    .qty-stepper .qty { font-family: var(--mono); font-size: 12px; padding: 0 4px; color: var(--ink); }
    @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    /* ══════════════════════ About Band ══════════════════════ */
    #about-band {
      background: var(--ink); color: #F3EADC; padding: 26px 20px; display: flex; gap: 16px; align-items: flex-start;
    }
    #about-portrait {
      width: 74px; height: 92px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #3D352C;
    }
    #about-band .eyebrow { color: #E9A6A0; margin-bottom: 8px; }
    #about-story-text { font-size: 15px; line-height: 1.6; color: #C9BCA8; }
    #about-signature { font-style: italic; font-size: 19px; margin-top: 10px; color: #F3EADC; }

    /* ══════════════════════ Good To Know / FAQ ══════════════════════ */
    #info-section { padding: 26px 20px; }
    #info-section h2 { font-size: 28px; font-weight: 700; color: var(--ink); margin-bottom: 14px; }
    .faq-row { border-bottom: 1px solid var(--line); }
    .faq-q {
      width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between;
      background: none; border: none; text-align: left; cursor: pointer; padding: 10px 0;
      font-size: 15px; font-weight: 600; color: var(--ink);
    }
    .faq-q .ind { color: var(--accent); font-size: 18px; }
    .faq-a { max-height: 0; overflow: hidden; transition: max-height .2s ease-out; }
    .faq-a p { font-size: 14px; line-height: 1.7; color: var(--body-text); padding-bottom: 14px; }
    .faq-row.open .faq-a { max-height: 400px; }

    #hours-card { margin-top: 22px; background: var(--surface-sunken); border-radius: 4px; padding: 16px; }
    #hours-card .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
    #hours-card .day { color: var(--muted); }
    #hours-card .time { font-family: var(--mono); color: var(--ink); }

    /* ══════════════════════ Footer ══════════════════════ */
    #site-footer { background: var(--surface-sunken); padding: 26px 20px 130px; }
    #footer-cols { display: flex; flex-direction: column; gap: 18px; font-size: 12px; line-height: 1.9; color: var(--muted); }
    #footer-cols b { color: var(--ink-secondary); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; }
    #footer-credit {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
      font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--faint); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    #footer-credit a { color: var(--faint); text-decoration: none; }
    #footer-credit .i { color: var(--accent); }

    /* ══════════════════════ Fixed Bottom Bar ══════════════════════
       Only ever appears once the cart has something in it — an
       empty-cart "Shop today's menu" bar here would just repeat the
       identical CTA already sitting in the profile block above. */
    #action-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: color-mix(in srgb, var(--bg) 97%, transparent); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line); padding: 11px 14px calc(20px + env(safe-area-inset-bottom));
    }
    #action-bar-cart {
      display: flex; align-items: center; justify-content: space-between; height: 54px;
      background: var(--accent); color: #fff; border-radius: 4px; padding: 0 18px; cursor: pointer;
      border: none; width: 100%; animation: popIn .18s ease-out;
    }
    #action-bar-cart .l { text-align: left; }
    #action-bar-cart .l .t { font-size: 15px; font-weight: 700; }
    #action-bar-cart .l .s { font-family: var(--mono); font-size: 10px; color: #F1CDBC; margin-top: 2px; }
    #action-bar-cart .r { font-family: var(--mono); font-size: 18px; font-weight: 500; }

    /* ══════════════════════ Sheets / Modal / Toast ══════════════════════ */
    .scrim {
      position: fixed; inset: 0; background: rgba(20,15,10,.55); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .scrim.open { display: flex; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 480px; max-height: 90%; overflow: auto;
      border-radius: 16px 16px 0 0; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
      animation: riseIn .22s ease-out;
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sheet-close {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(20,15,10,.55); color: #fff; border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }

    #item-sheet-photo { position: relative; aspect-ratio: 4/3; background: var(--surface-sunken); }
    #item-sheet-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    #item-sheet-body { padding: 18px 20px; }
    #item-sheet-body .eyebrow { color: var(--accent); }
    #item-sheet-name { font-size: 30px; font-weight: 700; color: var(--ink); margin-top: 8px; }
    #item-sheet-price { font-family: var(--mono); font-size: 19px; font-weight: 500; color: var(--ink); margin-top: 4px; }
    #item-sheet-desc { font-size: 14px; line-height: 1.75; color: var(--body-text); margin-top: 14px; }
    .spec-list { margin-top: 14px; }
    .spec-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; padding: 6px 0; border-top: 1px solid var(--line); color: var(--muted); }
    .spec-row b { color: var(--ink); font-weight: 500; }
    #item-sheet-body .btn { width: 100%; height: 52px; margin-top: 18px; }

    #cart-sheet-body { padding: 18px 20px 24px; }
    #cart-step-label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
    .cart-line { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cart-line .thumb { width: 48px; height: 48px; border-radius: 4px; background: var(--surface-sunken); flex-shrink: 0; overflow: hidden; }
    .cart-line .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-line .info { flex: 1; min-width: 0; }
    .cart-line .info .n { font-size: 14px; font-weight: 600; color: var(--ink); }
    .cart-line .info .m { font-family: var(--mono); font-size: 10px; color: var(--faint); }
    .cart-line .stepper { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 4px; height: 40px; }
    .cart-line .stepper button { width: 30px; height: 100%; border: none; background: none; font-size: 15px; cursor: pointer; color: var(--ink); }
    .cart-line .stepper .qty { font-family: var(--mono); font-size: 12px; min-width: 18px; text-align: center; }
    .cart-line .total { font-family: var(--mono); font-size: 13px; color: var(--ink); width: 56px; text-align: right; }

    .cart-financial-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--body-text); }
    .cart-financial-row.total { font-weight: 700; color: var(--ink); font-size: 16px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
    .cart-note { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--faint); text-align: center; margin-top: 10px; }

    .field { margin-top: 12px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--ink-secondary); display: block; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 46px; border-radius: 4px; border: 1px solid var(--line-strong);
      background: var(--surface); color: var(--ink); padding: 0 12px; font-size: 14px;
    }

    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--ink); color: #F3EADC; padding: 10px 18px; border-radius: 4px; font-size: 13px;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .not-found { text-align: center; padding: 60px 20px; color: var(--muted); }
    .not-found h2 { font-size: 1.2rem; color: var(--ink); margin-bottom: 8px; }

    .avatar {
      border-radius: 50%; background: var(--avatar-fill); display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--accent); overflow: hidden; position: relative; border: 1px solid var(--line-strong);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }

    /* ══════════════════════ Desktop ══════════════════════ */
    @media (min-width: 860px) {
      #site-header { height: 70px; padding: 0 40px; }
      #header-nav { display: flex; gap: 24px; margin-left: auto; margin-right: 24px; }
      #header-nav a { font-size: 14px; font-weight: 600; color: var(--ink-secondary); text-decoration: none; }
      #header-nav a:hover { color: var(--accent); }

      #profile-block { display: none; } /* replaced by sticky rail */

      #desktop-shell { max-width: 1160px; margin: 0 auto; padding: 34px 40px 0; display: grid; grid-template-columns: 320px 1fr; gap: 44px; }
      #profile-rail { display: block; position: sticky; top: 94px; align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 24px; }
      #profile-rail .avatar { width: 78px; height: 78px; font-size: 28px; }
      #profile-rail #rail-name { font-size: 32px; font-weight: 700; color: var(--ink); margin-top: 14px; }
      #profile-rail #rail-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: .06em; }
      #profile-rail #rail-bio { font-size: 14px; line-height: 1.7; color: var(--body-text); margin-top: 12px; }
      #profile-rail .btn { width: 100%; margin-top: 10px; height: 46px; }
      #profile-rail .rail-note { margin-top: 16px; background: var(--surface-sunken); border-radius: 4px; padding: 12px; font-size: 12px; color: var(--muted); }

      #filter-bar { position: static; padding: 0; margin-bottom: 18px; max-width: 260px; margin-left: auto; }
      #feed { padding: 0 0 40px; }
      .feed-title { font-size: 40px; }
      #product-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .p-card .p-photo { aspect-ratio: 5/4; cursor: pointer; }
      .p-card:hover { border-color: var(--ink); }

      #about-band, #info-section, #site-footer { margin-left: calc(-1 * (100vw - 100%) / 2); }
      #about-band { padding: 52px 40px; display: grid; grid-template-columns: 220px 1fr; gap: 30px; max-width: 1160px; margin: 22px auto 0; }
      #about-portrait { width: 100%; height: 100%; aspect-ratio: 3/4; }
      #about-story-text { font-size: 15px; max-width: 640px; }

      #info-section { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px; }

      #site-footer { padding: 26px 40px; }
      #footer-cols { flex-direction: row; justify-content: space-between; }

      #action-bar { position: static; background: none; backdrop-filter: none; border: none; padding: 0; }
      #action-bar-cart { display: none !important; }

      .scrim { align-items: center; }
      #item-sheet, #cart-sheet {
        max-width: 820px; width: 90%; border-radius: 4px; max-height: 88vh;
      }
      #item-sheet-inner { display: grid; grid-template-columns: 1fr 1fr; }
      #item-sheet-photo { aspect-ratio: auto; height: 100%; }

      #cart-sheet { max-width: 440px; margin-left: auto; margin-right: 0; height: 100%; max-height: 100%; border-radius: 0; box-shadow: -20px 0 50px -20px rgba(0,0,0,.4); }
      .scrim:has(#cart-sheet) { justify-content: flex-end; }

      #desktop-cart-btn { display: flex; }
    }
    @media (max-width: 859px) {
      #header-nav, #profile-rail, #desktop-cart-btn { display: none; }
      #desktop-shell { display: block; }
    }
  </style>
</head>
<body>

<header id="site-header">
  <div id="header-id">
    <div id="header-name"></div>
    <div id="header-avail" class="hidden"></div>
  </div>
  <nav id="header-nav">
    <a href="#" data-scroll="shop">Shop</a>
    <a href="#" data-scroll="info">About</a>
    <a href="#" data-scroll="info">Pickup &amp; FAQ</a>
  </nav>
  <button class="icon-btn" id="share-btn" aria-label="Share">↗</button>
  <button class="btn btn-outline" id="desktop-cart-btn" style="display:none; height:40px; padding:0 16px; border-color: var(--accent); color: var(--accent);">
    <span id="desktop-cart-label">Your order</span>
  </button>
  <button id="cart-btn" aria-label="Cart"><span>🛒</span><span class="n" id="cart-btn-count"></span></button>
</header>

<div id="desktop-shell">
  <aside id="profile-rail">
    <div class="avatar" id="rail-avatar"><span id="rail-avatar-letter"></span></div>
    <div id="rail-name"></div>
    <div id="rail-meta"></div>
    <div id="rail-bio"></div>
    <div id="rail-ctas"></div>
    <div id="rail-hours"></div>
    <div class="rail-note">📍 Exact pickup address is provided by email once your order is confirmed.</div>
  </aside>

  <div id="main-col">
    <section id="profile-block">
      <div class="avatar" id="pb-avatar"><span id="pb-avatar-letter"></span></div>
      <div id="shop-name"></div>
      <div id="shop-meta"></div>
      <div id="shop-bio" class="hidden"></div>
      <div id="profile-ctas"></div>
    </section>

    <div id="filter-bar" data-sec="shop">
      <button class="filter-btn active" data-tab="now">Today <span class="n" id="count-now"></span></button>
      <button class="filter-btn" data-tab="pre">Pre-order <span class="n" id="count-pre"></span></button>
      <button class="filter-btn" data-tab="custom">Custom <span class="n" id="count-custom"></span></button>
    </div>

    <section id="feed">
      <div class="feed-head">
        <div class="feed-title" id="feed-title">Ready today</div>
      </div>
      <div id="feed-note" class="hidden"></div>
      <div id="product-grid"></div>

</div>

<section id="about-band" class="hidden">
  <img id="about-portrait" alt="" />
  <div>
    <div class="eyebrow">THE BAKER</div>
    <p id="about-story-text"></p>
    <div id="about-signature"></div>
  </div>
</section>

<section id="info-section" class="hidden" data-sec="info">
  <div id="faq-col" class="hidden">
    <h2>Good to know</h2>
    <div id="faq-list"></div>
  </div>
  <div id="hours-card" class="hidden">
    <div id="hours-rows"></div>
  </div>
</section>

<footer id="site-footer">
  <div id="footer-cols">
    <div id="footer-hours-col" class="hidden"><b>PICKUP</b><br /><span id="footer-hours"></span></div>
    <div id="footer-contact-col" class="hidden"><b>FIND US</b><br /><span id="footer-contact"></span></div>
  </div>
  <div id="footer-credit">
    <span id="footer-copy"></span>
    <span>POWERED BY BAKER<span class="i">Ï</span> · <a href="https://bakeriapp.com">bakeriapp.com</a> · <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a></span>
  </div>
</footer>

<div id="action-bar">
  <button id="action-bar-cart">
    <div class="l">
      <div class="t">Checkout</div>
      <div class="s" id="cart-bar-sub"></div>
    </div>
    <div class="r" id="cart-bar-total"></div>

</div>

<!-- Item detail sheet -->
<div class="scrim" id="item-scrim">
  <div class="sheet" id="item-sheet">
    <div id="item-sheet-inner">
      <div id="item-sheet-photo">
        <div class="ph-fallback" id="item-sheet-ph" style="position:absolute;inset:0;"></div>
        <img id="item-sheet-img" alt="" />
        <button class="sheet-close" id="item-sheet-close">✕</button>
      </div>
      <div id="item-sheet-body">
        <div class="eyebrow" id="item-sheet-kind"></div>
        <div id="item-sheet-name"></div>
        <div id="item-sheet-price"></div>
        <div id="item-sheet-desc"></div>
        <div class="spec-list" id="item-sheet-specs"></div>
        <button class="btn btn-primary" id="item-sheet-cta"></button>
      </div>
    </div>

</div>

<!-- Cart / checkout sheet -->
<div class="scrim" id="cart-scrim">
  <div class="sheet" id="cart-sheet">
    <div style="position:relative;">
      <button class="sheet-close" id="cart-sheet-close">✕</button>
    </div>
    <div id="cart-sheet-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STORAGE_URL  = SUPABASE_URL + '/storage/v1/object/public';

  const params  = new URLSearchParams(window.location.search);
  const slug    = (params.get('slug') || '').trim().toLowerCase();
  const bakerID = (params.get('id')   || '').trim();
  const isCleanRedirect = params.get('clean') === '1';

  const WEEKDAY_LABELS = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };
  const WEEKDAY_ORDER  = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

  let profile = null;
  let allListings = [];
  let resolvedBakerId = bakerID;
  let tab = 'now';
  let cart = {}; // { itemId: qty }
  let cartStep = 0; // 0 order, 1 pickup&payment, 2 confirmed
  let currentItemForSheet = null;
  let toastTimer = null;
  // Direct checkout (ready_now / preorder) needs the baker's Stripe Connect
  // payout wired up; custom-quote inquiries don't touch payment at intake
  // time (submit-custom-order-inquiry lands a pending_quote lead), so those
  // stay open even before onboarding finishes.
  let stripeReady = false;

  // ── Cart persistence — keyed per baker so a visitor's cart from one
  // storefront never bleeds into another's. ──
  function cartStorageKey() { return 'bakeri_cart_' + resolvedBakerId; }
  function loadCart() {
    try { cart = JSON.parse(sessionStorage.getItem(cartStorageKey()) || '{}'); } catch (e) { cart = {}; }
  }
  function saveCart() {
    try { sessionStorage.setItem(cartStorageKey(), JSON.stringify(cart)); } catch (e) {}
  }

  if (!slug && !bakerID) {
    showNotFound('No baker specified', 'This link appears to be invalid.');
    return;
  }

  const rpcName = slug ? 'get_baker_web_profile_by_slug' : 'get_baker_web_profile_by_id';
  const rpcBody = slug ? { p_slug: slug } : { p_user_id: bakerID };

  fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpcName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify(rpcBody)
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data || !data.profile) { showNotFound('Baker not found', 'No baker found at this link.'); return; }
    profile = data.profile;
    resolvedBakerId = profile.id;
    loadCart();
    if (window.BakeriTheme) window.BakeriTheme.apply(profile);
    render(profile, data.listings || [], data.faqs || []);
    if (isCleanRedirect && slug && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '/' + slug);
    }
  })
  .catch(function () { showNotFound('Something went wrong', 'Could not load this profile. Try again later.'); });

  // ══════════════════════ Render ══════════════════════

  function render(profile, listings, faqs) {
    allListings = listings;
    const name = profile.business_name || profile.user_name || 'Baker';
    const location = profile.neighbourhood
      ? [profile.neighbourhood, profile.pickup_province].filter(Boolean).join(', ')
      : [profile.pickup_city, profile.pickup_province].filter(Boolean).join(', ') || profile.location || '';

    document.title = name + ' on Bakeri';
    document.querySelector('meta[name="description"]').content = name + ' — handcrafted bakes on Bakeri. ' + (profile.bio || '');

    stripeReady = profile.stripe_connect_onboarding_complete === true;

    renderAvatar(name);
    document.getElementById('header-name').textContent = name;
    const readyCount = stripeReady ? listings.filter(function (l) { return l.listing_kind === 'ready_now' && !isSoldOut(l); }).length : 0;
    if (readyCount > 0) {
      const hdrAvail = document.getElementById('header-avail');
      hdrAvail.textContent = readyCount + ' READY FOR PICKUP TODAY';
      hdrAvail.classList.remove('hidden');
    }

    document.getElementById('shop-name').textContent = name;
    document.getElementById('rail-name').textContent = name;
    if (location) {
      document.getElementById('shop-meta').textContent = location.toUpperCase();
      document.getElementById('rail-meta').textContent = location.toUpperCase();
    } else {
      document.getElementById('shop-meta').classList.add('hidden');
      document.getElementById('rail-meta').classList.add('hidden');
    }

    if (profile.bio) {
      document.getElementById('shop-bio').textContent = profile.bio;
      document.getElementById('shop-bio').classList.remove('hidden');
      document.getElementById('rail-bio').textContent = profile.bio;
    }

    renderCTAs(readyCount, listings);
    renderHours(profile.pickup_hours_json);
    renderAboutBand(profile, name);
    renderFAQ(faqs);
    renderFooter(profile, name);

    document.getElementById('share-btn').addEventListener('click', shareLink);

    // A baker mid-Stripe-setup still gets a working storefront — custom
    // listings take quote requests regardless (see stripeReady above).
    // Only note it when it actually affects something orderable.
    if (!stripeReady && listings.some(function (l) { return l.listing_kind !== 'custom'; })) {
      const hasCustom = listings.some(function (l) { return l.listing_kind === 'custom'; });
      document.getElementById('feed-note').textContent = 'Direct ordering isn\'t live yet — check back soon' +
        (hasCustom ? ', or request a custom quote below.' : '.');
      document.getElementById('feed-note').classList.remove('hidden');
    }

    renderCounts(listings);
    renderGrid();
    updateCartUI();

    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { setTab(btn.dataset.tab); });
    });
    document.querySelectorAll('[data-scroll="shop"]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); scrollToSection('shop'); });
    });
    document.querySelectorAll('[data-scroll="info"]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); scrollToSection('info'); });
    });
    document.getElementById('cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('desktop-cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('action-bar-cart').addEventListener('click', openCartSheet);
    document.getElementById('item-sheet-close').addEventListener('click', closeItemSheet);
    document.getElementById('cart-sheet-close').addEventListener('click', closeCartSheet);
    document.getElementById('item-scrim').addEventListener('click', function (e) { if (e.target === this) closeItemSheet(); });
    document.getElementById('cart-scrim').addEventListener('click', function (e) { if (e.target === this) closeCartSheet(); });
  }

  function renderAvatar(name) {
    const logoURL = STORAGE_URL + '/business-logos/' + resolvedBakerId.toUpperCase() + '/logo.jpg';
    const initial = name.charAt(0).toUpperCase();
    ['pb-avatar', 'rail-avatar'].forEach(function (id) {
      const el = document.getElementById(id);
      const letterEl = document.getElementById(id + '-letter');
      letterEl.textContent = initial;
      const img = document.createElement('img');
      img.alt = name;
      img.onload = function () { img.style.display = 'block'; letterEl.style.display = 'none'; };
      img.src = logoURL;
      el.appendChild(img);
    });
  }

  function renderCTAs(readyCount, listings) {
    const hasCustom = listings.some(function (l) { return l.listing_kind === 'custom'; });
    const shopLabel = readyCount > 0
      ? '<span>Shop today\'s menu</span><span class="n">' + readyCount + ' READY</span>'
      : '<span>Shop the menu</span>';
    const customBtn = hasCustom
      ? '<button class="btn btn-outline" data-scroll="quote-fallback">Request a custom quote</button>' : '';
    const html = '<button class="btn btn-primary" data-scroll="shop">' + shopLabel + '</button>' + customBtn;
    document.getElementById('profile-ctas').innerHTML = html;
    document.getElementById('rail-ctas').innerHTML =
      '<button class="btn btn-primary" data-scroll="shop">Shop today\'s menu</button>' + customBtn;
    document.querySelectorAll('#profile-ctas [data-scroll="shop"], #rail-ctas [data-scroll="shop"]').forEach(function (b) {
      b.addEventListener('click', function () { scrollToSection('shop'); });
    });
    // Custom items live inside the Custom tab, not a separate form — route there.
    document.querySelectorAll('[data-scroll="quote-fallback"]').forEach(function (b) {
      b.addEventListener('click', function () { setTab('custom'); scrollToSection('shop'); });
    });
  }

  // Only renders if the baker has actually configured hours in the app (the
  // Pickup & Hours editor) — an untouched profile has an empty object, and
  // showing a fake "closed every day" table would be worse than showing
  // nothing at all.
  function renderHours(hoursJSON) {
    const hasHours = hoursJSON && WEEKDAY_ORDER.some(function (k) { return hoursJSON[k]; });
    if (!hasHours) {
      document.getElementById('hours-card').classList.add('hidden');
      updateInfoSectionVisibility();
      return;
    }
    document.getElementById('hours-card').classList.remove('hidden');
    updateInfoSectionVisibility();
    const rowsHTML = WEEKDAY_ORDER.map(function (key) {
      const day = hoursJSON[key];
      const label = WEEKDAY_LABELS[key];
      const time = (!day || day.closed) ? 'Closed' : (day.open + '–' + day.close);
      return '<div class="row"><span class="day">' + label + '</span><span class="time">' + time + '</span></div>';
    }).join('');
    document.getElementById('hours-rows').innerHTML = rowsHTML;
    const openDays = WEEKDAY_ORDER.filter(function (k) { return hoursJSON[k] && !hoursJSON[k].closed; });
    if (openDays.length) {
      document.getElementById('footer-hours').innerHTML =
        openDays.map(function (k) { return WEEKDAY_LABELS[k] + ' ' + hoursJSON[k].open + '–' + hoursJSON[k].close; }).join('<br />');
      document.getElementById('footer-hours-col').classList.remove('hidden');
    }
  }

  function renderAboutBand(profile, name) {
    if (!profile.about_story) return;
    document.getElementById('about-band').classList.remove('hidden');
    document.getElementById('about-story-text').textContent = profile.about_story;
    document.getElementById('about-signature').textContent = '— ' + name;
    const img = document.getElementById('about-portrait');
    img.alt = name;
    img.onerror = function () { document.getElementById('about-band').style.gridTemplateColumns = '1fr'; img.style.display = 'none'; };
    img.src = STORAGE_URL + '/baker-portraits/' + resolvedBakerId.toUpperCase() + '/portrait.jpg';
  }

  // #info-section holds both the FAQ column and the hours card — each
  // self-hides independently (checked again after renderHours), and the
  // whole section only hides if neither has anything to show.
  function updateInfoSectionVisibility() {
    const hasFAQ = !document.getElementById('faq-col').classList.contains('hidden');
    const hasHours = !document.getElementById('hours-card').classList.contains('hidden');
    document.getElementById('info-section').classList.toggle('hidden', !hasFAQ && !hasHours);
  }

  function renderFAQ(faqs) {
    if (!faqs || faqs.length === 0) {
      document.getElementById('faq-col').classList.add('hidden');
      updateInfoSectionVisibility();
      return;
    }
    document.getElementById('faq-col').classList.remove('hidden');
    updateInfoSectionVisibility();
    const list = document.getElementById('faq-list');
    list.innerHTML = '';
    faqs.forEach(function (faq, i) {
      const row = document.createElement('div');
      row.className = 'faq-row' + (i === 0 ? ' open' : '');
      row.innerHTML =
        '<button class="faq-q"><span>' + escapeHtml(faq.question) + '</span><span class="ind">' + (i === 0 ? '−' : '+') + '</span></button>' +
        '<div class="faq-a"><p>' + escapeHtml(faq.answer) + '</p></div>';
      row.querySelector('.faq-q').addEventListener('click', function () {
        const willOpen = !row.classList.contains('open');
        list.querySelectorAll('.faq-row').forEach(function (r) {
          r.classList.remove('open');
          r.querySelector('.ind').textContent = '+';
        });
        if (willOpen) {
          row.classList.add('open');
          row.querySelector('.ind').textContent = '−';
        }
      });
      list.appendChild(row);
    });
  }

  function renderFooter(profile, name) {
    const contactLines = [];
    if (profile.user_name) contactLines.push(escapeHtml(profile.user_name));
    const loc = [profile.neighbourhood, profile.pickup_city].filter(Boolean).join(', ');
    if (loc) contactLines.push(escapeHtml(loc));
    if (contactLines.length) {
      document.getElementById('footer-contact').innerHTML = contactLines.join('<br />');
      document.getElementById('footer-contact-col').classList.remove('hidden');
    }
    document.getElementById('footer-copy').textContent = '© ' + new Date().getFullYear() + ' ' + name.toUpperCase();
  }

  // ══════════════════════ Tabs / Feed ══════════════════════

  function listingsForTab(t) {
    const kind = t === 'now' ? 'ready_now' : (t === 'pre' ? 'preorder' : 'custom');
    return allListings.filter(function (l) { return l.listing_kind === kind; });
  }

  function renderCounts(listings) {
    document.getElementById('count-now').textContent    = listingsForTab('now').length;
    document.getElementById('count-pre').textContent    = listingsForTab('pre').length;
    document.getElementById('count-custom').textContent = listingsForTab('custom').length;
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
    const titles = { now: 'Ready today', pre: 'Pre-order', custom: 'Custom orders' };
    document.getElementById('feed-title').textContent = titles[t];
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('product-grid');
    const listings = listingsForTab(tab);
    if (listings.length === 0) {
      grid.innerHTML = '<div class="not-found" style="grid-column:1/-1;padding:30px 0;">Nothing here yet.</div>';
      return;
    }
    grid.innerHTML = '';
    listings.forEach(function (item) {
      grid.appendChild(buildCard(item));
    });
  }

  function buildCard(item) {
    const card = document.createElement('div');
    card.className = 'p-card';

    const photo = document.createElement('div');
    photo.className = 'p-photo';
    photo.appendChild(photoFallback(item));
    const img = document.createElement('img');
    img.alt = item.name;
    img.onload = function () { img.style.display = 'block'; };
    img.src = itemImgURL(item);
    photo.appendChild(img);
    photo.addEventListener('click', function () { openItemSheet(item); });

    if (item.listing_kind !== 'custom') {
      // Single badge carries both the kind and, for ready_now, the live
      // count — badgeInfo() already folds "N left today" into its label,
      // so a second availability pill here would just repeat it.
      const badge = document.createElement('div');
      badge.className = 'p-badge';
      const info = badgeInfo(item);
      badge.style.background = info.bg;
      badge.textContent = info.label;
      photo.appendChild(badge);
    }

    const body = document.createElement('div');
    body.className = 'p-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'p-name';
    nameEl.textContent = item.name;
    nameEl.addEventListener('click', function () { openItemSheet(item); });
    const metaEl = document.createElement('div');
    metaEl.className = 'p-meta';
    // The badge already carries availability/status for ready_now &
    // preorder — this line is for the baker's own description instead, so
    // the card isn't repeating the same fact in two places.
    metaEl.textContent = item.item_description || (isSoldOut(item) ? 'Sold out for today' : '');

    const priceRow = document.createElement('div');
    priceRow.className = 'p-price-row';
    const priceEl = document.createElement('div');
    priceEl.className = 'p-price';
    priceEl.innerHTML = priceIsFrom(item) ? '<span class="from">from</span>$' + formatPrice(item.price) : '$' + formatPrice(item.price);
    priceRow.appendChild(priceEl);
    priceRow.appendChild(buildAddControl(item));

    body.appendChild(nameEl);
    body.appendChild(metaEl);
    body.appendChild(priceRow);
    card.appendChild(photo);
    card.appendChild(body);
    return card;
  }

  function buildAddControl(item) {
    const wrap = document.createElement('div');
    wrap.dataset.itemId = item.id;
    refreshAddControl(wrap, item);
    return wrap;
  }

  function refreshAddControl(wrap, item) {
    wrap.innerHTML = '';
    if (item.listing_kind === 'custom') {
      const btn = document.createElement('button');
      btn.className = 'add-btn custom-btn';
      btn.textContent = '→';
      btn.setAttribute('aria-label', 'Request a custom order');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        window.location.href = customOrderURL(item);
      });
      wrap.appendChild(btn);
      return;
    }
    const qty = cart[item.id] || 0;
    if (isSoldOut(item) || !stripeReady) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.style.opacity = '.4'; btn.disabled = true;
      btn.textContent = '—';
      btn.title = stripeReady ? 'Sold out for today' : 'Ordering isn\'t live yet';
      wrap.appendChild(btn);
      return;
    }
    if (qty === 0) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '+';
      btn.setAttribute('aria-label', 'Add to order');
      btn.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      wrap.appendChild(btn);
    } else {
      const stepper = document.createElement('div');
      stepper.className = 'qty-stepper';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, -1); });
      const qtyEl = document.createElement('span');
      qtyEl.className = 'qty';
      qtyEl.textContent = qty;
      const plus = document.createElement('button');
      plus.className = 'plus';
      plus.textContent = '+';
      plus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
      wrap.appendChild(stepper);
    }
  }

  function changeQty(item, delta) {
    const current = cart[item.id] || 0;
    const next = Math.max(0, current + delta);
    if (next === 0) { delete cart[item.id]; } else { cart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateCartUI();
  }

  function updateCartUI() {
    const count = Object.values(cart).reduce(function (s, q) { return s + q; }, 0);
    document.getElementById('cart-btn-count').textContent = count > 0 ? count : '';
    const total = cartSubtotal();
    document.getElementById('desktop-cart-label').textContent = count > 0 ? ('Checkout · ' + count) : 'Your order';

    if (count > 0) {
      document.getElementById('action-bar-cart').style.display = 'flex';
      document.getElementById('cart-bar-sub').textContent = count + (count === 1 ? ' item' : ' items') +
        (profile && profile.pickup_city ? ' · pickup in ' + profile.pickup_city : ' · pickup');
      document.getElementById('cart-bar-total').textContent = '$' + formatPrice(total);
    } else {
      // Stays hidden — the profile block above already carries the same
      // "Shop today's menu" CTA; repeating it in a pinned bar is redundant.
      document.getElementById('action-bar-cart').style.display = 'none';
    }
  }

  function cartLines() {
    return Object.keys(cart).map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? { item: item, qty: cart[id] } : null;
    }).filter(Boolean);
  }

  function cartSubtotal() {
    return cartLines().reduce(function (sum, l) { return sum + l.item.price * l.qty; }, 0);
  }

  // ══════════════════════ Item Sheet ══════════════════════

  function openItemSheet(item) {
    currentItemForSheet = item;
    const kindLabels = { ready_now: 'READY TODAY', preorder: 'PRE-ORDER', custom: 'BY QUOTE' };
    document.getElementById('item-sheet-kind').textContent = kindLabels[item.listing_kind] || '';
    document.getElementById('item-sheet-name').textContent = item.name;
    document.getElementById('item-sheet-price').innerHTML = (priceIsFrom(item) ? 'from ' : '') + '$' + formatPrice(item.price);
    document.getElementById('item-sheet-desc').textContent = item.item_description || '';

    const ph = document.getElementById('item-sheet-ph');
    ph.textContent = categoryEmoji(item.category);
    ph.style.display = 'flex';
    const img = document.getElementById('item-sheet-img');
    img.style.display = 'none';
    img.onload = function () { img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);

    const specs = [];
    specs.push({ k: 'AVAILABILITY', v: subtitleFor(item) });
    if (item.lead_time_note) specs.push({ k: 'LEAD TIME', v: item.lead_time_note });
    if (item.allergens) specs.push({ k: 'ALLERGENS', v: item.allergens });
    document.getElementById('item-sheet-specs').innerHTML = specs.map(function (s) {
      return '<div class="spec-row"><span>' + s.k + '</span><b>' + escapeHtml(s.v) + '</b></div>';
    }).join('');

    const cta = document.getElementById('item-sheet-cta');
    if (item.listing_kind === 'custom') {
      cta.textContent = 'Request a Custom Order';
      cta.onclick = function () { window.location.href = customOrderURL(item); };
    } else if (isSoldOut(item)) {
      cta.textContent = 'Sold Out';
      cta.disabled = true;
      cta.style.opacity = '.5';
    } else if (!stripeReady) {
      cta.textContent = 'Ordering Opens Soon';
      cta.disabled = true;
      cta.style.opacity = '.5';
    } else {
      cta.textContent = 'Add to order';
      cta.disabled = false;
      cta.style.opacity = '1';
      cta.onclick = function () {
        changeQty(item, 1);
        closeItemSheet();
        showToast('Added to your order');
      };
    }

    document.getElementById('item-scrim').classList.add('open');
  }
  function closeItemSheet() { document.getElementById('item-scrim').classList.remove('open'); }

  // ══════════════════════ Cart / Checkout Sheet ══════════════════════

  function openCartSheet() {
    cartStep = 0;
    renderCartSheet();
    document.getElementById('cart-scrim').classList.add('open');
  }
  function closeCartSheet() { document.getElementById('cart-scrim').classList.remove('open'); }

  function renderCartSheet() {
    const body = document.getElementById('cart-sheet-body');
    if (cartStep === 0) body.innerHTML = renderCartStepOrder();
    else if (cartStep === 1) body.innerHTML = renderCartStepPickup();
    else body.innerHTML = renderCartStepConfirmed();
    wireCartStepEvents();
  }

  function renderCartStepOrder() {
    const lines = cartLines();
    if (lines.length === 0) {
      return '<div id="cart-step-label">YOUR ORDER</div>' +
        '<div class="not-found"><p>Your order is empty.</p></div>' +
        '<button class="btn btn-outline" id="cart-see-ready" style="width:100%;height:48px;margin-top:12px;">See what\'s ready</button>';
    }
    const rows = lines.map(function (l) {
      return '<div class="cart-line" data-line-id="' + l.item.id + '">' +
        '<div class="thumb"><img src="' + itemImgURL(l.item) + '" alt="" onerror="this.style.display=\'none\'" /></div>' +
        '<div class="info"><div class="n">' + escapeHtml(l.item.name) + '</div><div class="m">' + escapeHtml(subtitleFor(l.item)) + '</div></div>' +
        '<div class="stepper"><button class="line-minus">−</button><span class="qty">' + l.qty + '</span><button class="line-plus">+</button></div>' +
        '<div class="total">$' + formatPrice(l.item.price * l.qty) + '</div>' +
        '</div>';
    }).join('');
    const subtotal = cartSubtotal();
    return '<div id="cart-step-label">YOUR ORDER</div>' +
      rows +
      '<div class="cart-financial-row"><span>Subtotal</span><span>$' + formatPrice(subtotal) + '</span></div>' +
      '<div class="cart-financial-row"><span>Pickup — no delivery fee</span><span>$0.00</span></div>' +
      '<div class="cart-financial-row total"><span>Total</span><span>$' + formatPrice(subtotal) + '</span></div>' +
      '<button class="btn btn-primary" id="cart-continue" style="width:100%;">Continue to pickup details</button>' +
      '<div class="cart-note">PAY IN APP · ADDRESS EMAILED ON CONFIRMATION</div>';
  }

  function renderCartStepPickup() {
    const hours = (profile && profile.pickup_hours_json) || {};
    const openDays = WEEKDAY_ORDER.filter(function (k) { return hours[k] && !hours[k].closed; });
    const windowOptions = openDays.length
      ? openDays.map(function (k) { return '<option>' + WEEKDAY_LABELS[k] + ' ' + hours[k].open + '–' + hours[k].close + '</option>'; }).join('')
      : '<option>By arrangement</option>';
    return '<div id="cart-step-label">PICKUP &amp; PAYMENT</div>' +
      '<div class="field"><label>Pickup window</label><select id="f-window">' + windowOptions + '</select></div>' +
      '<div class="field"><label>Name</label><input id="f-name" type="text" autocomplete="name" /></div>' +
      '<div class="field"><label>Mobile</label><input id="f-phone" type="tel" autocomplete="tel" /></div>' +
      '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" /></div>' +
      '<div class="cart-financial-row total"><span>Total</span><span>$' + formatPrice(cartSubtotal()) + '</span></div>' +
      '<div id="pay-error" style="color:var(--error);font-size:13px;margin-top:6px;"></div>' +
      '<button class="btn btn-primary" id="cart-pay" style="width:100%;">Pay $' + formatPrice(cartSubtotal()) + '</button>' +
      '<button class="btn" id="cart-back" style="width:100%;height:auto;padding:10px;text-decoration:underline;background:none;color:var(--muted);">Back to order</button>';
  }

  function renderCartStepConfirmed() {
    return '<div style="text-align:center;padding:20px 0;">' +
      '<div style="width:54px;height:54px;border-radius:50%;background:var(--ready);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto;">✓</div>' +
      '<div style="font-size:22px;font-weight:700;color:var(--ink);margin-top:16px;">Order confirmed</div>' +
      '<p style="font-size:14px;color:var(--body-text);margin-top:10px;">The pickup address and window are in your email.</p>' +
      '<button class="btn btn-outline" id="cart-keep-shopping" style="width:100%;margin-top:20px;">Keep shopping</button>' +
      '</div>';
  }

  function wireCartStepEvents() {
    const seeReady = document.getElementById('cart-see-ready');
    if (seeReady) seeReady.addEventListener('click', function () {
      closeCartSheet(); setTab('now'); scrollToSection('shop');
    });
    document.querySelectorAll('.line-minus, .line-plus').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.closest('.cart-line').dataset.lineId;
        const item = allListings.find(function (l) { return l.id === id; });
        changeQty(item, btn.classList.contains('line-plus') ? 1 : -1);
        renderCartSheet();
      });
    });
    const cont = document.getElementById('cart-continue');
    if (cont) cont.addEventListener('click', function () { cartStep = 1; renderCartSheet(); });
    const back = document.getElementById('cart-back');
    if (back) back.addEventListener('click', function () { cartStep = 0; renderCartSheet(); });
    const pay = document.getElementById('cart-pay');
    if (pay) pay.addEventListener('click', goToCheckout);
    const keep = document.getElementById('cart-keep-shopping');
    if (keep) keep.addEventListener('click', function () {
      cart = {}; saveCart(); updateCartUI(); closeCartSheet();
    });
  }

  // Hands the whole cart off to checkout.html as a sessionStorage payload —
  // avoids an unbounded query string for a multi-item order.
  function goToCheckout() {
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const errEl = document.getElementById('pay-error');
    if (!name || !phone || !email) {
      errEl.textContent = 'Please fill in your name, mobile and email.';
      return;
    }
    const payload = {
      baker: resolvedBakerId,
      theme: profile.selected_theme,
      pattern: profile.background_pattern,
      gstRegistered: profile.is_gst_registered ? '1' : '0',
      province: profile.pickup_province || '',
      customer: { name: name, phone: phone, email: email },
      items: cartLines().map(function (l) {
        return {
          id: l.item.id, name: l.item.name, qty: l.qty, price: l.item.price,
          taxCategory: l.item.tax_category, unitWeightGrams: l.item.unit_weight_grams,
          listingKind: l.item.listing_kind, dropDate: l.item.preorder_drop_date || '',
          maxQty: l.item.max_preorder_quantity || 0, availQty: l.item.available_qty_today || 0
        };
      })
    };
    sessionStorage.setItem('bakeri_checkout_cart', JSON.stringify(payload));
    window.location.href = '/baker/checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&theme=' + encodeURIComponent(profile.selected_theme || '') +
      '&pattern=' + encodeURIComponent(profile.background_pattern || '');
  }

  // ══════════════════════ Helpers ══════════════════════

  function scrollToSection(sec) {
    const el = document.querySelector('[data-sec="' + sec + '"]');
    if (!el) return;
    const offset = window.innerWidth >= 860 ? 84 : 118;
    const top = el.getBoundingClientRect().top + window.pageYOffset - offset;
    window.scrollTo({ top: top, behavior: 'smooth' });
  }

  function shareLink() {
    const url = window.location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
    showToast('Link copied — ' + window.location.host + window.location.pathname);
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  function isSoldOut(item) {
    return item.listing_kind === 'ready_now' && (item.available_qty_today || 0) <= 0;
  }

  function badgeInfo(item) {
    if (isSoldOut(item)) return { bg: 'var(--muted)', label: 'Sold Out' };
    if (item.listing_kind === 'ready_now') return { bg: 'var(--ready)', label: (item.available_qty_today || 0) + ' left today' };
    if (item.listing_kind === 'preorder') return { bg: 'var(--preorder)', label: 'Pre-order' };
    return { bg: 'var(--custom)', label: 'Custom' };
  }

  function subtitleFor(item) {
    if (item.listing_kind === 'custom') return item.lead_time_note || 'Request a custom quote';
    if (isSoldOut(item)) return 'Sold out for today';
    if (item.listing_kind === 'ready_now' && item.available_qty_today > 0) return item.available_qty_today + ' available today';
    if (item.listing_kind === 'preorder') return item.lead_time_note || 'Order ahead';
    return item.item_description || '';
  }

  function priceIsFrom(item) { return item.listing_kind === 'custom'; }
  function formatPrice(v) { return parseFloat(v).toFixed(2); }

  function photoFallback(item) {
    const ph = document.createElement('div');
    ph.className = 'ph-fallback';
    ph.style.position = 'absolute'; ph.style.inset = '0';
    ph.textContent = categoryEmoji(item.category);
    return ph;
  }

  function itemImgURL(item) {
    return STORAGE_URL + '/menu-item-images/' + resolvedBakerId.toUpperCase() + '/' + item.id.toUpperCase() + '.jpg';
  }

  function customOrderURL(item) {
    return '/baker/custom-order.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&item=' + encodeURIComponent(item.id) +
      '&form=' + encodeURIComponent(item.intake_form_id || '') +
      '&name=' + encodeURIComponent(item.name) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  function categoryEmoji(cat) {
    const map = {
      'Cakes': '🎂', 'Cookies': '🍪', 'Bread': '🍞', 'Pastries': '🥐',
      'Cupcakes': '🧁', 'Pies': '🥧', 'Donuts': '🍩', 'Macarons': '🫶',
      'Muffins': '🧁', 'Bars': '🍫'
    };
    return map[cat] || '🍰';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function showNotFound(title, subtitle) {
    document.body.innerHTML = '<div class="not-found"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(subtitle) + '</p></div>';
  }
})();
</script>
</body>
</html>
