    const badgeEl = document.getElementById('item-sheet-badge');
    badgeEl.style.background = badge.bg;
    badgeEl.innerHTML = '<span class="dot"></span>' + badge.label;

    const ph = document.getElementById('item-sheet-ph');
    ph.textContent = categoryEmoji(item);
    ph.style.display = 'flex';
    const img = document.getElementById('item-sheet-img');
    img.style.display = 'none';
    img.onload = function () { img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);

    const specs = [];
    if (item.lead_time_note) specs.push({ k: 'Lead time', v: item.lead_time_note });
    if (item.allergens) specs.push({ k: 'Allergens', v: item.allergens });
    document.getElementById('item-sheet-specs').innerHTML = specs.map(function (s) {
      return '<div class="spec-row"><span>' + s.k + '</span><b>' + escapeHtml(s.v) + '</b></div>';
    }).join('');

    const cta = document.getElementById('item-sheet-cta');
    const boxEl = document.getElementById('item-sheet-box');
    boxState = null;
    preorderState = null;

    if (item.is_assorted_box) {
      boxEl.style.display = 'block';
      openBoxPicker(item);
    } else if (item.listing_kind === 'preorder') {
      openPreorderPicker(item);
    } else {
      boxEl.style.display = 'none';
      boxEl.innerHTML = '';
      if (item.listing_kind === 'custom') {
        cta.textContent = 'Request a Custom Order';
        cta.disabled = false;
        cta.style.opacity = '1';
        cta.onclick = function () { window.location.href = customOrderURL(item); };
      } else if (item.listing_kind === 'digital') {
        const inCart = digitalCart.indexOf(item.id) !== -1;
        cta.textContent = (inCart ? 'Remove from Cart ✓ — $' : 'Add to Cart — $') + formatPrice(item.price);
        cta.disabled = !stripeReady;
        cta.style.opacity = stripeReady ? '1' : '.5';
        cta.onclick = stripeReady ? function () {
          toggleDigitalCartItem(item);
          closeItemSheet();
          showToast(inCart ? 'Removed from your download cart' : 'Added to your download cart');
        } : null;
      } else if (item.listing_kind === 'physical') {
        if (isSoldOut(item) || !stripeReady) {
          cta.textContent = isSoldOut(item) ? 'Sold Out' : 'Ordering Opens Soon';
          cta.disabled = true;
          cta.style.opacity = '.5';
        } else {
          cta.textContent = 'Add to Cart — $' + formatPrice(item.price);
          cta.disabled = false;
          cta.style.opacity = '1';
          cta.onclick = function () {
            changeShipQty(item, 1);
            closeItemSheet();
            showToast('Added to your ship cart');
          };
        }
      } else if (isSoldOut(item)) {
        cta.textContent = 'Sold Out';
        cta.disabled = true;
        cta.style.opacity = '.5';
      } else if (!stripeReady) {
        cta.textContent = 'Ordering Opens Soon';
        cta.disabled = true;
        cta.style.opacity = '.5';
      } else {
        cta.textContent = 'Add to Order';
        cta.disabled = false;
        cta.style.opacity = '1';
        cta.onclick = function () {
          changeQty(item, 1);
          closeItemSheet();
          showToast('Added to your order');
        };
      }
    }

    document.getElementById('item-scrim').classList.add('open');

    // CSS aspect-ratio on a flex item has inconsistent cross-browser
    // support for constraining height (notably iOS Safari) — set the
    // photo's height explicitly from its own resolved width instead of
    // relying on the browser to reconcile aspect-ratio with flex sizing.
    // clientWidth forces a synchronous layout, so this reads correctly
    // right after the sheet becomes visible.
    const photoEl = document.getElementById('item-sheet-photo');
    photoEl.style.height = photoEl.clientWidth + 'px';

    // Only now (sheet visible, clamp applied) do scrollHeight/clientHeight
    // reflect real layout — measuring this before .open is added would
    // read 0/0 off a display:none subtree and never show the toggle. A
    // short description that doesn't overflow isn't clickable at all —
    // opening a popup to show the exact same text it's already showing
    // would just be a dead tap.
    const descOverflows = descEl.scrollHeight > descEl.clientHeight + 1;
    descToggle.style.display = descOverflows ? 'block' : 'none';
    descEl.classList.toggle('tappable', descOverflows);
    if (!descOverflows) descEl.onclick = null;
  }
  function closeItemSheet() { document.getElementById('item-scrim').classList.remove('open'); }

  // ══════════════════════ Swipe down to dismiss ══════════════════════
  //
  // Mobile users expect a bottom sheet to close on a downward swipe, not
  // just the ✕ button. A touch starting inside the scrollable description
  // only arms the dismiss-drag once that area is already scrolled to its
  // top (scrollTop <= 0) — otherwise this would fight normal scrolling of
  // long descriptions. A touch starting on the photo or the fixed
  // name/price/button block arms immediately since neither scrolls.
  (function setupItemSheetSwipeDismiss() {
    const sheet = document.getElementById('item-sheet');
    const scrollArea = document.getElementById('item-sheet-scroll');
    let startY = 0;
    let currentY = 0;
    let dragging = false;
    let armed = false;

    sheet.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      startY = currentY = e.touches[0].clientY;
      dragging = true;
      armed = false;
      sheet.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', function (e) {
      if (!dragging || e.touches.length !== 1) return;
      currentY = e.touches[0].clientY;
      const deltaY = currentY - startY;
      if (deltaY <= 0) { armed = false; sheet.style.transform = ''; return; }

      if (!armed) {
        const inScrollArea = scrollArea.contains(e.target);
        if (inScrollArea && scrollArea.scrollTop > 0) return;
        armed = true;
      }

      e.preventDefault();
      sheet.style.transform = 'translateY(' + deltaY + 'px)';
    }, { passive: false });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      const deltaY = currentY - startY;
      if (armed && deltaY > 120) {
        closeItemSheet();
        sheet.style.transform = '';
      } else {
        sheet.style.transition = 'transform 0.25s ease-out';
        sheet.style.transform = '';
      }
      armed = false;
    }
    sheet.addEventListener('touchend', endDrag);
    sheet.addEventListener('touchcancel', endDrag);
  })();

  // ══════════════════════ Full-description popup ══════════════════════

  function openDescSheet(name, text) {
    document.getElementById('desc-sheet-body').innerHTML =
      '<div id="desc-sheet-title">' + escapeHtml(name) + '</div>' +
      '<div id="desc-sheet-text"></div>';
    document.getElementById('desc-sheet-text').textContent = text;
    document.getElementById('desc-scrim').classList.add('open');
  }
  function closeDescSheet() { document.getElementById('desc-scrim').classList.remove('open'); }

  // Same swipe-down-to-dismiss as the item sheet, simplified — desc-sheet
  // has no separate fixed/scroll split, it's just one scrollable block via
  // the shared .sheet overflow: auto, so the sheet itself is both the drag
  // target and the thing whose scrollTop needs checking.
  (function setupDescSheetSwipeDismiss() {
    const sheet = document.getElementById('desc-sheet');
    let startY = 0, currentY = 0, dragging = false, armed = false;

    sheet.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      startY = currentY = e.touches[0].clientY;
      dragging = true;
      armed = false;
      sheet.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', function (e) {
      if (!dragging || e.touches.length !== 1) return;
      currentY = e.touches[0].clientY;
      const deltaY = currentY - startY;
      if (deltaY <= 0) { armed = false; sheet.style.transform = ''; return; }
      if (!armed) {
        if (sheet.scrollTop > 0) return;
        armed = true;
      }
      e.preventDefault();
      sheet.style.transform = 'translateY(' + deltaY + 'px)';
    }, { passive: false });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      const deltaY = currentY - startY;
      if (armed && deltaY > 120) {
        closeDescSheet();
        sheet.style.transform = '';
      } else {
        sheet.style.transition = 'transform 0.25s ease-out';
        sheet.style.transform = '';
      }
      armed = false;
    }
    sheet.addEventListener('touchend', endDrag);
    sheet.addEventListener('touchcancel', endDrag);
  })();

  // ══════════════════════ Assorted Box picker ══════════════════════

  function openBoxPicker(item) {
    boxState = { item: item, tierId: null, chosen: {} };
    renderBoxPickerBody();
  }

  function renderBoxPickerBody() {
    const item = boxState.item;
    const tiers = item.size_tiers || [];
    const variants = item.variants || [];
    const activeTier = tiers.find(function (t) { return t.id === boxState.tierId; });
    const target = activeTier ? activeTier.unit_count : 0;
    const chosenTotal = Object.values(boxState.chosen).reduce(function (s, q) { return s + q; }, 0);

    const tierHtml = '<div class="box-tiers">' + tiers.map(function (t) {
      return '<button type="button" class="box-tier' + (t.id === boxState.tierId ? ' active' : '') + '" data-tier-id="' + t.id + '">' +
        '<div class="box-tier-label">' + escapeHtml(t.label) + '</div>' +
        '<div class="box-tier-price tabular">$' + formatPrice(t.price) + '</div>' +
        '</button>';
    }).join('') + '</div>';

    const flavorHtml = !activeTier ? '' :
      '<div class="box-flavor-header">Choose your flavors (' + chosenTotal + '/' + target + ')</div>' +
      variants.map(function (v) {
        const q = boxState.chosen[v.id] || 0;
        const plusDisabled = chosenTotal >= target;
        const minusDisabled = q === 0;
        return '<div class="box-flavor-row" data-variant-id="' + v.id + '">' +
          '<img class="box-flavor-thumb" src="' + variantImgURL(item, v) + '" alt="" onerror="this.style.visibility=\'hidden\'" />' +
          '<div class="box-flavor-name">' + escapeHtml(v.name) + '</div>' +
          '<div class="stepper">' +
          '<button type="button" class="box-minus"' + (minusDisabled ? ' disabled' : '') + '>−</button>' +
          '<span class="qty">' + q + '</span>' +
          '<button type="button" class="box-plus"' + (plusDisabled ? ' disabled' : '') + '>+</button>' +
          '</div></div>';
      }).join('');

    document.getElementById('item-sheet-box').innerHTML =
      '<div class="box-step-label">Choose your size</div>' + tierHtml + flavorHtml;

    wireBoxPickerEvents();
    updateBoxCTA();
  }

  function wireBoxPickerEvents() {
    document.querySelectorAll('.box-tier').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (boxState.tierId !== btn.dataset.tierId) {
          boxState.tierId = btn.dataset.tierId;
          boxState.chosen = {}; // switching size starts the flavor mix over
          renderBoxPickerBody();
        }
      });
    });
    document.querySelectorAll('.box-plus').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const vid = btn.closest('.box-flavor-row').dataset.variantId;
        const tiers = boxState.item.size_tiers || [];
        const tier = tiers.find(function (t) { return t.id === boxState.tierId; });
        const target = tier ? tier.unit_count : 0;
        const total = Object.values(boxState.chosen).reduce(function (s, q) { return s + q; }, 0);
        if (total >= target) return;
        boxState.chosen[vid] = (boxState.chosen[vid] || 0) + 1;
        renderBoxPickerBody();
      });
    });
    document.querySelectorAll('.box-minus').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const vid = btn.closest('.box-flavor-row').dataset.variantId;
        const q = boxState.chosen[vid] || 0;
        if (q <= 0) return;
        if (q - 1 <= 0) { delete boxState.chosen[vid]; } else { boxState.chosen[vid] = q - 1; }
        renderBoxPickerBody();
      });
    });
  }

  function updateBoxCTA() {
    const cta = document.getElementById('item-sheet-cta');
    const tiers = boxState.item.size_tiers || [];
    const tier = tiers.find(function (t) { return t.id === boxState.tierId; });
    if (!tier) {
      cta.textContent = 'Choose a size';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }
    const chosenTotal = Object.values(boxState.chosen).reduce(function (s, q) { return s + q; }, 0);
    const ready = chosenTotal === tier.unit_count;
    const canBuy = ready && stripeReady;
    cta.textContent = ready ? ('Add to Order — $' + formatPrice(tier.price)) : ('Choose ' + (tier.unit_count - chosenTotal) + ' more');
    cta.disabled = !canBuy;
    cta.style.opacity = canBuy ? '1' : '.5';
    cta.onclick = canBuy ? addBoxToCart : null;
  }

  function addBoxToCart() {
    const item = boxState.item;
    const tier = (item.size_tiers || []).find(function (t) { return t.id === boxState.tierId; });
    if (!tier) return;
    const variants = item.variants || [];
    const breakdown = Object.keys(boxState.chosen).filter(function (id) { return boxState.chosen[id] > 0; }).map(function (id) {
      const v = variants.find(function (x) { return x.id === id; });
      return { variantId: id, name: v ? v.name : '', qty: boxState.chosen[id] };
    });
    boxCartLines.push({
      lineId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()),
      menuItemId: item.id, itemName: item.name, tierId: tier.id, tierLabel: tier.label,
      unitCount: tier.unit_count, price: tier.price, qty: 1, variants: breakdown,
      taxCategory: item.tax_category, unitWeightGrams: item.unit_weight_grams
    });
    saveCart();
    updateCartUI();
    closeItemSheet();
    showToast('Added to your order');
  }

  function changeBoxLineQty(lineId, delta) {
    const line = boxCartLines.find(function (l) { return l.lineId === lineId; });
    if (!line) return;
    line.qty = Math.max(0, line.qty + delta);
    if (line.qty === 0) { boxCartLines = boxCartLines.filter(function (l) { return l.lineId !== lineId; }); }
    saveCart();
    updateCartUI();
  }

  function variantImgURL(item, variant) {
    return STORAGE_URL + '/menu-item-images/' + resolvedBakerId.toUpperCase() + '/' + item.id.toUpperCase() + '/variants/' + variant.id.toUpperCase() + '.jpg';
  }

  // ══════════════════════ Pre-order date picker ══════════════════════

  // Per-date capacity cache — { menuItemId: { dateTimeMs: committedQty } }.
  // Refetched fresh every time a multi-date picker opens (cheap aggregate
  // query), so it's never more than one sheet-open stale; the edge function
  // is the real authority and re-checks at checkout regardless.
  let preorderCommitmentsCache = {};

  function fetchPreorderCommitments(menuItemId) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/get_preorder_date_commitments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ p_menu_item_id: menuItemId })
    })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        const map = {};
        (rows || []).forEach(function (row) {
          map[new Date(row.preorder_date).getTime()] = Number(row.committed_qty) || 0;
        });
        preorderCommitmentsCache[menuItemId] = map;
        return map;
      })
      .catch(function () { return preorderCommitmentsCache[menuItemId] || {}; });
  }

  // Remaining stock for one candidate date — server-committed quantity plus
  // whatever this buyer already has in their own cart for that same date
  // (so repeatedly clicking + can't exceed the cap before a page refresh
  // would next refetch commitments), against the listing's shared per-date
  // cap (max_preorder_quantity; 0 = unlimited, matching MenuItem's semantics).
  function remainingForPreorderDate(item, dateMs) {
    const cap = item.max_preorder_quantity || 0;
    if (cap <= 0) return Infinity;
    const committed = (preorderCommitmentsCache[item.id] || {})[dateMs] || 0;
    const iso = new Date(dateMs).toISOString();
    const inCart = preorderCartLines
      .filter(function (l) { return l.menuItemId === item.id && l.chosenISO === iso; })
      .reduce(function (s, l) { return s + l.qty; }, 0);
    return Math.max(0, cap - committed - inCart);
  }

  function openPreorderPicker(item) {
    const boxEl = document.getElementById('item-sheet-box');
    const cta = document.getElementById('item-sheet-cta');

    if (isPreorderClosed(item)) {
      boxEl.style.display = 'block';
      boxEl.innerHTML = '<div class="box-step-label">Ordering has closed for this item.</div>';
      cta.textContent = 'Ordering Closed';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }

    const mode = item.preorder_schedule_mode || 'fixed_dates';
    if (mode === 'fixed_dates') {
      const dates = futurePreorderDates(item);
      if (dates.length > 1) {
        boxEl.style.display = 'block';
        // Always starts blank, even if this item already has cart lines —
        // re-opening the sheet is for adding another (possibly different)
        // date, not editing a prior choice; the existing line's qty stepper
        // in the cart is how a buyer adds more of an already-chosen date.
        preorderState = { item: item, chosenISO: null };
        boxEl.innerHTML = '<div class="box-step-label">Choose a pickup date</div><div class="box-tiers" style="flex-wrap:wrap;"></div>';
        cta.textContent = 'Choose a date';
        cta.disabled = true;
        cta.style.opacity = '.5';
        cta.onclick = null;
        fetchPreorderCommitments(item.id).then(function () {
          if (!preorderState || preorderState.item !== item) return; // buyer moved to a different item
          renderPreorderDatePicker(dates);
          updatePreorderCTA();
        });
        return;
      }
    }

    // Single deterministic date (or none, for lead_time) — no picker needed.
    const readyDate = resolvePreorderDate(item, null);
    if (readyDate) {
      boxEl.style.display = 'block';
      boxEl.innerHTML = '<div class="box-step-label">Ready ' + formatDateLong(readyDate) + '</div>';
    } else {
      boxEl.style.display = 'none';
      boxEl.innerHTML = '';
    }
    if (!stripeReady) {
      cta.textContent = 'Ordering Opens Soon';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }
    cta.textContent = 'Add to Order';
    cta.disabled = false;
    cta.style.opacity = '1';
    cta.onclick = function () { addPreorderToCart(item, readyDate ? readyDate.toISOString() : null); };
  }

  function renderPreorderDatePicker(dates) {
    const boxEl = document.getElementById('item-sheet-box');
    const item = preorderState.item;
    boxEl.innerHTML = '<div class="box-step-label">Choose a pickup date</div>' +
      '<div class="box-tiers" style="flex-wrap:wrap;">' + dates.map(function (d) {
        const iso = d.toISOString();
        const active = preorderState.chosenISO === iso;
        const remaining = remainingForPreorderDate(item, d.getTime());
        const soldOut = remaining <= 0;
        if (soldOut && active) preorderState.chosenISO = null;
        return '<button type="button" class="box-tier' + (active && !soldOut ? ' active' : '') + (soldOut ? ' disabled' : '') + '"' +
          (soldOut ? ' disabled' : '') + ' data-date="' + iso + '">' +
          '<div class="box-tier-label">' + formatDateShort(d) + '</div>' +
          (soldOut ? '<div class="box-tier-price">Sold out</div>' : '') +
        '</button>';
      }).join('') + '</div>';
    boxEl.querySelectorAll('.box-tier:not(.disabled)').forEach(function (btn) {
      btn.addEventListener('click', function () {
        preorderState.chosenISO = btn.dataset.date;
        renderPreorderDatePicker(dates);
        updatePreorderCTA();
      });
    });
  }

  function updatePreorderCTA() {
    const cta = document.getElementById('item-sheet-cta');
    if (!preorderState.chosenISO) {
      cta.textContent = 'Choose a date';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }
    const canBuy = stripeReady;
    cta.textContent = canBuy ? 'Add to Order' : 'Ordering Opens Soon';
    cta.disabled = !canBuy;
    cta.style.opacity = canBuy ? '1' : '.5';
    cta.onclick = canBuy ? function () { addPreorderToCart(preorderState.item, preorderState.chosenISO); } : null;
  }

  function addPreorderToCart(item, chosenISO) {
    const iso = chosenISO || null;
    const existing = preorderCartLines.find(function (l) { return l.menuItemId === item.id && l.chosenISO === iso; });
    if (existing) {
      existing.qty += 1;
    } else {
      preorderCartLines.push({
        lineId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()),
        menuItemId: item.id, chosenISO: iso, qty: 1
      });
    }
    saveCart();
    updateCartUI();
    closeItemSheet();
    showToast('Added to your order');
  }

  function changePreorderLineQty(lineId, delta) {
    const line = preorderCartLines.find(function (l) { return l.lineId === lineId; });
    if (!line) return;
    if (delta > 0 && line.chosenISO) {
      // Best-effort client-side guard using whatever commitments this
      // session already fetched (see preorderCommitmentsCache) — the edge
      // function is the real authority and re-checks fresh at checkout.
      const item = allListings.find(function (l) { return l.id === line.menuItemId; });
      if (item && remainingForPreorderDate(item, new Date(line.chosenISO).getTime()) <= 0) {
        showToast('No more available for that date');
        return;
      }
    }
    line.qty = Math.max(0, line.qty + delta);
    if (line.qty === 0) { preorderCartLines = preorderCartLines.filter(function (l) { return l.lineId !== lineId; }); }
    saveCart();
    updateCartUI();
  }

  // ══════════════════════ Cart / Checkout Sheet ══════════════════════

  function openCartSheet() {
    // Always opens this sheet first, regardless of which cart(s) have items
    // — a digital- or ship-only cart used to jump straight to its own
    // lightweight checkout page from here, which had no way to remove an
    // item (a baker reported this: the only fix was going back to the
    // listing and deselecting it). The sheet's own Continue button (see
    // wireCartStepEvents) is what actually decides whether to go to the
    // full pickup-info step or straight to a lighter digital/ship checkout
    // page — this function just makes sure that decision is always made
    // from a screen where every line item is removable.
    cartStep = 0;
    renderCartSheet();
    document.getElementById('cart-scrim').classList.add('open');
  }
  function closeCartSheet() { document.getElementById('cart-scrim').classList.remove('open'); }

  function renderCartSheet() {
    const body = document.getElementById('cart-sheet-body');
    if (cartStep === 0) body.innerHTML = renderCartStepOrder();
    else if (cartStep === 1) body.innerHTML = renderCartStepPickup();
    else body.innerHTML = renderCartStepConfirmed();
    wireCartStepEvents();
  }

  function renderCartStepOrder() {
    const lines = cartLines();
    const digitalItems = digitalCartItems();
    const shipLinesData = shipCartItems();
    if (lines.length === 0 && digitalItems.length === 0 && shipLinesData.length === 0) {
      return '<div id="cart-step-label">Your order</div>' +
        '<div class="empty-state">Your order is empty.</div>' +
        '<button class="btn btn-outline" id="cart-see-ready" style="width:100%;margin-top:12px;">Browse the menu</button>';
    }
    const rows = lines.map(function (l) {
      if (l.kind === 'box') {
        const breakdownStr = l.line.variants.map(function (v) { return v.qty + '× ' + v.name; }).join(', ');
        return '<div class="cart-line" data-line-kind="box" data-line-id="' + l.line.lineId + '">' +
          '<div class="thumb"><img src="' + itemImgURL(l.item) + '" alt="" onerror="this.style.display=\'none\'" /></div>' +
          '<div class="info"><div class="n">' + escapeHtml(l.item.name) + ' — ' + escapeHtml(l.line.tierLabel) + '</div><div class="m">' + escapeHtml(breakdownStr) + '</div></div>' +
          '<div class="stepper"><button class="line-minus">−</button><span class="qty">' + l.qty + '</span><button class="line-plus">+</button></div>' +
          '<div class="total tabular">$' + formatPrice(l.line.price * l.qty) + '</div>' +
          '</div>';
      }
      if (l.kind === 'preorder') {
        const date = resolvePreorderDate(l.item, l.line.chosenISO);
        const meta = date ? 'Ready ' + formatDateShort(date) : subtitleFor(l.item);
        return '<div class="cart-line" data-line-kind="preorder" data-line-id="' + l.line.lineId + '">' +
          '<div class="thumb"><img src="' + itemImgURL(l.item) + '" alt="" onerror="this.style.display=\'none\'" /></div>' +
          '<div class="info"><div class="n">' + escapeHtml(l.item.name) + '</div><div class="m">' + escapeHtml(meta) + '</div></div>' +
          '<div class="stepper"><button class="line-minus">−</button><span class="qty">' + l.qty + '</span><button class="line-plus">+</button></div>' +
          '<div class="total tabular">$' + formatPrice(l.item.price * l.qty) + '</div>' +
          '</div>';
      }
      return '<div class="cart-line" data-line-kind="plain" data-line-id="' + l.item.id + '">' +
        '<div class="thumb"><img src="' + itemImgURL(l.item) + '" alt="" onerror="this.style.display=\'none\'" /></div>' +
        '<div class="info"><div class="n">' + escapeHtml(l.item.name) + '</div><div class="m">' + escapeHtml(subtitleFor(l.item)) + '</div></div>' +
        '<div class="stepper"><button class="line-minus">−</button><span class="qty">' + l.qty + '</span><button class="line-plus">+</button></div>' +
        '<div class="total tabular">$' + formatPrice(l.item.price * l.qty) + '</div>' +
        '</div>';
    }).join('');
    const subtotal = cartSubtotal();
    const taxCents = cartTaxCents();

    // A mixed cart (pickup items + digital downloads) checks out as two
    // separate Stripe charges under the hood — see checkout.html — since a
    // pickup item's authorize-then-capture-on-accept can't share a
    // PaymentIntent with a digital item's instant capture. Folding the
    // digital lines into this same summary/total keeps it feeling like one
    // order to the buyer even though it settles as two charges.
    const digitalRows = digitalItems.map(function (item) {
      return '<div class="cart-line" data-line-kind="digital" data-line-id="' + item.id + '">' +
        '<div class="thumb"><img src="' + itemImgURL(item) + '" alt="" onerror="this.style.display=\'none\'" /></div>' +
        '<div class="info"><div class="n">' + escapeHtml(item.name) + '</div><div class="m">Instant digital download</div></div>' +
        '<button class="remove-btn" aria-label="Remove">✕</button>' +
        '<div class="total tabular">$' + formatPrice(item.price) + '</div>' +
        '</div>';
    }).join('');
    // Ship lines get the same qty-stepper look as a plain pickup line (not
    // digital's flat remove-✕ row) — a ships item is stock-bound and a
    // buyer can reasonably want more than one, unlike a digital download.
    const shipRows = shipLinesData.map(function (l) {
      return '<div class="cart-line" data-line-kind="ship" data-line-id="' + l.item.id + '">' +
        '<div class="thumb"><img src="' + itemImgURL(l.item) + '" alt="" onerror="this.style.display=\'none\'" /></div>' +
        '<div class="info"><div class="n">' + escapeHtml(l.item.name) + '</div><div class="m">Ships in ' + (l.item.lead_days || 3) + ' day' + (l.item.lead_days === 1 ? '' : 's') + '</div></div>' +
        '<div class="stepper"><button class="line-minus">−</button><span class="qty">' + l.qty + '</span><button class="line-plus">+</button></div>' +
        '<div class="total tabular">$' + formatPrice(l.item.price * l.qty) + '</div>' +
        '</div>';
    }).join('');
    const grandTotal = cartTotal() + digitalCartTotal() + shipCartTotal();
    const nonPickupVerticals = (digitalItems.length > 0 ? 1 : 0) + (shipLinesData.length > 0 ? 1 : 0);

    return '<div id="cart-step-label">Your order</div>' +
      rows +
      (lines.length > 0 ? (
        '<div class="cart-financial-row"><span>Subtotal</span><span class="tabular">$' + formatPrice(subtotal) + '</span></div>' +
        (taxCents > 0 ? '<div class="cart-financial-row"><span>Tax</span><span class="tabular">$' + formatPrice(taxCents / 100) + '</span></div>' : '')
      ) : '') +
      (digitalItems.length > 0 ? (
        '<div class="cart-section-label">Digital Downloads</div>' +
        digitalRows +
        '<div class="cart-financial-row"><span>Downloads subtotal</span><span class="tabular">$' + formatPrice(digitalCartTotal()) + '</span></div>'
      ) : '') +
      (shipLinesData.length > 0 ? (
        '<div class="cart-section-label">Ships to You</div>' +
        shipRows +
        '<div class="cart-financial-row"><span>Items subtotal</span><span class="tabular">$' + formatPrice(shipCartTotal() - shipCartShippingFees()) + '</span></div>' +
        (shipCartShippingFees() > 0 ? '<div class="cart-financial-row"><span>Shipping fee</span><span class="tabular">$' + formatPrice(shipCartShippingFees()) + '</span></div>' : '')
      ) : '') +
      '<div class="cart-financial-row total"><span>Total</span><span class="tabular">$' + formatPrice(grandTotal) + '</span></div>' +
      '<button class="btn btn-primary" id="cart-continue" style="width:100%;">Continue to ' + (lines.length > 0 || nonPickupVerticals > 1 ? 'checkout' : (digitalItems.length > 0 ? 'download details' : (shipLinesData.length > 0 ? 'shipping details' : 'pickup details'))) + '</button>' +
      '<div class="cart-note">' +
        (lines.length > 0 ? 'Upon confirmation of your order, pickup details will be provided by email. Customers are responsible for coordinating pickup of their order with the Seller.' : '') +
        (digitalItems.length > 0 ? ' Digital downloads are delivered instantly, separately from pickup items.' : '') +
        (shipLinesData.length > 0 ? ' Shipping items are a separate charge, and you\'ll be asked for a shipping address.' : '') +
      '</div>';
  }

  function renderCartStepPickup() {
    // No pickup-window picker — the baker coordinates the actual pickup
    // time directly with the customer using the contact details below,
    // rather than having the customer pre-select a slot here (this field
    // was also never actually read into the order payload).
    // No total/pay amount shown here either — this step only collects
    // contact info. checkout.html (next) is the one place that shows the
    // definitive fee/tax-inclusive total and actually takes payment, so
    // there's only ever one number for a buyer to trust.
    return '<div id="cart-step-label">Customer Information</div>' +
      '<div class="field"><label>Name</label><input id="f-name" type="text" autocomplete="name" /></div>' +
      '<div class="field"><label>Mobile</label><input id="f-phone" type="tel" autocomplete="tel" /></div>' +
      '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" /></div>' +
      '<div class="field"><label>Confirm email</label><input id="f-email-confirm" type="email" autocomplete="email" onpaste="return false" oncopy="return false" oncut="return false" /></div>' +
      '<div id="pay-error" style="color:var(--error);font-size:13px;margin-top:6px;"></div>' +
      '<button class="btn btn-primary" id="cart-pay" style="width:100%;">Continue to Payment</button>' +
      '<button class="btn" id="cart-back" style="width:100%;height:auto;padding:10px;text-decoration:underline;background:none;color:var(--muted);">Back to order</button>';
  }

  function renderCartStepConfirmed() {
    return '<div style="text-align:center;padding:20px 0;">' +
      '<div style="width:54px;height:54px;border-radius:50%;background:var(--ready);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto;">✓</div>' +
      '<div style="font-size:20px;font-weight:700;color:var(--ink);margin-top:16px;">Order confirmed</div>' +
      '<p style="font-size:14px;color:var(--bio);margin-top:10px;">The pickup address and window are in your email.</p>' +
      '<button class="btn btn-outline" id="cart-keep-shopping" style="width:100%;margin-top:20px;">Keep shopping</button>' +
      '</div>';
  }

  function wireCartStepEvents() {
    const seeReady = document.getElementById('cart-see-ready');
    if (seeReady) seeReady.addEventListener('click', function () { closeCartSheet(); });
    document.querySelectorAll('.line-minus, .line-plus').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const row = btn.closest('.cart-line');
        const id = row.dataset.lineId;
        const delta = btn.classList.contains('line-plus') ? 1 : -1;
        if (row.dataset.lineKind === 'box') {
          changeBoxLineQty(id, delta);
        } else if (row.dataset.lineKind === 'preorder') {
          changePreorderLineQty(id, delta);
        } else if (row.dataset.lineKind === 'ship') {
          const item = allListings.find(function (l) { return l.id === id; });
          changeShipQty(item, delta);
        } else {
          const item = allListings.find(function (l) { return l.id === id; });
          changeQty(item, delta);
        }
        renderCartSheet();
      });
    });
    document.querySelectorAll('.cart-line[data-line-kind="digital"] .remove-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const id = btn.closest('.cart-line').dataset.lineId;
        const idx = digitalCart.indexOf(id);
        if (idx !== -1) digitalCart.splice(idx, 1);
        saveCart();
        updateDigitalCartUI();
        // Keeps the underlying Digital Downloads row's own add-control (the
        // ✓/+ toggle) in sync — without this it kept showing "added" after
        // a removal here until the next full page load.
        renderDigitalFeed();
        renderCartSheet();
      });
    });
    const cont = document.getElementById('cart-continue');
    if (cont) cont.addEventListener('click', function () {
      // A pickup line (or 2+ non-pickup verticals at once — e.g. digital +
      // ship with no pickup items) goes through the full name/email step
      // and checkout.html, which chains whichever legs are actually
      // present. A single non-pickup vertical alone skips straight to its
      // own lighter single-purpose checkout page (no phone number, since
      // neither digital nor ship needs one for pickup coordination).
      const hasPickup = cartLines().length > 0;
      const hasDigital = digitalCartItems().length > 0;
      const hasShip = shipCartItems().length > 0;
      const verticalCount = (hasPickup ? 1 : 0) + (hasDigital ? 1 : 0) + (hasShip ? 1 : 0);
      if (hasPickup || verticalCount > 1) {
        cartStep = 1;
        renderCartSheet();
      } else if (hasDigital) {
        window.location.href = digitalCartCheckoutURL();
      } else if (hasShip) {
        window.location.href = shipCartCheckoutURL();
      }
    });
    const back = document.getElementById('cart-back');
    if (back) back.addEventListener('click', function () { cartStep = 0; renderCartSheet(); });
    const pay = document.getElementById('cart-pay');
    if (pay) pay.addEventListener('click', goToCheckout);
    const keep = document.getElementById('cart-keep-shopping');
    if (keep) keep.addEventListener('click', function () {
      cart = {}; boxCartLines = []; preorderCartLines = []; digitalCart = []; shipCart = {};
      saveCart(); updateCartUI(); updateDigitalCartUI(); updateShipCartUI(); closeCartSheet();
    });
  }

  // Hands the whole cart off to checkout.html as a sessionStorage payload —
  // avoids an unbounded query string for a multi-item order.
  function goToCheckout() {
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const emailConfirm = document.getElementById('f-email-confirm').value.trim();
    const errEl = document.getElementById('pay-error');
    if (!name || !phone || !email || !emailConfirm) {
      errEl.textContent = 'Please fill in your name, mobile and email (twice, to confirm).';
      return;
    }
    // A single mistyped character in the domain (e.g. .ckm instead of .com)
    // still looks like a syntactically valid email, so it passes any regex
    // check but silently fails to deliver — the confirmation email never
    // arrives and the baker has no working way to reach the customer.
    // Requiring the address twice catches exactly that class of typo.
    if (email.toLowerCase() !== emailConfirm.toLowerCase()) {
      errEl.textContent = "Those emails don't match — please check for typos.";
      return;
    }
    const payload = {
      baker: resolvedBakerId,
      theme: profile.selected_theme,
      pattern: profile.background_pattern,
      gstRegistered: profile.is_gst_registered ? '1' : '0',
      province: profile.pickup_province || '',
      customer: { name: name, phone: phone, email: email },
      items: cartLines().map(function (l) {
        if (l.kind === 'box') {
          return {
            id: l.item.id, name: l.item.name + ' — ' + l.line.tierLabel, qty: l.qty, price: l.line.price,
            taxCategory: l.item.tax_category, unitWeightGrams: l.item.unit_weight_grams,
            listingKind: 'ready_now', dropDate: '', maxQty: 0, availQty: 0,
            isAssortedBox: true, tierId: l.line.tierId, tierLabel: l.line.tierLabel, variants: l.line.variants
          };
        }
        if (l.kind === 'preorder') {
          return {
            id: l.item.id, name: l.item.name, qty: l.qty, price: l.item.price,
            taxCategory: l.item.tax_category, unitWeightGrams: l.item.unit_weight_grams,
            listingKind: l.item.listing_kind, dropDate: l.item.preorder_drop_date || '',
            maxQty: l.item.max_preorder_quantity || 0, availQty: l.item.available_qty_today || 0,
            // Only meaningful for fixed_dates mode with 2+ candidates — the
            // server re-validates this against the listing's actual dates
            // rather than trusting it outright; weekday/lead_time modes are
            // computed server-side from the listing itself, no buyer choice.
            // This line's own chosenISO (not a global per-item value), so a
            // cart with the same item on 3 different dates sends 3 distinct
            // line objects here instead of collapsing to one.
            chosenPreorderDate: l.line.chosenISO || ''
          };
        }
        return {
          id: l.item.id, name: l.item.name, qty: l.qty, price: l.item.price,
          taxCategory: l.item.tax_category, unitWeightGrams: l.item.unit_weight_grams,
          listingKind: l.item.listing_kind, dropDate: '', maxQty: 0, availQty: l.item.available_qty_today || 0
        };
      }),
      // Present only for a mixed cart — checkout.html runs this as a second,
      // separate charge after the pickup one (see comment on renderCartStepOrder
      // for why they can't share a PaymentIntent), then shows one combined
      // confirmation screen.
      digitalItems: digitalCartItems().map(function (item) {
        return { id: item.id, name: item.name, price: item.price };
      }),
      // A third, independent leg — same reasoning as digitalItems above,
      // but stock-bound (qty can be >1) and needs a shipping address,
      // which checkout.html collects just before charging this leg.
      shipItems: shipCartItems().map(function (l) {
        return { id: l.item.id, name: l.item.name, price: l.item.price, qty: l.qty, leadDays: l.item.lead_days || 3, shippingFee: l.item.shipping_fee || 0 };
      })
    };
    sessionStorage.setItem('bakeri_checkout_cart', JSON.stringify(payload));
    window.location.href = '/baker/checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&theme=' + encodeURIComponent(profile.selected_theme || '') +
      '&pattern=' + encodeURIComponent(profile.background_pattern || '');
  }

  // ══════════════════════ Helpers ══════════════════════

  function shareLink() {
    const url = window.location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(function () {});
    showToast('Link copied — ' + window.location.host + window.location.pathname);
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  function isSoldOut(item) {
    if (item.is_assorted_box) return false; // no plain daily quantity tracked
    if (item.listing_kind === 'preorder') return isPreorderClosed(item);
    return (item.listing_kind === 'ready_now' || item.listing_kind === 'physical') && (item.available_qty_today || 0) <= 0;
  }

  // ══════════════════════ Pre-order scheduling ══════════════════════
  // Three mutually exclusive modes a baker can set per listing — see
  // MenuItem.PreorderScheduleMode (iOS) / preorder_schedule_mode (Supabase):
  //   fixed_dates — 1+ candidate dates; buyer picks one if there's >1
  //   weekday     — a day of week + an explicit order-by cutoff
  //   lead_time   — ready N days after whenever the buyer orders

  function futurePreorderDates(item) {
    const raw = (item.preorder_dates && item.preorder_dates.length)
      ? item.preorder_dates
      : (item.preorder_drop_date ? [item.preorder_drop_date] : []);
    return raw.map(function (d) { return new Date(d); })
      .filter(function (d) { return d > new Date(); })
      .sort(function (a, b) { return a - b; });
  }

  // Mirrors MenuItem.weekdayComputedReadyDate exactly: the first date
  // strictly after the cutoff matching the chosen weekday. JS Date.getDay()
  // is 0=Sun...6=Sat; Calendar's convention (used server-side and in the
  // app) is 1=Sun...7=Sat, hence the +1.
  function computeWeekdayReadyDate(weekday, cutoffISO) {
    if (!weekday || !cutoffISO) return null;
    const date = new Date(cutoffISO);
    date.setDate(date.getDate() + 1);
    for (let i = 0; i < 7; i++) {
      if (date.getDay() + 1 === weekday) return date;
      date.setDate(date.getDate() + 1);
    }
    return null;
  }

  // The listing's one deterministic ready date for fixed_dates-with-1-date,
  // weekday, and lead_time modes — null for lead_time (no fixed date exists;
  // the server computes now+lead_days at order time) and for fixed_dates
  // with no chosen date yet when there's more than one candidate.
  function resolvePreorderDate(item, chosenISO) {
    const mode = item.preorder_schedule_mode || 'fixed_dates';
    if (mode === 'weekday') return computeWeekdayReadyDate(item.preorder_weekday, item.preorder_order_cutoff_date);
    if (mode === 'lead_time') return null;
    if (chosenISO) return new Date(chosenISO);
    const dates = futurePreorderDates(item);
    return dates.length ? dates[0] : null;
  }

  function isPreorderClosed(item) {
    const mode = item.preorder_schedule_mode || 'fixed_dates';
    if (mode === 'weekday') {
      return item.preorder_order_cutoff_date ? new Date() > new Date(item.preorder_order_cutoff_date) : false;
    }
    if (mode === 'lead_time') return false;
    const raw = (item.preorder_dates && item.preorder_dates.length)
      ? item.preorder_dates
      : (item.preorder_drop_date ? [item.preorder_drop_date] : []);
    if (!raw.length) return false;
    return raw.every(function (d) { return new Date(d) < new Date(); });
  }

  function formatDateShort(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function formatDateLong(d) { return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }

  // Plain kind badge — used on grid cards. A sold-out ready_now item keeps
  // its normal "Ready Now" tag, distinguished only by lighter subtitle
  // text below (see subtitleFor) — swapping the tag itself in a dense
  // grid would read as a second, competing badge type.
  function kindBadgeInfo(item) {
    // Assorted Box is a composition detail, not a fulfillment type — the
    // badge should still say Ready Now/Pre-order like any other listing
    // (that's the info a buyer actually needs at a glance); "pick your own
    // flavors" in the subtitle already signals it's a box.
    if (item.listing_kind === 'ready_now') return { bg: 'var(--ready)', label: 'Ready Now' };
    if (item.listing_kind === 'preorder')  return { bg: 'var(--preorder)', label: 'Pre-order' };
    if (item.listing_kind === 'digital')   return { bg: 'var(--digital)', label: 'Digital' };
    if (item.listing_kind === 'physical')  return { bg: 'var(--physical)', label: 'Ships' };
    return { bg: 'var(--custom)', label: 'Custom' };
  }

  // Sold-out-aware badge — used only in the item detail sheet.
  function badgeInfo(item) {
    if (isSoldOut(item)) return { bg: 'var(--muted)', label: 'Sold Out' };
    return kindBadgeInfo(item);
  }

  function subtitleFor(item) {
    if (item.is_assorted_box) return 'Pick your own flavors';
    if (item.listing_kind === 'custom') return item.lead_time_note || 'Request a custom quote';
    if (item.listing_kind === 'digital') return 'Instant digital download';
    if (item.listing_kind === 'physical') {
      if (isSoldOut(item)) return 'Sold out';
      const n = item.lead_days || 3;
      return (item.available_qty_today || 0) + ' in stock · ships in ' + n + ' day' + (n === 1 ? '' : 's');
    }
    if (item.listing_kind === 'preorder') {
      if (item.lead_time_note) return item.lead_time_note;
      if (isPreorderClosed(item)) return 'Ordering closed';
      const mode = item.preorder_schedule_mode || 'fixed_dates';
      if (mode === 'weekday') {
        const ready = computeWeekdayReadyDate(item.preorder_weekday, item.preorder_order_cutoff_date);
        return ready ? 'Ready ' + formatDateShort(ready) : 'Order ahead';
      }
      if (mode === 'lead_time') {
        const n = item.lead_days || 2;
        return 'Ready in ' + n + ' day' + (n === 1 ? '' : 's');
      }
      const dates = futurePreorderDates(item);
      if (dates.length > 1) return 'Pick a pickup date';
      if (dates.length === 1) return 'Ready ' + formatDateShort(dates[0]);
      return 'Order ahead';
    }
    if (isSoldOut(item)) return 'Sold out for today';
    if (item.listing_kind === 'ready_now' && item.available_qty_today > 0) return item.available_qty_today + ' available today';
    return item.item_description || '';
  }

  function priceIsFrom(item) { return item.listing_kind === 'custom' || item.is_assorted_box === true; }
  function formatPrice(v) { return parseFloat(v).toFixed(2); }

  function photoFallback(item) {
    const ph = document.createElement('div');
    ph.className = 'ph-fallback';
    ph.style.position = 'absolute'; ph.style.inset = '0';
    ph.textContent = categoryEmoji(item);
    return ph;
  }

  function itemImgURL(item) {
    return STORAGE_URL + '/menu-item-images/' + resolvedBakerId.toUpperCase() + '/' + item.id.toUpperCase() + '.jpg';
  }

  function customOrderURL(item) {
    return '/baker/custom-order.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&item=' + encodeURIComponent(item.id) +
      '&form=' + encodeURIComponent(item.intake_form_id || '') +
      '&name=' + encodeURIComponent(item.name) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  // Falls back by listing_kind rather than always defaulting to 🍰 — a cake
  // slice is a nonsensical placeholder for an unrecognized physical or
  // digital category (a baker's own free-text "Cookie Cutters"/"Printable
  // Labels"/etc. will never all be enumerable here).
  function categoryEmoji(item) {
    const map = {
      'Cakes': '🎂', 'Cookies': '🍪', 'Bread': '🍞', 'Pastries': '🥐',
      'Cupcakes': '🧁', 'Pies': '🥧', 'Donuts': '🍩', 'Macarons': '🫶',
      'Muffins': '🧁', 'Bars': '🍫'
    };
    if (map[item.category]) return map[item.category];
    if (item.listing_kind === 'physical') return '📦';
    if (item.listing_kind === 'digital') return '📄';
    return '🍰';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function showNotFound(title, subtitle) {
    document.body.innerHTML = '<div class="empty-state"><h2 style="color:var(--ink);margin-bottom:8px;font-size:18px;">' + escapeHtml(title) + '</h2><p>' + escapeHtml(subtitle) + '</p></div>';
  }
})();
</script>
</body>
</html>
