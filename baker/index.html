<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri</title>
  <meta name="description" content="View this baker's storefront on Bakeri." />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="theme.js"></script>

  <style>
    :root {
      /* Overwritten at runtime by theme.js from the baker's chosen in-app
         theme (profiles.selected_theme) — pre-load fallback. */
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-gold:      #C49A6C;
      --theme-button-fg: #FFFFFF;

      /* Baker-adaptive */
      --bg:        var(--theme-bg);
      --accent:    var(--theme-primary);
      --accent-fg: var(--theme-button-fg);

      /* Fixed tokens from BakeriTheme.swift's storefront profile redesign
         (bakeriProfileInk/Muted/Bio/ChipText, bakeriProfileBadge*) — the
         same values used for the in-app baker profile, so the web page
         reads as the same product. */
      --surface:    #FFFFFF;
      --ink:        #241712;
      --muted:      #948577;
      --bio:        #4A3E33;
      --chip-text:  #7A6C5D;
      --line:       rgba(36,23,18,0.08);
      --line-soft:  rgba(36,23,18,0.06);
      --ready:      #3FA672;
      --preorder:   #C79A3D;
      --custom:     #A66A5B;
      --digital:    #5F92E6;
      --physical:   #7A8C5C;
      --error:      #C0392B;

      --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --theme-bg: #17110C;
        --surface:  #241A14;
        --ink:      #F6F1E6;
        --bio:      #E4D9C8;
        --muted:    #A69B8C;
        --chip-text:#C2B29E;
        --line:     rgba(246,241,230,0.10);
        --line-soft:rgba(246,241,230,0.08);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--bio);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }
    .hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── Photo placeholder (used until a real image loads) ── */
    .ph-fallback {
      background: var(--line-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }

    /* ══════════════════════ Page shell ══════════════════════
       Everything (header through footer) lives in one width-constrained,
       opaque column — matches the in-app screen anatomy (flat cream band,
       white filter strip, then the pattern behind the product grid) and
       keeps every section the same width instead of some bleeding full-
       width and others not. The fixed pattern layer (theme.js) sits behind
       this whole shell, so on desktop it only shows in the side margins;
       on mobile the shell fills the viewport, so no margin — no pattern. */
    #page-shell { max-width: 1200px; margin: 0 auto; background: var(--bg); position: relative; }

    /* Floats over the hero (photo or plain background) instead of a
       separate fixed/sticky bar — scrolls away with the hero, doesn't
       persist over the rest of the page. */
    #site-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      padding: 14px 16px;
    }
    .circle-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(36,23,18,.08), 0 6px 16px rgba(36,23,18,.06);
    }
    #cart-btn { position: relative; }
    #cart-btn-count {
      position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 3px;
      border-radius: 9999px; background: var(--accent); color: var(--accent-fg);
      font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    #cart-btn-count:empty { display: none; }

    /* ══════════════════════ Header image ══════════════════════
       The photo is a full-bleed background behind the entire hero (logo,
       name, meta pill, bio) rather than a banner that just peeks above it —
       #storefront-header is absolutely positioned to fill #profile-hero,
       whatever height that ends up being (driven by profile-block's actual
       content), not a fixed aspect ratio. Falls back to a plain
       theme-colored gradient when the baker hasn't set one (img.onerror
       below), same convention as the about-portrait fallback. */
    #profile-hero { position: relative; }
    #storefront-header {
      position: absolute; inset: 0; overflow: hidden;
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
    }
    #storefront-header img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    /* Flat scrim, not just a bottom gradient — text sits everywhere in the
       block now (avatar ring, name, meta pill, bio), not only at the
       bottom, so it all needs consistent legibility against the photo. */
    #header-scrim { position: absolute; inset: 0; background: rgba(20,15,10,.42); }

    #profile-block { text-align: center; padding: 64px 20px 22px; position: relative; z-index: 1; }
    #profile-block .avatar {
      width: 128px; height: 128px; font-size: 42px; margin: 0 auto;
      box-shadow: 0 0 0 4px var(--bg), 0 2px 6px rgba(36,23,18,.15);
    }
    #shop-name { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 14px; }
    #shop-meta {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
      background: var(--line-soft); padding: 5px 12px; border-radius: 9999px;
    }
    #shop-meta span { font-size: 12.5px; font-weight: 500; color: var(--chip-text); }
    #shop-bio {
      font-size: 14.5px; line-height: 1.45; color: var(--bio);
      margin: 14px auto 0; max-width: 600px;
    }
    /* Social accounts (baker_links section literally named "Social") — small
       round icons in the hero, not rectangular rows in the body. Real
       platform icons (assets/social/*.png): a solid black circle with the
       logo cut out as transparent. Used as a CSS mask (not a plain <img>)
       on a var(--accent)-colored circle — the theme color paints the circle
       itself, the logo shape shows the wrapper's --bg behind it. Recoloring
       this way (vs. layering the image on top of a color) keeps the logo
       legible even for a near-black theme accent (Classic is #1C1C1E) —
       stacking the raw image over a same-toned color would make the cutout
       collapse into the circle with no contrast at all. */
    #social-icons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .social-icon {
      position: relative; width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; background: var(--bg);
      box-shadow: 0 1px 3px rgba(36,23,18,.15);
    }
    .social-icon-mask {
      position: absolute; inset: 0; background: var(--accent);
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      -webkit-mask-size: cover; mask-size: cover;
    }
    .social-icon-fallback { position: relative; font-size: 15px; }
    /* Once a header photo is showing, name/meta/bio switch to light text
       over the scrim instead of the plain-background dark ink tones. The
       icons themselves don't need a variant — they're already a solid
       black circle, legible against photo or plain background alike. */
    #profile-hero.has-photo #shop-name,
    #profile-hero.has-photo #shop-bio { color: #fff; }
    #profile-hero.has-photo #shop-meta { background: rgba(255,255,255,.22); }
    #profile-hero.has-photo #shop-meta span { color: #fff; }

    /* About / Store policies — plain body sections further down the page,
       same treatment as FAQ/Hours, not disclosure rows in the header block
       anymore: they're real content, not something to tuck away. */
    /* Editorial — the portrait floats within the text (magazine-style pull
       image) instead of sitting in a fixed-size side column next to it, so
       it actually scales with the available width instead of staying a
       small fixed thumbnail regardless of how much room there is. Mobile
       width is a plain percentage; the >=860px override below pushes it out
       to roughly a quarter of the (up to 1200px) content column. */
    .profile-about-inner { margin-top: 12px; }
    .profile-about-inner::after { content: ""; display: table; clear: both; }
    .about-portrait {
      float: left; width: 42%; max-width: 220px; aspect-ratio: 4 / 5; height: auto;
      border-radius: 14px; object-fit: cover; background: var(--line-soft);
      margin: 0 18px 10px 0;
    }
    #pb-about p, #pb-policies p { font-size: 13.5px; line-height: 1.65; color: var(--bio); }
    /* ══════════════════════ Section bands ══════════════════════
       Every top-level content section (Menu, Links, About, FAQ, Store
       Policies, Store Hours) shares this — a plain white background, and a
       divider line automatic between any two of them regardless of which
       are hidden (a hidden one in between takes no visual space, so the
       divider still lands exactly at the seam a visitor actually sees).
       Footer is deliberately excluded — it reads as the page's close, not
       another content section. */
    .section-band { background: var(--surface); padding: 20px 20px 24px; }
    .section-band + .section-band { border-top: 1px solid var(--line); }
    .section-band h2 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    /* Sits outside #feed (the filter chips/grid are their own elements, not
       nested under one wrapper) so the heading can lead them both. */
    .section-band-heading {
      font-size: 16px; font-weight: 700; color: var(--ink);
      background: var(--surface); padding: 20px 20px 0;
    }

    /* ══════════════════════ Filter strip — white band ══════════════════ */
    #filter-strip { background: var(--surface); border-bottom: 1px solid var(--line); }
    #filter-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px;
      justify-content: center; scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; padding: 8px 16px; border-radius: 9999px; border: 1.5px solid var(--line);
      background: var(--bg); color: var(--ink); cursor: pointer;
      font-family: var(--sans); font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .filter-chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* ══════════════════════ Section nav ══════════════════════
       The section names themselves ARE the navigation — Menu (the only
       swappable tab) + a scroll-to shortcut for every other always-visible
       section (Digital Downloads, About, Store Policies, Store Hours, one
       per distinct baker_links section) — no separate heading text
       anywhere else, no redundant second label. Always visible, even
       with only "Menu" — a lone heading is still the section's title. */
    #section-nav-wrap { background: var(--surface); border-bottom: 1px solid var(--line); }
    /* Wraps instead of horizontally scrolling — every section name needs to
       be visible up front, not hidden behind a swipe. */
    #section-nav {
      display: flex; flex-wrap: wrap; gap: 10px 22px; padding: 14px 20px;
      /* On a full-viewport-width bar, keep the tab row itself aligned with
         the same centered column as the rest of the content below it. */
      max-width: 1200px; margin: 0 auto;
    }
    .section-tab {
      flex-shrink: 0; background: none; border: none; cursor: pointer; font-family: var(--sans);
      font-size: 16px; font-weight: 700; color: var(--muted); padding: 0 0 4px;
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .section-tab.active { color: var(--ink); border-bottom-color: var(--accent); }

    /* Shop collapses every product section (Baked Goods, Digital Downloads,
       each physical category) into one nav entry with a dropdown — without
       this, a baker with several physical categories would blow the nav bar
       out to one pill per category. */
    .shop-tab-wrap { position: relative; }
    .shop-tab-btn { display: flex; align-items: center; gap: 4px; }
    .shop-tab-btn .chev { font-size: 11px; }
    .shop-dropdown {
      position: absolute; top: calc(100% + 10px); left: 0; z-index: 40;
      background: var(--surface); border-radius: 14px; padding: 6px;
      box-shadow: 0 12px 30px -8px rgba(0,0,0,.25); min-width: 200px;
    }
    .shop-dropdown.hidden { display: none; }
    .shop-dropdown-item {
      display: block; width: 100%; text-align: left; background: none; border: none;
      font-family: var(--sans); font-size: 14.5px; font-weight: 600; color: var(--ink);
      padding: 10px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    }
    .shop-dropdown-item:hover { background: var(--line-soft); }

    /* ══════════════════════ Link sections ══════════════════════
       Always visible, every configured section stacked at once — not one
       swapped in behind a nav click, which made Social links effectively
       invisible unless a visitor happened to tap the tab. */
    #links-feed { padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .link-section + .link-section { border-top: 1px solid var(--line); padding-top: 14px; }
    .link-list { display: flex; flex-direction: column; gap: 10px; }
    .link-row {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px;
      background: var(--bg); text-decoration: none; cursor: pointer;
    }
    .link-row .circle {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--line-soft);
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--muted);
    }
    .link-row .label { font-size: 14.5px; font-weight: 600; color: var(--ink); flex: 1; }
    .link-row .arrow { color: var(--muted); font-size: 14px; }

    /* ══════════════════════ Product Grid ══════════════════════
       Matches the app's own Market (listings) card exactly: photo with an
       overlaid kind badge, name + availability, a divider, then price +
       action on their own row — not an invented layout. The baker's
       chosen background pattern shows behind these cards (theme.js's
       #theme-pattern-layer). */
    #feed { padding: 18px 20px 28px; }
    #product-grid, .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

    /* ══════════════════════ Shop sections (categories) ══════════════════
       Physical items group into one headed block per category (Cookie
       Cutters, Cookie Stamps, ...) instead of one flat list — each block
       reuses .product-grid, the same photo-card grid the Menu section uses. */
    .category-block { padding: 18px 20px 8px; background: var(--surface); }
    .category-block h2 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
    .category-block:first-child { border-top: 1px solid var(--line); }
    .category-block:last-child { padding-bottom: 28px; }

    /* Digital Downloads render as plain rows, not photo-grid cards — a file
       isn't a physical product you're judging by its thumbnail the way a
       cake or cookie box is, and a lone item stretching to fill a whole
       grid cell looked broken (see 2026-08-01 screenshot report). */
    #digital-grid { display: flex; flex-direction: column; }
    .digital-row {
      display: flex; align-items: center; gap: 14px; padding: 12px 0;
      border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .digital-row:last-child { border-bottom: none; }
    .digital-row .thumb {
      width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0; position: relative;
      overflow: hidden; background: var(--line-soft);
    }
    .digital-row .thumb img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .digital-row .thumb .ph-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .digital-row .info { flex: 1; min-width: 0; }
    .digital-row .info .n { font-size: 14.5px; font-weight: 700; color: var(--ink); }
    .digital-row .info .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .digital-row .price { font-size: 14px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .p-card {
      cursor: pointer; background: var(--surface); border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 5px rgba(36,23,18,.08);
    }
    .p-card .p-photo { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--bg); }
    .p-card .p-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .p-badge {
      position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 9999px; color: #fff;
    }
    .p-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; }
    .p-body { padding: 10px 12px 11px; }
    .p-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
    .p-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .p-divider { border-top: 1px solid var(--line); margin-top: 9px; padding-top: 8px; }
    .p-price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .p-price { font-size: 13.5px; font-weight: 700; color: var(--accent); }
    .p-price .from { font-size: 9.5px; font-weight: 400; color: var(--muted); display: block; }

    .add-btn, .qty-stepper { height: 32px; flex-shrink: 0; }
    .add-btn {
      width: 32px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-fg);
      font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .add-btn.added { background: var(--digital); font-size: 14px; }
    .qty-stepper {
      display: flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 9999px; overflow: hidden;
      animation: popIn .16s ease-out;
    }
    .qty-stepper button {
      width: 26px; height: 100%; border: none; background: transparent; color: var(--ink);
      font-size: 14px; cursor: pointer;
    }
    .qty-stepper .qty { font-size: 12px; padding: 0 2px; color: var(--ink); min-width: 12px; text-align: center; }
    @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }

    /* ══════════════════════ FAQ ══════════════════════ */
    .faq-row { border-bottom: 1px solid var(--line); }
    .faq-row:last-child { border-bottom: none; }
    .faq-q {
      width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between;
      background: none; border: none; text-align: left; cursor: pointer; padding: 10px 0;
      font-size: 14.5px; font-weight: 600; color: var(--ink);
    }
    .faq-q .ind { color: var(--muted); font-size: 18px; }
    .faq-a { max-height: 0; overflow: hidden; transition: max-height .2s ease-out; }
    .faq-a p { font-size: 13.5px; line-height: 1.7; color: var(--bio); padding-bottom: 14px; }
    .faq-row.open .faq-a { max-height: 400px; }

    /* Store Hours — free-flowing text elsewhere in these sections is fine
       filling the full-width container; a day/time list isn't. A
       space-between row stretched across the whole container would strand
       "Mon" and "9:00–17:00" at opposite edges with a long dead gap between
       them, so the row list itself stays a compact, natural width. */
    #hours-rows { max-width: 320px; }
    #hours-card .row { display: flex; justify-content: space-between; gap: 24px; padding: 4px 0; font-size: 13px; }
    #hours-card .day { color: var(--muted); }
    #hours-card .time { color: var(--ink); }

    /* ══════════════════════ Footer ══════════════════════ */
    #site-footer { background: var(--surface); border-top: 1px solid var(--line); padding: 20px 20px 120px; text-align: center; }
    #footer-contact { font-size: 12.5px; line-height: 1.7; color: var(--muted); }
    #footer-contact a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    #footer-credit { margin-top: 18px; font-size: 12px; color: var(--muted); }
    #footer-credit a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

    /* ══════════════════════ Fixed Bottom Bar — only ever shows once the
       cart has something in it; an empty-cart CTA here would just repeat
       the page itself. ══════════════════════ */
    #action-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    }
    #action-bar-cart {
      display: none; align-items: center; justify-content: space-between; height: 56px;
      background: var(--accent); color: var(--accent-fg); border-radius: 9999px; padding: 0 8px 0 20px; cursor: pointer;
      border: none; width: 100%; box-shadow: 0 10px 30px -8px rgba(0,0,0,.35);
      animation: popIn .18s ease-out;
    }
    #action-bar-cart .l { text-align: left; }
    #action-bar-cart .l .t { font-size: 14.5px; font-weight: 700; }
    #action-bar-cart .l .s { font-size: 11px; color: var(--accent-fg); opacity: .75; margin-top: 2px; }
    #action-bar-cart .r {
      font-size: 14px; font-weight: 700; background: var(--surface); color: var(--ink);
      border-radius: 9999px; padding: 10px 16px;
    }
    /* Digital downloads have their own bar (see digitalCart) — same shape
       as the pickup cart's, distinguished with --digital instead of the
       theme accent so it's clearly a separate mini-cart at a glance. Sits
       above the pickup bar when both are visible (a mixed cart). */
    #action-bar-digital-cart {
      display: none; align-items: center; justify-content: space-between; height: 56px;
      background: var(--digital); color: #fff; border-radius: 9999px; padding: 0 8px 0 20px; cursor: pointer;
      border: none; width: 100%; box-shadow: 0 10px 30px -8px rgba(0,0,0,.35);
      animation: popIn .18s ease-out; margin-bottom: 8px;
    }
    #action-bar-digital-cart .l { text-align: left; }
    #action-bar-digital-cart .l .t { font-size: 14.5px; font-weight: 700; }
    #action-bar-digital-cart .l .s { font-size: 11px; color: #fff; opacity: .75; margin-top: 2px; }
    #action-bar-digital-cart .r {
      font-size: 14px; font-weight: 700; background: var(--surface); color: var(--ink);
      border-radius: 9999px; padding: 10px 16px;
    }
    /* Ships (physical) items get their own bar too, same shape again —
       distinguished with --physical. Sits above both the digital and
       pickup bars when all three are visible at once. */
    #action-bar-ship-cart {
      display: none; align-items: center; justify-content: space-between; height: 56px;
      background: var(--physical); color: #fff; border-radius: 9999px; padding: 0 8px 0 20px; cursor: pointer;
      border: none; width: 100%; box-shadow: 0 10px 30px -8px rgba(0,0,0,.35);
      animation: popIn .18s ease-out; margin-bottom: 8px;
    }
    #action-bar-ship-cart .l { text-align: left; }
    #action-bar-ship-cart .l .t { font-size: 14.5px; font-weight: 700; }

      border-radius: 9999px; padding: 10px 16px;

    /* ══════════════════════ Sheets / Modal / Toast ══════════════════════ */
    .scrim {
      position: fixed; inset: 0; background: rgba(20,15,10,.55); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .scrim.open { display: flex; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 480px; max-height: 90%; overflow: auto;
      overscroll-behavior: contain;
      border-radius: 24px 24px 0 0; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
      animation: riseIn .22s ease-out;
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sheet-close {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(20,15,10,.5); color: #fff; border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 9999px; border: none; cursor: pointer; font-weight: 700; font-size: 15px;
      text-decoration: none; font-family: var(--sans);

    .btn-primary { height: 50px; background: var(--accent); color: var(--accent-fg); }
    .btn-outline { height: 48px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

    /* Same 1/1 ratio as .p-card .p-photo in the grid — the detail sheet's
       photo should look like the same product photo, just larger, not a
       differently-cropped shape. */
    /* Photo stays pinned at the top; only the body scrolls internally — a
       long description used to drag the photo along with it inside one
       shared scroll area, which also let the sheet rubber-band past its own
       edges on touch and expose blank space behind the rounded corners. */
    /* Overrides .sheet's shared max-height: 90% — with real content (photo +
       fixed header + a long description) the sheet already reached that cap
       naturally, so raising it (not just replacing max-height with an equal
       height) is what actually reclaims the dimmed gap above it for the
       description to use. Cart sheet keeps the shared 90%; this is scoped
       to the item detail sheet specifically. */
    #item-sheet { display: flex; flex-direction: column; overflow: hidden; height: 96%; max-height: 96%; }
    #item-sheet-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    /* min-height: 0 overrides the flex-item default of min-height: auto —
       without it, a tall portrait source photo whose height:100% can't
       resolve against an aspect-ratio-only parent falls back to its natural
       aspect ratio and forces this box taller than its intended 1/1 square,
       eating into the space the scrollable body needs below it. */
    /* touch-action: none — the photo has no scrollable content of its own,
       so a touch/scroll gesture starting on it could otherwise fall through
       and pan the page behind the sheet on iOS Safari. This stops the
       gesture at its source instead of locking/restoring body scroll (which
       caused its own bug: the page jumping back to the tapped card's
       position when the sheet closed). */
    #item-sheet-photo { position: relative; aspect-ratio: 1/1; background: var(--line-soft); flex: none; min-height: 0; overflow: hidden; touch-action: none; }
    #item-sheet-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    /* Name/price/box-selector/cta stay put; only the description+specs
       scroll. Two flex children instead of one shared scroll area, same
       reasoning as the photo/body split above. */
    #item-sheet-body { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 18px 20px 22px; }
    #item-sheet-fixed { flex: none; }
    #item-sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    #item-sheet-name { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 10px; }
    #item-sheet-price { font-size: 17px; font-weight: 700; color: var(--accent); margin-top: 4px; }
    #item-sheet-desc { font-size: 14px; line-height: 1.7; color: var(--bio); margin-top: 16px; }

       long one doesn't dominate the sheet on open — "Read more" only shows
       up when the text actually overflows the clamp (see openItemSheet). */
    #item-sheet-desc.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    #item-sheet-desc.tappable { cursor: pointer; }
    #item-sheet-desc-toggle {

    .field { margin-top: 12px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 14px;
    }

    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 9999px; font-size: 13px;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .avatar {
      border-radius: 50%; background: var(--theme-secondary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; overflow: hidden; position: relative;
      box-shadow: 0 2px 6px rgba(36,23,18,.15);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }

    /* ══════════════════════ Desktop ══════════════════════ */
    @media (min-width: 860px) {
      /* Stands the column off the patterned backdrop showing in the side
         margins — on mobile the shell fills the viewport edge to edge, so
         there's no backdrop to separate from and no shadow needed there. */
      #page-shell { box-shadow: 0 8px 40px rgba(20,15,10,.14); }

      /* auto-fit (not auto-fill) — with only a few cards, auto-fill still
         reserves the grid columns unfilled cards WOULD have used, leaving
         a dead gap where a phantom next card should be. auto-fit collapses
         those, letting the real cards stretch to actually fill the row. */
      #product-grid, .product-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; }
      /* A lone card has no neighbors to share the row with, so auto-fit's
         one remaining track stretches to the full container width instead
         of staying card-sized — cap it explicitly for the single-item case
         without touching the intentional stretch behavior for 2+ cards. */
      #product-grid:has(> .p-card:only-child), .product-grid:has(> .p-card:only-child) { grid-template-columns: minmax(180px, 320px); }
      .p-card:hover .p-photo { opacity: .92; }

      #desktop-cart-btn { display: flex !important; }

      #cart-sheet { max-width: 800px; width: 90%; border-radius: 24px; max-height: 88vh; }

      #item-sheet { max-width: 560px; width: 90%; border-radius: 24px; max-height: 92vh; height: 92vh; }

      #cart-sheet { max-width: 440px; margin-left: auto; margin-right: 0; height: 100%; max-height: 100%; border-radius: 0; box-shadow: -20px 0 50px -20px rgba(0,0,0,.4); }
      .scrim:has(#cart-sheet) { justify-content: flex-end; }
    }
  </style>
</head>

      const raw = JSON.parse(sessionStorage.getItem(cartStorageKey()) || '{}');
      // Backward compatible with sessions saved before Assorted Box shipped,
      // when this key held the flat { itemId: qty } map directly, and with
      // sessions saved before per-date preorder lines shipped, when a
      // preorder's date lived in a flat { itemId: isoString } map (raw.preorderDates)
      // instead of preorderCartLines — that old shape is simply dropped, since
      // sessionStorage is ephemeral and re-picking a date is a one-click fix.
      if (raw && (raw.cart || raw.boxLines || raw.preorderLines || raw.preorderDates)) {
        cart = raw.cart || {};
        boxCartLines = raw.boxLines || [];
        preorderCartLines = raw.preorderLines || [];
        digitalCart = raw.digitalCart || [];
        shipCart = raw.shipCart || {};
      } else {
        cart = raw || {};
        boxCartLines = [];
        preorderCartLines = [];
        digitalCart = [];
        shipCart = {};
      }
    } catch (e) { cart = {}; boxCartLines = []; preorderCartLines = []; digitalCart = []; shipCart = {}; }
  }
  function saveCart() {
    try {
      sessionStorage.setItem(cartStorageKey(), JSON.stringify({ cart: cart, boxLines: boxCartLines, preorderLines: preorderCartLines, digitalCart: digitalCart, shipCart: shipCart }));
    } catch (e) {}
  }

  if (!slug && !bakerID) {
    showNotFound('No baker specified', 'This link appears to be invalid.');
    return;
  }

  const rpcName = slug ? 'get_baker_web_profile_by_slug' : 'get_baker_web_profile_by_id';
  const rpcBody = slug ? { p_slug: slug } : { p_user_id: bakerID };

  fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpcName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify(rpcBody)
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data || !data.profile) { showNotFound('Baker not found', 'No baker found at this link.'); return; }
    profile = data.profile;
    resolvedBakerId = profile.id;
    loadCart();
    if (window.BakeriTheme) window.BakeriTheme.apply(profile);
    render(profile, data.listings || [], data.faqs || [], data.links || []);
    if (isCleanRedirect && slug && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '/' + slug);
    }
  })
  .catch(function () { showNotFound('Something went wrong', 'Could not load this profile. Try again later.'); });

  // ══════════════════════ Render ══════════════════════

  function render(profile, listings, faqs, links) {
    // A custom listing with no intake form attached has no working way to
    // actually collect a request — customOrderURL would build a link with
    // an empty &form= param, which custom-order.html correctly rejects as
    // invalid. Rather than publish a card that leads to a dead end, treat
    // it the same as any other not-actually-ready-to-show content (see the
    // Menu-section-hides-when-empty rule) and just leave it out entirely
    // until the baker finishes setting it up.
    allListings = listings.filter(function (l) { return l.listing_kind !== 'custom' || l.intake_form_id; });
    allLinks = links;
    const name = profile.business_name || profile.user_name || 'Baker';
    const location = profile.neighbourhood
      ? [profile.neighbourhood, profile.pickup_province].filter(Boolean).join(', ')
      : [profile.pickup_city, profile.pickup_province].filter(Boolean).join(', ') || profile.location || '';

    document.title = name + ' on Bakeri';
    document.querySelector('meta[name="description"]').content = name + ' — handcrafted bakes on Bakeri. ' + (profile.bio || '');

    stripeReady = profile.stripe_connect_onboarding_complete === true;

    renderAvatar(name);
    renderHeaderImage(name);

    document.getElementById('shop-name').textContent = name;
    if (location) {
      document.getElementById('shop-meta-text').textContent = location;
      document.getElementById('shop-meta').classList.remove('hidden');
    }

    if (profile.bio) {
      document.getElementById('shop-bio').textContent = profile.bio;
      document.getElementById('shop-bio').classList.remove('hidden');
    }
    renderSocialIcons();

    renderHours(profile.pickup_hours_json);
    renderAboutAndPolicies(profile, name);
    renderFAQ(faqs);
    renderDigitalFeed();
    renderPhysicalFeed();
    renderLinkSections();
    renderFooter(profile, name);

    document.getElementById('share-btn').addEventListener('click', shareLink);

    updateFeedVisibility();
    renderFilterBar();
    renderGrid();
    renderSectionNav();
    updateCartUI();
    updateDigitalCartUI();
    updateShipCartUI();

    document.getElementById('cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('desktop-cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('action-bar-cart').addEventListener('click', openCartSheet);
    document.getElementById('action-bar-digital-cart').addEventListener('click', openCartSheet);
    document.getElementById('action-bar-ship-cart').addEventListener('click', openCartSheet);
    document.getElementById('item-sheet-close').addEventListener('click', closeItemSheet);
    document.getElementById('cart-sheet-close').addEventListener('click', closeCartSheet);
    document.getElementById('desc-sheet-close').addEventListener('click', closeDescSheet);
    document.getElementById('item-scrim').addEventListener('click', function (e) { if (e.target === this) closeItemSheet(); });
    document.getElementById('cart-scrim').addEventListener('click', function (e) { if (e.target === this) closeCartSheet(); });
    document.getElementById('desc-scrim').addEventListener('click', function (e) { if (e.target === this) closeDescSheet(); });
  }

  function renderAvatar(name) {
    const logoURL = STORAGE_URL + '/business-logos/' + resolvedBakerId.toUpperCase() + '/logo.jpg';
    const initial = name.charAt(0).toUpperCase();
    const el = document.getElementById('pb-avatar');
    const letterEl = document.getElementById('pb-avatar-letter');
    letterEl.textContent = initial;
    const img = document.createElement('img');
    img.alt = name;
    img.onload = function () { img.style.display = 'block'; letterEl.style.display = 'none'; };
    img.src = logoURL;
    el.appendChild(img);
  }

  // Falls back to the plain gradient already set on #storefront-header if
  // the baker hasn't uploaded one — same onerror-hide convention as the
  // about-portrait image. No banner uploaded → the whole layer collapses
  // (display:none) and .has-photo comes off #profile-hero, so name/meta/bio
  // fall back to their plain dark-ink colors instead of the light-over-photo
  // treatment.
  function renderHeaderImage(name) {
    const hero = document.getElementById('profile-hero');
    const header = document.getElementById('storefront-header');
    const img = document.getElementById('header-img');
    img.alt = name;
    img.onerror = function () { header.classList.add('hidden'); hero.classList.remove('has-photo'); };
    img.onload = function () { header.classList.remove('hidden'); img.style.display = 'block'; hero.classList.add('has-photo'); };
    img.src = STORAGE_URL + '/storefront-headers/' + resolvedBakerId.toUpperCase() + '/header.jpg';
  }

  // Only renders if the baker has actually configured hours in the app (the
  // Pickup & Hours editor) — an untouched profile has an empty object, and
  // showing a fake "closed every day" table would be worse than showing
  // nothing at all.
  // The native "Pickup & Hours" editor always encodes all 7 days (every
  // unedited day defaults to closed:true) — so a key merely existing
  // doesn't mean the baker actually set anything. Only treat this as
  // "configured" once at least one day is explicitly marked open.
  function hasConfiguredHours(hoursJSON) {
    return !!(hoursJSON && WEEKDAY_ORDER.some(function (k) { return hoursJSON[k] && hoursJSON[k].closed === false; }));
  }

  function renderHours(hoursJSON) {
    const hasHours = hasConfiguredHours(hoursJSON);
    if (!hasHours) {
      document.getElementById('hours-card').classList.add('hidden');
      return;
    }
    document.getElementById('hours-card').classList.remove('hidden');
    const rowsHTML = WEEKDAY_ORDER.map(function (key) {
      const day = hoursJSON[key];
      const label = WEEKDAY_LABELS[key];
      const time = (!day || day.closed) ? 'Closed' : (formatTime12h(day.open) + '–' + formatTime12h(day.close));
      return '<div class="row"><span class="day">' + label + '</span><span class="time">' + time + '</span></div>';
    }).join('');
    document.getElementById('hours-rows').innerHTML = rowsHTML;
    // A link back up to the one place hours actually live, not a second
    // copy of the same data.
    const footerContact = document.getElementById('footer-contact');
    footerContact.innerHTML = '<a href="#hours-card">See pickup hours ↑</a>';
    footerContact.classList.remove('hidden');
  }

  // About + Store Policies are now independent top-level sections (each
  // self-hides on its own — no shared wrapper to keep in sync anymore). The
  // heading is baker-editable (about_heading, e.g. "Meet Juliana") since the
  // story is often about the person, not the bakery brand — falls back to a
  // plain "About" if unset. Never derived from business_name/name; the nav
  // tab (scrollTabs, below) always just says "About" regardless of this
  // heading.
  function renderAboutAndPolicies(profile, name) {
    if (profile.about_story) {
      document.getElementById('pb-about').classList.remove('hidden');
      document.getElementById('pb-about-heading').textContent = profile.about_heading || 'About the Baker';
      document.getElementById('pb-about-text').textContent = profile.about_story;
      const img = document.getElementById('pb-about-portrait');
      img.alt = name;
      img.onerror = function () { img.style.display = 'none'; };
      img.src = STORAGE_URL + '/baker-portraits/' + resolvedBakerId.toUpperCase() + '/portrait.jpg';
    }
    if (profile.store_policies) {
      document.getElementById('pb-policies').classList.remove('hidden');
      document.getElementById('pb-policies-text').textContent = profile.store_policies;
    }
  }

  function renderFAQ(faqs) {
    if (!faqs || faqs.length === 0) {
      document.getElementById('faq-col').classList.add('hidden');
      return;
    }
    document.getElementById('faq-col').classList.remove('hidden');
    const list = document.getElementById('faq-list');
    list.innerHTML = '';
    faqs.forEach(function (faq, i) {
      const row = document.createElement('div');
      row.className = 'faq-row' + (i === 0 ? ' open' : '');
      row.innerHTML =
        '<button class="faq-q"><span>' + escapeHtml(faq.question) + '</span><span class="ind">' + (i === 0 ? '−' : '+') + '</span></button>' +
        '<div class="faq-a"><p>' + escapeHtml(faq.answer) + '</p></div>';
      // Independent per row — opening one doesn't close the others.
      row.querySelector('.faq-q').addEventListener('click', function () {
        const willOpen = !row.classList.contains('open');
        row.classList.toggle('open', willOpen);
        row.querySelector('.ind').textContent = willOpen ? '−' : '+';
      });
      list.appendChild(row);
    });
  }

  function renderFooter(profile, name) {
    document.getElementById('footer-copy').textContent = '© ' + new Date().getFullYear() + ' ' + name;
  }

  // ══════════════════════ Section Nav (Menu / Links / etc.) ═════════════
  // Only "Menu" is ever a swappable tab (Ready-Now/Pre-order/Custom chips
  // live one level deeper, inside it). Everything else — Digital Downloads,
  // About, Store Policies, Store Hours, each baker_links section — is
  // always-visible body content further down the page, with a scroll-to
  // shortcut in the nav instead of a tab that hides it until clicked.
  // Nav order and page order are kept identical on purpose (see
  // scrollTabs()): a visitor should never have to guess that a nav item
  // leads to content that isn't otherwise reachable by scrolling.

  function menuListings() { return allListings.filter(function (l) { return l.listing_kind !== 'digital' && l.listing_kind !== 'physical'; }); }
  function digitalListings() { return allListings.filter(function (l) { return l.listing_kind === 'digital'; }); }
  function physicalListings() { return allListings.filter(function (l) { return l.listing_kind === 'physical'; }); }

  // ── Category grouping (physical items only, for now) ──────────────────
  // category is free text a baker types/picks in the app — never trusted to
  // already be display-ready casing, and never assumed to be one of a fixed
  // set, so this groups on the raw string but only ever *displays* the
  // title-cased version.
  function slugify(str) {
    return (str || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'other';
  }
  function titleCase(str) {
    return (str || '').toLowerCase().replace(/\b([a-z])/g, function (m, c) { return c.toUpperCase(); });
  }
  // Returns [{ category, slug, items }], sorted alphabetically by category —
  // same convention the app's own MenuView already groups listings by.
  function groupByCategory(items, fallbackName) {
    const map = {};
    items.forEach(function (item) {
      const cat = (item.category || '').trim() || fallbackName;
      if (!map[cat]) map[cat] = [];
      map[cat].push(item);
    });
    return Object.keys(map).sort(function (a, b) { return a.localeCompare(b); })
      .map(function (cat) { return { category: cat, slug: slugify(cat), items: map[cat] }; });
  }

  function linkSections() {
    const seen = [];
    allLinks.forEach(function (l) {
      if (l.section && seen.indexOf(l.section) === -1) seen.push(l.section);
    });
    return seen;
  }

  // A baker_links section literally named "Social" gets pulled out of the
  // ordinary rectangular link-row treatment entirely — those render as small
  // round platform icons up in the hero instead (see renderSocialIcons),
  // same convention any social-in-bio page uses. Any other section (Amazon
  // Faves, Recipes, whatever) still renders as a normal link-row list
  // further down.
  function isSocialSection(section) { return (section || '').trim().toLowerCase() === 'social'; }
  // Every non-social link renders under one "My Links" heading regardless
  // of its actual stored `section` value — older rows saved before this
  // convention (e.g. a baker's own "Amazon Storefront") would otherwise
  // still surface as their own separate nav heading forever, since nothing
  // ever rewrites old data. Collapsing at render time fixes existing bakers
  // immediately, not just links saved going forward.
  function bodyLinkSections() { return linkSections().some(function (s) { return !isSocialSection(s); }) ? ['My Links'] : []; }

  function linkSectionId(section) {
    return 'link-section-' + (section || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  // Every "shoppable" section — Baked Goods, Digital Downloads, and one
  // entry per physical category — collapses into a single "Shop" nav item
  // with a dropdown (see renderSectionNav), rather than one nav pill each.
  // With physical items split into per-category sections, a pill-per-section
  // approach would make the nav bar grow without bound as a baker adds
  // categories; this keeps it at a fixed handful of entries no matter how
  // many categories exist.
  function shopSections() {
    const sections = [];
    if (menuListings().length > 0) sections.push({ id: 'feed-heading', label: 'Baked Goods' });
    if (digitalListings().length > 0) sections.push({ id: 'digital-feed', label: 'Digital Downloads' });
    groupByCategory(physicalListings(), 'Ships to You').forEach(function (g) {
      sections.push({ id: 'physical-cat-' + g.slug, label: titleCase(g.category) });
    });
    return sections;
  }

  // Hours/FAQ/About/Policies/Links aren't shoppable — they stay as their own
  // individual scroll-to nav pills, same as before Shop existed.
  function otherNavTabs() {
    const tabs = [];
    bodyLinkSections().forEach(function (s) {
      tabs.push({ id: linkSectionId(s), label: s });
    });
    // Label is always the plain section name, never the baker-editable
    // about_heading — the nav is a fixed set of destinations, not a place
    // for a custom, possibly-long "Meet Juliana"-style heading to show up.
    if (profile && profile.about_story) {
      tabs.push({ id: 'pb-about', label: 'About' });
    }
    if (profile && profile.store_policies) {
      tabs.push({ id: 'pb-policies', label: 'Store Policies' });
    }
    if (hasConfiguredHours(profile && profile.pickup_hours_json)) {
      tabs.push({ id: 'hours-card', label: 'Store Hours' });
    }
    return tabs;
  }

  function scrollToSection(id) {
    const target = document.getElementById(id);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // The section/category names are the nav — no separate icon per entry, no
  // duplicate heading text anywhere else.
  function renderSectionNav() {
    const shop = shopSections();
    const others = otherNavTabs();
    const nav = document.getElementById('section-nav');
    // Nothing to navigate to at all — a brand-new baker with no listings and
    // no other section filled out yet. Hide the strip rather than show an
    // empty bar with a stray border line.
    document.getElementById('section-nav-wrap').classList.toggle('hidden', shop.length === 0 && others.length === 0);
    nav.innerHTML = '';

    if (shop.length > 0) {
      const wrap = document.createElement('div');
      wrap.className = 'shop-tab-wrap';
      const btn = document.createElement('button');
      btn.className = 'section-tab shop-tab-btn';
      btn.innerHTML = 'Shop <span class="chev">▾</span>';
      const dropdown = document.createElement('div');
      dropdown.className = 'shop-dropdown hidden';
      shop.forEach(function (s) {
        const item = document.createElement('button');
        item.className = 'shop-dropdown-item';
        item.textContent = s.label;
        item.addEventListener('click', function () {
          dropdown.classList.add('hidden');
          scrollToSection(s.id);
        });
        dropdown.appendChild(item);
      });
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
      });
      wrap.appendChild(btn);
      wrap.appendChild(dropdown);
      nav.appendChild(wrap);
    }

    others.forEach(function (t) {
      const btn = document.createElement('button');
      btn.className = 'section-tab';
      btn.textContent = t.label;
      btn.addEventListener('click', function () { scrollToSection(t.id); });
      nav.appendChild(btn);
    });
  }

  // Closes the Shop dropdown on any click outside it — wired once, not
  // per-render, since renderSectionNav rebuilds the dropdown but this
  // document-level listener only ever needs to exist a single time.
  document.addEventListener('click', function () {
    document.querySelectorAll('.shop-dropdown').forEach(function (d) { d.classList.add('hidden'); });
  });

  // Always-visible — every non-Social link section renders at once, each in
  // its own labeled block, instead of one section swapped in at a time
  // behind a nav click. Independent no-op if the baker has no links at all.
  // Social itself is excluded here — see renderSocialIcons.
  function renderLinkSections() {
    const wrap = document.getElementById('links-feed');
    const sections = bodyLinkSections();
    if (sections.length === 0) {
      wrap.classList.add('hidden');
      wrap.innerHTML = '';
      return;
    }
    wrap.classList.remove('hidden');
    wrap.innerHTML = sections.map(function (s) {
      // s is always the single collapsed "My Links" bucket now (see
      // bodyLinkSections) — grab every non-social link regardless of its
      // actual stored section, not just ones literally tagged "My Links".
      const items = allLinks.filter(function (l) { return !isSocialSection(l.section); });
      // No heading text here — the "My Links" nav tab already labels this
      // section, and a repeated in-body heading was redundant.
      return '<div class="link-section" id="' + linkSectionId(s) + '">' +
        '<div class="link-list">' + items.map(function (l) {
          return '<a class="link-row" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener noreferrer">' +
            '<span class="circle">🔗</span>' +
            '<span class="label">' + escapeHtml(l.label) + '</span>' +
            '<span class="arrow">→</span>' +
          '</a>';
        }).join('') + '</div>' +
      '</div>';
    }).join('');
  }

  // Guesses the platform from the URL's hostname to pick each icon — the
  // baker only ever enters a plain URL (same "Social" section as any other
  // link), there's no separate platform field to key off of. Icon files are
  // cropped from assets/social/*.png (the baker's own downloaded icon set —
  // see assets/social/README.txt). Unrecognized hosts still render, just
  // with a generic glyph instead of a missing image, so an unusual link
  // never silently disappears.
  function socialPlatform(url) {
    let host = '';
    try { host = new URL(url).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { /* leave blank → generic */ }
    if (host.indexOf('instagram') !== -1) return { label: 'Instagram', icon: 'instagram' };
    if (host.indexOf('tiktok') !== -1) return { label: 'TikTok', icon: 'tiktok' };
    if (host.indexOf('facebook') !== -1) return { label: 'Facebook', icon: 'facebook' };
    if (host === 'x.com' || host.indexOf('twitter') !== -1) return { label: 'X', icon: 'x' };
    if (host.indexOf('pinterest') !== -1) return { label: 'Pinterest', icon: 'pinterest' };
    if (host.indexOf('linkedin') !== -1) return { label: 'LinkedIn', icon: 'linkedin' };
    if (host.indexOf('whatsapp') !== -1 || host === 'wa.me') return { label: 'WhatsApp', icon: 'whatsapp' };
    return { label: 'Link', icon: null };
  }

  // Small round icons in the hero, not rows in the body — the visual
  // convention every social-in-bio page uses for actual social accounts,
  // distinct from a plain link list (Amazon Faves, Recipes, etc., which
  // stay as link-rows further down — see renderLinkSections).
  function renderSocialIcons() {
    const wrap = document.getElementById('social-icons');
    const items = allLinks.filter(function (l) { return isSocialSection(l.section); });
    if (items.length === 0) {
      wrap.classList.add('hidden');
      wrap.innerHTML = '';
      return;
    }
    wrap.classList.remove('hidden');
    wrap.innerHTML = items.map(function (l) {
      const platform = socialPlatform(l.url);
      // The icon PNG is used as a mask (see .social-icon-mask), not a plain
      // <img> — that's what lets the theme's accent color paint the circle
      // itself instead of just sitting behind a fixed-black raster image.
      const inner = platform.icon
        ? '<span class="social-icon-mask" style="-webkit-mask-image:url(../assets/social/' + platform.icon + '.png);mask-image:url(../assets/social/' + platform.icon + '.png)"></span>'
        : '<span class="social-icon-fallback">🔗</span>';
      return '<a class="social-icon" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener noreferrer" ' +
        'title="' + escapeHtml(platform.label) + '" aria-label="' + escapeHtml(platform.label) + '">' +
        inner + '</a>';
    }).join('');
  }

  // ══════════════════════ Filter / Feed (within Menu) ══════════════════

  function listingsForTab(t) {
    if (t === 'all') return menuListings();
    const kind = t === 'now' ? 'ready_now' : (t === 'pre' ? 'preorder' : 'custom');
    return menuListings().filter(function (l) { return l.listing_kind === kind; });
  }

  // Only a category with at least one item gets a chip — "All" is never
  // empty as long as the Menu section itself is showing at all, so it's
  // exempt from the check.
  function availableFilters() {
    return FILTERS.filter(function (f) { return f.key === 'all' || listingsForTab(f.key).length > 0; });
  }

  function renderFilterBar() {
    const strip = document.getElementById('filter-strip');
    const bar = document.getElementById('filter-bar');
    if (menuListings().length === 0) {
      strip.classList.add('hidden');
      bar.classList.add('hidden');
      return;
    }
    strip.classList.remove('hidden');
    bar.classList.remove('hidden');
    bar.innerHTML = availableFilters().map(function (f) {
      return '<button class="filter-chip' + (f.key === tab ? ' active' : '') + '" data-tab="' + f.key + '">' + f.label + '</button>';
    }).join('');
    bar.querySelectorAll('.filter-chip').forEach(function (btn) {
      btn.addEventListener('click', function () { setTab(btn.dataset.tab); });
    });
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('.filter-chip').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
    renderGrid();
  }

  // The Menu section (nav entry, filter bar, and this grid) only ever
  // renders when the baker actually has at least one ready_now/preorder/
  // custom listing — see updateFeedVisibility. availableFilters() only ever
  // offers a category that has items, so listings here should never
  // legitimately come back empty; the message is a defensive fallback only.
  function renderGrid() {
    const grid = document.getElementById('product-grid');
    const listings = listingsForTab(tab);
    if (listings.length === 0) {
      grid.innerHTML = '<div class="empty-state">No items in this category.</div>';
      return;
    }
    grid.innerHTML = '';
    listings.forEach(function (item) {
      grid.appendChild(buildCard(item));
    });
  }

  // Hides the whole Menu section — nav entry, filter bar, and grid — when
  // the baker has no ready_now/preorder/custom listings, per "only show
  // what the baker has actually made available." Digital Downloads is a
  // fully separate section (see renderDigitalFeed) so it's unaffected.
  function updateFeedVisibility() {
    const noMenu = menuListings().length === 0;
    document.getElementById('feed').classList.toggle('hidden', noMenu);
    document.getElementById('feed-heading').classList.toggle('hidden', noMenu);
  }

  // Always-visible, directly under the Menu grid — matches how Links/About/
  // Policies/Hours already behave (see renderLinkSections), instead of
  // hiding digital items behind a swappable tab a visitor has to discover.
  function renderDigitalFeed() {
    const section = document.getElementById('digital-feed');
    const grid = document.getElementById('digital-grid');
    const items = digitalListings();
    if (items.length === 0) {
      section.classList.add('hidden');
      grid.innerHTML = '';
      return;
    }
    section.classList.remove('hidden');
    grid.innerHTML = '';
    items.forEach(function (item) {
      grid.appendChild(buildDigitalRow(item));
    });
  }

  // Always-visible, like Digital Downloads above, but split into one
  // headed .category-block per distinct category ("Cookie Cutters",
  // "Cookie Stamps", "Cookie Kits", ...) rather than one flat list —
  // physical spans genuinely different product types in a way a single
  // "Ships to You" grid couldn't tell apart. Cards use buildCard (the same
  // full-photo badged grid card Ready Now/Pre-order/Custom use), not
  // buildDigitalRow — a physical good is worth judging by its photo the way
  // a digital file isn't.
  function renderPhysicalFeed() {
    const section = document.getElementById('physical-feed');
    const items = physicalListings();
    section.innerHTML = '';
    if (items.length === 0) {
      section.classList.add('hidden');
      return;
    }
    section.classList.remove('hidden');
    groupByCategory(items, 'Ships to You').forEach(function (g) {
      const block = document.createElement('div');
      block.className = 'category-block';
      block.id = 'physical-cat-' + g.slug;
      const heading = document.createElement('h2');
      heading.textContent = titleCase(g.category);
      const grid = document.createElement('div');
      grid.className = 'product-grid';
      g.items.forEach(function (item) { grid.appendChild(buildCard(item)); });
      block.appendChild(heading);
      block.appendChild(grid);
      section.appendChild(block);
    });
  }

  function buildDigitalRow(item) {
    const row = document.createElement('div');
    row.className = 'digital-row';
    row.addEventListener('click', function () { openItemSheet(item); });

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const ph = photoFallback(item);
    thumb.appendChild(ph);
    const img = document.createElement('img');
    img.alt = item.name;
    img.onload = function () { img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);
    thumb.appendChild(img);

    const info = document.createElement('div');
    info.className = 'info';
    const nameEl = document.createElement('div');
    nameEl.className = 'n';
    nameEl.textContent = item.name;
    const metaEl = document.createElement('div');
    metaEl.className = 'm';
    metaEl.textContent = subtitleFor(item);
    info.appendChild(nameEl);
    info.appendChild(metaEl);

    const priceEl = document.createElement('div');
    priceEl.className = 'price tabular';
    priceEl.textContent = '$' + formatPrice(item.price);

    row.appendChild(thumb);
    row.appendChild(info);
    row.appendChild(priceEl);
    row.appendChild(buildAddControl(item));
    return row;
  }

  function buildCard(item) {
    const card = document.createElement('div');
    card.className = 'p-card';
    card.addEventListener('click', function () { openItemSheet(item); });

    const photo = document.createElement('div');
    photo.className = 'p-photo';
    const ph = photoFallback(item);
    photo.appendChild(ph);
    const img = document.createElement('img');
    img.alt = item.name;
    img.onload = function () { img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);
    photo.appendChild(img);

    // Plain kind badge overlaid on the photo — matches the app's own
    // Market listing card exactly (a sold-out ready_now item keeps its
    // normal badge, distinguished only by the lighter meta text below).
    const kind = kindBadgeInfo(item);
    const badge = document.createElement('div');
    badge.className = 'p-badge';
    badge.style.background = kind.bg;
    badge.innerHTML = '<span class="dot"></span>' + kind.label;
    photo.appendChild(badge);

    const body = document.createElement('div');
    body.className = 'p-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'p-name';
    nameEl.textContent = item.name;
    const metaEl = document.createElement('div');
    metaEl.className = 'p-meta';
    metaEl.textContent = subtitleFor(item);

    const divider = document.createElement('div');
    divider.className = 'p-divider';
    const priceRow = document.createElement('div');
    priceRow.className = 'p-price-row';
    const priceEl = document.createElement('div');
    priceEl.className = 'p-price tabular';
    priceEl.innerHTML = priceIsFrom(item) ? '<span class="from">from</span>$' + formatPrice(item.price) : '$' + formatPrice(item.price);
    priceRow.appendChild(priceEl);
    priceRow.appendChild(buildAddControl(item));
    divider.appendChild(priceRow);

    body.appendChild(nameEl);
    body.appendChild(metaEl);
    body.appendChild(divider);
    card.appendChild(photo);
    card.appendChild(body);
    return card;
  }

  function buildAddControl(item) {
    const wrap = document.createElement('div');
    wrap.dataset.itemId = item.id;
    refreshAddControl(wrap, item);
    return wrap;
  }

  function refreshAddControl(wrap, item) {
    wrap.innerHTML = '';
    if (item.listing_kind === 'custom') {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '→';
      btn.setAttribute('aria-label', 'Request a custom order');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        window.location.href = customOrderURL(item);
      });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'digital') {
      // Digital purchases skip the pickup cart (no qty/dates/tiers to
      // track) but do get their own small cart — see digitalCart — so
      // multiple downloads can check out together instead of one at a time.
      const inCart = digitalCart.indexOf(item.id) !== -1;
      const btn = document.createElement('button');
      btn.className = 'add-btn' + (inCart ? ' added' : '');
      btn.textContent = inCart ? '✓' : '+';
      btn.setAttribute('aria-label', inCart ? 'Remove from download cart' : 'Add to download cart');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleDigitalCartItem(item);
      });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'physical') {
      // Ships items skip the pickup cart too, same reasoning as digital —
      // but unlike digital they're stock-bound, so this is a qty stepper
      // (see shipCart) clamped at available_qty_today rather than a plain
      // in/out toggle.
      const qty = shipCart[item.id] || 0;
      const max = item.available_qty_today || 0;
      if (max <= 0 || !stripeReady) {
        const btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.style.opacity = '.4'; btn.disabled = true;
        btn.textContent = '—';
        btn.title = stripeReady ? 'Sold out' : 'Ordering isn\'t live yet';
        wrap.appendChild(btn);
        return;
      }
      if (qty === 0) {
        const btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Add to ship cart');
        btn.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, 1); });
        wrap.appendChild(btn);
      } else {
        const stepper = document.createElement('div');
        stepper.className = 'qty-stepper';
        const minus = document.createElement('button');
        minus.textContent = '−';
        minus.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, -1); });
        const qtyEl = document.createElement('span');
        qtyEl.className = 'qty';
        qtyEl.textContent = qty;
        const plus = document.createElement('button');
        plus.textContent = '+';
        // Clamped at stock on hand — the real, atomic check happens
        // server-side at charge time (decrement_menu_item_stock_batch);
        // this is just so a buyer never sees a total they can't pay for.
        if (qty >= max) { plus.disabled = true; plus.style.opacity = '.35'; }
        plus.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, 1); });
        stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
        wrap.appendChild(stepper);
      }
      return;
    }
    if (item.is_assorted_box) {
      // Boxes don't track a plain sold-out quantity — building the flavor
      // mix always happens in the sheet, never a direct card stepper.
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      if (!stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
      } else {
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Build your box');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'preorder') {
      // Always routes through the sheet — even single-date/weekday/lead-time
      // modes benefit from showing the ready date there, and a multi-date
      // listing requires picking one before it can be added at all.
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      if (isSoldOut(item) || !stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
        btn.title = stripeReady ? 'Ordering closed' : 'Ordering isn\'t live yet';
      } else {
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Choose pickup date');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    const qty = cart[item.id] || 0;
    if (isSoldOut(item) || !stripeReady) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.style.opacity = '.4'; btn.disabled = true;
      btn.textContent = '—';
      btn.title = stripeReady ? 'Sold out for today' : 'Ordering isn\'t live yet';
      wrap.appendChild(btn);
      return;
    }
    if (qty === 0) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '+';
      btn.setAttribute('aria-label', 'Add to order');
      btn.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      wrap.appendChild(btn);
    } else {
      const stepper = document.createElement('div');
      stepper.className = 'qty-stepper';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, -1); });
      const qtyEl = document.createElement('span');
      qtyEl.className = 'qty';
      qtyEl.textContent = qty;
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
      wrap.appendChild(stepper);
    }
  }

  function changeQty(item, delta) {
    const current = cart[item.id] || 0;
    const next = Math.max(0, current + delta);
    if (next === 0) { delete cart[item.id]; } else { cart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateCartUI();
  }

  function updateCartUI() {
    const plainCount = Object.values(cart).reduce(function (s, q) { return s + q; }, 0);
    const boxCount = boxCartLines.reduce(function (s, l) { return s + l.qty; }, 0);
    const preorderCount = preorderCartLines.reduce(function (s, l) { return s + l.qty; }, 0);
    const count = plainCount + boxCount + preorderCount;
    document.getElementById('cart-btn-count').textContent = count > 0 ? count : '';
    const total = cartSubtotal();
    document.getElementById('desktop-cart-label').textContent = count > 0 ? ('Cart · ' + count) : 'Cart';

    if (count > 0) {
      document.getElementById('action-bar-cart').style.display = 'flex';
      document.getElementById('cart-bar-sub').textContent = count + (count === 1 ? ' item' : ' items') +
        (profile && profile.pickup_city ? ' · pickup in ' + profile.pickup_city : ' · pickup');
      document.getElementById('cart-bar-total').textContent = '$' + formatPrice(total);
    } else {
      document.getElementById('action-bar-cart').style.display = 'none';
    }
  }

  function digitalCartItems() {
    return digitalCart
      .map(function (id) { return allListings.find(function (l) { return l.id === id; }); })
      .filter(Boolean);
  }
  function digitalCartTotal() {
    return digitalCartItems().reduce(function (s, i) { return s + i.price; }, 0);
  }
  function toggleDigitalCartItem(item) {
    const idx = digitalCart.indexOf(item.id);
    if (idx === -1) digitalCart.push(item.id); else digitalCart.splice(idx, 1);
    saveCart();
    renderDigitalFeed();
    updateDigitalCartUI();
  }
  function updateDigitalCartUI() {
    const bar = document.getElementById('action-bar-digital-cart');
    const count = digitalCart.length;
    if (count > 0) {
      bar.style.display = 'flex';
      document.getElementById('digital-cart-bar-sub').textContent = count + (count === 1 ? ' download' : ' downloads');
      document.getElementById('digital-cart-bar-total').textContent = '$' + formatPrice(digitalCartTotal());
    } else {
      bar.style.display = 'none';
    }
  }
  function digitalCartCheckoutURL() {
    return '/baker/digital-checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&items=' + encodeURIComponent(digitalCart.join(',')) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  // Ships (physical) cart — a { itemId: qty } map, so lines carry a real
  // stepper (see refreshAddControl's 'physical' branch and the cart sheet's
  // 'ship' line kind) instead of digitalCart's plain in/out toggle.
  function shipCartItems() {
    return Object.keys(shipCart).map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? { item: item, qty: shipCart[id] } : null;
    }).filter(Boolean);
  }
  // Shipping fee is a flat per-listing amount (set by the baker, see
  // AddEditMenuItemView) charged once per distinct item in the cart, not
  // once per unit — ordering 3 of the same cookie cutter shouldn't triple
  // it. Real carrier-computed rates are a later integration; this is just
  // the manual placeholder for it.
  function shipCartShippingFees() {
    return shipCartItems().reduce(function (s, l) { return s + (l.item.shipping_fee || 0); }, 0);
  }
  function shipCartTotal() {
    return shipCartItems().reduce(function (s, l) { return s + l.item.price * l.qty; }, 0) + shipCartShippingFees();
  }
  function changeShipQty(item, delta) {
    const current = shipCart[item.id] || 0;
    const max = item.available_qty_today || 0;
    const next = Math.max(0, Math.min(max, current + delta));
    if (next === 0) { delete shipCart[item.id]; } else { shipCart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateShipCartUI();
  }
  function updateShipCartUI() {
    const bar = document.getElementById('action-bar-ship-cart');
    const items = shipCartItems();
    const count = items.reduce(function (s, l) { return s + l.qty; }, 0);
    if (count > 0) {
      bar.style.display = 'flex';
      document.getElementById('ship-cart-bar-sub').textContent = count + (count === 1 ? ' item' : ' items');
      document.getElementById('ship-cart-bar-total').textContent = '$' + formatPrice(shipCartTotal());
    } else {
      bar.style.display = 'none';
    }
  }
  function shipCartCheckoutURL() {
    const pairs = shipCartItems().map(function (l) { return l.item.id + ':' + l.qty; });
    return '/baker/physical-checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&items=' + encodeURIComponent(pairs.join(',')) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  function cartLines() {
    const plain = Object.keys(cart).map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? { kind: 'plain', item: item, qty: cart[id] } : null;
    }).filter(Boolean);
    const boxed = boxCartLines.map(function (bl) {
      const item = allListings.find(function (l) { return l.id === bl.menuItemId; }) ||
        { id: bl.menuItemId, name: bl.itemName, tax_category: bl.taxCategory, unit_weight_grams: bl.unitWeightGrams };
      return { kind: 'box', item: item, line: bl, qty: bl.qty };
    });
    const preordered = preorderCartLines.map(function (pl) {
      const item = allListings.find(function (l) { return l.id === pl.menuItemId; });
      return item ? { kind: 'preorder', item: item, line: pl, qty: pl.qty } : null;
    }).filter(Boolean);
    return plain.concat(boxed).concat(preordered);
  }

  function cartSubtotal() {
    return cartLines().reduce(function (sum, l) {
      const price = l.kind === 'box' ? l.line.price : l.item.price;
      return sum + price * l.qty;
    }, 0);
  }

  // Guest checkout: the customer pays exactly the item subtotal (+ tax) —
  // Bakeri's service charge comes out of the baker's side instead, so it's
  // never shown or added to this preview. Mirrors create-payment-intent's
  // guest branch in supabase/functions/create-payment-intent/index.ts.

  // Tax estimate — mirrors create-guest-marketplace-order/index.ts and
  // checkout.html exactly, so this preview never drifts from what's
  // actually charged. Shown here (before checkout.html) so the cart total
  // a buyer sees is realistic, not just the bare item subtotal.
  function taxRateForProvince(p) {
    switch ((p || '').toUpperCase().trim()) {
      case 'ON': return 0.13;
      case 'NB': case 'NL': case 'PE': return 0.15;
      case 'NS': return 0.14;
      case 'QC': return 0.14975;
      default: return 0.05;
    }
  }
  function isSingleServing(taxCategory, unitWeightGrams) {
    if (taxCategory !== 'sweetened_single_serving') return false;
    if (unitWeightGrams != null) return unitWeightGrams <= 230;
    return true;
  }
  function cartTaxCents() {
    if (!profile || !profile.is_gst_registered) return 0;
    const items = cartLines().map(function (l) {
      return {
        taxCategory: l.item.tax_category, unitWeightGrams: l.item.unit_weight_grams,
        qty: l.qty, price: l.kind === 'box' ? l.line.price : l.item.price
      };
    });
    const rate = taxRateForProvince(profile.pickup_province);
    const totalSingleServings = items.filter(function (i) { return isSingleServing(i.taxCategory, i.unitWeightGrams); })
      .reduce(function (s, i) { return s + i.qty; }, 0);
    let taxableSubtotal = 0;
    items.forEach(function (item) {
      if (item.taxCategory === 'plain_bread' || item.taxCategory === 'whole_item') return;
      if (isSingleServing(item.taxCategory, item.unitWeightGrams) && totalSingleServings < 6) {
        taxableSubtotal += item.price * item.qty;
      }
    });
    return Math.round(taxableSubtotal * rate * 100);
  }
  function cartTotal() { return cartSubtotal() + cartTaxCents() / 100; }

  // ══════════════════════ Item Sheet ══════════════════════

  function openItemSheet(item) {
    document.getElementById('item-sheet-name').textContent = item.name;
    document.getElementById('item-sheet-price').innerHTML = (priceIsFrom(item) ? 'from ' : '') + '$' + formatPrice(item.price);
    const descEl = document.getElementById('item-sheet-desc');
    const descToggle = document.getElementById('item-sheet-desc-toggle');
    descEl.textContent = item.item_description || '';
    descEl.classList.add('clamped');
    // Tapping the (clamped) text itself or "Read more" both open the full
    // description in its own popup rather than expanding inline — reading
    // a long one then never means scrolling the item sheet at all.
    const openFullDesc = function () { openDescSheet(item.name, item.item_description || ''); };
    descEl.onclick = openFullDesc;
    descToggle.onclick = openFullDesc;

    // Sold-out-aware badge — the one place a "Sold Out" label appears,
    // matching the app's dedicated item-detail treatment rather than
    // swapping the grid's badge (which stays the plain kind label there).
    const badge = badgeInfo(item);
