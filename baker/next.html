<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri</title>
  <meta name="description" content="View this baker's storefront on Bakeri." />
  <!-- Storefront v2 ("Profile layout") — see STOREFRONT_V2_SPEC.md. Not
       linked from anywhere and not indexed until it replaces index.html at
       launch. DELETE this robots tag at cutover. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" />
  <script src="theme.js"></script>
  <script src="intake-form.js"></script>

  <style>
    :root {
      /* theme.js writes these from profiles.selected_theme (light palette
         only — see forceLight); applyDesignTokens() then derives the
         storefront's own roles from them unless the baker overrode them. */
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-gold:      #C49A6C;
      --theme-button-fg: #FFFFFF;

      /* Seller roles (handoff "Design Tokens" → seller theme). */
      --accent:     #1C1C1E;
      --accent-600: #111113;
      --accent-fg:  #FFFFFF;
      --head-ink:   #1C1C1E;   /* handoff `ink` — headings/prices on white */
      --tint:       #F1EFEC;

      /* Fixed, Bakeri-owned. */
      --text:  #201e1d;
      --n800:  #444141;
      --n700:  #605d5d;
      --n300:  #d7d3d3;
      --n200:  #eae7e7;
      --n100:  #f8f4f4;
      --shadow-sm: 0 1px 2px rgba(45,43,43,.14);
      --shadow-md: 0 3px 10px rgba(45,43,43,.16);
      --shadow-lg: 0 12px 32px rgba(45,43,43,.22);
      --r: 18px; --rs: 12px; --rp: 999px;
      --body: "Archivo", -apple-system, system-ui, sans-serif;
      --display: "Archivo", -apple-system, system-ui, sans-serif;
      --dw: 800;

      /* Names the carried-over sheet/cart/picker CSS below still uses. */
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --ink: var(--text);
      --bio: var(--n800);
      --muted: var(--n700);
      --line: var(--n200);
      --line-soft: var(--n100);
      --ready: #3FA672; --preorder: #C79A3D; --custom: #A66A5B; --digital: #5F92E6; --physical: #7A8C5C;
      --error: #C0392B; --sale: var(--error);
      --sans: var(--body);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* html carries the page's base colour (theme bg / fade base) — body
       stays transparent so theme.js's z-index:-1 pattern layer and the
       background-image layers still paint above it (see the long note in
       index.html on why body must not get its own background). */
    html { background: var(--theme-bg); }
    body { font-family: var(--body); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    button, input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ph-fallback { background: var(--n100); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }

    /* ══════════════ Background layers (see renderBackground) ══════════════
       The photo / fade / pattern lives in #sf-frame: a panel centred behind
       the cards, 50px wider than the card column on each side, full page
       height, with a soft edge shadow. Outside it the page is the plain
       base colour (html background) — so on a wide monitor the photo never
       stretches to the screen edges. Below ~1180px wide the frame is simply
       the full width. */
    #sf-root { position: relative; }
    #sf-frame {
      position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100%, 1180px); z-index: -1; pointer-events: none; overflow: hidden;
      background: var(--fade-base, var(--theme-bg));
      box-shadow: 0 0 0 1px rgba(45,43,43,.04), 0 10px 40px rgba(45,43,43,.14);
    }
    /* Theme background (no photo): the theme's colour + pattern fill the
       whole screen — no centred panel. theme.js's own full-screen fixed
       pattern layer is left as-is; the frame just disappears. */
    #sf-root.bg-theme #sf-frame { display: none; }
    #sf-bg-top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1;
      background-position: center top; background-size: cover; background-repeat: no-repeat;
    }
    /* The fade: image fully visible down to 60% of its rendered height,
       then into the solid base colour by 100% (handoff photo-with-fade). */
    #sf-bg-top::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 0, transparent 60%, var(--fade-base, var(--theme-bg)) 100%);
    }
    /* Full-page photo: a viewport-tall layer stuck to the top of the frame
       while it scrolls, so the photo is sized to the screen, not to the
       (very tall) page. */
    #sf-bg-full {
      position: sticky; top: 0; height: 100vh; z-index: 1;
      background-position: center; background-size: cover; background-repeat: no-repeat;
    }

    /* ══════════════ Page column + responsive tokens ══════════════
       Compact mode is driven by the column's own width (ResizeObserver →
       .compact), not a viewport media query — same as the handoff. */
    #sf-root {
      --pad: 40px; --padb: 64px; --gap: 22px; --cpad: 36px; --cpad2: 32px;
      --logo: 168px; --proftop: 24px; --h1: 60px; --h2: 34px; --h3: 32px; --h3m: 30px;
      --h2a: 46px; --ggap: 16px; --apad: 44px;
      width: 100%;
    }
    #sf-root.compact {
      --pad: 10px; --padb: 28px; --gap: 12px; --cpad: 16px; --cpad2: 18px;
      --logo: 120px; --proftop: 56px; --h1: 36px; --h2: 24px; --h3: 24px; --h3m: 22px;
      --h2a: 30px; --ggap: 10px; --apad: 20px;
    }
    #page-shell {
      max-width: 1160px; margin: 0 auto; padding: var(--pad) var(--pad) var(--padb);
      display: flex; flex-direction: column; gap: var(--gap);
    }

    #announcement-banner {
      align-self: center; max-width: 100%; text-align: center;
      padding: 9px 18px; border-radius: var(--rp); background: #fff; box-shadow: var(--shadow-sm);
      font-size: 13px; font-weight: 700; color: var(--head-ink);
    }
    #announcement-banner.promo { background: var(--sale); color: #fff; }

    /* ══════════════ 1. Profile top ══════════════ */
    #profile-block {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: var(--proftop) 0 8px; text-align: center;
    }
    #sf-top-actions { position: absolute; top: 0; right: 0; display: flex; gap: 8px; z-index: 2; }
    .sf-pill-btn {
      height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0 16px; border: 0; background: #fff; border-radius: var(--rp); box-shadow: var(--shadow-md);
      color: var(--text); font: 700 14px var(--body); cursor: pointer;
    }
    .sf-pill-btn.icon { padding: 0; width: 44px; }
    #pb-avatar {
      width: var(--logo); height: var(--logo); border-radius: 50%; border: 6px solid #fff; background: var(--accent);
      box-shadow: var(--shadow-lg); overflow: hidden; position: relative; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-fg); font: var(--dw) calc(var(--logo) * .42) var(--display);
    }
    #pb-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #fff; }
    #shop-name {
      font-family: var(--display); font-weight: var(--dw); font-size: var(--h1); line-height: 1.05; letter-spacing: 0;
      margin: 4px 0 0; max-width: 100%; text-wrap: balance; overflow-wrap: anywhere;
      color: var(--head-ink); text-shadow: 0 1px 0 rgba(255,255,255,.6);
    }
    #sf-root.name-on-dark #shop-name { color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
    /* A baker-chosen name colour (profile card → Titles) keeps a neutral
       shadow so it stays legible on photos and patterns. */
    #sf-root #shop-name.custom-color { text-shadow: 0 1px 2px rgba(0,0,0,.18), 0 0 18px rgba(255,255,255,.55) !important; }
    /* On a light PHOTO (not a flat theme colour) the handoff's 1px white
       shadow isn't enough against busy detail — a soft white halo is. */
    #sf-root.name-on-photo:not(.name-on-dark) #shop-name {
      text-shadow: 0 0 2px #fff, 0 0 10px rgba(255,255,255,.95), 0 0 24px rgba(255,255,255,.8);
    }
    #sf-root.name-on-photo.name-on-dark #shop-name { text-shadow: 0 1px 3px rgba(0,0,0,.5), 0 2px 18px rgba(0,0,0,.55); }
    #sf-intro-card {
      width: 100%; max-width: 620px; margin-top: 6px; padding: var(--cpad2);
      background: var(--card-bg, #fff); color: var(--card-text, var(--text));
      border-radius: var(--r); box-shadow: var(--shadow-md);
      display: flex; flex-direction: column; gap: 12px;
    }
    #shop-meta { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--card-text, var(--text)); }
    #shop-bio { margin: 0 0 6px; font-size: 16px; line-height: 1.55; text-wrap: pretty; white-space: pre-line; }
    #sf-nav { display: flex; flex-direction: column; gap: 10px; }
    #sf-nav:empty { display: none; }
    /* Nav buttons + plain-pill links share one look. */
    .sf-navbtn {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 0 20px; border-radius: var(--rp); border: 2px solid var(--n300);
      background: #fff; color: var(--text); font: 800 16px var(--body); text-decoration: none; text-align: left;
      cursor: pointer; width: 100%;
    }
    .sf-navbtn:hover { filter: brightness(.96); }
    .sf-navbtn.primary { background: var(--btn-bg, var(--accent)); border-color: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); }
    .sf-navbtn svg { flex: none; }
    /* Social icons — Bakeri's own icon set (assets/social/*.png) used as a
       mask, so the accent colour paints the round badge and the logo shape
       is cut out of it (same treatment as index.html). 44px tap targets. */
    #social-icons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding-top: 6px; }
    .social-icon {
      position: relative; width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      background: var(--card-bg, #fff); color: var(--btn-bg, var(--accent));
      box-shadow: var(--shadow-sm); transition: transform .15s;
    }
    .social-icon:hover { transform: translateY(-1px); }
    .social-icon-mask {
      position: absolute; inset: 0; background: var(--btn-bg, var(--accent));
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      -webkit-mask-size: cover; mask-size: cover;
    }
    .social-icon-fallback { width: 100%; height: 100%; border-radius: 50%; background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); display: flex; align-items: center; justify-content: center; }

    /* ══════════════ Shared section card ══════════════ */
    .sf-card {
      background: var(--card-bg, #fff); color: var(--card-text, var(--text));
      border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-md); scroll-margin-top: 16px;
    }
    .sf-card-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
      padding: var(--cpad2) var(--cpad) 16px; border-bottom: 1px solid var(--card-line, var(--n200));
    }
    .sf-card-head .titles { display: flex; flex-direction: column; gap: 4px; margin-right: auto; min-width: 0; }
    .sf-card-head h2 {
      font-family: var(--display); font-weight: var(--dw); font-size: var(--h2); line-height: 1.05; margin: 0;
      color: var(--card-title, var(--head-ink)); overflow-wrap: anywhere;
    }
    .sf-sub { font-size: 14px; font-weight: 600; color: var(--card-muted, var(--n800)); }
    .sf-sub:empty { display: none; }
    .sf-card-body { padding: var(--cpad); }
    .sf-kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--card-title, var(--head-ink)); }

    .sf-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .sf-chips:empty { display: none; }
    .sf-chip {
      padding: 8px 14px; min-height: 38px; border-radius: var(--rp); border: 1.5px solid var(--n300);
      font: 700 13px var(--body); cursor: pointer; background: #fff; color: var(--text);
    }
    .sf-chip.active { background: var(--btn-bg, var(--accent)); border-color: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg)); }

    .sf-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-height: 50px; padding: 15px 20px; border: 0; border-radius: var(--rp);
      background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg));
      font: 800 16px var(--body); cursor: pointer; text-decoration: none;
    }
    .sf-btn:hover { filter: brightness(.96); }
    .sf-btn:active { background: var(--accent-600); }
    .sf-btn[disabled] { opacity: .45; cursor: default; filter: none; }

    /* ══════════════ Product tiles (Menu + Products grids) ══════════════ */
    .sf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px var(--ggap); }
    .sf-tile { display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-width: 0; }
    .sf-tile-img { aspect-ratio: 1/1; position: relative; border-radius: var(--rs); overflow: hidden; background: var(--n100); }
    .sf-tile-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .sf-badge {
      position: absolute; left: 8px; bottom: 8px; padding: 5px 10px; border-radius: var(--rp);
      background: #fff; color: var(--text); font-size: 11px; font-weight: 800; box-shadow: var(--shadow-sm);
      max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sf-tile-body { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .sf-tile-name { font-size: 15px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-tile-meta { font-size: 12px; color: var(--card-muted, var(--n700)); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-price-row { margin-top: auto; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sf-price { font-size: 18px; font-weight: 800; color: var(--card-title, var(--head-ink)); }
    .sf-price .from { font-size: 12px; font-weight: 600; margin-right: 4px; color: var(--card-muted, var(--n700)); }
    .sf-price:has(.orig) { color: var(--sale); }
    .orig { text-decoration: line-through; color: var(--n700); font-weight: 400; margin-right: 6px; font-size: .8em; }
    .p-sale-badge {
      display: inline-flex; align-self: flex-start; font-size: 10px; font-weight: 800; letter-spacing: .02em;
      padding: 3px 9px; border-radius: var(--rp); background: var(--sale); color: #fff;
    }

    /* Carried-over add control (refreshAddControl), restyled to the
       handoff's 44px round primary button. */
    .add-btn, .qty-stepper { height: 44px; flex-shrink: 0; }
    .add-btn {
      width: 44px; border-radius: var(--rp); border: none; background: var(--btn-bg, var(--accent)); color: var(--btn-fg, var(--accent-fg));
      font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .add-btn.added { font-size: 15px; }
    .qty-stepper {
      display: flex; align-items: center; border: 1.5px solid var(--n300); border-radius: var(--rp); overflow: hidden; background: #fff;
      animation: popIn .16s ease-out;
    }
    .qty-stepper button { width: 34px; height: 100%; border: none; background: transparent; color: var(--text); font-size: 17px; cursor: pointer; }
    .qty-stepper .qty { font-size: 14px; font-weight: 700; padding: 0 2px; color: var(--text); min-width: 14px; text-align: center; }
    @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    .sf-more { margin-top: 18px; display: flex; justify-content: center; }
    .sf-more button {
      min-height: 44px; padding: 0 20px; border-radius: var(--rp); border: 1.5px solid var(--n300); background: #fff;
      font: 700 14px var(--body); color: var(--text); cursor: pointer;
    }

    /* ── Single-item feature layout (any card with exactly one item) ── */
    .sf-feature { display: flex; flex-wrap: wrap; gap: var(--cpad); }
    .sf-feature-img { flex: 1 1 340px; min-height: 300px; position: relative; border-radius: var(--rs); overflow: hidden; background: var(--tint); cursor: pointer; }
    .sf-feature-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .sf-feature-info { flex: 1 1 280px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .sf-feature-info h3 { font-size: var(--h3); line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
    .sf-feature-meta { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--card-muted, var(--n800)); }
    .sf-feature-desc { font-size: 15px; line-height: 1.55; color: var(--card-muted, var(--n800)); white-space: pre-line;
      display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-feature-buy { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
    .sf-feature-buy .sf-price { font-size: 30px; letter-spacing: -.02em; }
    .sf-feature-buy .sf-price .from { font-size: 13px; margin-right: 6px; }

    /* ══════════════ 2. Lead magnet ══════════════ */
    /* Rich capture card — shared by Free download (#sf-magnet) and the
       mailing-list signup (#email-capture): optional picture, title, short
       description, and the email form, side by side on wide screens and
       stacked on phones. */
    .sf-rich {
      display: flex; flex-wrap: wrap; align-items: center; gap: 18px 24px; padding: var(--cpad2) var(--cpad);
      background: var(--card-bg, #fff); color: var(--card-text, var(--text));
      border-radius: var(--r); box-shadow: var(--shadow-md); scroll-margin-top: 16px;
    }
    #sf-magnet.sf-rich { background: var(--card-bg, var(--tint)); }
    .sf-rich.hidden { display: none; }
    .sf-rich-media {
      width: 96px; height: 96px; border-radius: var(--rs); background: var(--n100); transform: rotate(-4deg);
      box-shadow: var(--shadow-md); overflow: hidden; flex: none; position: relative;
    }
    .sf-rich-media:empty { display: none; }
    .sf-rich-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .sf-rich-text { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .sf-rich-text h3 {
      font-family: var(--display); font-weight: var(--dw); font-size: var(--h3m); line-height: 1.1; margin: 0;
      color: var(--card-title, var(--head-ink)); overflow-wrap: anywhere;
    }
    .sf-rich-text p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--card-muted, var(--n800)); white-space: pre-line; }
    .sf-rich-text p:empty { display: none; }
    .sf-rich-action { flex: 1 1 300px; min-width: 0; display: flex; }
    .sf-capture-form { width: 100%; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sf-capture-form input {
      flex: 1 1 180px; min-width: 0; height: 50px; padding: 0 18px; background: #fff; border: 0; border-radius: var(--rp);
      font-size: 15px; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--n300);
    }
    #sf-magnet .sf-capture-form input { box-shadow: none; }
    /* Phones: email field and button each take the full width when stacked. */
    #sf-root.compact .sf-capture-form input,
    #sf-root.compact .sf-capture-form .sf-btn { flex: 1 1 100%; }
    .sf-capture-form .sf-btn { flex: 0 0 auto; height: 50px; min-height: 0; padding: 0 22px; font-size: 15px; justify-content: center; }
    .sf-capture-status { flex-basis: 100%; font-size: 13px; color: var(--card-muted, var(--n800)); min-height: 0; }
    .sf-capture-status:empty { display: none; }
    .sf-capture-done {
      flex: 1 1 320px; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 18px;
      background: #fff; color: var(--text); border-radius: var(--rp); font-size: 15px; font-weight: 700;
    }

    /* ══════════════ 4. Products: downloads sub-section ══════════════ */
    #digital-feed { border-top: 1px solid var(--card-line, var(--n200)); }
    #digital-feed.solo { border-top: 0; }
    .sf-dl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: var(--cpad2) var(--cpad) 4px; }
    .sf-dl-head .titles { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
    .sf-dl-head h3 { font-size: 20px; font-weight: 800; line-height: 1.2; margin: 0; }
    .sf-viewall { display: flex; align-items: center; gap: 6px; font: 800 14px var(--body); color: var(--card-title, var(--head-ink)); background: none; border: 0; cursor: pointer; }
    .sf-dl-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      column-gap: 32px; padding: 4px var(--cpad) 12px;
    }
    .sf-dl-row {
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--card-line, var(--n200)); cursor: pointer;
    }
    .sf-dl-thumb { width: 56px; height: 56px; border-radius: var(--rs); background: var(--n100); overflow: hidden; position: relative; }
    .sf-dl-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .sf-dl-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .sf-dl-name { font-size: 14px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sf-dl-price { font-size: 14px; font-weight: 800; color: var(--card-title, var(--head-ink)); }
    .sf-dl-price:has(.orig) { color: var(--sale); }
    .sf-dl-add {
      min-height: 40px; padding: 0 14px; border-radius: var(--rp); border: 1.5px solid var(--n300); background: #fff;
      font: 700 13px var(--body); color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .sf-dl-add:hover { border-color: var(--accent); color: var(--head-ink); }
    .sf-dl-add.added { background: var(--tint); border-color: var(--tint); color: var(--head-ink); }

    /* ══════════════ 5. Links ══════════════ */
    /* A link's glow may spill past the card edge rather than being cut off. */
    #links-feed { overflow: visible; }
    #links-feed .sf-card-head { border-radius: var(--r) var(--r) 0 0; }
    .sf-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--ggap); align-items: start; }
    .sf-link { position: relative; border-radius: var(--r); text-decoration: none; color: var(--text); font: inherit; text-align: left; border: 0; cursor: pointer; }
    .sf-link.pill { border-radius: var(--rp); }
    .sf-link.rich {
      display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center;
      padding: 8px 16px 8px 8px; background: var(--n100);
    }
    .sf-link.rich:hover, .sf-link.photo:hover { background: var(--tint); }
    .sf-link-img { width: 96px; height: 72px; border-radius: var(--rs); background: var(--tint); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .sf-link-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .sf-link-title { font-size: 15px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .sf-link-domain { font-size: 12px; color: var(--link-sub, var(--n700)); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sf-link.photo { display: flex; flex-direction: column; background: var(--n100); padding: 8px; gap: 10px; }
    .sf-link.photo .sf-link-img { width: 100%; height: auto; aspect-ratio: 16/10; font-size: 34px; }
    .sf-link.photo .sf-link-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 8px 6px; }
    .sf-link.pill {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 0 20px; border: 2px solid var(--n300); background: #fff;
      color: var(--text); font: 800 16px var(--body);
    }
    .sf-link.pill:hover { filter: brightness(.96); }
    .sf-link-label { min-width: 0; overflow-wrap: anywhere; }
    .sf-link.disabled { opacity: .45; pointer-events: none; }
    /* Stroke / glow / shake — on the link card itself, never the section card. */
    /* Border / glow are inline styles per link — see renderLinkRow. */
    @keyframes sf-shake {
      0%, 80%, 100% { transform: rotate(0); }
      83% { transform: rotate(-2deg); } 86% { transform: rotate(2deg); }
      89% { transform: rotate(-1.5deg); } 92% { transform: rotate(1.5deg); } 95% { transform: rotate(-.5deg); }
    }
    .sf-link.shake, .sf-navbtn.shake { animation: sf-shake 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .sf-link.shake, .sf-navbtn.shake { animation: none; } }

    /* ══════════════ 6. About ══════════════ */
    #pb-about { display: flex; flex-wrap: wrap; }
    #pb-about.hidden { display: none; }
    #pb-about-photo { flex: 1 1 280px; min-height: 320px; position: relative; background: var(--tint); }
    #pb-about-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #pb-about-body { flex: 2 1 360px; padding: var(--apad); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    #pb-about-heading { font-family: var(--display); font-weight: var(--dw); font-size: var(--h2a); line-height: 1.05; margin: 0; color: var(--card-title, var(--head-ink)); overflow-wrap: anywhere; }
    #pb-about-text p { margin: 0 0 12px; font-size: 16px; line-height: 1.65; max-width: 60ch; text-wrap: pretty; }
    #pb-about-text p:last-child { margin-bottom: 0; }

    /* ══════════════ 7. Before you order ══════════════ */
    #sf-info-body { display: flex; flex-wrap: wrap; gap: 12px 48px; padding: 4px var(--cpad) var(--cpad2); }
    #sf-info-acc { flex: 2 1 380px; min-width: 0; }
    #sf-info-acc:empty { display: none; }
    .sf-acc { border-bottom: 1px solid var(--card-line, var(--n200)); }
    .sf-acc > summary {
      list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      min-height: 54px; font-size: 16px; font-weight: 800;
    }
    .sf-acc > summary::-webkit-details-marker { display: none; }
    .sf-acc > summary svg { flex: none; transition: transform .2s; }
    .sf-acc[open] > summary svg { transform: rotate(45deg); }
    .sf-acc .sf-acc-body { margin: 0 0 16px; font-size: 15px; line-height: 1.6; max-width: 64ch; white-space: pre-line; }
    #hours-card { flex: 1 1 240px; display: flex; flex-direction: column; padding-top: 14px; }
    #hours-card .sf-kicker { padding-bottom: 6px; }
    .sf-hours-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--card-line, var(--n200)); font-size: 15px; }
    .sf-hours-row .day { font-weight: 700; }

    /* ══════════════ Form takeover card ══════════════ */
    #sf-form-intro { padding: var(--cpad) var(--cpad) 0; }
    #sf-form-intro p { font-size: 15px; line-height: 1.6; white-space: pre-wrap; max-width: 70ch; }
    #sf-form-mount { padding: var(--cpad); }

    /* ══════════════ Email capture card ══════════════ */

    /* ══════════════ 8. Footer ══════════════ */
    #site-footer {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 14px 20px;
      background: #fff; border-radius: var(--rp); box-shadow: var(--shadow-sm); font-size: 13px; color: var(--n800);
    }
    #footer-copy { margin-right: auto; }
    #site-footer a { color: inherit; }
    #site-footer .made { font-weight: 700; text-decoration: none; }

    /* ══════════════ 9. Sticky cart bar ══════════════ */
    #sf-cartbar {
      position: sticky; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40;
      display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 20px;
      background: var(--text); color: #fff; border-radius: var(--rp); box-shadow: var(--shadow-lg);
      animation: popIn .18s ease-out;
    }
    #sf-cartbar-label { font-size: 15px; font-weight: 700; margin-right: auto; }
    #sf-cartbar .sf-btn { min-height: 44px; padding: 0 20px; font-size: 15px; }

    /* Square corners option (storefront_design.corners = 'square'). */
    #sf-root.square { --r: 0px; --rs: 0px; --rp: 0px; }

    /* ══════════════ Sheets / modal / toast (carried over) ══════════════ */
    .scrim {
      position: fixed; inset: 0; background: rgba(20,15,10,.55); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .scrim.open { display: flex; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 480px; max-height: 90%; overflow: auto;
      overscroll-behavior: contain;
      border-radius: 24px 24px 0 0; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
      animation: riseIn .22s ease-out;
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sheet-close {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(20,15,10,.5); color: #fff; border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 9999px; border: none; cursor: pointer; font-weight: 700; font-size: 15px;
      text-decoration: none; font-family: var(--body);
    }
    .btn-primary { height: 50px; background: var(--accent); color: var(--accent-fg); }
    .btn-outline { height: 48px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
    #item-sheet { display: flex; flex-direction: column; overflow: hidden; height: 96%; max-height: 96%; }
    #item-sheet-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #item-sheet-photo { position: relative; aspect-ratio: 1/1; background: var(--line-soft); flex: none; min-height: 0; overflow: hidden; touch-action: none; }
    #item-sheet-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .p-badge {
      position: absolute; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 9999px; color: #fff; font-size: 11px; font-weight: 700;
    }
    .p-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
    #item-sheet-body { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 14px 20px 14px; }
    #item-sheet-fixed { flex: none; }
    #item-sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    #item-sheet-name { font-size: 20px; font-weight: 800; color: var(--ink); margin-top: 6px; }
    #item-sheet-price { font-size: 16px; font-weight: 800; color: var(--head-ink); margin-top: 2px; }
    #item-sheet-price:has(.orig) { color: var(--sale); }
    #item-sheet-desc { font-size: 14px; line-height: 1.6; color: var(--bio); margin-top: 10px; }
    #item-sheet-desc.clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #item-sheet-desc.tappable { cursor: pointer; }
    #item-sheet-desc-toggle {
      display: none; background: none; border: none; padding: 0; margin-top: 8px;
      font-size: 13px; font-weight: 700; color: var(--head-ink); cursor: pointer; font-family: inherit;
    }
    .spec-list { margin-top: 8px; }
    .spec-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); color: var(--muted); }
    .spec-row b { color: var(--ink); font-weight: 600; }
    #item-sheet-body .btn { width: 100%; height: 46px; margin-top: 12px; }
    #item-sheet-box { margin-top: 12px; }
    .box-step-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin-bottom: 6px; }
    .box-tiers { display: flex; gap: 8px; margin-bottom: 10px; }
    .box-tier {
      flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 14px; background: transparent;
      padding: 8px 6px; text-align: center; cursor: pointer;
    }
    .box-tier.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .box-tier.disabled { opacity: .45; cursor: not-allowed; }
    .box-tier-thumb { display: block; width: 34px; height: 34px; object-fit: cover; border-radius: 8px; margin: 0 auto 6px; background: var(--line-soft); }
    .box-tier-label { font-size: 12.5px; font-weight: 700; color: var(--ink); }
    .box-tier-price { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .box-flavor-header { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    .box-flavor-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .box-flavor-thumb { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; background: var(--line-soft); flex-shrink: 0; }
    .box-flavor-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
    .box-flavor-row .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 9999px; height: 32px; flex-shrink: 0; }
    .box-flavor-row .stepper button { width: 28px; height: 100%; border: none; background: none; font-size: 15px; cursor: pointer; color: var(--ink); }
    .box-flavor-row .stepper button:disabled { opacity: .3; cursor: default; }
    .box-flavor-row .stepper .qty { font-size: 13px; min-width: 16px; text-align: center; }
    #cart-sheet-body { padding: 18px 20px 24px; }
    #desc-sheet-body { padding: 4px 20px 28px; }
    #desc-sheet-title { font-size: 20px; font-weight: 800; color: var(--ink); margin-bottom: 12px; }
    #desc-sheet-text { font-size: 15px; line-height: 1.75; color: var(--bio); white-space: pre-wrap; }
    #cart-step-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin-bottom: 8px; }
    .cart-line { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cart-line .thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--line-soft); flex-shrink: 0; overflow: hidden; }
    .cart-line .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-line .info { flex: 1; min-width: 0; }
    .cart-line .info .n { font-size: 14px; font-weight: 600; color: var(--ink); }
    .cart-line .info .m { font-size: 11px; color: var(--muted); }
    .cart-line .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 9999px; height: 36px; }
    .cart-line .stepper button { width: 28px; height: 100%; border: none; background: none; font-size: 15px; cursor: pointer; color: var(--ink); }
    .cart-line .stepper .qty { font-size: 12px; min-width: 16px; text-align: center; }
    .cart-line .total { font-size: 13px; color: var(--ink); width: 56px; text-align: right; }
    .cart-line .remove-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 13px; cursor: pointer; flex-shrink: 0; }
    .cart-section-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin: 16px 0 8px; }
    .cart-financial-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--bio); }
    .cart-financial-row.total { font-weight: 700; color: var(--ink); font-size: 16px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
    .cart-note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 10px; }
    .field { margin-top: 12px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 14px;
    }
    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--text); color: #fff; padding: 10px 18px; border-radius: 9999px; font-size: 13px;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 860px) {
      .scrim { align-items: center; }
      #item-sheet { max-width: 560px; width: 90%; border-radius: 24px; max-height: 92vh; height: 92vh; }
      #cart-sheet { max-width: 440px; margin-left: auto; margin-right: 0; height: 100%; max-height: 100%; border-radius: 0; box-shadow: -20px 0 50px -20px rgba(0,0,0,.4); }
      .scrim:has(#cart-sheet) { justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div id="sf-root">
<div id="sf-frame" aria-hidden="true">
  <div id="sf-bg-top" class="hidden"></div>
  <div id="sf-bg-full" class="hidden"></div>
</div>
<div id="page-shell">

<div id="announcement-banner" class="hidden"></div>

<!-- 1. Profile top — pinned first. id kept as profile-block: the iOS
     builder's 'identity' tap target / edit hint keys off it. -->
<header id="profile-block">
  <div id="sf-top-actions">
    <button class="sf-pill-btn icon" id="share-btn" aria-label="Share">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    </button>
    <button class="sf-pill-btn" id="cart-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span id="cart-btn-count">0</span>
    </button>
  </div>
  <div id="pb-avatar"><span id="pb-avatar-letter"></span></div>
  <h1 id="shop-name"></h1>
  <div id="sf-intro-card">
    <span id="shop-meta" class="hidden">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="shop-meta-text"></span>
    </span>
    <p id="shop-bio" class="hidden"></p>
    <nav id="sf-nav" aria-label="Sections"></nav>
    <div id="social-icons" class="hidden"></div>
  </div>
</header>

<!-- Content blocks — reordered/hidden by applyStorefrontBlockLayout.
     Inner ids (feed, physical-feed, digital-feed, faq-col, pb-policies,
     hours-card, email-capture, links-feed, pb-about, form-storefront) are
     the SAME ids the live index.html uses, so installed iOS builder builds
     (BuilderEditHints.containerIDs / tap-to-select) keep working when this
     page replaces it. Don't rename them without shipping the builder. -->

<section id="sf-magnet" class="sf-rich hidden" data-block="leadMagnet">
  <div class="sf-rich-media" id="sf-magnet-thumb"></div>
  <div class="sf-rich-text">
    <span class="sf-kicker">Free download</span>
    <h3 id="sf-magnet-title"></h3>
    <p id="sf-magnet-body"></p>
  </div>
  <div class="sf-rich-action" id="sf-magnet-action"></div>
</section>

<section id="feed" class="sf-card hidden" data-block="menu">
  <div class="sf-card-head" id="feed-heading">
    <div class="titles"><h2 id="feed-title"></h2><span class="sf-sub" id="feed-sub"></span></div>
    <div class="sf-chips" id="filter-strip"></div>
  </div>
  <div class="sf-card-body" id="product-grid"></div>
</section>

<section id="form-storefront" class="sf-card hidden" data-block="form">
  <div class="sf-card-head">
    <div class="titles"><h2 id="sf-form-title"></h2><span class="sf-sub" id="sf-form-sub"></span></div>
  </div>
  <div id="sf-form-intro" class="hidden"><p id="sf-intro-body"></p></div>
  <div id="sf-form-mount"></div>
</section>

<section id="sf-products" class="sf-card hidden" data-block="products">
  <div class="sf-card-head">
    <div class="titles"><h2 id="sf-products-title"></h2><span class="sf-sub" id="sf-products-sub"></span></div>
    <div class="sf-chips" id="sf-products-filters"></div>
  </div>
  <div class="sf-card-body hidden" id="physical-feed" data-bt="physical"></div>
  <div id="digital-feed" class="hidden" data-bt="digital"></div>
</section>

<section id="links-feed" class="sf-card hidden" data-block="links">
  <div class="sf-card-head">
    <div class="titles"><h2 id="sf-links-title"></h2></div>
  </div>
  <div class="sf-card-body"><div class="sf-links" id="sf-links-list"></div></div>
</section>

<section id="pb-about" class="sf-card hidden" data-block="about">
  <div id="pb-about-photo" class="hidden"><img id="pb-about-portrait" alt="" /></div>
  <div id="pb-about-body">
    <span class="sf-kicker" id="pb-about-kicker">About the baker</span>
    <h2 id="pb-about-heading"></h2>
    <div id="pb-about-text"></div>
  </div>
</section>

<section id="sf-info" class="sf-card hidden" data-block="info">
  <div class="sf-card-head">
    <div class="titles"><h2 id="sf-info-title"></h2><span class="sf-sub" id="sf-info-sub"></span></div>
  </div>
  <div id="sf-info-body">
    <div id="sf-info-acc"><div id="pb-policies" class="hidden" data-bt="policies"></div><div id="faq-col" class="hidden" data-bt="faq"></div></div>
    <div id="hours-card" class="hidden" data-bt="hours">
      <span class="sf-kicker">Pickup hours</span>
      <div id="hours-rows"></div>
    </div>
  </div>
</section>

<section id="email-capture" class="sf-rich hidden" data-block="emailCapture">
  <div class="sf-rich-media" id="sf-capture-media"></div>
  <div class="sf-rich-text">
    <h3 id="sf-capture-title"></h3>
    <p id="sf-capture-desc"></p>
  </div>
  <div class="sf-rich-action" id="sf-capture-body"></div>
</section>

<footer id="site-footer">
  <span id="footer-copy"></span>
  <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
  <a class="made" href="https://bakeriapp.com">Made with Bakeri</a>
</footer>

<div id="sf-cartbar" class="hidden">

      order.push(b.type);
      (Array.isArray(b.parts_hidden) ? b.parts_hidden : []).forEach(function (part) { sub[part] = true; });
    });

      if (cfg[t]) return;
      cfg[t] = { type: t, hidden: false };
      order.push(t);

    const raw = Array.isArray(p.storefront_block_layout) && p.storefront_block_layout.length ? p.storefront_block_layout : [];

    // in v2 — shown as the Free download card, in the email block's slot —

    leadFromCapture = !!p.email_capture_deliverable_listing_id &&

    const order = [];
    const cfg = {};
    const sub = {};

        Object.keys(b).forEach(function (k) { if (cfg[t][k] === undefined) cfg[t][k] = b[k]; });
      }

      if (!b.hidden) cfg[t].hidden = false;

    // would put them (right after the nearest earlier default type present).
    V2_DEFAULT_ORDER.forEach(function (t, i) {

      for (let j = i - 1; j >= 0; j--) {

        if (k !== -1) { at = k + 1; break; }
      }
      order.splice(at, 0, t);
    });
    blockOrder = order;
    blockCfg = cfg;
    subHidden = sub;
  }

  function firstName() {
    const n = ((profile && profile.user_name) || '').trim().split(/\s+/)[0];
    return n || (profile && profile.business_name) || 'me';
  }

  // Every card title is renamable (entry.title); these are the defaults.
  function cardTitle(type) {
    const key = type === 'form' ? 'menu' : type;
    const custom = ((blockCfg[key] && blockCfg[key].title) || '').trim();
    if (custom) return custom;
    switch (type) {
      case 'menu': return 'Shop my Menu';
      case 'products': return 'Shop my Products';
      case 'links': return 'More from ' + firstName();
      case 'info': return 'Before you order';
      case 'about': return ((profile && profile.about_heading) || '').trim() || 'Meet ' + firstName();
      case 'emailCapture': return ((profile && profile.email_capture_heading) || '').trim() || 'Join my list';
      case 'leadMagnet': return leadMagnetConfig().heading;
      case 'form':
        return (sfListing && ((sfListing.storefront_intro_title || '').trim() || sfListing.name)) || 'Order';
    }
    return '';
  }

  function cardElement(type) {
    if (type === 'menu' && sfListing) return document.getElementById(CARD_IDS.form);
    return document.getElementById(CARD_IDS[type]);
  }

  // Moves already-rendered cards into the baker's order and applies hide +
  // per-card colours. Never un-hides a card its renderer left hidden
  // (nothing to show).
  function applyStorefrontBlockLayout() {
    const shell = document.getElementById('page-shell');
    const footer = document.getElementById('site-footer');
    if (sfListing) document.getElementById('feed').classList.add('hidden');
    blockOrder.forEach(function (t) {
      const el = cardElement(t);
      if (!el) return;
      shell.insertBefore(el, footer);
      if (blockCfg[t].hidden) el.classList.add('hidden');
      applyCardColors(el, blockCfg[t].colors);
    });
  }

  function scrollToSection(id) {
    const target = document.getElementById(id);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  const ARROW_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
  const ARROW_UR_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>';
  const DOWNLOAD_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
  const CLOCK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  const PLUS_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="flex:none"><path d="M12 5v14M5 12h14"/></svg>';
  const CHECK_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="20 6 9 17 4 12"/></svg>';

  // The intro card's stacked buttons ARE the site nav: one per visible
  // block, in block order (reorder the blocks to reorder these). Each can
  // be hidden (entry.nav = false) or relabelled (entry.nav_label); the
  // first one shown is the solid accent button.
  function renderSectionNav() {
    const nav = document.getElementById('sf-nav');
    nav.innerHTML = '';
    let first = true;
    blockOrder.forEach(function (t) {
      const key = (t === 'menu' && sfListing) ? 'form' : t;
      const el = cardElement(t);
      if (!el || el.classList.contains('hidden')) return;
      const c = blockCfg[t] || {};
      const show = typeof c.nav === 'boolean' ? c.nav : NAV_DEFAULT[key];
      if (!show) return;
      const label = (c.nav_label || '').trim() || cardTitle(key);
      const btn = document.createElement('a');
      btn.href = '#' + el.id;
      btn.className = 'sf-navbtn' + (first ? ' primary' : '');
      // Each menu button: own fill, text colour, border (with its own
      // colour) and shake — entry.nav_color / nav_text_color /
      // nav_border + nav_border_color / nav_shake.
      const navColor = validHex(c.nav_color);
      const navText = validHex(c.nav_text_color);
      if (navColor) {
        btn.style.background = navColor;
        btn.style.borderColor = navColor;
      }
      if (navText || navColor) btn.style.color = navText || readableOn(navColor);
      if (c.nav_border === true) {
        btn.style.borderColor = validHex(c.nav_border_color) || navText || 'currentColor';
      } else if (c.nav_border === false && !navColor) {
        btn.style.borderColor = 'transparent';
      }
      if (c.nav_shake === true) btn.classList.add('shake');
      btn.innerHTML = '<span>' + escapeHtml(label) + '</span>' + ARROW_SVG;
      btn.addEventListener('click', function (e) { e.preventDefault(); scrollToSection(el.id); });
      nav.appendChild(btn);
      first = false;
    });
  }

  // ══════════════════════ Colour + type tokens ══════════════════════

  const DISPLAY_FONTS = {
    'Archivo':            { w: 800, gf: null },
    'Shrikhand':          { w: 400, gf: 'Shrikhand' },
    'Cormorant Garamond': { w: 700, gf: 'Cormorant+Garamond:wght@700' },
    'Fraunces':           { w: 700, gf: 'Fraunces:opsz,wght@9..144,700' },
    'Playfair Display':   { w: 700, gf: 'Playfair+Display:wght@700' },
    'DM Serif Display':   { w: 400, gf: 'DM+Serif+Display' },
    'Abril Fatface':      { w: 400, gf: 'Abril+Fatface' },
    'Lilita One':         { w: 400, gf: 'Lilita+One' },
    'Pacifico':           { w: 400, gf: 'Pacifico' },
    'Baloo 2':            { w: 800, gf: 'Baloo+2:wght@800' }
  };
  const loadedFonts = {};
  function loadDisplayFont(name) {
    const f = DISPLAY_FONTS[name];
    if (!f || !f.gf || loadedFonts[name]) return;
    loadedFonts[name] = true;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + f.gf + '&display=swap';
    document.head.appendChild(link);
  }

  function validHex(v) {
    if (typeof v !== 'string') return null;
    const s = v.trim();
    if (/^#[0-9a-f]{6}$/i.test(s)) return s;
    if (/^#[0-9a-f]{3}$/i.test(s)) return '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
    return null;
  }
  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function rgbHex(rgb) {
    return '#' + rgb.map(function (c) { return Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0'); }).join('');
  }
  // t = how far toward `b` (0 → a, 1 → b)
  function mixHex(a, b, t) {
    const x = hexRgb(a), y = hexRgb(b);
    return rgbHex([0, 1, 2].map(function (i) { return x[i] + (y[i] - x[i]) * t; }));
  }
  function relLum(hex) {
    const c = hexRgb(hex).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrast(a, b) {
    const la = relLum(a), lb = relLum(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }
  function readableOn(bg) { return contrast(bg, '#ffffff') >= contrast(bg, '#201e1d') ? '#ffffff' : '#201e1d'; }
  // Handoff `ink`: a deeper shade of the accent for headings/prices on
  // white — darkened until it clears 4.5:1 against white.
  function inkFor(accent) {
    for (let i = 3; i <= 20; i++) {
      const c = mixHex(accent, '#000000', i * 0.05);
      if (contrast(c, '#ffffff') >= 4.5) return c;
    }
    return '#201e1d';
  }

  function currentTheme() {
    const T = window.BakeriTheme && window.BakeriTheme.THEMES;
    if (!T) return null;
    return T[(profile && profile.selected_theme) || 'Classic'] || T['Classic'];
  }

  // Seller roles default to the baker's theme; any colour she set
  // explicitly (storefront_design.colors) wins.
  function applyDesignTokens() {
    const T = currentTheme();
    const themePrimary = (T && T.primary && T.primary.light) || '#1C1C1E';
    const themeBtnFg = (T && T.buttonFg && T.buttonFg.light) || '#FFFFFF';
    const c = design.colors || {};
    const accent = validHex(c.accent) || themePrimary;
    const accentFg = validHex(c.accent) ? readableOn(accent) : themeBtnFg;
    const root = document.documentElement.style;
    root.setProperty('--accent', accent);
    root.setProperty('--accent-600', mixHex(accent, '#000000', 0.1));
    root.setProperty('--accent-fg', validHex(c.button_text) || accentFg);
    root.setProperty('--head-ink', validHex(c.ink) || inkFor(accent));
    root.setProperty('--tint', validHex(c.tint) || mixHex(accent, '#ffffff', 0.88));

    const fontName = DISPLAY_FONTS[design.display_font] ? design.display_font : 'Archivo';
    loadDisplayFont(fontName);
    root.setProperty('--display', '"' + fontName + '", "Archivo", -apple-system, system-ui, sans-serif');
    root.setProperty('--dw', String(DISPLAY_FONTS[fontName].w));
    document.getElementById('sf-root').classList.toggle('square', design.corners === 'square');
  }

  // Per-card colour overrides (entry.colors / design.identity.colors):
  // background, title, button. Text, muted text and dividers follow the
  // background automatically so a dark card stays readable.
  function applyCardColors(el, colors) {
    if (!el) return;
    ['--card-bg', '--card-text', '--card-muted', '--card-line', '--card-title', '--btn-bg', '--btn-fg'].forEach(function (v) {
      el.style.removeProperty(v);
    });
    if (!colors || typeof colors !== 'object') return;
    const bg = validHex(colors.background);
    let darkBg = false;
    if (bg) {
      darkBg = readableOn(bg) === '#ffffff';
      el.style.setProperty('--card-bg', bg);
      el.style.setProperty('--card-text', darkBg ? '#ffffff' : '#201e1d');
      el.style.setProperty('--card-muted', darkBg ? 'rgba(255,255,255,.78)' : '#444141');
      el.style.setProperty('--card-line', darkBg ? 'rgba(255,255,255,.18)' : 'rgba(32,30,29,.12)');
    }
    const text = validHex(colors.text);
    if (text) {
      el.style.setProperty('--card-text', text);
      const rgb = hexRgb(text);
      el.style.setProperty('--card-muted', 'rgba(' + rgb.join(',') + ',.82)');
    }
    const title = validHex(colors.title);
    if (title) el.style.setProperty('--card-title', title);
    else if (darkBg) el.style.setProperty('--card-title', '#ffffff');
    const btn = validHex(colors.button);
    if (btn) {
      el.style.setProperty('--btn-bg', btn);
      el.style.setProperty('--btn-fg', readableOn(btn));
    }
  }

  // ══════════════════════ Background ══════════════════════
  //
  // storefront_design.background.mode:
  //   'theme'      — theme background colour + pattern (theme.js layer)
  //   'image_top'  — image across the top, always fading into a base colour
  //   'image_full' — image covering the whole page
  //   unset        — 'image_top' if the baker has a header image, else
  //                  'theme'. This is how every existing baker's header
  //                  photo becomes their faded top at launch with no data
  //                  migration: same Storage path, new treatment.
  // Fade/base colour = background.fade_color, else the theme background.

  let bgToken = 0;
  let bgRatio = 0;
  let bgMode = 'theme';

  // The page's base colour: what the top image fades into, the frame's fill
  // and everything outside the frame (photo modes) / the theme background
  // (theme mode). Baker's choice, else the theme bg.
  function baseColor() {
    const b = (design.background && typeof design.background === 'object') ? design.background : {};
    return validHex(b.color) || validHex(b.fade_color) || themeBgLight();
  }

  function themeBgLight() {
    const T = currentTheme();
    return (T && T.bg && T.bg.light) || '#FAF6EE';
  }

  // Only the bold two-colour stripes/gingham are dark enough behind the
  // shop name to need white text; every other pattern is a pale texture
  // (it gets the white halo instead — see name-on-photo).
  function themePatternIsBusy() {
    const T = currentTheme() || {};
    const pattern = (profile && profile.background_pattern) || 'Standard';
    if (pattern === 'Stripes') return !!T.bold;
    if (pattern === 'Gingham') return !!T.bold && !T.legacyGingham;
    return false;
  }

  function setNameOnDark(onDark) {
    document.getElementById('sf-root').classList.toggle('name-on-dark', !!onDark);
  }

  function useThemeBackground() {
    bgMode = 'theme';
    document.getElementById('sf-bg-top').classList.add('hidden');
    document.getElementById('sf-bg-full').classList.add('hidden');
    document.documentElement.style.background = baseColor();
    if (window.BakeriTheme) window.BakeriTheme.apply(profile, { forceLight: true });
    // Full-width theme: theme.js's fixed full-screen pattern layer stays
    // where it is and the photo frame is hidden (see .bg-theme).
    document.getElementById('sf-root').classList.add('bg-theme');
    const patterned = ((profile && profile.background_pattern) || 'Standard') !== 'Standard';
    document.getElementById('sf-root').classList.toggle('name-on-photo', patterned);
    setNameOnDark(themePatternIsBusy());
  }

  function renderBackground() {
    const b = (design.background && typeof design.background === 'object') ? design.background : {};
    const fade = baseColor();
    document.documentElement.style.setProperty('--fade-base', fade);
    const token = ++bgToken;
    useThemeBackground(); // paints immediately; swapped out below once an image loads
    if (b.mode === 'theme') return;

    const url = b.image_url || (profile && profile.__preview_header_data_url) ||
      assetURL('/storefront-headers/' + resolvedBakerId.toUpperCase() + '/header.jpg');
    const img = new Image();
    img.onload = function () {
      if (token !== bgToken) return; // a newer render already replaced this
      const full = b.mode === 'image_full';
      bgMode = full ? 'image_full' : 'image_top';
      bgRatio = img.naturalHeight / img.naturalWidth;
      const layer = document.getElementById('theme-pattern-layer');
      if (layer) layer.remove();
      document.documentElement.style.background = fade;
      const on = document.getElementById(full ? 'sf-bg-full' : 'sf-bg-top');
      const off = document.getElementById(full ? 'sf-bg-top' : 'sf-bg-full');
      on.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
      // Faded top keeps the image's top edge pinned (that's what fades);
      // full-page crops around the subject.
      const bgFocus = b.focus || designFocus('background');
      on.style.backgroundPosition = full
        ? focusPosition(bgFocus, img.naturalWidth, img.naturalHeight)
        : (bgFocus ? focusPosition(bgFocus).split(' ')[0] + ' top' : 'center top');
      on.classList.remove('hidden');
      off.classList.add('hidden');
      document.getElementById('sf-root').classList.add('name-on-photo');
      document.getElementById('sf-root').classList.remove('bg-theme');
      sizeTopBackground();
      sampleImageIsDark(url, full, function (dark) { if (token === bgToken) setNameOnDark(dark); });
    };
    img.src = url;
  }

  // Full width at the image's natural ratio (scaled), cropped to a taller
  // minimum on narrow screens so a landscape photo still reads as a
  // backdrop behind the logo and name.
  function sizeTopBackground() {
    if (bgMode !== 'image_top' || !bgRatio) return;
    const top = document.getElementById('sf-bg-top');
    const w = document.getElementById('sf-frame').clientWidth;
    const compact = document.getElementById('sf-root').classList.contains('compact');
    top.style.height = Math.round(Math.max(w * bgRatio, compact ? 440 : 360)) + 'px';
  }

  // Average luminance of the part of the photo behind the logo + name
  // (the upper-middle band for a top image, the upper half for full-page).
  // Needs a CORS-clean read; if the canvas is tainted we assume dark, since
  // white text with a heavy shadow is the safe default on a photo.
  function sampleImageIsDark(url, full, done) {
    const probe = new Image();
    probe.crossOrigin = 'anonymous';
    probe.onload = function () {
      try {
        const c = document.createElement('canvas');
        c.width = 24; c.height = 24;
        const ctx = c.getContext('2d');
        const sh = probe.naturalHeight * (full ? 0.5 : 0.45);
        const sy = probe.naturalHeight * (full ? 0 : 0.1);
        ctx.drawImage(probe, probe.naturalWidth * 0.2, sy, probe.naturalWidth * 0.6, sh, 0, 0, 24, 24);
        const d = ctx.getImageData(0, 0, 24, 24).data;
        let sum = 0;
        for (let i = 0; i < d.length; i += 4) sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
        done(sum / (d.length / 4) < 0.6);
      } catch (e) { done(true); }
    };
    probe.onerror = function () { done(true); };
    probe.src = url;
  }

  // ══════════════════════ Builder tap-to-select bridge ══════════════════════
  //
  // Preview-mode only. Same messages as index.html ({type:'select',
  // blockType} / {type:'rects'}) using the v1 block types today's iOS
  // builder understands — a merged v2 card reports whichever v1 part was
  // tapped (data-bt), so the right existing editor opens.
  const BLOCK_CONTAINER_IDS = {
    menu:     ['feed'],
    physical: ['physical-feed'],
    digital:  ['digital-feed'],
    links:    ['links-feed'],
    about:    ['pb-about'],
    faq:      ['faq-col'],
    policies: ['pb-policies'],
    hours:    ['hours-card'],
    emailCapture: ['email-capture', 'sf-magnet']
  };
  let builderTapTargetsWired = false;
  let rectReportScheduled = false;

  function bakeriBridgePost(message) {
    if (!isPreviewMode) return;
    if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.bakeriBridge) return;
    window.webkit.messageHandlers.bakeriBridge.postMessage(message);
  }

  function firstVisibleBt(card, fallback) {
    const parts = card.querySelectorAll('[data-bt]');
    for (let i = 0; i < parts.length; i++) {
      if (!parts[i].classList.contains('hidden')) return parts[i].dataset.bt;
    }
    return fallback;
  }

  function builderTypeFor(card, target) {
    const block = card.dataset.block;
    if (isBuilderV2) return block;
    if (block === 'products' || block === 'info') {
      const part = target.closest && target.closest('[data-bt]');
      if (part && card.contains(part)) return part.dataset.bt;
      return firstVisibleBt(card, block === 'products' ? 'physical' : 'policies');
    }
    if (block === 'leadMagnet') return leadFromCapture ? 'emailCapture' : 'leadMagnet';
    return block;
  }

  function wireBuilderTapTargets() {
    if (!isPreviewMode || builderTapTargetsWired) return;
    builderTapTargetsWired = true;
    document.querySelectorAll('[data-block]').forEach(function (card) {
      card.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        bakeriBridgePost({ type: 'select', blockType: builderTypeFor(card, e.target) });
      }, { capture: true });
    });
    if (isBuilderV2) {
      // The profile is the logo, shop name and intro card; a tap anywhere
      // else that isn't a card (the page background, the gaps between
      // cards) opens the site-wide Design sheet.
      document.addEventListener('click', function (e) {
        const t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('[data-block]') || t.closest('.scrim') || t.closest('#bk-layer, .bk-box, .bk-pill')) return;
        e.preventDefault();
        e.stopPropagation();
        const isProfile = t.closest('#sf-intro-card, #pb-avatar, #shop-name');
        bakeriBridgePost({ type: 'select', blockType: isProfile ? 'identity' : 'design' });
      }, { capture: true });
      return;
    }
    const hero = document.getElementById('profile-block');
    if (hero) {
      hero.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        bakeriBridgePost({ type: 'select', blockType: 'identity' });
      }, { capture: true });
    }
  }

  function scheduleRectReport() {
    if (!isPreviewMode || rectReportScheduled) return;
    rectReportScheduled = true;
    requestAnimationFrame(function () {
      rectReportScheduled = false;
      reportAllRects();
    });
  }

  function unionRect(a, b) {
    if (!a) return b;
    if (!b) return a;
    const x = Math.min(a.x, b.x);
    const y = Math.min(a.y, b.y);
    return {
      x: x, y: y,
      width: Math.max(a.x + a.width, b.x + b.width) - x,
      height: Math.max(a.y + a.height, b.y + b.height) - y,
    };
  }

  function visibleRect(el) {
    if (!el || el.classList.contains('hidden') || el.closest('.hidden')) return null;
    const b = el.getBoundingClientRect();
    if (b.width === 0 && b.height === 0) return null;
    return { x: b.left, y: b.top, width: b.width, height: b.height };
  }

  function reportAllRects() {
    if (!isPreviewMode) return;
    const rects = {};
    Object.keys(BLOCK_CONTAINER_IDS).forEach(function (blockType) {
      let r = null;
      BLOCK_CONTAINER_IDS[blockType].forEach(function (id) {
        r = unionRect(r, visibleRect(document.getElementById(id)));
      });
      if (r) rects[blockType] = r;
    });
    const hero = visibleRect(document.getElementById('profile-block'));
    if (hero) rects['identity'] = hero;
    const form = visibleRect(document.getElementById('form-storefront'));
    if (form) rects['form'] = form;
    bakeriBridgePost({ type: 'rects', rects: rects, scrollY: window.scrollY });
  }

  if (isPreviewMode) {
    window.addEventListener('scroll', scheduleRectReport, { passive: true });
    window.addEventListener('resize', scheduleRectReport);
  }

  // ══════════════════════ Photo focus (smart cropping) ══════════════════════
  //
  // Every photo here is cropped with object-fit / background-size: cover,
  // which by default centres the crop — on a portrait photo of a person
  // that's their torso, and as the box changes shape the crop slides down
  // to their knees. So:
  //   1. an explicit focal point wins — {x, y} in % (0–100), set by the
  //      baker in the builder ("tap the subject"): storefront_design.focus
  //      .about / .background / .logo / .items[listingId], and
  //      storefront_design.links[linkId].focus
  //   2. otherwise a portrait-shaped photo is anchored toward its upper part
  //      (where faces almost always are); landscape/square stay centred.
  function focusPosition(focus, w, h) {
    if (focus && typeof focus === 'object' && isFinite(focus.x) && isFinite(focus.y)) {
      const c = function (v) { return Math.max(0, Math.min(100, Number(v))); };
      return c(focus.x) + '% ' + c(focus.y) + '%';
    }
    if (w && h && h > w * 1.05) return '50% 22%';
    return '50% 50%';
  }
  function designFocus(key) {
    const f = design && design.focus;
    return (f && typeof f === 'object') ? f[key] : null;
  }
  function itemFocus(item) {
    const items = designFocus('items');
    if (!items || typeof items !== 'object' || !item) return null;
    return items[String(item.id).toLowerCase()] || items[String(item.id).toUpperCase()] || null;
  }
  // Per-link look stored in storefront_design.links[linkId] (outline_color,
  // focus) — kept out of baker_links so the live page/app never see it.
  function linkDesign(l) {
    const all = design && design.links;
    if (!all || typeof all !== 'object' || !l || !l.id) return {};
    return all[String(l.id).toLowerCase()] || all[String(l.id).toUpperCase()] || {};
  }
  function focusImage(img, focus) {
    img.style.objectPosition = focusPosition(focus, img.naturalWidth, img.naturalHeight);
  }
  // For CSS background images (link cards): measure, then position.
  function focusBackground(el, url, focus) {
    const probe = new Image();
    probe.onload = function () { el.style.backgroundPosition = focusPosition(focus, probe.naturalWidth, probe.naturalHeight); };
    probe.src = url;
  }

  // ══════════════════════ Profile top ══════════════════════

  function renderAvatar(name) {
    // Preview mode: a just-picked logo not yet uploaded comes through as a
    // data: URI so the canvas reflects the draft.
    const logoURL = (profile && profile.__preview_logo_data_url)
      || assetURL('/business-logos/' + resolvedBakerId.toUpperCase() + '/logo.jpg');
    const el = document.getElementById('pb-avatar');
    const letterEl = document.getElementById('pb-avatar-letter');
    letterEl.textContent = name.charAt(0).toUpperCase();
    letterEl.style.display = '';
    el.querySelectorAll('img').forEach(function (n) { n.remove(); });
    const img = document.createElement('img');
    img.alt = name;
    img.onload = function () { focusImage(img, designFocus('logo')); img.style.display = 'block'; letterEl.style.display = 'none'; };
    img.src = logoURL;
    el.appendChild(img);
  }

  // Guesses the platform from the URL's hostname — the baker only enters a
  // plain URL in her "Social" link section. Shown as text links under the
  // nav (handoff), not icons.
  function socialPlatform(url) {
    let host = '';
    try { host = new URL(url).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { /* generic */ }
    if (host.indexOf('instagram') !== -1) return { label: 'Instagram', icon: 'instagram' };
    if (host.indexOf('tiktok') !== -1) return { label: 'TikTok', icon: 'tiktok' };
    if (host.indexOf('facebook') !== -1) return { label: 'Facebook', icon: 'facebook' };
    if (host === 'x.com' || host.indexOf('twitter') !== -1) return { label: 'X', icon: 'x' };
    if (host.indexOf('pinterest') !== -1) return { label: 'Pinterest', icon: 'pinterest' };
    if (host.indexOf('linkedin') !== -1) return { label: 'LinkedIn', icon: 'linkedin' };
    if (host.indexOf('whatsapp') !== -1 || host === 'wa.me') return { label: 'WhatsApp', icon: 'whatsapp' };
    return { label: host || 'Link', icon: null };
  }

  function linkSections() {
    const seen = [];
    allLinks.forEach(function (l) {
      if (l.section && seen.indexOf(l.section) === -1) seen.push(l.section);
    });
    return seen;
  }
  function isSocialSection(section) { return (section || '').trim().toLowerCase() === 'social'; }

  function renderSocialIcons() {
    const wrap = document.getElementById('social-icons');
    const items = allLinks.filter(function (l) { return isSocialSection(l.section); });
    wrap.classList.toggle('hidden', items.length === 0);
    wrap.innerHTML = items.map(function (l) {
      const platform = socialPlatform(l.url);
      const inner = platform.icon
        ? '<span class="social-icon-mask" style="-webkit-mask-image:url(../assets/social/' + platform.icon + '.png);mask-image:url(../assets/social/' + platform.icon + '.png)"></span>'
        : '<span class="social-icon-fallback">' + ARROW_UR_SVG + '</span>';
      return '<a class="social-icon" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener noreferrer" ' +
        'title="' + escapeHtml(platform.label) + '" aria-label="' + escapeHtml(platform.label) + '">' + inner + '</a>';
    }).join('');
  }

  // ══════════════════════ Lead magnet (Free download) ══════════════════════

  function leadMagnetConfig() {
    const c = blockCfg.leadMagnet || {};
    const p = profile || {};
    const listingId = c.listing_id || (leadFromCapture ? p.email_capture_deliverable_listing_id : null) || null;
    const heading = String(c.title || c.heading || (leadFromCapture ? p.email_capture_heading : '') || '').trim() || 'Free download';
    const body = String(c.body || (leadFromCapture ? p.email_capture_body : '') || '').trim();
    return { listingId: listingId, heading: heading, body: body };
  }

  // The optional picture on a rich capture card (entry.image_url, uploaded
  // from the builder); the Free download card falls back to its file's
  // listing photo.
  function fillRichMedia(box, url, fallbackUrl) {
    box.innerHTML = '';
    const src = url || fallbackUrl;
    if (!src) return;
    const img = document.createElement('img');
    img.alt = '';
    img.onload = function () { focusImage(img, null); };
    img.onerror = function () {
      if (fallbackUrl && img.src !== fallbackUrl && src !== fallbackUrl) { img.src = fallbackUrl; return; }
      box.innerHTML = '';
    };
    img.src = src;
    box.appendChild(img);
  }

  function renderLeadMagnet() {
    const card = document.getElementById('sf-magnet');
    const cfg = leadMagnetConfig();
    if (!cfg.listingId) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-magnet-title').textContent = cfg.heading;
    document.getElementById('sf-magnet-body').textContent = cfg.body;
    fillRichMedia(document.getElementById('sf-magnet-thumb'),
      (blockCfg.leadMagnet || {}).image_url, itemImgURL({ id: String(cfg.listingId) }));

    const action = document.getElementById('sf-magnet-action');
    action.innerHTML = captureFormMarkup('magnet', 'Send it to me');
    wireCaptureForm(document.getElementById('magnet-form'), 'lead_magnet', cfg.listingId, function () {
      action.innerHTML = '<div class="sf-capture-done">' + CHECK_SVG + '<span>Check your inbox — it\'s on its way.</span></div>';
    });
  }

  // ══════════════════════ Menu (Shop my Menu) ══════════════════════

  function menuListings() { return allListings.filter(function (l) { return l.listing_kind !== 'digital' && l.listing_kind !== 'physical'; }); }
  function digitalListings() { return allListings.filter(function (l) { return l.listing_kind === 'digital'; }); }
  function physicalListings() { return allListings.filter(function (l) { return l.listing_kind === 'physical'; }); }

  function slugify(str) {
    return (str || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'other';
  }
  function titleCase(str) {
    return (str || '').toLowerCase().replace(/\b([a-z])/g, function (m, c) { return c.toUpperCase(); });
  }
  function groupByCategory(items, fallbackName) {
    const map = {};
    items.forEach(function (item) {
      const cat = (item.category || '').trim() || fallbackName;
      if (!map[cat]) map[cat] = [];
      map[cat].push(item);
    });
    return Object.keys(map).sort(function (a, b) { return a.localeCompare(b); })
      .map(function (cat) { return { category: cat, slug: slugify(cat), items: map[cat] }; });
  }

  function listingsForTab(t) {
    if (t === 'all') return menuListings();
    const kind = t === 'now' ? 'ready_now' : (t === 'pre' ? 'preorder' : 'custom');
    return menuListings().filter(function (l) { return l.listing_kind === kind; });
  }

  function menuSubline(items) {
    const kinds = {};
    items.forEach(function (l) { kinds[l.listing_kind] = true; });
    const parts = [];
    if (kinds.ready_now) parts.push('Ready now');
    if (kinds.preorder) parts.push('Pre-order');
    if (kinds.custom) parts.push('Made to order');
    return parts.join(' · ');
  }

  function renderMenuCard() {
    const card = document.getElementById('feed');
    const items = menuListings();
    if (sfListing || items.length === 0) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('feed-title').textContent = cardTitle('menu');
    document.getElementById('feed-sub').textContent = menuSubline(items);
    if (items.length === 1) {
      document.getElementById('filter-strip').innerHTML = '';
      const body = document.getElementById('product-grid');
      body.innerHTML = '';
      body.appendChild(buildFeature(items[0]));
      return;
    }
    renderFilterBar();
    renderGrid();
  }

  // Chips only once they can actually split something (2+ kinds).
  function renderFilterBar() {
    const bar = document.getElementById('filter-strip');
    const distinctKinds = new Set(menuListings().map(function (l) { return l.listing_kind; }));
    if (distinctKinds.size <= 1) { bar.innerHTML = ''; tab = 'all'; return; }
    const filters = FILTERS.filter(function (f) { return f.key === 'all' || listingsForTab(f.key).length > 0; });
    if (!filters.some(function (f) { return f.key === tab; })) tab = 'all';
    bar.innerHTML = filters.map(function (f) {
      return '<button type="button" class="sf-chip' + (f.key === tab ? ' active' : '') + '" data-tab="' + f.key + '">' + f.label + '</button>';
    }).join('');
    bar.querySelectorAll('.sf-chip').forEach(function (btn) {
      btn.addEventListener('click', function () { setTab(btn.dataset.tab); });
    });
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('#filter-strip .sf-chip').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === t); });
    renderGrid();
  }

  function renderGrid() {
    const body = document.getElementById('product-grid');
    const listings = listingsForTab(tab);
    body.innerHTML = '';
    if (listings.length === 0) {
      body.innerHTML = '<div class="empty-state">No items in this category.</div>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'sf-grid';
    listings.forEach(function (item) { grid.appendChild(buildTile(item)); });
    body.appendChild(grid);
  }

  // ══════════════════════ Form takeover ══════════════════════
  //
  // profiles.storefront_listing_id → the intake form replaces the MENU
  // card (in Menu's slot); every other card stays (spec). Mounted in-page —
  // no redirect to custom-order.html.
  let mountedFormKey = null;
  function renderFormStorefront(listing) {
    const card = document.getElementById('form-storefront');
    card.classList.remove('hidden');
    document.getElementById('sf-form-title').textContent = cardTitle('form');
    document.getElementById('sf-form-sub').textContent = listing.lead_time_note ? ('Lead time: ' + listing.lead_time_note) : 'Request a quote';
    const introBody = (listing.storefront_intro_body || '').trim();
    document.getElementById('sf-intro-body').textContent = introBody;
    document.getElementById('sf-form-intro').classList.toggle('hidden', !introBody);

    // Preview re-renders on every draft edit — don't wipe a half-filled
    // form unless it's actually a different form now.
    const key = listing.id + ':' + listing.intake_form_id;
    if (mountedFormKey === key) return;
    mountedFormKey = key;
    const mount = document.getElementById('sf-form-mount');
    mount.innerHTML = '';
    if (window.BakeriIntakeForm) {
      window.BakeriIntakeForm.mount({
        container: mount,
        supabaseUrl: SUPABASE_URL,
