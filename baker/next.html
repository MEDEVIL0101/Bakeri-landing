        anonKey: ANON_KEY,
        bakerId: resolvedBakerId,
        itemId: listing.id,
        formId: listing.intake_form_id,
        itemName: listing.name,
        standalone: false
      });
    }
  }

  // ══════════════════════ Products (Shop my Products) ══════════════════════
  //
  // Physical goods (photo grid, category chips) and digital downloads (list
  // rows) in ONE card. The v1 'physical' / 'digital' entries can still hide
  // either half on its own.

  function physicalShown() { return physicalListings().length > 0 && subHidden.physical !== true; }
  function digitalShown() { return digitalListings().length > 0 && subHidden.digital !== true; }

  function renderProductsCard() {
    const card = document.getElementById('sf-products');
    const phys = physicalShown(), dig = digitalShown();
    if (!phys && !dig) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-products-title').textContent = cardTitle('products');
    document.getElementById('sf-products-sub').textContent =
      phys && dig ? 'Ships to you · instant downloads' : (phys ? 'Ships to you' : 'Instant downloads');
    renderPhysicalFeed();
    renderDigitalFeed();
  }

  function renderPhysicalFeed() {
    const wrap = document.getElementById('physical-feed');
    const chips = document.getElementById('sf-products-filters');
    const items = physicalListings();
    wrap.innerHTML = '';
    chips.innerHTML = '';
    if (!physicalShown()) { wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    if (items.length === 1) { wrap.appendChild(buildFeature(items[0])); return; }

    const groups = groupByCategory(items, 'Ships to You');
    if (groups.length > 1) {
      if (physTab !== 'all' && !groups.some(function (g) { return g.slug === physTab; })) physTab = 'all';
      chips.innerHTML = [{ slug: 'all', category: 'All' }].concat(groups).map(function (g) {
        return '<button type="button" class="sf-chip' + (g.slug === physTab ? ' active' : '') + '" data-slug="' + g.slug + '">' +
          escapeHtml(g.slug === 'all' ? 'All' : titleCase(g.category)) + '</button>';
      }).join('');
      chips.querySelectorAll('.sf-chip').forEach(function (btn) {
        btn.addEventListener('click', function () { physTab = btn.dataset.slug; renderPhysicalFeed(); });
      });
    } else {
      physTab = 'all';
    }

    const group = groups.find(function (g) { return g.slug === physTab; });
    const list = group ? group.items : items;
    const collapsible = list.length > PHYSICAL_PREVIEW_COUNT;
    const expanded = !!physicalExpanded[physTab];
    const shown = (collapsible && !expanded) ? list.slice(0, PHYSICAL_PREVIEW_COUNT) : list;
    const grid = document.createElement('div');
    grid.className = 'sf-grid';
    shown.forEach(function (item) { grid.appendChild(buildTile(item)); });
    wrap.appendChild(grid);
    if (collapsible) {
      const more = document.createElement('div');
      more.className = 'sf-more';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = expanded ? 'Show fewer' : 'View all ' + list.length;
      btn.addEventListener('click', function () {
        physicalExpanded[physTab] = !expanded;
        renderPhysicalFeed();
        if (expanded) document.getElementById('sf-products').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      more.appendChild(btn);
      wrap.appendChild(more);
    }
  }

  // Also called by toggleDigitalCartItem (carried-over cart code) after
  // every add/remove, so it must stay self-contained.
  function renderDigitalFeed() {
    const wrap = document.getElementById('digital-feed');
    const items = digitalListings();
    wrap.innerHTML = '';
    if (!digitalShown()) { wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    const physOn = physicalShown();
    wrap.classList.toggle('solo', !physOn);

    if (!physOn && items.length === 1) {
      const body = document.createElement('div');
      body.className = 'sf-card-body';
      body.appendChild(buildFeature(items[0]));
      wrap.appendChild(body);
      return;
    }

    const collapsible = items.length > DIGITAL_PREVIEW_COUNT;
    if (physOn || collapsible) {
      const head = document.createElement('div');
      head.className = 'sf-dl-head';
      head.innerHTML = '<div class="titles">' +
        (physOn ? '<h3>Digital downloads</h3>' : '') +
        '<span class="sf-sub">Instant download · ' + items.length + ' design' + (items.length === 1 ? '' : 's') + '</span></div>';
      if (collapsible) {
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'sf-viewall';
        toggle.innerHTML = (digitalExpanded ? 'Show fewer' : 'View all') + ' ' + ARROW_SVG;
        toggle.addEventListener('click', function () {
          digitalExpanded = !digitalExpanded;
          renderDigitalFeed();
          if (!digitalExpanded) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        head.appendChild(toggle);
      }
      wrap.appendChild(head);
    }

    const list = document.createElement('div');
    list.className = 'sf-dl-list';
    if (!physOn && !collapsible) list.style.paddingTop = 'var(--cpad2)';
    const shown = (collapsible && !digitalExpanded) ? items.slice(0, DIGITAL_PREVIEW_COUNT) : items;
    shown.forEach(function (item) { list.appendChild(buildDigitalRow(item)); });
    wrap.appendChild(list);
  }

  function digitalInCart(item) {
    if (item.has_variants) return digitalVariantCartLines.some(function (l) { return l.menuItemId === item.id; });
    return digitalCart.indexOf(item.id) !== -1;
  }

  function refreshDigitalPills() {
    document.querySelectorAll('.sf-dl-add[data-dl-id]').forEach(function (btn) {
      const item = allListings.find(function (l) { return l.id === btn.dataset.dlId; });
      if (!item) return;
      const inCart = digitalInCart(item);
      btn.classList.toggle('added', inCart);
      btn.textContent = inCart ? 'Added ✓' : 'Add';
    });
  }

  function buildDigitalRow(item) {
    const row = document.createElement('div');
    row.className = 'sf-dl-row';
    row.addEventListener('click', function () { openItemSheet(item); });

    const thumb = document.createElement('div');
    thumb.className = 'sf-dl-thumb';
    appendPhoto(thumb, item);

    const info = document.createElement('div');
    info.className = 'sf-dl-info';
    info.innerHTML = '<span class="sf-dl-name">' + escapeHtml(item.name) + '</span>' +
      '<span class="sf-dl-price tabular">' + priceHTML(item.original_price, item.price, { from: priceIsFrom(item) }) + '</span>';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sf-dl-add';
    btn.dataset.dlId = item.id;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (item.has_variants) openItemSheet(item);
      else toggleDigitalCartItem(item);
    });

    row.appendChild(thumb);
    row.appendChild(info);
    row.appendChild(btn);
    // Sets the pill's label from cart state.
    setTimeout(refreshDigitalPills, 0);
    return row;
  }

  // ══════════════════════ Links (More from …) ══════════════════════

  function renderLinkSections() {
    const card = document.getElementById('links-feed');
    const items = allLinks.filter(function (l) { return !isSocialSection(l.section); });
    const list = document.getElementById('sf-links-list');
    if (items.length === 0) { card.classList.add('hidden'); list.innerHTML = ''; return; }
    card.classList.remove('hidden');
    document.getElementById('sf-links-title').textContent = cardTitle('links');
    list.innerHTML = items.map(renderLinkRow).join('');
    list.querySelectorAll('.sf-link-img[data-img]').forEach(function (el, i) {
      const l = items.filter(function (x) { return x.image_url; })[i];
      focusBackground(el, el.dataset.img, l && linkDesign(l).focus);
    });

    list.querySelectorAll('.sf-link[data-listing-id]').forEach(function (row) {
      if (row.dataset.leadMagnet === 'true') {
        const title = row.querySelector('.sf-link-title, .sf-link-label');
        const heading = 'Get: ' + (title ? title.textContent : 'this download');
        row.addEventListener('click', function () { openCaptureSheet('inline', row.dataset.listingId, heading); });
        return;
      }
      const item = allListings.find(function (x) { return String(x.id).toLowerCase() === String(row.dataset.listingId).toLowerCase(); });
      if (item) row.addEventListener('click', function () { openItemSheet(item); });
      else row.classList.add('disabled');
    });
  }

  function linkDomain(l) {
    if (l.target_type === 'file') return 'Download';
    if (l.target_type === 'product') return l.target_listing_is_lead_magnet ? 'Free download' : 'In my shop';
    try { return new URL(l.url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  // baker_links.style → v2 look:
  //   'list' (default)  → pill button, same look as the top nav
  //   'photoCard'       → handoff link card (96×72 thumbnail + title + domain)
  //   'richCard'        → big image on top, title below
  // outline_style 'border' | 'glow' (+ optional outline_color) and shake
  // decorate the LINK CARD itself, never the section card.
  function renderLinkRow(l) {
    const kind = l.style === 'photoCard' ? 'rich' : (l.style === 'richCard' ? 'photo' : 'pill');
    const classes = ['sf-link', kind];
    if (l.shake) classes.push('shake');
    const ld = linkDesign(l);
    // Border and glow are independent — either, both or neither — each with
    // its own colour (storefront_design.links[id].border / .glow). Without
    // a v2 setting, fall back to baker_links.outline_style (one or the other).
    const legacyColor = validHex(ld.outline_color) || validHex(l.outline_color);
    const hasBorder = typeof ld.border === 'boolean' ? ld.border : l.outline_style === 'border';
    const hasGlow = typeof ld.glow === 'boolean' ? ld.glow : l.outline_style === 'glow';
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#201e1d';
    const borderColor = validHex(ld.border_color) || legacyColor || validHex(accent) || '#201e1d';
    const glowColor = validHex(ld.glow_color) || legacyColor || validHex(accent) || '#201e1d';
    const fill = validHex(ld.background);
    const ink = validHex(ld.text) || (fill ? readableOn(fill) : null);
    const css = [];
    const shadows = [];
    if (hasBorder) {
      if (kind === 'pill') css.push('border-color:' + borderColor);
      else shadows.push('0 0 0 2px ' + borderColor);
    }
    if (hasGlow) {
      const rgb = hexRgb(glowColor);
      // Two layers: a tight bright halo plus a wide soft one, so the glow
      // reads on any card colour.
      shadows.push('0 0 6px 2px rgba(' + rgb.join(',') + ',.9)', '0 0 22px 6px rgba(' + rgb.join(',') + ',.6)');
    }
    if (shadows.length) css.push('box-shadow:' + shadows.join(','));
    if (fill) css.push('background:' + fill);
    if (fill && !hasBorder) css.push('border-color:' + fill);
    if (ink) css.push('color:' + ink, '--link-sub:' + ink);
    const style = css.length ? ' style="' + css.join(';') + '"' : '';

    const isFile = l.target_type === 'file' && l.url;
    const icon = isFile ? DOWNLOAD_SVG : (l.target_type === 'product' ? ARROW_SVG : ARROW_UR_SVG);
    const label = escapeHtml(l.label);
    const domain = escapeHtml(linkDomain(l));
    const imgStyle = l.image_url ? ' data-img="' + escapeHtml(l.image_url) + '" style="background-image:url(' + escapeHtml(l.image_url) + ')"' : '';
    const emoji = l.image_url ? '' : (isFile ? '📄' : '🔗');

    let inner;
    if (kind === 'pill') {
      inner = '<span class="sf-link-label">' + label + '</span>' + icon;
    } else if (kind === 'rich') {
      inner = '<span class="sf-link-img"' + imgStyle + '>' + emoji + '</span>' +
        '<span class="sf-link-text"><span class="sf-link-title">' + label + '</span><span class="sf-link-domain">' + domain + '</span></span>' + icon;
    } else {
      inner = '<span class="sf-link-img"' + imgStyle + '>' + emoji + '</span>' +
        '<span class="sf-link-foot"><span class="sf-link-text"><span class="sf-link-title">' + label + '</span><span class="sf-link-domain">' + domain + '</span></span>' + icon + '</span>';
    }

    // File target: Storage's ?download= forces Content-Disposition with the
    // original filename (the `download` attribute is ignored cross-origin).
    if (isFile) {
      const fileName = decodeURIComponent(l.url.split('?')[0].split('/').pop() || '');
      const href = l.url.split('?')[0] + '?download=' + encodeURIComponent(fileName);
      return '<a class="' + classes.join(' ') + '"' + style + ' href="' + escapeHtml(href) +
        '" download="' + escapeHtml(fileName) + '" rel="noopener noreferrer">' + inner + '</a>';
    }
    if (l.target_type === 'product' && l.linked_listing_id) {
      return '<button type="button" class="' + classes.join(' ') + '"' + style + ' data-listing-id="' +
        escapeHtml(l.linked_listing_id) + '" data-lead-magnet="' +
        (l.target_listing_is_lead_magnet ? 'true' : 'false') + '">' + inner + '</button>';
    }
    return '<a class="' + classes.join(' ') + '"' + style + ' href="' + escapeHtml(l.url) +
      '" target="_blank" rel="noopener noreferrer">' + inner + '</a>';
  }

  // ══════════════════════ About ══════════════════════

  function renderAbout(p) {
    const card = document.getElementById('pb-about');
    if (!p.about_story) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    const heading = cardTitle('about');
    document.getElementById('pb-about-heading').textContent = heading;
    document.getElementById('pb-about-kicker').classList.toggle('hidden', heading.trim().toLowerCase() === 'about the baker');
    document.getElementById('pb-about-text').innerHTML = String(p.about_story).split(/\n\s*\n/).map(function (para) {
      return '<p>' + escapeHtml(para.trim()) + '</p>';
    }).join('');
    const photo = document.getElementById('pb-about-photo');
    const img = document.getElementById('pb-about-portrait');
    img.alt = p.business_name || '';
    img.onload = function () { focusImage(img, designFocus('about')); photo.classList.remove('hidden'); };
    img.onerror = function () { photo.classList.add('hidden'); };
    img.src = (p.__preview_portrait_data_url) || assetURL('/baker-portraits/' + resolvedBakerId.toUpperCase() + '/portrait.jpg');
  }

  // ══════════════════════ Before you order ══════════════════════
  //
  // Store policies + FAQ as independent accordions, pickup hours beside
  // them. Each part can still be hidden by its own v1 entry.

  function hasConfiguredHours(hoursJSON) {
    return !!(hoursJSON && WEEKDAY_ORDER.some(function (k) { return hoursJSON[k] && hoursJSON[k].closed === false; }));
  }

  function accordionHTML(title, body, open) {
    return '<details class="sf-acc"' + (open ? ' open' : '') + '><summary>' + escapeHtml(title) + PLUS_SVG + '</summary>' +
      '<div class="sf-acc-body">' + escapeHtml(body) + '</div></details>';
  }

  function renderInfoCard(p) {
    const card = document.getElementById('sf-info');
    const hasPol = !!(p.store_policies && String(p.store_policies).trim()) && subHidden.policies !== true;
    const hasFaq = allFaqs.length > 0 && subHidden.faq !== true;
    const hasHours = hasConfiguredHours(p.pickup_hours_json) && subHidden.hours !== true;
    if (!hasPol && !hasFaq && !hasHours) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-info-title').textContent = cardTitle('info');
    const parts = [];
    if (hasPol) parts.push('Policies');
    if (hasFaq) parts.push('FAQ');
    if (hasHours) parts.push('Pickup hours');
    document.getElementById('sf-info-sub').textContent = parts.join(' · ');

    const pol = document.getElementById('pb-policies');
    pol.classList.toggle('hidden', !hasPol);
    pol.innerHTML = hasPol ? accordionHTML('Store policies', p.store_policies, true) : '';

    const faq = document.getElementById('faq-col');
    faq.classList.toggle('hidden', !hasFaq);
    faq.innerHTML = hasFaq ? allFaqs.map(function (f) { return accordionHTML(f.question, f.answer); }).join('') : '';
    document.getElementById('sf-info-acc').classList.toggle('hidden', !hasPol && !hasFaq);

    const hours = document.getElementById('hours-card');
    hours.classList.toggle('hidden', !hasHours);
    document.getElementById('hours-rows').innerHTML = !hasHours ? '' : WEEKDAY_ORDER.map(function (key) {
      const day = p.pickup_hours_json[key];
      const time = (!day || day.closed) ? 'Closed' : (formatTime12h(day.open) + '–' + formatTime12h(day.close));
      return '<div class="sf-hours-row"><span class="day">' + WEEKDAY_LABELS[key] + '</span><span>' + time + '</span></div>';
    }).join('');
  }

  // ══════════════════════ Email capture (Join my list) ══════════════════════
  //
  // Voluntary mailing-list signup. inline: the form sits in the card;
  // popup: a button opens #capture-scrim. Both, plus the header signup
  // pill, post to capture-storefront-email → baker_contacts.

  function captureFormMarkup(idPrefix, buttonLabel) {
    return '<form class="sf-capture-form" id="' + idPrefix + '-form" novalidate>' +
      '<input type="email" required autocomplete="email" placeholder="you@email.com" aria-label="Email address" id="' + idPrefix + '-email" />' +
      '<button type="submit" class="sf-btn">' + escapeHtml(buttonLabel) + '</button>' +
      '<div class="sf-capture-status" id="' + idPrefix + '-status" role="status"></div>' +
      '</form>';
  }

  function wireCaptureForm(formEl, source, deliverableListingId, onDone) {
    if (!formEl) return;
    formEl.addEventListener('submit', function (e) {
      e.preventDefault();
      const idPrefix = formEl.id.replace(/-form$/, '');
      const emailInput = document.getElementById(idPrefix + '-email');
      const statusEl = document.getElementById(idPrefix + '-status');
      const submitBtn = formEl.querySelector('button[type="submit"]');
      const email = (emailInput.value || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        statusEl.textContent = 'Please enter a valid email address.';
        emailInput.focus();
        return;
      }
      if (isPreviewMode) { statusEl.textContent = 'Signups are turned off in the preview.'; return; }
      submitBtn.disabled = true;
      statusEl.textContent = 'Sending…';
      submitCapture(email, source, deliverableListingId)
        .then(function (result) {
          if (result.ok) {
            if (onDone) { onDone(result); return; }
            statusEl.textContent = result.downloadUrl ? 'Check your email — your download is on its way!' : "You're on the list!";
            emailInput.value = '';
          } else {
            statusEl.textContent = result.error || 'Something went wrong.';
          }
        })
        .finally(function () { submitBtn.disabled = false; });
    });
  }

  function submitCapture(email, source, deliverableListingId) {
    const payload = { user_id: resolvedBakerId, email: email, source: source };
    const listingId = deliverableListingId || (designBlocksMode ? null : profile.email_capture_deliverable_listing_id);
    if (listingId) payload.deliverable_listing_id = listingId;
    return fetch(SUPABASE_URL + '/functions/v1/capture-storefront-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (data) { return { httpOk: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.httpOk) return { ok: false, error: res.data.error };
        return { ok: true, downloadUrl: res.data.download_url || null };
      })
      .catch(function () { return { ok: false, error: 'Network error — please try again.' }; });
  }

  function renderEmailCapture(p) {
    const card = document.getElementById('email-capture');
    const heading = (p.email_capture_heading || '').trim();
    // Configured with a file to deliver → it's the lead magnet card instead.
    if (!heading || leadFromCapture) { card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    document.getElementById('sf-capture-title').textContent = cardTitle('emailCapture');
    document.getElementById('sf-capture-desc').textContent = (p.email_capture_body || '').trim();
    fillRichMedia(document.getElementById('sf-capture-media'), (blockCfg.emailCapture || {}).image_url, null);
    const wrap = document.getElementById('sf-capture-body');
    if (p.email_capture_display_style === 'popup') {
      wrap.innerHTML = '<button type="button" class="sf-btn" id="email-capture-open" style="gap:14px;">Join the list ' + ARROW_SVG + '</button>';
      document.getElementById('email-capture-open').addEventListener('click', function () { openCaptureSheet('popup'); });
      return;
    }
    wrap.innerHTML = captureFormMarkup('inline-capture', 'Join');
    wireCaptureForm(document.getElementById('inline-capture-form'), 'inline', null, function () {
      wrap.innerHTML = '<div class="sf-capture-done">' + CHECK_SVG + '<span>You\'re on the list — thank you!</span></div>';
    });
  }

  function renderHeaderSignupButton(p) {
    const existing = document.getElementById('header-signup-btn');
    if (!p.header_signup_enabled) { if (existing) existing.remove(); return; }
    const label = (p.header_signup_label || 'Sign up').trim() || 'Sign up';
    const btn = existing || document.createElement('button');
    btn.type = 'button';
    btn.id = 'header-signup-btn';
    btn.className = 'sf-pill-btn';
    btn.textContent = label;
    if (!existing) {
      btn.addEventListener('click', function () { openCaptureSheet('header'); });
      const actions = document.getElementById('sf-top-actions');
      actions.insertBefore(btn, actions.firstChild);
    }
  }

  function openCaptureSheet(source, deliverableListingId, headingOverride) {
    const heading = (headingOverride || profile.email_capture_heading || 'Join my list').trim() || 'Join my list';
    const body = headingOverride ? '' : (profile.email_capture_body || '').trim();
    document.getElementById('capture-sheet-body').innerHTML =
      '<h2 style="font-family:var(--display);font-weight:var(--dw);font-size:26px;line-height:1.1;color:var(--head-ink);margin-bottom:8px;padding-right:40px;">' + escapeHtml(heading) + '</h2>' +
      (body ? '<p style="font-size:15px;line-height:1.5;color:var(--n800);margin-bottom:16px;">' + escapeHtml(body) + '</p>' : '<div style="height:8px"></div>') +
      captureFormMarkup('popup-capture', deliverableListingId ? 'Send it to me' : 'Join');
    wireCaptureForm(document.getElementById('popup-capture-form'), deliverableListingId ? 'lead_magnet' : source, deliverableListingId);
    document.getElementById('capture-scrim').classList.add('open');
  }
  function closeCaptureSheet() { document.getElementById('capture-scrim').classList.remove('open'); }

  // ══════════════════════ Tiles + single-item feature ══════════════════════

  function appendPhoto(box, item) {
    const ph = photoFallback(item);
    box.appendChild(ph);
    const img = document.createElement('img');
    img.alt = item.name || '';
    // No loading="lazy": the img stays display:none until it loads, and
    // Safari/WKWebView never lazy-loads an image that isn't laid out — the
    // photo would never appear in the iOS builder.
    img.onload = function () { focusImage(img, itemFocus(item)); img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);
    box.appendChild(img);
  }

  // Only stock status gets a badge. The kind (Ships, Pre-order, Custom…)
  // isn't labelled: the cards already group items by kind.
  function tileBadge(item) {
    if (!isSoldOut(item)) return null;
    if (item.listing_kind === 'preorder') return 'Ordering closed';
    if (item.listing_kind === 'ready_now') return 'Sold out today';
    return 'Sold out';
  }

  function appendTileBadge(photo, item) {
    const text = tileBadge(item);
    if (!text) return;
    const badge = document.createElement('span');
    badge.className = 'sf-badge';
    badge.textContent = text;
    photo.appendChild(badge);
  }

  function buildTile(item) {
    const art = document.createElement('article');
    art.className = 'sf-tile';
    art.addEventListener('click', function () { openItemSheet(item); });

    const photo = document.createElement('div');
    photo.className = 'sf-tile-img';
    appendPhoto(photo, item);
    appendTileBadge(photo, item);

    const body = document.createElement('div');
    body.className = 'sf-tile-body';
    if (item.promo) {
      const sale = document.createElement('span');
      sale.className = 'p-sale-badge';
      sale.textContent = item.promo.label;
      body.appendChild(sale);
    }
    const nameEl = document.createElement('span');
    nameEl.className = 'sf-tile-name';
    nameEl.textContent = item.name;
    body.appendChild(nameEl);
    const meta = subtitleFor(item);
    if (meta) {
      const metaEl = document.createElement('span');
      metaEl.className = 'sf-tile-meta';
      metaEl.textContent = meta;
      body.appendChild(metaEl);
    }
    const priceRow = document.createElement('div');
    priceRow.className = 'sf-price-row';
    const priceEl = document.createElement('span');
    priceEl.className = 'sf-price tabular';
    priceEl.innerHTML = priceHTML(item.original_price, item.price, { from: priceIsFrom(item) });
    priceRow.appendChild(priceEl);
    priceRow.appendChild(buildAddControl(item));
    body.appendChild(priceRow);

    art.appendChild(photo);
    art.appendChild(body);
    return art;
  }

  // The one big button on a single-item feature card. Everything except a
  // custom quote goes through the item sheet, which already owns dates,
  // options, boxes and stock.
  function featureCTA(item) {
    const k = item.listing_kind;
    if (k === 'custom') {
      return { label: 'Request a quote', go: function () { window.location.href = customOrderURL(item); } };
    }
    const open = function () { openItemSheet(item); };
    if (k === 'digital') return { label: 'Get the download', go: open };
    if (!stripeReady) return { label: 'Ordering opens soon', disabled: true };
    if (isSoldOut(item)) return { label: k === 'preorder' ? 'Ordering closed' : 'Sold out', disabled: true };
    if (item.is_assorted_box) return { label: 'Build your box', go: open };
    if (k === 'preorder') return { label: 'Pre-order now', go: open };
    if (k === 'physical') return { label: 'Add to cart', go: open };
    return { label: 'Order now', go: open };
  }

  function buildFeature(item) {
    const wrap = document.createElement('div');
    wrap.className = 'sf-feature';

    const photo = document.createElement('div');
    photo.className = 'sf-feature-img';
    appendPhoto(photo, item);
    appendTileBadge(photo, item);
    photo.addEventListener('click', function () { openItemSheet(item); });

    const info = document.createElement('div');
    info.className = 'sf-feature-info';
    if (item.promo) {
      const sale = document.createElement('span');
      sale.className = 'p-sale-badge';
      sale.textContent = item.promo.label;
      info.appendChild(sale);
    }
    const h3 = document.createElement('h3');
    h3.textContent = item.name;
    info.appendChild(h3);
    const desc = (item.item_description || '').trim();
    const meta = subtitleFor(item);
    if (meta && meta !== desc) {
      const metaEl = document.createElement('span');
      metaEl.className = 'sf-feature-meta';
      metaEl.innerHTML = CLOCK_SVG + '<span>' + escapeHtml(meta) + '</span>';
      info.appendChild(metaEl);
    }
    if (desc) {
      const d = document.createElement('p');
      d.className = 'sf-feature-desc';
      d.textContent = desc;
      info.appendChild(d);
    }
    const buy = document.createElement('div');
    buy.className = 'sf-feature-buy';
    const price = document.createElement('span');
    price.className = 'sf-price tabular';
    price.innerHTML = priceHTML(item.original_price, item.price, { from: priceIsFrom(item) });
    buy.appendChild(price);
    const cta = featureCTA(item);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sf-btn';
    btn.innerHTML = '<span>' + escapeHtml(cta.label) + '</span>' + (cta.disabled ? '' : ARROW_SVG);
    if (cta.disabled) btn.disabled = true;
    else btn.addEventListener('click', cta.go);
    buy.appendChild(btn);
    info.appendChild(buy);

    wrap.appendChild(photo);
    wrap.appendChild(info);
    return wrap;
  }

  function buildAddControl(item) {
    const wrap = document.createElement('div');
    wrap.dataset.itemId = item.id;
    refreshAddControl(wrap, item);
    return wrap;
  }

  function refreshAddControl(wrap, item) {
    wrap.innerHTML = '';
    if (item.listing_kind === 'custom') {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '→';
      btn.setAttribute('aria-label', 'Request a custom order');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        window.location.href = customOrderURL(item);
      });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'digital' && item.has_variants) {
      // A digital listing with variants (e.g. one file, four print sizes)
      // always routes to the item sheet's picker — same "no direct card
      // stepper" reasoning as is_assorted_box below, just for a single-select
      // option list instead of a flavor mix.
      const picked = digitalVariantCartLines.filter(function (l) { return l.menuItemId === item.id; }).length;
      const btn = document.createElement('button');
      btn.className = 'add-btn' + (picked > 0 ? ' added' : '');
      btn.textContent = picked > 0 ? String(picked) : '+';
      btn.setAttribute('aria-label', 'Choose an option');
      btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'digital') {
      // Digital purchases skip the pickup cart (no qty/dates/tiers to
      // track) but do get their own small cart — see digitalCart — so
      // multiple downloads can check out together instead of one at a time.
      const inCart = digitalCart.indexOf(item.id) !== -1;
      const btn = document.createElement('button');
      btn.className = 'add-btn' + (inCart ? ' added' : '');
      btn.textContent = inCart ? '✓' : '+';
      btn.setAttribute('aria-label', inCart ? 'Remove from download cart' : 'Add to download cart');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleDigitalCartItem(item);
      });
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'physical' && item.has_variants) {
      // A physical listing with variants (e.g. a cookie-cutter set in
      // Small/Medium/Large/XL, each with its own stock) always routes to
      // the item sheet's picker, same reasoning as digital has_variants
      // above — a card-level stepper can't represent "which size."
      const qty = shipVariantCartLines.filter(function (l) { return l.menuItemId === item.id; })
        .reduce(function (s, l) { return s + l.qty; }, 0);
      const anyStock = (item.listing_variants || []).some(function (v) { return (v.stock_qty || 0) > 0; });
      const btn = document.createElement('button');
      btn.className = 'add-btn' + (qty > 0 ? ' added' : '');
      if (!anyStock || !stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
        btn.title = stripeReady ? 'Sold out' : 'Ordering isn\'t live yet';
      } else {
        btn.textContent = qty > 0 ? String(qty) : '+';
        btn.setAttribute('aria-label', 'Choose an option');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'physical') {
      // Ships items skip the pickup cart too, same reasoning as digital —
      // but unlike digital they're stock-bound, so this is a qty stepper
      // (see shipCart) clamped at available_qty_today rather than a plain
      // in/out toggle.
      const qty = shipCart[item.id] || 0;
      const max = item.available_qty_today || 0;
      if (max <= 0 || !stripeReady) {
        const btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.style.opacity = '.4'; btn.disabled = true;
        btn.textContent = '—';
        btn.title = stripeReady ? 'Sold out' : 'Ordering isn\'t live yet';
        wrap.appendChild(btn);
        return;
      }
      if (qty === 0) {
        const btn = document.createElement('button');
        btn.className = 'add-btn';
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Add to ship cart');
        btn.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, 1); });
        wrap.appendChild(btn);
      } else {
        const stepper = document.createElement('div');
        stepper.className = 'qty-stepper';
        const minus = document.createElement('button');
        minus.textContent = '−';
        minus.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, -1); });
        const qtyEl = document.createElement('span');
        qtyEl.className = 'qty';
        qtyEl.textContent = qty;
        const plus = document.createElement('button');
        plus.textContent = '+';
        // Clamped at stock on hand — the real, atomic check happens
        // server-side at charge time (decrement_menu_item_stock_batch);
        // this is just so a buyer never sees a total they can't pay for.
        if (qty >= max) { plus.disabled = true; plus.style.opacity = '.35'; }
        plus.addEventListener('click', function (e) { e.stopPropagation(); changeShipQty(item, 1); });
        stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
        wrap.appendChild(stepper);
      }
      return;
    }
    if (item.is_assorted_box) {
      // Boxes don't track a plain sold-out quantity — building the flavor
      // mix always happens in the sheet, never a direct card stepper.
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      if (!stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
      } else {
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Build your box');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    if (item.listing_kind === 'preorder') {
      // Always routes through the sheet — even single-date/weekday/lead-time
      // modes benefit from showing the ready date there, and a multi-date
      // listing requires picking one before it can be added at all.
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      if (isSoldOut(item) || !stripeReady) {
        btn.style.opacity = '.4'; btn.disabled = true; btn.textContent = '—';
        btn.title = stripeReady ? 'Ordering closed' : 'Ordering isn\'t live yet';
      } else {
        btn.textContent = '+';
        btn.setAttribute('aria-label', 'Choose pickup date');
        btn.addEventListener('click', function (e) { e.stopPropagation(); openItemSheet(item); });
      }
      wrap.appendChild(btn);
      return;
    }
    const qty = cart[item.id] || 0;
    if (isSoldOut(item) || !stripeReady) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.style.opacity = '.4'; btn.disabled = true;
      btn.textContent = '—';
      btn.title = stripeReady ? 'Sold out for today' : 'Ordering isn\'t live yet';
      wrap.appendChild(btn);
      return;
    }
    if (qty === 0) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.textContent = '+';
      btn.setAttribute('aria-label', 'Add to order');
      btn.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      wrap.appendChild(btn);
    } else {
      const stepper = document.createElement('div');
      stepper.className = 'qty-stepper';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, -1); });
      const qtyEl = document.createElement('span');
      qtyEl.className = 'qty';
      qtyEl.textContent = qty;
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.addEventListener('click', function (e) { e.stopPropagation(); changeQty(item, 1); });
      stepper.appendChild(minus); stepper.appendChild(qtyEl); stepper.appendChild(plus);
      wrap.appendChild(stepper);
    }
  }

  function changeQty(item, delta) {
    const current = cart[item.id] || 0;
    const next = Math.max(0, current + delta);
    if (next === 0) { delete cart[item.id]; } else { cart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateCartUI();
  }

  // Every cart type — pickup/preorder/box, digital downloads, ships-to-you
  // — counted and totalled together. A buyer shouldn't have to parse
  // separate mini-carts just because the storefront's own plumbing tracks
  // pickup/digital/ship as distinct arrays internally; that split is our
  // problem to manage, not something to surface as three competing
  // banners. The cart sheet (renderCartStepOrder) is still the one place
  // per-vertical detail — sections, shipping fee, etc. — belongs.
  function cartCombinedCount() {
    const plainCount = Object.values(cart).reduce(function (s, q) { return s + q; }, 0);
    const boxCount = boxCartLines.reduce(function (s, l) { return s + l.qty; }, 0);
    const preorderCount = preorderCartLines.reduce(function (s, l) { return s + l.qty; }, 0);
    const digitalCount = digitalCartItems().length;
    const shipCount = shipCartItems().reduce(function (s, l) { return s + l.qty; }, 0);
    return plainCount + boxCount + preorderCount + digitalCount + shipCount;
  }
  // Item subtotal only, across every vertical — no shipping fee, no tax.
  // Not customary for a mini-cart banner to show a fees-inclusive figure
  // before the buyer has even reached checkout, and the three separate
  // subtotal helpers below already exclude each other's fees by construction.
  function cartCombinedSubtotal() {
    return cartSubtotal() + digitalCartTotal() + shipCartItemsSubtotal();
  }

  // Header cart icon (mobile 🛒 badge + desktop "Cart · N" pill) — kept in
  // sync by having updateCartUI/updateDigitalCartUI/updateShipCartUI all
  // call this (and updateCartActionBar below) whenever any cart changes.
  function updateHeaderCartBadge() {
    document.getElementById('cart-btn-count').textContent = String(cartCombinedCount());
    refreshDigitalPills();
  }

  // The one bottom-of-screen cart banner (#action-bar-cart) — see the HTML
  // comment above it for why this used to be up to three stacked banners.
  // Deliberately just "View Cart" + the subtotal, no item count — nothing
  // else on the page needed a per-vertical breakdown at this level either.
  // Sticky bottom bar (handoff #9): "{n} in cart · $total" + Checkout.
  function updateCartActionBar() {
    const bar = document.getElementById('sf-cartbar');
    const count = cartCombinedCount();
    bar.classList.toggle('hidden', count === 0);
    if (count > 0) {
      document.getElementById('sf-cartbar-label').textContent =
        count + ' in cart · $' + formatPrice(cartCombinedSubtotal());
    }
  }

  // updateCartUI/updateDigitalCartUI/updateShipCartUI are called from
  // every place that mutates their respective cart (changeQty,
  // toggleDigitalCartItem, changeShipQty, etc.) — kept as three distinctly-
  // named entry points (rather than renaming every call site to one shared
  // function) but all converging on the same header badge + single banner.
  function updateCartUI() {
    updateHeaderCartBadge();
    updateCartActionBar();
  }

  // Returns every digital cart entry — both the plain in/out picks
  // (digitalCart, bare ids) and variant picks (digitalVariantCartLines,
  // since the same base item can appear more than once with a different
  // option chosen) — normalized to one shape via Object.assign: every
  // field the base listing has (id, category, etc., for itemImgURL and
  // friends) plus lineKey (unique per cart line, used for removal —
  // equal to the base item id for a plain pick, so existing single-pick
  // behavior is unchanged) and, for a variant pick, an overridden
  // price/name and the variantId/variantLabel that picked it.
  function digitalCartItems() {
    const plain = digitalCart.map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? Object.assign({}, item, { lineKey: item.id, variantId: null, variantLabel: null }) : null;
    }).filter(Boolean);
    const variantLines = digitalVariantCartLines.map(function (ln) {
      const base = allListings.find(function (l) { return l.id === ln.menuItemId; });
      if (!base) return null;
      return Object.assign({}, base, {
        lineKey: ln.lineId, price: ln.price, variantId: ln.variantId, variantLabel: ln.variantLabel,
        name: base.name + ' — ' + ln.variantLabel
      });
    }).filter(Boolean);
    return plain.concat(variantLines);
  }
  function digitalCartTotal() {
    return digitalCartItems().reduce(function (s, i) { return s + i.price; }, 0);
  }
  function toggleDigitalCartItem(item) {
    const idx = digitalCart.indexOf(item.id);
    if (idx === -1) digitalCart.push(item.id); else digitalCart.splice(idx, 1);
    saveCart();
    renderDigitalFeed();
    updateDigitalCartUI();
  }
  // A digital item with variants always adds/removes through the item
  // sheet's picker (see refreshAddControl's has_variants check), toggling
  // one specific option in or out — same in/out feel as
  // toggleDigitalCartItem, just keyed by (item, variant) instead of item alone.
  function toggleDigitalVariantCartLine(item, variant) {
    const idx = digitalVariantCartLines.findIndex(function (l) { return l.menuItemId === item.id && l.variantId === variant.id; });
    if (idx !== -1) {
      digitalVariantCartLines.splice(idx, 1);
    } else {
      digitalVariantCartLines.push({
        lineId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()),
        menuItemId: item.id, variantId: variant.id, variantLabel: variant.label, price: variant.price
      });
    }
    saveCart();
    updateDigitalCartUI();
  }
  // Single removal entry point for the cart sheet's ✕ button — works for
  // either a plain pick or a variant line without the caller needing to
  // know which one a given lineKey belongs to.
  function removeDigitalCartLine(lineKey) {
    const idx = digitalCart.indexOf(lineKey);
    if (idx !== -1) { digitalCart.splice(idx, 1); saveCart(); return; }
    digitalVariantCartLines = digitalVariantCartLines.filter(function (l) { return l.lineId !== lineKey; });
    saveCart();
  }
  function updateDigitalCartUI() {
    updateHeaderCartBadge();
    updateCartActionBar();
  }
  // itemId, or itemId~variantId for a variant pick — parsed back out by
  // digital-checkout.html.
  function digitalCartLineToken(entry) {
    return entry.variantId ? (entry.id + '~' + entry.variantId) : entry.id;
  }
  function digitalCartCheckoutURL() {
    const tokens = digitalCartItems().map(digitalCartLineToken);
    return '/baker/digital-checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&items=' + encodeURIComponent(tokens.join(',')) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  // Ships (physical) cart — a { itemId: qty } map for plain items, so
  // those lines carry a real stepper (see refreshAddControl's 'physical'
  // branch and the cart sheet's 'ship' line kind); variant picks live in
  // shipVariantCartLines instead (same reasoning as digitalVariantCartLines
  // above — the same base item can appear more than once with a different
  // option chosen). shipCartItems() normalizes both into one list of
  // { item, qty } pairs, with the variant line's own price/lineKey/
  // variantId/variantLabel folded into `item` via Object.assign so every
  // existing consumer that reads l.item.price/l.item.id etc. picks up the
  // right value automatically without needing to know which source a
  // given line came from.
  function shipCartItems() {
    const plain = Object.keys(shipCart).map(function (id) {
      const base = allListings.find(function (l) { return l.id === id; });
      if (!base) return null;
      return { item: Object.assign({}, base, { lineKey: base.id, variantId: null, variantLabel: null }), qty: shipCart[id] };
    }).filter(Boolean);
    const variantLines = shipVariantCartLines.map(function (ln) {
      const base = allListings.find(function (l) { return l.id === ln.menuItemId; });
      if (!base) return null;
      return {
        item: Object.assign({}, base, {
          lineKey: ln.lineId, price: ln.price, variantId: ln.variantId, variantLabel: ln.variantLabel,
          name: base.name + ' — ' + ln.variantLabel
        }),
        qty: ln.qty
      };
    }).filter(Boolean);
    return plain.concat(variantLines);
  }
  function shipCartItemsSubtotal() {
    return shipCartItems().reduce(function (s, l) { return s + l.item.price * l.qty; }, 0);
  }
  // Shipping fee is a flat per-listing amount (set by the baker, see
  // WebShopShippingSheet) charged once per distinct BASE item in the cart
  // (deduped by the item's real id, not lineKey — two different options of
  // the same cookie-cutter-set listing still only pay the fee once), not
  // once per unit. Real carrier-computed rates are a later integration;
  // this is just the manual placeholder for it. A baker can also set a
  // storefront-wide "free shipping over $X"
  // (profile.shipping_free_over_threshold) that waives every item's fee
  // once the ship-cart's item subtotal alone clears it.
  //
  // Combined-shipping: among the distinct base items in the cart, the one
  // with the highest shipping_fee charges in full; every other distinct
  // item charges round(shipping_fee * shipping_additional_item_percent /
  // 100) instead of its own full fee, unless it has
  // shipping_always_full_price set (always full fee regardless of rank).
  // shipping_additional_item_percent defaults to 100 (no discount) — same
  // "sum of full fees" behavior as before this existed. See
  // finalize-guest-physical-order for the authoritative server-side
  // recompute of this exact same rule.
  function shipCartShippingFees() {
    const threshold = (profile && profile.shipping_free_over_threshold) || 0;
    if (threshold > 0 && shipCartItemsSubtotal() >= threshold) return 0;
    const additionalPercent = (profile && profile.shipping_additional_item_percent != null)
      ? profile.shipping_additional_item_percent : 100;
    const seen = {};
    const distinct = [];
    shipCartItems().forEach(function (l) {
      if (seen[l.item.id]) return;
      seen[l.item.id] = true;
      distinct.push(l.item);
    });
    if (distinct.length === 0) return 0;
    let highestIdx = 0;
    distinct.forEach(function (item, idx) {
      if ((item.shipping_fee || 0) > (distinct[highestIdx].shipping_fee || 0)) highestIdx = idx;
    });
    let fee = 0;
    distinct.forEach(function (item, idx) {
      if (idx === highestIdx) fee += (item.shipping_fee || 0);
      else if (item.shipping_always_full_price) fee += (item.shipping_fee || 0);
      else fee += Math.round((item.shipping_fee || 0) * additionalPercent / 100 * 100) / 100;
    });
    return fee;
  }
  function shipCartTotal() {
    return shipCartItemsSubtotal() + shipCartShippingFees();
  }
  // Plain (non-variant) physical items only — a has_variants item always
  // goes through the item sheet's picker/stepper instead (see
  // refreshAddControl and changeShipVariantLineQty below).
  function changeShipQty(item, delta) {
    const current = shipCart[item.id] || 0;
    const max = item.available_qty_today || 0;
    const next = Math.max(0, Math.min(max, current + delta));
    if (next === 0) { delete shipCart[item.id]; } else { shipCart[item.id] = next; }
    saveCart();
    document.querySelectorAll('[data-item-id="' + item.id + '"]').forEach(function (wrap) {
      refreshAddControl(wrap, item);
    });
    updateShipCartUI();
  }
  // Adds one unit of a specific variant to the ship cart, merging into an
  // existing line for the same (item, variant) pair rather than creating a
  // duplicate — clamped at that variant's own stock, re-resolved live from
  // allListings rather than trusted from whatever the sheet had open.
  function addShipVariantToCart(item, variant) {
    const base = allListings.find(function (l) { return l.id === item.id; }) || item;
    const liveVariant = (base.listing_variants || []).find(function (v) { return v.id === variant.id; }) || variant;
    const max = liveVariant.stock_qty || 0;
    const existing = shipVariantCartLines.find(function (l) { return l.menuItemId === item.id && l.variantId === variant.id; });
    if (existing) {
      existing.qty = Math.min(max, existing.qty + 1);
    } else if (max > 0) {
      shipVariantCartLines.push({
        lineId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()),
        menuItemId: item.id, variantId: liveVariant.id, variantLabel: liveVariant.label, price: liveVariant.price, qty: 1
      });
    }
    saveCart();
    updateShipCartUI();
  }
  function changeShipVariantLineQty(lineId, delta) {
    const line = shipVariantCartLines.find(function (l) { return l.lineId === lineId; });
    if (!line) return;
    const base = allListings.find(function (l) { return l.id === line.menuItemId; });
    const variant = base && (base.listing_variants || []).find(function (v) { return v.id === line.variantId; });
    const max = variant ? (variant.stock_qty || 0) : line.qty;
    line.qty = Math.max(0, Math.min(max, line.qty + delta));
    if (line.qty === 0) { shipVariantCartLines = shipVariantCartLines.filter(function (l) { return l.lineId !== lineId; }); }
    saveCart();
    updateShipCartUI();
  }
  // Single "change qty by delta" entry point for the cart sheet's
  // −/+ buttons — routes to the plain or variant path without the caller
  // needing to know which one a given lineKey belongs to.
  function changeShipCartLine(lineKey, delta) {
    if (Object.prototype.hasOwnProperty.call(shipCart, lineKey)) {
      const item = allListings.find(function (l) { return l.id === lineKey; });
      if (item) changeShipQty(item, delta);
    } else {
      changeShipVariantLineQty(lineKey, delta);
    }
  }
  function updateShipCartUI() {
    updateHeaderCartBadge();
    updateCartActionBar();
  }
  // itemId:qty, or itemId:qty:variantId for a variant pick — parsed back
  // out by physical-checkout.html.
  function shipCartLineToken(l) {
    return l.item.id + ':' + l.qty + (l.item.variantId ? ':' + l.item.variantId : '');
  }
  function shipCartCheckoutURL() {
    const pairs = shipCartItems().map(shipCartLineToken);
    return '/baker/physical-checkout.html?baker=' + encodeURIComponent(resolvedBakerId) +
      '&items=' + encodeURIComponent(pairs.join(',')) +
      '&theme=' + encodeURIComponent((profile && profile.selected_theme) || '') +
      '&pattern=' + encodeURIComponent((profile && profile.background_pattern) || '');
  }

  function cartLines() {
    const plain = Object.keys(cart).map(function (id) {
      const item = allListings.find(function (l) { return l.id === id; });
      return item ? { kind: 'plain', item: item, qty: cart[id] } : null;
    }).filter(Boolean);
    const boxed = boxCartLines.map(function (bl) {
      const item = allListings.find(function (l) { return l.id === bl.menuItemId; }) ||
        { id: bl.menuItemId, name: bl.itemName, tax_category: bl.taxCategory, unit_weight_grams: bl.unitWeightGrams };
      return { kind: 'box', item: item, line: bl, qty: bl.qty };
    });
    const preordered = preorderCartLines.map(function (pl) {
      const item = allListings.find(function (l) { return l.id === pl.menuItemId; });
      return item ? { kind: 'preorder', item: item, line: pl, qty: pl.qty } : null;
    }).filter(Boolean);
    return plain.concat(boxed).concat(preordered);
  }

  function cartSubtotal() {
    return cartLines().reduce(function (sum, l) {
      const price = l.kind === 'box' ? l.line.price : l.item.price;
      return sum + price * l.qty;
    }, 0);
  }

  // Guest checkout: the customer pays exactly the item subtotal (+ tax) —
  // Bakeri's service charge comes out of the baker's side instead, so it's
  // never shown or added to this preview. Mirrors create-payment-intent's
  // guest branch in supabase/functions/create-payment-intent/index.ts.

  // Sales tax is calculated by Stripe Tax at checkout (create-payment-intent),
  // from the vendor's own tax registrations and where the order is picked up
  // or shipped — the cart can't know it yet, so a vendor who collects tax
  // gets a note instead (profile.is_gst_registered = collects sales tax).
  function cartTotal() { return cartSubtotal(); }

  // ══════════════════════ Item Sheet ══════════════════════

  function openItemSheet(item) {
    document.getElementById('item-sheet-name').textContent = item.name;
    document.getElementById('item-sheet-price').innerHTML = priceHTML(item.original_price, item.price, { from: priceIsFrom(item) });
    const descEl = document.getElementById('item-sheet-desc');
    const descToggle = document.getElementById('item-sheet-desc-toggle');
    descEl.textContent = item.item_description || '';
    descEl.classList.add('clamped');
    // Tapping the (clamped) text itself or "Read more" both open the full
    // description in its own popup rather than expanding inline — reading
    // a long one then never means scrolling the item sheet at all.
    const openFullDesc = function () { openDescSheet(item.name, item.item_description || ''); };
    descEl.onclick = openFullDesc;
    descToggle.onclick = openFullDesc;

    // Sold-out-aware badge — the one place a "Sold Out" label appears,
    // matching the app's dedicated item-detail treatment rather than
    // swapping the grid's badge (which stays the plain kind label there).
    const badge = badgeInfo(item);
    const badgeEl = document.getElementById('item-sheet-badge');
    badgeEl.style.background = badge.bg;
    badgeEl.innerHTML = '<span class="dot"></span>' + badge.label;

    const ph = document.getElementById('item-sheet-ph');
    ph.textContent = categoryEmoji(item);
    ph.style.display = 'flex';
    const img = document.getElementById('item-sheet-img');
    img.style.display = 'none';
    img.onload = function () { focusImage(img, itemFocus(item)); img.style.display = 'block'; ph.style.display = 'none'; };
    img.src = itemImgURL(item);

    const specs = [];
    if (item.lead_time_note) specs.push({ k: 'Lead time', v: item.lead_time_note });
    if (item.allergens) specs.push({ k: 'Allergens', v: item.allergens });
    document.getElementById('item-sheet-specs').innerHTML = specs.map(function (s) {
      return '<div class="spec-row"><span>' + s.k + '</span><b>' + escapeHtml(s.v) + '</b></div>';
    }).join('');

    const cta = document.getElementById('item-sheet-cta');
    const boxEl = document.getElementById('item-sheet-box');
    boxState = null;
    preorderState = null;
    variantState = null;

    if (item.is_assorted_box) {
      boxEl.style.display = 'block';
      openBoxPicker(item);
    } else if (item.listing_kind === 'preorder') {
      openPreorderPicker(item);
    } else if (item.has_variants) {
      boxEl.style.display = 'block';
      openVariantPicker(item);
    } else {
      boxEl.style.display = 'none';
      boxEl.innerHTML = '';
      if (item.listing_kind === 'custom') {
        cta.textContent = 'Request a Custom Order';
        cta.disabled = false;
        cta.style.opacity = '1';
        cta.onclick = function () { window.location.href = customOrderURL(item); };
      } else if (item.listing_kind === 'digital') {
        const inCart = digitalCart.indexOf(item.id) !== -1;
        cta.textContent = (inCart ? 'Remove from Cart ✓ — $' : 'Add to Cart — $') + formatPrice(item.price);
        cta.disabled = !stripeReady;
        cta.style.opacity = stripeReady ? '1' : '.5';
        cta.onclick = stripeReady ? function () {
          toggleDigitalCartItem(item);
          closeItemSheet();
          showToast(inCart ? 'Removed from your download cart' : 'Added to your download cart');
        } : null;
      } else if (item.listing_kind === 'physical') {
        if (isSoldOut(item) || !stripeReady) {
          cta.textContent = isSoldOut(item) ? 'Sold Out' : 'Ordering Opens Soon';
          cta.disabled = true;
          cta.style.opacity = '.5';
        } else {
          cta.textContent = 'Add to Cart — $' + formatPrice(item.price);
          cta.disabled = false;
          cta.style.opacity = '1';
          cta.onclick = function () {
            changeShipQty(item, 1);
            closeItemSheet();
            showToast('Added to your ship cart');
          };
        }
      } else if (isSoldOut(item)) {
        cta.textContent = 'Sold Out';
        cta.disabled = true;
        cta.style.opacity = '.5';
      } else if (!stripeReady) {
        cta.textContent = 'Ordering Opens Soon';
        cta.disabled = true;
        cta.style.opacity = '.5';
      } else {
        cta.textContent = 'Add to Order';
        cta.disabled = false;
        cta.style.opacity = '1';
        cta.onclick = function () {
          changeQty(item, 1);
          closeItemSheet();
          showToast('Added to your order');
        };
      }
    }

    document.getElementById('item-scrim').classList.add('open');

    // CSS aspect-ratio on a flex item has inconsistent cross-browser
    // support for constraining height (notably iOS Safari) — set the
    // photo's height explicitly from its own resolved width instead of
    // relying on the browser to reconcile aspect-ratio with flex sizing.
    // clientWidth forces a synchronous layout, so this reads correctly
    // right after the sheet becomes visible.
    const photoEl = document.getElementById('item-sheet-photo');
    photoEl.style.height = photoEl.clientWidth + 'px';

    // Only now (sheet visible, clamp applied) do scrollHeight/clientHeight
    // reflect real layout — measuring this before .open is added would
    // read 0/0 off a display:none subtree and never show the toggle. A
    // short description that doesn't overflow isn't clickable at all —
    // opening a popup to show the exact same text it's already showing
    // would just be a dead tap.
    const descOverflows = descEl.scrollHeight > descEl.clientHeight + 1;
    descToggle.style.display = descOverflows ? 'block' : 'none';
    descEl.classList.toggle('tappable', descOverflows);
    if (!descOverflows) descEl.onclick = null;
  }
  function closeItemSheet() { document.getElementById('item-scrim').classList.remove('open'); }

  // ══════════════════════ Swipe down to dismiss ══════════════════════
  //
  // Mobile users expect a bottom sheet to close on a downward swipe, not
  // just the ✕ button. A touch starting inside the scrollable description
  // only arms the dismiss-drag once that area is already scrolled to its
  // top (scrollTop <= 0) — otherwise this would fight normal scrolling of
  // long descriptions. A touch starting on the photo or the fixed
  // name/price/button block arms immediately since neither scrolls.
  (function setupItemSheetSwipeDismiss() {
    const sheet = document.getElementById('item-sheet');
    const scrollArea = document.getElementById('item-sheet-scroll');
    let startY = 0;
    let currentY = 0;
    let dragging = false;
    let armed = false;

    sheet.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      startY = currentY = e.touches[0].clientY;
      dragging = true;
      armed = false;
      sheet.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', function (e) {
      if (!dragging || e.touches.length !== 1) return;
      currentY = e.touches[0].clientY;
      const deltaY = currentY - startY;
      if (deltaY <= 0) { armed = false; sheet.style.transform = ''; return; }

      if (!armed) {
        const inScrollArea = scrollArea.contains(e.target);
        if (inScrollArea && scrollArea.scrollTop > 0) return;
        armed = true;
      }

      e.preventDefault();
      sheet.style.transform = 'translateY(' + deltaY + 'px)';
    }, { passive: false });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      const deltaY = currentY - startY;
      if (armed && deltaY > 120) {
        closeItemSheet();
        sheet.style.transform = '';
      } else {
        sheet.style.transition = 'transform 0.25s ease-out';
        sheet.style.transform = '';
      }
      armed = false;
    }
    sheet.addEventListener('touchend', endDrag);
    sheet.addEventListener('touchcancel', endDrag);
  })();

  // ══════════════════════ Full-description popup ══════════════════════

  function openDescSheet(name, text) {
    document.getElementById('desc-sheet-body').innerHTML =
      '<div id="desc-sheet-title">' + escapeHtml(name) + '</div>' +
      '<div id="desc-sheet-text"></div>';
    document.getElementById('desc-sheet-text').textContent = text;
    document.getElementById('desc-scrim').classList.add('open');
  }
  function closeDescSheet() { document.getElementById('desc-scrim').classList.remove('open'); }

  // Same swipe-down-to-dismiss as the item sheet, simplified — desc-sheet
  // has no separate fixed/scroll split, it's just one scrollable block via
  // the shared .sheet overflow: auto, so the sheet itself is both the drag
  // target and the thing whose scrollTop needs checking.
  (function setupDescSheetSwipeDismiss() {
    const sheet = document.getElementById('desc-sheet');
    let startY = 0, currentY = 0, dragging = false, armed = false;

    sheet.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      startY = currentY = e.touches[0].clientY;
      dragging = true;
      armed = false;
      sheet.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', function (e) {
      if (!dragging || e.touches.length !== 1) return;
      currentY = e.touches[0].clientY;
      const deltaY = currentY - startY;
      if (deltaY <= 0) { armed = false; sheet.style.transform = ''; return; }
      if (!armed) {
        if (sheet.scrollTop > 0) return;
        armed = true;
      }
      e.preventDefault();
      sheet.style.transform = 'translateY(' + deltaY + 'px)';
    }, { passive: false });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      const deltaY = currentY - startY;
      if (armed && deltaY > 120) {
        closeDescSheet();
        sheet.style.transform = '';
      } else {
        sheet.style.transition = 'transform 0.25s ease-out';
        sheet.style.transform = '';
      }
      armed = false;
    }
    sheet.addEventListener('touchend', endDrag);
    sheet.addEventListener('touchcancel', endDrag);
  })();

  // ══════════════════════ Assorted Box picker ══════════════════════

  function openBoxPicker(item) {
    boxState = { item: item, tierId: null, chosen: {} };
    renderBoxPickerBody();
  }

  function renderBoxPickerBody() {
    const item = boxState.item;
    const tiers = item.size_tiers || [];
    const variants = item.variants || [];
    const activeTier = tiers.find(function (t) { return t.id === boxState.tierId; });
    const target = activeTier ? activeTier.unit_count : 0;
    const chosenTotal = Object.values(boxState.chosen).reduce(function (s, q) { return s + q; }, 0);

    const tierHtml = '<div class="box-tiers">' + tiers.map(function (t) {
      return '<button type="button" class="box-tier' + (t.id === boxState.tierId ? ' active' : '') + '" data-tier-id="' + t.id + '">' +
        '<div class="box-tier-label">' + escapeHtml(t.label) + '</div>' +
        '<div class="box-tier-price tabular">$' + formatPrice(t.price) + '</div>' +
        '</button>';
    }).join('') + '</div>';

    const flavorHtml = !activeTier ? '' :
      '<div class="box-flavor-header">Choose your flavors (' + chosenTotal + '/' + target + ')</div>' +
      variants.map(function (v) {
        const q = boxState.chosen[v.id] || 0;
        const plusDisabled = chosenTotal >= target;
        const minusDisabled = q === 0;
        return '<div class="box-flavor-row" data-variant-id="' + v.id + '">' +
          '<img class="box-flavor-thumb" src="' + variantImgURL(item, v) + '" alt="" onerror="this.style.visibility=\'hidden\'" />' +
          '<div class="box-flavor-name">' + escapeHtml(v.name) + '</div>' +
          '<div class="stepper">' +
          '<button type="button" class="box-minus"' + (minusDisabled ? ' disabled' : '') + '>−</button>' +
          '<span class="qty">' + q + '</span>' +
          '<button type="button" class="box-plus"' + (plusDisabled ? ' disabled' : '') + '>+</button>' +
          '</div></div>';
      }).join('');

    document.getElementById('item-sheet-box').innerHTML =
      '<div class="box-step-label">Choose your size</div>' + tierHtml + flavorHtml;

    wireBoxPickerEvents();
    updateBoxCTA();
  }

  function wireBoxPickerEvents() {
    document.querySelectorAll('.box-tier').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (boxState.tierId !== btn.dataset.tierId) {
          boxState.tierId = btn.dataset.tierId;
          boxState.chosen = {}; // switching size starts the flavor mix over
          renderBoxPickerBody();
        }
      });
    });
    document.querySelectorAll('.box-plus').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const vid = btn.closest('.box-flavor-row').dataset.variantId;
        const tiers = boxState.item.size_tiers || [];
        const tier = tiers.find(function (t) { return t.id === boxState.tierId; });
        const target = tier ? tier.unit_count : 0;
        const total = Object.values(boxState.chosen).reduce(function (s, q) { return s + q; }, 0);
        if (total >= target) return;
        boxState.chosen[vid] = (boxState.chosen[vid] || 0) + 1;
        renderBoxPickerBody();
      });
    });
    document.querySelectorAll('.box-minus').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const vid = btn.closest('.box-flavor-row').dataset.variantId;
        const q = boxState.chosen[vid] || 0;
        if (q <= 0) return;
        if (q - 1 <= 0) { delete boxState.chosen[vid]; } else { boxState.chosen[vid] = q - 1; }
        renderBoxPickerBody();
      });
    });
  }

  function updateBoxCTA() {
    const cta = document.getElementById('item-sheet-cta');
    const tiers = boxState.item.size_tiers || [];
    const tier = tiers.find(function (t) { return t.id === boxState.tierId; });
    if (!tier) {
      cta.textContent = 'Choose a size';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }
    const chosenTotal = Object.values(boxState.chosen).reduce(function (s, q) { return s + q; }, 0);
    const ready = chosenTotal === tier.unit_count;
    const canBuy = ready && stripeReady;
    cta.textContent = ready ? ('Add to Order — $' + formatPrice(tier.price)) : ('Choose ' + (tier.unit_count - chosenTotal) + ' more');
    cta.disabled = !canBuy;
    cta.style.opacity = canBuy ? '1' : '.5';
    cta.onclick = canBuy ? addBoxToCart : null;
  }

  function addBoxToCart() {
    const item = boxState.item;
    const tier = (item.size_tiers || []).find(function (t) { return t.id === boxState.tierId; });
    if (!tier) return;
    const variants = item.variants || [];
    const breakdown = Object.keys(boxState.chosen).filter(function (id) { return boxState.chosen[id] > 0; }).map(function (id) {
      const v = variants.find(function (x) { return x.id === id; });
      return { variantId: id, name: v ? v.name : '', qty: boxState.chosen[id] };
    });
    boxCartLines.push({
      lineId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()),
      menuItemId: item.id, itemName: item.name, tierId: tier.id, tierLabel: tier.label,
      unitCount: tier.unit_count, price: tier.price,
      originalPrice: tier.original_price != null ? tier.original_price : tier.price,
      qty: 1, variants: breakdown,
      taxCategory: item.tax_category, unitWeightGrams: item.unit_weight_grams
    });
    saveCart();
    updateCartUI();
    closeItemSheet();
    showToast('Added to your order');
  }

  function changeBoxLineQty(lineId, delta) {
    const line = boxCartLines.find(function (l) { return l.lineId === lineId; });
    if (!line) return;
    line.qty = Math.max(0, line.qty + delta);
    if (line.qty === 0) { boxCartLines = boxCartLines.filter(function (l) { return l.lineId !== lineId; }); }
    saveCart();
    updateCartUI();
  }

  function variantImgURL(item, variant) {
    return STORAGE_URL + '/menu-item-images/' + resolvedBakerId.toUpperCase() + '/' + item.id.toUpperCase() + '/variants/' + variant.id.toUpperCase() + '.jpg';
  }

  // ══════════════════════ Listing variant picker ══════════════════════
  //
  // Single-select size/option picker for a plain (non-Assorted-Box)
  // digital or physical listing — e.g. a cookie-cutter set sold in
  // Small/Medium/Large/XL, or a printable design offered at a few sizes.
  // Deliberately simpler than the box picker above (no flavor mix to
  // build): pick exactly one listing_variants row, then Add to Cart.
  // Reuses the box picker's .box-tiers/.box-tier CSS since the "one row
  // of tappable option cards" shape is identical.

  function openVariantPicker(item) {
    variantState = { item: item, variantId: null };
    renderVariantPickerBody();
  }

  function renderVariantPickerBody() {
    const item = variantState.item;
    const variants = item.listing_variants || [];
    const isPhysical = item.listing_kind === 'physical';
    const tierHtml = '<div class="box-tiers">' + variants.map(function (v) {
      const soldOut = isPhysical && (v.stock_qty || 0) <= 0;
      // Gated on v.has_image rather than always attempting the thumbnail and
      // relying on onerror to hide a 404 — for the (currently overwhelming)
      // common case of a variant with no photo, that meant every tap
      // (re-rendering this whole button's innerHTML) started a fresh failed
      // image load, and iOS Safari's broken-image placeholder briefly
      // ignored the CSS width/height and rendered at its own intrinsic
      // size — the button visibly stretching wider with a broken-image
      // glyph before onerror caught up and hid it. Explicit width/height
      // attributes (not just the CSS class) plus removing the element
      // outright on error guard the has_image:true path too, in case that
      // flag and reality ever drift (e.g. the upload failed after the flag
      // was set).
      const thumb = v.has_image
        ? '<img class="box-tier-thumb" width="34" height="34" src="' + variantImgURL(item, v) + '" alt="" onerror="this.remove()" />'
        : '';
      return '<button type="button" class="box-tier' + (v.id === variantState.variantId ? ' active' : '') + '"' +
        (soldOut ? ' disabled' : '') + ' style="' + (soldOut ? 'opacity:.4;' : '') + '" data-variant-id="' + v.id + '">' +
        thumb +
        '<div class="box-tier-label">' + escapeHtml(v.label) + (soldOut ? ' (Sold Out)' : '') + '</div>' +
        '<div class="box-tier-price tabular">$' + formatPrice(v.price) + '</div>' +
        '</button>';
    }).join('') + '</div>';

    document.getElementById('item-sheet-box').innerHTML =
      '<div class="box-step-label">Choose an option</div>' + tierHtml;

    wireVariantPickerEvents();
    updateVariantCTA();
  }

  function wireVariantPickerEvents() {
    document.querySelectorAll('#item-sheet-box .box-tier').forEach(function (btn) {
      if (btn.disabled) return;
      btn.addEventListener('click', function () {
        variantState.variantId = btn.dataset.variantId;
        renderVariantPickerBody();
      });
    });
  }

  function updateVariantCTA() {
    const cta = document.getElementById('item-sheet-cta');
    const item = variantState.item;
    const variant = (item.listing_variants || []).find(function (v) { return v.id === variantState.variantId; });
    // Header price tracks the picker: "from $lowest" before a choice is
    // made (if options differ in price), the exact chosen option's price
    // once one is — otherwise it's stuck showing the lowest option's price
    // even after picking a pricier one, which reads as a bug/bait-and-switch.
    const priceEl = document.getElementById('item-sheet-price');
    priceEl.innerHTML = variant
      ? priceHTML(variant.original_price, variant.price)
      : priceHTML(item.original_price, item.price, { from: priceIsFrom(item) });
    if (!variant) {
      cta.textContent = 'Choose an option';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }
    if (item.listing_kind === 'digital') {
      const inCart = digitalVariantCartLines.some(function (l) { return l.menuItemId === item.id && l.variantId === variant.id; });
      cta.textContent = (inCart ? 'Remove from Cart ✓ — $' : 'Add to Cart — $') + formatPrice(variant.price);
      cta.disabled = !stripeReady;
      cta.style.opacity = stripeReady ? '1' : '.5';
      cta.onclick = stripeReady ? function () {
        toggleDigitalVariantCartLine(item, variant);
        closeItemSheet();
        showToast(inCart ? 'Removed from your download cart' : 'Added to your download cart');
      } : null;
      return;
    }
    const soldOut = (variant.stock_qty || 0) <= 0;
    if (soldOut || !stripeReady) {
      cta.textContent = soldOut ? 'Sold Out' : 'Ordering Opens Soon';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }
    cta.textContent = 'Add to Cart — $' + formatPrice(variant.price);
    cta.disabled = false;
    cta.style.opacity = '1';
    cta.onclick = function () {
      addShipVariantToCart(item, variant);
      closeItemSheet();
      showToast('Added to your ship cart');
    };
  }

  // ══════════════════════ Pre-order date picker ══════════════════════

  // Per-date capacity cache — { menuItemId: { dateTimeMs: committedQty } }.
  // Refetched fresh every time a multi-date picker opens (cheap aggregate
  // query), so it's never more than one sheet-open stale; the edge function
  // is the real authority and re-checks at checkout regardless.
  let preorderCommitmentsCache = {};

  function fetchPreorderCommitments(menuItemId) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/get_preorder_date_commitments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ p_menu_item_id: menuItemId })
    })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        const map = {};
        (rows || []).forEach(function (row) {
          map[new Date(row.preorder_date).getTime()] = Number(row.committed_qty) || 0;
        });
        preorderCommitmentsCache[menuItemId] = map;
        return map;
      })
      .catch(function () { return preorderCommitmentsCache[menuItemId] || {}; });
  }

  // Remaining stock for one candidate date — server-committed quantity plus
  // whatever this buyer already has in their own cart for that same date
  // (so repeatedly clicking + can't exceed the cap before a page refresh
  // would next refetch commitments), against the listing's shared per-date
  // cap (max_preorder_quantity; 0 = unlimited, matching MenuItem's semantics).
  function remainingForPreorderDate(item, dateMs) {
    const cap = item.max_preorder_quantity || 0;
    if (cap <= 0) return Infinity;
    const committed = (preorderCommitmentsCache[item.id] || {})[dateMs] || 0;
    const iso = new Date(dateMs).toISOString();
    const inCart = preorderCartLines
      .filter(function (l) { return l.menuItemId === item.id && l.chosenISO === iso; })
      .reduce(function (s, l) { return s + l.qty; }, 0);
    return Math.max(0, cap - committed - inCart);
  }

  function openPreorderPicker(item) {
    const boxEl = document.getElementById('item-sheet-box');
    const cta = document.getElementById('item-sheet-cta');

    if (isPreorderClosed(item)) {
      boxEl.style.display = 'block';
      boxEl.innerHTML = '<div class="box-step-label">Ordering has closed for this item.</div>';
      cta.textContent = 'Ordering Closed';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }

    const mode = item.preorder_schedule_mode || 'fixed_dates';
    if (mode === 'fixed_dates') {
      const dates = futurePreorderDates(item);
      if (dates.length > 1) {
        boxEl.style.display = 'block';
        // Always starts blank, even if this item already has cart lines —
        // re-opening the sheet is for adding another (possibly different)
        // date, not editing a prior choice; the existing line's qty stepper
        // in the cart is how a buyer adds more of an already-chosen date.
        preorderState = { item: item, chosenISO: null };
        boxEl.innerHTML = '<div class="box-step-label">Choose a pickup date</div><div class="box-tiers" style="flex-wrap:wrap;"></div>';
        cta.textContent = 'Choose a date';
        cta.disabled = true;
        cta.style.opacity = '.5';
        cta.onclick = null;
        fetchPreorderCommitments(item.id).then(function () {
          if (!preorderState || preorderState.item !== item) return; // buyer moved to a different item
          renderPreorderDatePicker(dates);
          updatePreorderCTA();
        });
        return;
      }
    }

    // Single deterministic date (or none, for lead_time) — no picker needed.
    const readyDate = resolvePreorderDate(item, null);
    if (readyDate) {
      boxEl.style.display = 'block';
      boxEl.innerHTML = '<div class="box-step-label">Ready ' + formatDateLong(readyDate) + '</div>';
    } else {
      boxEl.style.display = 'none';
      boxEl.innerHTML = '';
    }
    if (!stripeReady) {
      cta.textContent = 'Ordering Opens Soon';
      cta.disabled = true;
      cta.style.opacity = '.5';
      cta.onclick = null;
      return;
    }
    cta.textContent = 'Add to Order';
    cta.disabled = false;
    cta.style.opacity = '1';
    cta.onclick = function () { addPreorderToCart(item, readyDate ? readyDate.toISOString() : null); };
  }

  function renderPreorderDatePicker(dates) {
