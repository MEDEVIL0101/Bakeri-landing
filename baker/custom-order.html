<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request a Custom Order — Bakeri</title>
  <meta name="description" content="Request a custom order from a baker on Bakeri." />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="theme.js"></script>
  <script src="intake-form.js"></script>

  <style>
    :root {
      /* Overwritten at runtime by theme.js from the baker/index.html link's
         theme/pattern params — these are the pre-load fallback. */
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-button-fg: #FFFFFF;

      --bg:      var(--theme-bg);
      --accent:  var(--theme-primary);
      --ink:     #241712;
      --muted:   #948577;
      --bio:     #4A3E33;
      --line:    rgba(36,23,18,0.08);
      --error:   #C0392B;
      --sans:    -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --theme-bg: #17110C; --ink: #F6F1E6; --bio: #E4D9C8; --muted: #A69B8C; --line: rgba(246,241,230,0.10); }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--bio);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font-family: inherit; }
    .hidden { display: none !important; }

    #page-shell { max-width: 720px; margin: 0 auto; background: var(--bg); position: relative; }

    /* Header image + logo — same treatment as the baker's main storefront
       page (baker/index.html's #profile-hero/#profile-block), simplified to
       just the identity block (no nav/cart/bio) since this page has one job. */
    #profile-hero { position: relative; }
    #storefront-header {
      position: absolute; inset: 0; overflow: hidden;
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
    }
    #storefront-header img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    #header-scrim { position: absolute; inset: 0; background: rgba(20,15,10,.42); }
    #profile-block { text-align: center; padding: 40px 20px 26px; position: relative; z-index: 1; }
    #profile-link { display: block; text-decoration: none; }
    .avatar {
      width: 84px; height: 84px; margin: 0 auto; font-size: 28px;
      border-radius: 50%; background: var(--theme-secondary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; overflow: hidden; position: relative;
      box-shadow: 0 2px 6px rgba(36,23,18,.15);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }
    #shop-name { font-size: 17px; font-weight: 700; color: var(--ink); margin-top: 12px; }
    #profile-hero.has-photo #shop-name { color: #fff; }

    /* Full-width white band directly under the hero, same as every section
       on the main storefront page (.section-band there) — one continuous
       white surface, not a rounded card floating with cream gaps around it. */
    #form-band { background: var(--surface, #fff); }
    @media (prefers-color-scheme: dark) { #form-band { --surface: #241a12; } }

    #page { width: 100%; max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; box-sizing: border-box; }
    @media (min-width: 640px) { #page { padding: 48px 24px 60px; } }

    .footer-links { margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); }
    .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>

<div id="page-shell">
  <div id="profile-hero">
    <div id="storefront-header" class="hidden">
      <img id="header-img" alt="" />
      <div id="header-scrim"></div>
    </div>
    <a id="profile-link" href="https://bakeriapp.com" target="_blank" rel="noopener">
      <section id="profile-block">
        <div class="avatar" id="pb-avatar"><span id="pb-avatar-letter"></span></div>
        <div id="shop-name"></div>
      </section>
    </a>
  </div>

  <div id="form-band">
    <div id="page">
      <div id="card">Loading…</div>
      <div class="footer-links">
        <a href="https://bakeriapp.com">bakeriapp.com</a> · <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STORAGE_URL  = SUPABASE_URL + '/storage/v1/object/public';

  const params  = new URLSearchParams(window.location.search);
  const bakerId = (params.get('baker') || '').trim();
  const itemId  = (params.get('item')  || '').trim();
  const formId  = (params.get('form')  || '').trim();
  const itemName = (params.get('name') || 'this item').trim();
  const themeName = (params.get('theme') || 'Classic').trim();
  const patternName = (params.get('pattern') || 'Standard').trim();

  const card = document.getElementById('card');

  if (window.BakeriTheme) {
    window.BakeriTheme.apply({ selected_theme: themeName, background_pattern: patternName });
  }

  // Header only — the form itself is BakeriIntakeForm's job (shared with
  // baker/index.html's storefront-takeover mode, see intake-form.js).
  fetch(SUPABASE_URL + '/rest/v1/rpc/get_baker_web_profile_by_id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify({ p_user_id: bakerId })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) { if (data && data.profile) renderHeader(data.profile); })
  .catch(function () { /* header is non-essential — the form still loads without it */ });

  window.BakeriIntakeForm.mount({
    container: card,
    supabaseUrl: SUPABASE_URL,
    anonKey: ANON_KEY,
    bakerId: bakerId,
    itemId: itemId,
    formId: formId,
    itemName: itemName,
    standalone: true
  });

  // Same treatment as baker/index.html's header image + avatar — this page
  // is reached by clicking through from the storefront, so it should still
  // look like the same store, not a bare, unbranded form.
  function renderHeader(profile) {
    const name = profile.business_name || profile.user_name || 'Baker';
    document.getElementById('shop-name').textContent = name;

    // Cache-bust storefront images with the profile's publish timestamp — see
    // the matching note in baker/index.html's assetURL.
    const stamp = profile.updated_at ? Date.parse(profile.updated_at) : 0;
    const assetURL = function (path) {
      const u = STORAGE_URL + path;
      return stamp ? u + '?v=' + stamp : u;
    };

    const link = document.getElementById('profile-link');
    link.href = profile.profile_slug
      ? 'https://bakeriapp.com/' + encodeURIComponent(profile.profile_slug)
      : 'https://bakeriapp.com/baker/index.html?id=' + encodeURIComponent(bakerId);

    const letterEl = document.getElementById('pb-avatar-letter');
    letterEl.textContent = name.charAt(0).toUpperCase();
    const avatarImg = document.createElement('img');
    avatarImg.alt = name;
    avatarImg.onload = function () { avatarImg.style.display = 'block'; letterEl.style.display = 'none'; };
    avatarImg.src = assetURL('/business-logos/' + bakerId.toUpperCase() + '/logo.jpg');
    document.getElementById('pb-avatar').appendChild(avatarImg);

    const hero = document.getElementById('profile-hero');
    const header = document.getElementById('storefront-header');
    const headerImg = document.getElementById('header-img');
    headerImg.alt = name;
    headerImg.onerror = function () { header.classList.add('hidden'); hero.classList.remove('has-photo'); };
    headerImg.onload = function () { header.classList.remove('hidden'); headerImg.style.display = 'block'; hero.classList.add('has-photo'); };
    headerImg.src = assetURL('/storefront-headers/' + bakerId.toUpperCase() + '/header.jpg');
  }
})();
</script>
</body>
</html>
