<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request a Custom Order — Bakeri</title>
  <meta name="description" content="Request a custom order from a baker on Bakeri." />
  <link rel="icon" href="../1024.png" />
  <link rel="apple-touch-icon" href="../1024.png" />
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LcIGEgtAAAAAAYXr8zyy_jJse4xc9LgjN43otQf"></script>
  <script src="theme.js"></script>

  <style>
    :root {
      /* Overwritten at runtime by theme.js from the baker/index.html link's
         theme/pattern params — these are the pre-load fallback. */
      --theme-primary:   #241712;
      --theme-bg:        #F6F1E6;
      --theme-button-fg: #FFFFFF;

      --bg:      var(--theme-bg);
      --white:   #FFFFFF;
      --ink:     #241712;
      --muted:   #948577;
      --bio:     #4A3E33;
      --chip:    #7A6C5D;
      --line:    rgba(36,23,18,0.08);
      --line-2:  rgba(36,23,18,0.14);
      --error:   #C0392B;
      --sans:    -apple-system, "SF Pro Text", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    #page { width: 100%; max-width: 560px; margin: 0 auto; padding: 32px 18px; box-sizing: border-box; }
    @media (min-width: 640px) { #page { padding: 56px 24px; } }

    .wordmark-row { text-align: center; margin-bottom: 28px; }
    .wordmark { height: 26px; width: auto; display: inline-block; }
    .grecaptcha-badge { visibility: hidden; }

    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 2px 8px rgba(36,23,18,0.06), 0 12px 32px rgba(36,23,18,0.06);
      box-sizing: border-box;
    }

    .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; color: var(--muted); text-transform: uppercase; }
    .item-name { font-size: 22px; font-weight: 800; color: var(--ink); margin-top: 6px; letter-spacing: -0.3px; }
    .lede { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

    .field-group { margin-top: 22px; }
    .field-label { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 6px; display: block; }
    .field-help { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
    .field-required { color: var(--error); }

    input[type="text"], input[type="email"], input[type="tel"], input[type="number"],
    input[type="date"], textarea {
      width: 100%; padding: 12px 14px; font-family: var(--sans); font-size: 15px;
      color: var(--ink); background: var(--bg); border: 1.5px solid transparent;
      border-radius: 12px; outline: none;
    }
    textarea { resize: vertical; min-height: 88px; }
    input:focus, textarea:focus { border-color: var(--ink); }
    input.field-error, textarea.field-error { border-color: var(--error); }

    .choice-list { display: flex; flex-direction: column; gap: 8px; }
    .choice-option {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      background: var(--bg); border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .choice-option.selected { outline: 1.5px solid var(--ink); }
    .choice-option input { margin: 0; }
    .choice-option span { font-size: 14.5px; color: var(--ink); }

    .photo-field { display: flex; flex-wrap: wrap; gap: 10px; }
    .photo-thumb { width: 72px; height: 72px; border-radius: 10px; overflow: hidden; position: relative; background: var(--bg); }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-remove {
      position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
      background: rgba(20,15,10,0.7); border: none; color: #fff; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-add {
      width: 72px; height: 72px; border-radius: 10px; border: 1.5px dashed var(--line-2);
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 22px;
    }

    .error-text { font-size: 12.5px; color: var(--error); margin-top: 6px; display: none; }
    .error-text.show { display: block; }

    .btn-submit {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 50px; margin-top: 28px;
      background: var(--theme-primary); color: var(--theme-button-fg);
      font-family: var(--sans); font-size: 15px; font-weight: 700;
      border-radius: 9999px; border: none; cursor: pointer;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-submit:active:not(:disabled) { opacity: 0.85; }

    .submit-status { margin-top: 12px; text-align: center; font-size: 13px; color: var(--error); min-height: 16px; }
    .pickup-note { margin-top: 14px; text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    .success-state { text-align: center; padding: 20px 0; }
    .success-state .icon { font-size: 40px; }
    .success-state h2 { font-size: 19px; font-weight: 800; color: var(--ink); margin-top: 12px; }
    .success-state p { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.6; }

    .not-found { text-align: center; color: var(--muted); padding: 20px 0; }
    .not-found h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--ink); }

    .footer-links { margin-top: 28px; text-align: center; font-size: 12.5px; color: var(--muted); }
    .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

    @media (prefers-color-scheme: dark) {
      :root { --theme-bg: #17110C; }
      .card { background: #241A14; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
      .wordmark { filter: invert(1); }
      .item-name, .not-found h2, .success-state h2, .field-label, .choice-option span { color: #F6F1E6; }
      input, textarea, .choice-option, .photo-thumb { background: #17110C; color: #F6F1E6; }
      .choice-option.selected { outline-color: #F6F1E6; }
    }
  </style>
</head>
<body>

<div id="page">
  <div class="wordmark-row">
    <img class="wordmark" src="../wordmark.png" alt="Bakeri" />
  </div>
  <div class="card" id="card">
    <div class="eyebrow">Loading…</div>
  </div>
  <div class="footer-links">
    <a href="https://bakeriapp.com">bakeriapp.com</a> &nbsp;·&nbsp;
    <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const RECAPTCHA_SITE_KEY = '6LcIGEgtAAAAAAYXr8zyy_jJse4xc9LgjN43otQf';
  const RECAPTCHA_ACTION   = 'submit_custom_order_inquiry';
  const MAX_PHOTOS = 5;
  const MAX_PHOTO_DIMENSION = 1200;
  const PHOTO_QUALITY = 0.75;

  const params  = new URLSearchParams(window.location.search);
  const bakerId = (params.get('baker') || '').trim();
  const itemId  = (params.get('item')  || '').trim();
  const formId  = (params.get('form')  || '').trim();
  const itemName = (params.get('name') || 'this item').trim();
  const themeName = (params.get('theme') || 'Classic').trim();
  const patternName = (params.get('pattern') || 'Standard').trim();

  const card = document.getElementById('card');

  if (!bakerId || !itemId || !formId) {
    showNotFound('Link not found', 'This custom order link appears to be invalid.');
    return;
  }

  if (window.BakeriTheme) {
    window.BakeriTheme.apply({ selected_theme: themeName, background_pattern: patternName });
  }

  document.title = 'Request a Custom Order — ' + itemName;

  fetch(SUPABASE_URL + '/rest/v1/intake_form_fields?form_id=eq.' + encodeURIComponent(formId) +
        '&select=id,position,field_type,label,help_text,is_required,options&order=position.asc', {
    headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY }
  })
  .then(function (r) { return r.json(); })
  .then(function (fields) {
    if (!Array.isArray(fields) || fields.length === 0) {
      showNotFound('Form not found', 'This baker hasn\'t set up a custom order form for this item yet.');
      return;
    }
    renderForm(fields);
  })
  .catch(function () {
    showNotFound('Something went wrong', 'Could not load this form. Please try again later.');
  });

  function showNotFound(title, subtitle) {
    card.innerHTML = '<div class="not-found"><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(subtitle) + '</p></div>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // ── Answer state ──────────────────────────────────────────────────────
  const photoState = {}; // fieldId -> [{filename, contentType, base64, previewUrl}]
  const touched = {};

  function renderForm(fields) {
    let html =
      '<div class="eyebrow">Custom Order Request</div>' +
      '<div class="item-name">' + escapeHtml(itemName) + '</div>' +
      '<div class="lede">Tell the baker what you have in mind. They\'ll follow up with a quote directly.</div>' +

      '<div class="field-group">' +
        '<label class="field-label">Your name <span class="field-required">*</span></label>' +
        '<input type="text" id="f-name" data-touch="name" />' +
        '<div class="error-text" id="err-name">Please enter your name.</div>' +
      '</div>' +
      '<div class="field-group">' +
        '<label class="field-label">Email <span class="field-required">*</span></label>' +
        '<input type="email" id="f-email" data-touch="email" />' +
        '<div class="error-text" id="err-email">Please enter a valid email address.</div>' +
      '</div>' +
      '<div class="field-group">' +
        '<label class="field-label">Phone <span class="field-required">*</span></label>' +
        '<input type="tel" id="f-phone" data-touch="phone" />' +
        '<div class="error-text" id="err-phone">Please enter a valid phone number.</div>' +
      '</div>';

    fields.forEach(function (field) {
      html += renderField(field);
    });

    html += '<button class="btn-submit" id="submit-btn">Send Request</button>' +
            '<div class="submit-status" id="submit-status"></div>' +
            '<div class="pickup-note">📍 Pickup details are provided once the baker confirms your order.</div>';

    card.innerHTML = html;

    ['name', 'email', 'phone'].forEach(function (key) {
      const input = document.getElementById('f-' + key);
      input.addEventListener('blur', function () { touched[key] = true; validateField(key, fields); });
    });

    fields.forEach(function (field) {
      if (field.field_type === 'heading') return;
      wireField(field);
    });

    document.getElementById('submit-btn').addEventListener('click', function () {
      submit(fields);
    });
  }

  function renderField(field) {
    if (field.field_type === 'heading') {
      return '<div class="field-group"><div class="item-name" style="font-size:17px;margin-top:4px;">' + escapeHtml(field.label) + '</div></div>';
    }
    const req = field.is_required ? ' <span class="field-required">*</span>' : '';
    const help = field.help_text ? '<div class="field-help">' + escapeHtml(field.help_text) + '</div>' : '';
    const id = 'field-' + field.id;

    let body = '';
    if (field.field_type === 'short_text' || field.field_type === 'number') {
      body = '<input type="' + (field.field_type === 'number' ? 'number' : 'text') + '" id="' + id + '" />';
    } else if (field.field_type === 'long_text') {
      body = '<textarea id="' + id + '"></textarea>';
    } else if (field.field_type === 'date') {
      const today = new Date().toISOString().split('T')[0];
      body = '<input type="date" id="' + id + '" min="' + today + '" />';
    } else if (field.field_type === 'single_choice' || field.field_type === 'multi_choice') {
      const inputType = field.field_type === 'single_choice' ? 'radio' : 'checkbox';
      const options = Array.isArray(field.options) ? field.options : [];
      body = '<div class="choice-list" id="' + id + '">' +
        options.map(function (opt, i) {
          return '<label class="choice-option" data-opt="' + escapeHtml(opt) + '">' +
            '<input type="' + inputType + '" name="' + id + '" value="' + escapeHtml(opt) + '" />' +
            '<span>' + escapeHtml(opt) + '</span></label>';
        }).join('') +
      '</div>';
    } else if (field.field_type === 'photo') {
      body = '<div class="photo-field" id="' + id + '">' +
        '<label class="photo-add">+<input type="file" accept="image/*" multiple style="display:none;" /></label>' +
      '</div>';
    }

    return '<div class="field-group">' +
      '<label class="field-label">' + escapeHtml(field.label) + req + '</label>' +
      body + help +
      '<div class="error-text" id="err-' + id + '">This field is required.</div>' +
    '</div>';
  }

  function wireField(field) {
    const id = 'field-' + field.id;
    if (field.field_type === 'single_choice' || field.field_type === 'multi_choice') {
      const container = document.getElementById(id);
      container.querySelectorAll('input').forEach(function (input) {
        input.addEventListener('change', function () {
          if (field.field_type === 'single_choice') {
            container.querySelectorAll('.choice-option').forEach(function (el) { el.classList.remove('selected'); });
          }
          input.closest('.choice-option').classList.toggle('selected', input.checked);
          touched[id] = true;
          validateCustomField(field);
        });
      });
    } else if (field.field_type === 'photo') {
      photoState[field.id] = [];
      const container = document.getElementById(id);
      const fileInput = container.querySelector('input[type="file"]');
      fileInput.addEventListener('change', function (e) {
        handlePhotoFiles(field, Array.from(e.target.files || []));
        fileInput.value = '';
      });
    } else {
      const input = document.getElementById(id);
      input.addEventListener('blur', function () { touched[id] = true; validateCustomField(field); });
    }
  }

  function handlePhotoFiles(field, files) {
    const remaining = MAX_PHOTOS - photoState[field.id].length;
    files.slice(0, remaining).forEach(function (file) {
      resizeImage(file, function (base64, previewUrl) {
        photoState[field.id].push({ filename: file.name, contentType: 'image/jpeg', base64: base64, previewUrl: previewUrl });
        renderPhotoThumbs(field);
      });
    });
    touched['field-' + field.id] = true;
  }

  function renderPhotoThumbs(field) {
    const container = document.getElementById('field-' + field.id);
    const photos = photoState[field.id];
    let html = photos.map(function (p, i) {
      return '<div class="photo-thumb"><img src="' + p.previewUrl + '" /><button type="button" class="photo-remove" data-idx="' + i + '">×</button></div>';
    }).join('');
    if (photos.length < MAX_PHOTOS) {
      html += '<label class="photo-add">+<input type="file" accept="image/*" multiple style="display:none;" /></label>';
    }
    container.innerHTML = html;
    container.querySelectorAll('.photo-remove').forEach(function (btn) {
      btn.addEventListener('click', function () {
        photos.splice(parseInt(btn.dataset.idx, 10), 1);
        renderPhotoThumbs(field);
      });
    });
    const fileInput = container.querySelector('input[type="file"]');
    if (fileInput) {
      fileInput.addEventListener('change', function (e) {
        handlePhotoFiles(field, Array.from(e.target.files || []));
        fileInput.value = '';
      });
    }
    validateCustomField(field);
  }

  function resizeImage(file, cb) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        if (w > MAX_PHOTO_DIMENSION || h > MAX_PHOTO_DIMENSION) {
          const scale = MAX_PHOTO_DIMENSION / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);
        cb(dataUrl.split(',')[1], dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── Validation ───────────────────────────────────────────────────────
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const PHONE_RE = /^[0-9+()\-.\s]{7,20}$/;

  function validateField(key) {
    if (!touched[key]) return true;
    let ok = true;
    const el = document.getElementById('f-' + key);
    const err = document.getElementById('err-' + key);
    if (key === 'name') ok = el.value.trim().length > 0;
    if (key === 'email') ok = EMAIL_RE.test(el.value.trim());
    if (key === 'phone') ok = PHONE_RE.test(el.value.trim());
    err.classList.toggle('show', !ok);
    el.classList.toggle('field-error', !ok);
    return ok;
  }

  function fieldIsBlank(field) {
    const id = 'field-' + field.id;
    if (field.field_type === 'single_choice' || field.field_type === 'multi_choice') {
      const container = document.getElementById(id);
      return container.querySelectorAll('input:checked').length === 0;
    }
    if (field.field_type === 'photo') {
      return (photoState[field.id] || []).length === 0;
    }
    const el = document.getElementById(id);
    return !el || el.value.trim() === '';
  }

  function validateCustomField(field) {
    const id = 'field-' + field.id;
    if (!touched[id]) return true;
    const ok = field.field_type === 'heading' || !field.is_required || !fieldIsBlank(field);
    const err = document.getElementById('err-' + id);
    if (err) err.classList.toggle('show', !ok);
    return ok;
  }

  function submit(fields) {
    ['name', 'email', 'phone'].forEach(function (k) { touched[k] = true; });
    fields.forEach(function (f) { if (f.field_type !== 'heading') touched['field-' + f.id] = true; });

    let valid = true;
    ['name', 'email', 'phone'].forEach(function (k) { if (!validateField(k)) valid = false; });
    fields.forEach(function (f) { if (f.field_type !== 'heading' && !validateCustomField(f)) valid = false; });

    if (!valid) return;

    const submitBtn = document.getElementById('submit-btn');
    const status = document.getElementById('submit-status');
    submitBtn.disabled = true;
    status.textContent = '';
    status.style.color = '';

    const answers = fields.filter(function (f) { return f.field_type !== 'heading'; }).map(function (field) {
      const id = 'field-' + field.id;
      if (field.field_type === 'single_choice' || field.field_type === 'multi_choice') {
        const container = document.getElementById(id);
        const values = Array.from(container.querySelectorAll('input:checked')).map(function (i) { return i.value; });
        return { fieldID: field.id, label: field.label, fieldType: field.field_type, choiceValues: values };
      }
      if (field.field_type === 'photo') {
        const photos = (photoState[field.id] || []).map(function (p) {
          return { filename: p.filename, contentType: p.contentType, base64: p.base64 };
        });
        return { fieldID: field.id, label: field.label, fieldType: field.field_type, photos: photos };
      }
      return { fieldID: field.id, label: field.label, fieldType: field.field_type, textValue: document.getElementById(id).value.trim() };
    });

    getRecaptchaToken().then(function (token) {
      return fetch(SUPABASE_URL + '/functions/v1/submit-custom-order-inquiry', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + ANON_KEY
        },
        body: JSON.stringify({
          baker_id: bakerId,
          menu_item_id: itemId,
          customer_name: document.getElementById('f-name').value.trim(),
          customer_email: document.getElementById('f-email').value.trim(),
          customer_phone: document.getElementById('f-phone').value.trim(),
          answers: answers,
          recaptcha_token: token
        })
      });
    })
    .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
    .then(function (result) {
      if (result.ok && result.data && result.data.ok) {
        showSuccess();
      } else {
        submitBtn.disabled = false;
        status.textContent = (result.data && result.data.error) || 'Something went wrong. Please try again.';
      }
    })
    .catch(function () {
      submitBtn.disabled = false;
      status.textContent = 'Something went wrong. Please check your connection and try again.';
    });
  }

  function getRecaptchaToken() {
    return new Promise(function (resolve, reject) {
      if (typeof grecaptcha === 'undefined') { reject(new Error('reCAPTCHA did not load')); return; }
      grecaptcha.enterprise.ready(function () {
        grecaptcha.enterprise.execute(RECAPTCHA_SITE_KEY, { action: RECAPTCHA_ACTION }).then(resolve, reject);
      });
    });
  }

  function showSuccess() {
    card.innerHTML =
      '<div class="success-state">' +
        '<div class="icon">🎉</div>' +
        '<h2>Request sent!</h2>' +
        '<p>' + escapeHtml(itemName) + ' — the baker will follow up with you by email or phone with a quote.</p>' +
      '</div>';
  }
})();
</script>
</body>
</html>
