<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Bakeri</title>
  <meta name="description" content="Buy directly from a baker on Bakeri." />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="https://js.stripe.com/v3/"></script>
  <script src="theme.js"></script>

  <style>
    :root {
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-button-fg: #FFFFFF;

      --bg:        var(--theme-bg);
      --accent:    var(--theme-primary);
      --accent-fg: var(--theme-button-fg);

      --ink:       #241712;
      --muted:     #948577;
      --bio:       #4A3E33;
      --line:      rgba(36,23,18,0.08);
      --error:     #C0392B;

      --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --theme-bg: #17110C; --ink: #F6F1E6; --bio: #E4D9C8; --muted: #A69B8C; --line: rgba(246,241,230,0.10); }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--bio); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    button, input { font-family: inherit; }

    #page { width: 100%; max-width: 480px; margin: 0 auto; padding: 28px 20px 60px; box-sizing: border-box; }
    @media (min-width: 640px) { #page { padding: 48px 24px 60px; } }

    /* An opaque card, not bare text floating on the page — the storefront's
       background pattern can be a bold, full-saturation Stripes/Gingham for
       some themes (not a pale wash), so text with nothing behind it but the
       pattern read as illegible. */
    #content {
      background: var(--bg);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 14px 34px -16px rgba(0,0,0,.3);
    }

    .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); }
    .heading { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 4px; }

    .order-line { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .order-line .n { font-size: 14.5px; font-weight: 600; color: var(--ink); }
    .order-line .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .order-line .p { font-size: 14.5px; font-weight: 600; color: var(--ink); flex-shrink: 0; font-variant-numeric: tabular-nums; }

    .totals-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--bio); font-variant-numeric: tabular-nums; }
    .totals-row.grand { font-weight: 700; color: var(--ink); font-size: 17px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }

    #payment-element { margin-top: 20px; }

    .multi-charge-notice { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: rgba(148,133,119,0.1); border: 1px solid var(--line); }
    .multi-charge-notice .title { font-size: 13px; font-weight: 700; color: var(--ink); }
    .multi-charge-notice .desc { font-size: 12.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
    .multi-charge-notice ol { margin: 10px 0 0; padding-left: 18px; }
    .multi-charge-notice li { font-size: 12.5px; color: var(--bio); padding: 3px 0; line-height: 1.4; }
    .multi-charge-notice li b { color: var(--ink); }

    .btn-primary {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 52px; margin-top: 22px;
      background: var(--accent); color: var(--accent-fg);
      font-size: 15px; font-weight: 700;
      border-radius: 9999px; border: none; cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .submit-status { margin-top: 12px; text-align: center; font-size: 13px; color: var(--error); min-height: 16px; }
    .pickup-note { margin-top: 16px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }

    .success-state { text-align: center; padding: 10px 0 6px; }
    .success-state h2 { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 16px; }
    .success-state p { font-size: 14px; color: var(--bio); margin-top: 10px; line-height: 1.6; max-width: 340px; margin-left: auto; margin-right: auto; }
    .btn-download {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 52px; margin-top: 12px;
      background: #3FA672; color: #fff; text-decoration: none;
      font-size: 15px; font-weight: 700; border-radius: 9999px;
    }

    /* Receipt sections — same "Billing and Payment" card shape as
       pay-quote.html's post-payment view, so a guest sees the same
       polished receipt style regardless of which checkout page they paid
       through. */
    .section-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-top: 24px; margin-bottom: 4px; text-align: left; }
    .receipt-card { background: rgba(148,133,119,0.08); border-radius: 10px; overflow: hidden; margin-top: 10px; text-align: left; }
    .receipt-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 11px 16px; font-size: 13.5px; border-top: 1px solid var(--line); }
    .receipt-row:first-child { border-top: none; }
    .receipt-row .n { font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .receipt-row .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .receipt-row .label { color: var(--muted); }
    .receipt-row .value, .receipt-row .p { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .receipt-row.total { font-weight: 700; }
    .receipt-row.total .label, .receipt-row.total .value { font-weight: 700; color: var(--ink); }

    .not-found { text-align: center; color: var(--muted); padding: 40px 0; }
    .not-found h2 { font-size: 18px; margin-bottom: 8px; color: var(--ink); }
    .not-found button {
      margin-top: 16px; border: 1.5px solid var(--line); background: none; color: var(--ink);
      border-radius: 9999px; padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    .footer-links { margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); }
    .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>

<div id="page">
  <div id="content"><div class="eyebrow">Loading…</div></div>
  <div class="footer-links">
    <a href="https://bakeriapp.com">bakeriapp.com</a> · <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STRIPE_PK  = 'pk_live_51TdqbXRpI8DhqX3Ful2hqNWdNtdd4Rt0QQC6IZVhxA5Du89YIEo1638vSaJmBmk5XqRbfxcbqiYJCsMJgpRWvzoP00NUFyirgh';

  // Common shipping destinations for a small home bakery, US/Canada first
  // since that's the overwhelming majority, rest alphabetical. No pre-selected
  // value — the baker's own country was previously (wrongly) hardcoded here,
  // see the "Don't pre-fill guest checkout's shipping country as Canada" fix.
  const COUNTRIES = [
    'United States', 'Canada',
    'Australia', 'Austria', 'Belgium', 'Brazil', 'Denmark', 'Finland', 'France',
    'Germany', 'Ireland', 'Italy', 'Japan', 'Mexico', 'Netherlands', 'New Zealand',
    'Norway', 'Poland', 'Portugal', 'Singapore', 'South Korea', 'Spain', 'Sweden',
    'Switzerland', 'United Arab Emirates', 'United Kingdom'
  ];
  function countrySelectHtml(id, style) {
    return '<select id="' + id + '" autocomplete="country" style="' + style + '">' +
      '<option value="" disabled selected>Select country</option>' +
      COUNTRIES.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') +
      '</select>';
  }

  const params = new URLSearchParams(window.location.search);
  const content = document.getElementById('content');

  let cart = null;
  try { cart = JSON.parse(sessionStorage.getItem('bakeri_checkout_cart') || 'null'); } catch (e) { cart = null; }

  // Any of the three verticals (pickup, digital, ship) is enough to land
  // here — a digital+ship-only cart (no pickup lines) reaches checkout.html
  // whenever more than one non-pickup vertical is present at once (see
  // baker/index.html's goToCheckout dispatch), same as a pickup-only cart.
  // cart itself may be null (missing/corrupt sessionStorage) — checked first
  // so the vertical checks below never dereference a null cart.
  const hasAnyItems = Boolean(cart) && (
    (Array.isArray(cart.items) && cart.items.length > 0) ||
    (Array.isArray(cart.digitalItems) && cart.digitalItems.length > 0) ||
    (Array.isArray(cart.shipItems) && cart.shipItems.length > 0)
  );
  if (!cart || !cart.baker || !hasAnyItems) {
    showNotFound();
    return;
  }
  if (!Array.isArray(cart.items)) cart.items = [];

  if (window.BakeriTheme) {
    window.BakeriTheme.apply({ selected_theme: cart.theme || params.get('theme') || 'Classic', background_pattern: cart.pattern || params.get('pattern') || 'Standard' });
  }

  document.title = 'Checkout — Bakeri';

  // ── Tax — mirrors create-guest-marketplace-order/index.ts exactly, so the
  // total shown here matches what the server actually charges. ──
  function taxRateForProvince(p) {
    switch ((p || '').toUpperCase().trim()) {
      case 'ON': return 0.13;
      case 'NB': case 'NL': case 'PE': return 0.15;
      case 'NS': return 0.14;
      case 'QC': return 0.14975;
      default: return 0.05;
    }
  }
  function isSingleServing(taxCategory, unitWeightGrams) {
    if (taxCategory !== 'sweetened_single_serving') return false;
    if (unitWeightGrams != null) return unitWeightGrams <= 230;
    return true;
  }
  function calcTaxCents(items) {
    if (cart.gstRegistered !== '1') return 0;
    const rate = taxRateForProvince(cart.province);
    const totalSingleServings = items.filter(function (i) { return isSingleServing(i.taxCategory, i.unitWeightGrams); })
      .reduce(function (s, i) { return s + i.qty; }, 0);
    let taxableSubtotal = 0;
    items.forEach(function (item) {
      if (item.taxCategory === 'plain_bread' || item.taxCategory === 'whole_item') return;
      if (isSingleServing(item.taxCategory, item.unitWeightGrams) && totalSingleServings < 6) {
        taxableSubtotal += item.price * item.qty;
      }
    });
    return Math.round(taxableSubtotal * rate * 100);
  }

  // Guest checkout: the customer pays exactly the item subtotal + tax —
  // Bakeri's service charge comes out of the baker's side instead (see
  // create-payment-intent), so it's never added here.
  const subtotal = cart.items.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
  const taxCents = calcTaxCents(cart.items);
  const total = subtotal + taxCents / 100;

  // A mixed cart (pickup items + digital downloads/shipping, see
  // baker/index.html's digitalCart) settles as up to two separate Stripe
  // charges — a pickup item's authorize-then-capture-on-accept can't share a
  // PaymentIntent with digital/physical's instant capture. Digital and
  // physical/shipping items, though, are both instant-capture with no baker-
  // accept step, so as of 2026-08-24 they're no longer two charges of their
  // own — they settle together as ONE combined "instant" leg (one
  // PaymentIntent, one pay screen, one finalize call — see goToInstantLeg/
  // finalize-guest-digital-physical-order), running after the pickup leg if
  // one exists. legTotalCount below is at most 2 (pickup, then instant), not 3.
  const digitalItems = Array.isArray(cart.digitalItems) ? cart.digitalItems : [];
  const digitalSubtotal = digitalItems.reduce(function (s, i) { return s + i.price; }, 0);

  // Needs a shipping address, which nothing before this page collects
  // (renderShipAddressForm gathers it right before the instant leg's
  // PaymentIntent, whether or not digital items are also in that leg).
  const shipItems = Array.isArray(cart.shipItems) ? cart.shipItems : [];
  const shipItemsSubtotal = shipItems.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
  const shipShippingFeeTotal = shipItems.reduce(function (s, i) { return s + (i.shippingFee || 0); }, 0);
  const shipSubtotal = shipItemsSubtotal + shipShippingFeeTotal;

  const hasInstantLeg = digitalItems.length > 0 || shipItems.length > 0;
  const instantSubtotal = digitalSubtotal + shipSubtotal;

  const grandTotal = total + digitalSubtotal + shipSubtotal;
  let physicalResult = null;
  let digitalResult = null;
  let digitalError = null;
  let shipResult = null;
  let shipError = null;
  let shipAddress = null;

  // How many separate Stripe charges this checkout will actually run (see
  // the comment above digitalItems for why pickup can't join the instant
  // leg). Surfaced up front in renderSummary so a mixed cart never looks
  // like an unexplained second charge, and as a "Step X of Y" label on each
  // leg's own pay screen so the buyer knows there's more to finish (and what
  // happens if they stop early).
  const legTotalCount = (cart.items.length > 0 ? 1 : 0) + (hasInstantLeg ? 1 : 0);
  let legStepIndex = 0;
  function nextLegStep() { legStepIndex += 1; return legStepIndex; }
  function legStepLabel() { return legTotalCount > 1 ? 'Step ' + legStepIndex + ' of ' + legTotalCount + ' · ' : ''; }

  renderSummary();

  function renderSummary() {
    const lines = cart.items.map(function (i) {
      const meta = i.isAssortedBox
        ? (i.variants || []).map(function (v) { return v.qty + '× ' + v.name; }).join(', ')
        : i.qty + ' × $' + i.price.toFixed(2);
      return '<div class="order-line">' +
        '<div><div class="n">' + escapeHtml(i.name) + '</div><div class="m">' + escapeHtml(meta) + '</div></div>' +
        '<div class="p">$' + (i.price * i.qty).toFixed(2) + '</div>' +
        '</div>';
    }).join('');
    const digitalLines = digitalItems.map(function (i) {
      return '<div class="order-line"><div><div class="n">' + escapeHtml(i.name) + '</div><div class="m">Instant digital download</div></div>' +
        '<div class="p">$' + i.price.toFixed(2) + '</div></div>';
    }).join('');
    const shipLines = shipItems.map(function (i) {
      return '<div class="order-line"><div><div class="n">' + escapeHtml(i.name) + '</div><div class="m">' + i.qty + ' × $' + i.price.toFixed(2) + ' · ships in ' + (i.leadDays || 3) + ' day' + (i.leadDays === 1 ? '' : 's') + '</div></div>' +
        '<div class="p">$' + (i.price * i.qty).toFixed(2) + '</div></div>';
    }).join('');

    content.innerHTML =
      '<div class="eyebrow">Your Order</div>' +
      '<div class="heading">Checkout</div>' +
      renderMultiChargeNotice() +
      lines +
      (cart.items.length > 0 ? (
        '<div class="totals-row"><span>Subtotal</span><span>$' + subtotal.toFixed(2) + '</span></div>' +
        (taxCents > 0 ? '<div class="totals-row"><span>Tax</span><span>$' + (taxCents / 100).toFixed(2) + '</span></div>' : '')
      ) : '') +
      (digitalItems.length > 0 ? (
        '<div class="eyebrow" style="margin-top:14px;">Digital Downloads</div>' +
        digitalLines +
        '<div class="totals-row"><span>Downloads subtotal</span><span>$' + digitalSubtotal.toFixed(2) + '</span></div>'
      ) : '') +
      (shipItems.length > 0 ? (
        '<div class="eyebrow" style="margin-top:14px;">Ships to You</div>' +
        shipLines +
        '<div class="totals-row"><span>Items subtotal</span><span>$' + shipItemsSubtotal.toFixed(2) + '</span></div>' +
        (shipShippingFeeTotal > 0 ? '<div class="totals-row"><span>Shipping fee</span><span>$' + shipShippingFeeTotal.toFixed(2) + '</span></div>' : '')
      ) : '') +
      '<div class="totals-row grand"><span>Total</span><span>$' + grandTotal.toFixed(2) + '</span></div>' +
      '<button class="btn-primary" id="continue-btn">' + (legTotalCount > 1 ? 'Continue to Payment · Step 1 of ' + legTotalCount : 'Continue to Payment') + '</button>' +
      '<div class="submit-status" id="submit-status"></div>' +
      '<div class="pickup-note">' +
        (cart.items.length > 0 ? '📍 Exact pickup address is provided by email once your order is confirmed.' : '') +
        (shipItems.length > 0 ? ' You\'ll enter a shipping address on the shipping payment step.' : '') +
      '</div>';

    document.getElementById('continue-btn').addEventListener('click', startCheckout);
  }

  // A mixed cart settles as multiple back-to-back Stripe charges (see the
  // legTotalCount comment above) — without warning, a buyer sees a second
  // (or third) unexplained "Pay" screen right after they thought they were
  // done, which reads as broken and is exactly the kind of moment where
  // someone abandons partway through, leaving part of their order unpaid.
  // This spells out up front how many charges there are and what each pays
  // for, before they commit to starting.
  function renderMultiChargeNotice() {
    if (legTotalCount <= 1) return '';
    const steps = [];
    if (cart.items.length > 0) steps.push('<b>Pickup items</b> — $' + total.toFixed(2) + ', authorized now and charged once the baker confirms your order');
    if (digitalItems.length > 0 && shipItems.length > 0) {
      steps.push('<b>Digital downloads &amp; shipping items</b> — $' + instantSubtotal.toFixed(2) + ', charged right away in one payment — your download link arrives instantly, and shipped items go out separately after you enter a shipping address');
    } else if (digitalItems.length > 0) {
      steps.push('<b>Digital downloads</b> — $' + digitalSubtotal.toFixed(2) + ', charged right away and delivered instantly');
    } else if (shipItems.length > 0) {
      steps.push('<b>Shipping items</b> — $' + shipSubtotal.toFixed(2) + ', charged right away after you enter a shipping address');
    }
    return '<div class="multi-charge-notice">' +
      '<div class="title">This order is ' + legTotalCount + ' separate charges</div>' +
      '<div class="desc">Your card is charged once per step below, one after another — not all at once, and not as one combined charge. Please complete every step in the same visit: if you stop partway, only the completed charges go through and the rest of your order won\'t be placed.</div>' +
      '<ol>' + steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
    '</div>';
  }

  // Dispatches to whichever leg actually has items — a cart can reach this
  // page with the pickup leg empty (e.g. digital + ship only, no pickup
  // lines; see baker/index.html's goToCheckout), so this can't just always
  // start with goToPayment.
  function startCheckout() {
    if (cart.items.length > 0) { goToPayment(); }
    else if (hasInstantLeg) { goToInstantLeg(); }
  }

  // Pickup's finalize call ends by handing off to the instant leg (digital
  // and/or ship, now one combined leg — see hasInstantLeg above), or straight
  // to the combined success screen if there's nothing else to pay for.
  function afterPickupLeg() {
    if (hasInstantLeg) { goToInstantLeg(); }
    else { renderSuccess(); }
  }

  function goToPayment() {
    nextLegStep();
    const btn = document.getElementById('continue-btn');
    const status = document.getElementById('submit-status');
    btn.disabled = true;
    status.textContent = '';

    fetch(SUPABASE_URL + '/functions/v1/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        items: cart.items.map(function (i) {
          return {
            listing_id: i.id, baker_id: cart.baker, name: i.name, quantity: i.qty,
            price_from: i.price, listing_kind: i.listingKind, pickup_date: i.dropDate || null
          };
        }),
        currency: 'cad',
        tax_amount_cents: taxCents
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error || !data.client_secret) {
        status.textContent = data.error || 'Something went wrong. Please try again.';
        btn.disabled = false;
        return;
      }
      renderPayment(data.client_secret, data.amount_cents, data.platform_fee_cents, data.stripe_connect_account_id);
    })
    .catch(function () {
      status.textContent = 'Something went wrong. Please check your connection and try again.';
      btn.disabled = false;
    });
  }

  function renderPayment(clientSecret, amountCents, platformFeeCentsActual, connectedAccountId) {
    // Authoritative charge amount from create-payment-intent — not the
    // pre-flight estimate computed above — so what's shown here always
    // matches exactly what Stripe actually charges.
    const payTotal = (typeof amountCents === 'number' ? amountCents : Math.round(total * 100)) / 100;

    content.innerHTML =
      '<div class="eyebrow">' + legStepLabel() + 'Pay' + '</div>' +
      '<div class="heading">$' + payTotal.toFixed(2) + '</div>' +
      (legTotalCount > 1 ? '<p style="color:var(--muted);font-size:13px;margin-top:6px;">' + (legTotalCount - legStepIndex) + ' more charge' + (legTotalCount - legStepIndex === 1 ? '' : 's') + ' to go after this one to finish your order.</p>' : '') +
      '<div id="payment-element"></div>' +
      '<button class="btn-primary" id="pay-btn">Pay $' + payTotal.toFixed(2) + '</button>' +
      '<div class="submit-status" id="submit-status"></div>' +
      '<div class="pickup-note">📍 Exact pickup address is provided by email once your order is confirmed.</div>';

    // A direct charge's PaymentIntent lives on the baker's own connected
    // account — Stripe.js must be told that account to confirm against it.
    const stripe = connectedAccountId ? Stripe(STRIPE_PK, { stripeAccount: connectedAccountId }) : Stripe(STRIPE_PK);
    const elements = stripe.elements({ clientSecret: clientSecret });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    document.getElementById('pay-btn').addEventListener('click', function () {
      const btn = document.getElementById('pay-btn');
      const status = document.getElementById('submit-status');
      btn.disabled = true;
      status.textContent = '';

      stripe.confirmPayment({ elements: elements, redirect: 'if_required' }).then(function (result) {
        if (result.error) {
          status.textContent = result.error.message || 'Payment failed. Please try again.';
          btn.disabled = false;
          return;
        }
        const intent = result.paymentIntent;
        // 'requires_capture' = card authorized and held, not yet charged — the
        // expected outcome for a regular manual-capture hold; 'succeeded'
        // still covers deposit orders, which capture right away.
        if (!intent || (intent.status !== 'succeeded' && intent.status !== 'requires_capture')) {
          status.textContent = 'Payment did not complete. Please try again.';
          btn.disabled = false;
          return;
        }
        finalizeOrder(intent.id);
      });
    });
  }

  function finalizeOrder(paymentIntentId) {
    return fetch(SUPABASE_URL + '/functions/v1/create-guest-marketplace-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        payment_intent_id: paymentIntentId,
        baker_id: cart.baker,
        items: cart.items.map(function (i) {
          if (i.isAssortedBox) {
            return {
              menu_item_id: i.id, quantity: i.qty, tier_id: i.tierId,
              variant_selections: (i.variants || []).map(function (v) { return { variant_id: v.variantId, quantity: v.qty }; })
            };
          }
          return { menu_item_id: i.id, quantity: i.qty, chosenPreorderDate: i.chosenPreorderDate || '' };
        }),
        customer_name: cart.customer.name,
        customer_email: cart.customer.email,
        customer_phone: cart.customer.phone
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) {
        const status = document.getElementById('submit-status');
        if (status) status.textContent = 'Payment succeeded but we had trouble recording your order — contact the baker with this reference: ' + paymentIntentId;
        return;
      }
      physicalResult = data;
      // "Payment received" email now fires server-side (the DB trigger on the
      // orders INSERT), not from here — that survives the tab closing before
      // this script finishes, which a fire-and-forget fetch() did not.
      sessionStorage.removeItem('bakeri_checkout_cart');
      // A mixed cart's pickup order is safely recorded at this point no
      // matter what happens next — the digital/ship legs are independent
      // charges (see comment above renderSummary), so their own failure
      // paths (auto-refund) never touch this.
      afterPickupLeg();
    });
  }

  // ── Instant leg of a mixed cart — digital downloads and/or shipping
  // items. Both capture instantly with no baker-accept step (unlike pickup,
  // whose authorize-then-capture-on-accept hold can't share a PaymentIntent
  // with either), so as of 2026-08-24 they're merged into ONE combined
  // PaymentIntent/pay screen/finalize call instead of two sequential ones —
  // see create-payment-intent's isInstantCaptureCart and
  // finalize-guest-digital-physical-order. Runs after the pickup leg if one
  // exists. If shipping items are present, an address is collected first
  // (nothing earlier in this flow gathers one — the pickup step only asks
  // for name/phone/email). ──
  function goToInstantLeg() {
    nextLegStep();
    if (shipItems.length > 0) { renderShipAddressForm(); }
    else { createInstantPaymentIntent(); }
  }

  function renderShipAddressForm() {
    content.innerHTML =
      '<div class="eyebrow">' + legStepLabel() + 'Ships to You</div>' +
      '<div class="heading">Shipping address</div>' +
      '<p style="color:var(--muted);font-size:13px;margin-top:6px;">' +
        (physicalResult ? 'Your pickup order is confirmed — j' : 'J') +
        'ust need an address for the item' + (shipItems.length > 1 ? 's' : '') + ' that ship' +
        (digitalItems.length > 0 ? ' — your digital download' + (digitalItems.length > 1 ? 's are' : ' is') + ' part of this same payment.' : '.') +
      '</p>' +
      '<div class="field" style="margin-top:16px;"><label style="font-size:12px;color:var(--muted);">Name</label>' +
        '<input id="ship-name" type="text" autocomplete="name" style="width:100%;height:44px;margin-top:4px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;" /></div>' +
      '<div class="field" style="margin-top:10px;"><label style="font-size:12px;color:var(--muted);">Address line 1</label>' +
        '<input id="ship-line1" type="text" autocomplete="address-line1" style="width:100%;height:44px;margin-top:4px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;" /></div>' +
      '<div class="field" style="margin-top:10px;"><label style="font-size:12px;color:var(--muted);">Address line 2 (optional)</label>' +
        '<input id="ship-line2" type="text" autocomplete="address-line2" style="width:100%;height:44px;margin-top:4px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;" /></div>' +
      '<div style="display:flex;gap:10px;margin-top:10px;">' +
        '<div class="field" style="flex:2;"><label style="font-size:12px;color:var(--muted);">City</label>' +
          '<input id="ship-city" type="text" autocomplete="address-level2" style="width:100%;height:44px;margin-top:4px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;" /></div>' +
        '<div class="field" style="flex:1;"><label style="font-size:12px;color:var(--muted);">Province</label>' +
          '<input id="ship-province" type="text" autocomplete="address-level1" style="width:100%;height:44px;margin-top:4px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;" /></div>' +
      '</div>' +
      '<div style="display:flex;gap:10px;margin-top:10px;">' +
        '<div class="field" style="flex:1;"><label style="font-size:12px;color:var(--muted);">Postal code</label>' +
          '<input id="ship-postal" type="text" autocomplete="postal-code" style="width:100%;height:44px;margin-top:4px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;" /></div>' +
        '<div class="field" style="flex:1;"><label style="font-size:12px;color:var(--muted);">Country</label>' +
          countrySelectHtml('ship-country', 'width:100%;height:44px;margin-top:4px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;') + '</div>' +
      '</div>' +
      '<button class="btn-primary" id="ship-address-continue">Continue to Payment</button>' +
      '<div class="submit-status" id="submit-status"></div>';

    document.getElementById('ship-address-continue').addEventListener('click', function () {
      const status = document.getElementById('submit-status');
      const name = document.getElementById('ship-name').value.trim();
      const line1 = document.getElementById('ship-line1').value.trim();
      const city = document.getElementById('ship-city').value.trim();
      const province = document.getElementById('ship-province').value.trim();
      const postal = document.getElementById('ship-postal').value.trim();
      const country = document.getElementById('ship-country').value.trim();
      if (!name || !line1 || !city || !province || !postal || !country) {
        status.textContent = 'Please fill in the full shipping address.';
        return;
      }
      shipAddress = {
        name: name, line1: line1,
        line2: document.getElementById('ship-line2').value.trim(),
        city: city, province: province, postal_code: postal, country: country
      };
      createInstantPaymentIntent();
    });
  }

  // One PaymentIntent covering whichever of digitalItems/shipItems are
  // present — create-payment-intent validates each item against its own
  // kind's rules internally (see hasDigital/hasPhysical there) and captures
  // automatically since neither kind needs a baker-accept step.
  function createInstantPaymentIntent() {
    const btn = document.getElementById('ship-address-continue');
    const status = document.getElementById('submit-status');
    if (btn) btn.disabled = true;
    if (status) status.textContent = '';

    const items = digitalItems.map(function (i) {
      return { listing_id: i.id, baker_id: cart.baker, name: i.name, quantity: 1, price_from: i.price, listing_kind: 'digital', variant_id: i.variantId || null };
    }).concat(shipItems.map(function (i) {
      return { listing_id: i.id, baker_id: cart.baker, name: i.name, quantity: i.qty, price_from: i.price, listing_kind: 'physical', variant_id: i.variantId || null };
    }));

    fetch(SUPABASE_URL + '/functions/v1/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        items: items,
        currency: 'cad',
        shipping_fee_cents: Math.round(shipShippingFeeTotal * 100)
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error || !data.client_secret) {
        if (digitalItems.length > 0) digitalError = data.error || 'Something went wrong charging for your order. Please contact the baker.';
        if (shipItems.length > 0) shipError = data.error || 'Something went wrong charging for your order. Please contact the baker.';
        renderSuccess();
        return;
      }
      renderInstantPayment(data.client_secret, data.stripe_connect_account_id);
    })
    .catch(function () {
      if (digitalItems.length > 0) digitalError = 'Something went wrong charging for your order. Please contact the baker.';
      if (shipItems.length > 0) shipError = 'Something went wrong charging for your order. Please contact the baker.';
      renderSuccess();
    });
  }

  function renderInstantPayment(clientSecret, connectedAccountId) {
    const bothKinds = digitalItems.length > 0 && shipItems.length > 0;
    content.innerHTML =
      '<div class="eyebrow">' + legStepLabel() + (bothKinds ? 'Pay · Downloads & Shipping' : digitalItems.length > 0 ? 'Pay · Digital Downloads' : 'Pay · Ships to You') + '</div>' +
      '<div class="heading">$' + instantSubtotal.toFixed(2) + '</div>' +
      (physicalResult ? '<p style="color:var(--muted);font-size:13px;margin-top:6px;">Your pickup order is confirmed — this is the last charge to finish your order.</p>' :
        legTotalCount > 1 ? '<p style="color:var(--muted);font-size:13px;margin-top:6px;">This is the last charge to finish your order.</p>' : '') +
      (bothKinds ? '<p style="color:var(--muted);font-size:13px;margin-top:6px;">One payment covers both — your download link arrives instantly, and the shipped item' + (shipItems.length > 1 ? 's ship' : ' ships') + ' separately.</p>' : '') +
      '<div id="payment-element"></div>' +
      '<button class="btn-primary" id="pay-btn">Pay $' + instantSubtotal.toFixed(2) + '</button>' +
      '<div class="submit-status" id="submit-status"></div>';

    const stripe = connectedAccountId ? Stripe(STRIPE_PK, { stripeAccount: connectedAccountId }) : Stripe(STRIPE_PK);
    const elements = stripe.elements({ clientSecret: clientSecret });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    document.getElementById('pay-btn').addEventListener('click', function () {
      const btn = document.getElementById('pay-btn');
      const status = document.getElementById('submit-status');
      btn.disabled = true;
      status.textContent = '';

      stripe.confirmPayment({ elements: elements, redirect: 'if_required' }).then(function (result) {
        if (result.error) {
          status.textContent = result.error.message || 'Payment failed. Please try again.';
          btn.disabled = false;
          return;
        }
        const intent = result.paymentIntent;
        if (!intent || intent.status !== 'succeeded') {
          status.textContent = 'Payment did not complete. Please try again.';
          btn.disabled = false;
          return;
        }
        finalizeInstantOrder(intent.id);
      });
    });
  }

  function finalizeInstantOrder(paymentIntentId) {
    fetch(SUPABASE_URL + '/functions/v1/finalize-guest-digital-physical-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({
        payment_intent_id: paymentIntentId,
        digital_items: digitalItems.map(function (i) { return { id: i.id, variant_id: i.variantId || null }; }),
        physical_items: shipItems.map(function (i) { return { menu_item_id: i.id, quantity: i.qty, variant_id: i.variantId || null }; }),
        customer_name: cart.customer.name,
        customer_email: cart.customer.email,
        shipping_address: shipAddress
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) {
        // finalize-guest-digital-physical-order already auto-refunded the
        // whole charge if it could — its message says so. The pickup order,
        // if any, is unaffected either way.
        if (digitalItems.length > 0) digitalError = data.error;
        if (shipItems.length > 0) shipError = data.error;
        renderSuccess();
        return;
      }
      if (digitalItems.length > 0) digitalResult = data;
      if (shipItems.length > 0) shipResult = data;
      if (data.downloads && data.downloads.length > 0) {
        fetch(SUPABASE_URL + '/functions/v1/send-guest-digital-delivery-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
          body: JSON.stringify({ order_id: data.digital_order_id, downloads: data.downloads })
        }).catch(function () {});
      }
      renderSuccess();
    });
  }

  function renderSuccess() {
    // Stops the bfcache-restore reload in theme.js from throwing this
    // completed state away — otherwise clicking a download link then
    // pressing Back reloads the page back to a payable state. Also clears
    // whatever's left of the cart: finalizeOrder() only did this for the
    // pickup leg, so a digital- or ship-only checkout left the cart sitting
    // in sessionStorage, ready to render "Continue to Payment" again for an
    // order that's already fully paid for.
    document.body.setAttribute('data-bakeri-no-reload', '1');
    sessionStorage.removeItem('bakeri_checkout_cart');

    // Every block below can be either a receipt (its charge succeeded) or a
    // failure notice (charge or finalize failed) — never a green checkmark
    // next to red "failed" text, which is what a single fixed icon used to
    // produce whenever a later leg failed after an earlier one succeeded.
    const bakerName = (physicalResult && physicalResult.baker_name) || (digitalResult && digitalResult.baker_name) || null;

    const pickupBlock = physicalResult ? (
      '<h2>Order confirmed</h2>' +
      '<p>' + escapeHtml(physicalResult.baker_name || 'The baker') + ' is reviewing your order. You\'ll get an email as soon as it\'s confirmed, with your pickup details.</p>' +
      '<div class="section-title">Your Order</div>' +
      '<div class="receipt-card">' +
        (physicalResult.items || []).map(function (i) {
          // i.name already includes " — {tier label}" for box lines (set server-side).
          const breakdown = (i.variant_breakdown || []).map(function (v) { return v.quantity + '× ' + v.name; }).join(', ');
          return '<div class="receipt-row">' +
            '<div><div class="n">' + i.quantity + '× ' + escapeHtml(i.name) + '</div>' +
            (breakdown ? '<div class="m">' + escapeHtml(breakdown) + '</div>' : '') + '</div>' +
            '<span class="p">$' + (i.price_per_unit * i.quantity).toFixed(2) + '</span></div>';
        }).join('') +
        '<div class="receipt-row total"><span class="label">Total</span><span class="value">$' + (physicalResult.total_cents / 100).toFixed(2) + '</span></div>' +
      '</div>'
    ) : '';

    // Digital and ship now settle as one combined charge (see
    // finalize-guest-digital-physical-order), so a failure sets both
    // digitalError and shipError to the same message — shown as one block
    // when both kinds are in the cart, rather than the same failure text
    // twice.
    const bothInstantKinds = digitalItems.length > 0 && shipItems.length > 0;

    const digitalBlock = digitalResult ? (
      '<h2 style="margin-top:' + (physicalResult ? '26px' : '0') + ';">Your download' + (digitalResult.downloads.length > 1 ? 's are' : ' is') + ' ready</h2>' +
      '<p>' + (digitalResult.downloads.length > 1 ? 'Copies of these links were' : 'A copy of this link was') + ' also emailed to you.</p>' +
      digitalResult.downloads.map(function (d) {
        return '<a class="btn-download" href="' + d.download_url + '">' +
          (digitalResult.downloads.length > 1 ? 'Download ' + escapeHtml(d.item_name) : 'Download now') + '</a>';
      }).join('')
    ) : (digitalError && !bothInstantKinds ? (
      '<h2 style="margin-top:' + (physicalResult ? '26px' : '0') + ';color:var(--error);">Downloads charge failed</h2>' +
      '<p>' + escapeHtml(digitalError) + '</p>'
    ) : '');

    const shipBlock = shipResult ? (
      '<h2 style="margin-top:' + (physicalResult || digitalResult ? '26px' : '0') + ';">Your order will ship soon</h2>' +
      '<p>A confirmation with your shipping address was emailed to you.</p>' +
      '<div class="section-title">Shipping Order</div>' +
      '<div class="receipt-card">' +
        shipItems.map(function (i) {
          return '<div class="receipt-row"><div><div class="n">' + i.qty + '× ' + escapeHtml(i.name) + '</div></div>' +
            '<span class="p">$' + (i.price * i.qty).toFixed(2) + '</span></div>';
        }).join('') +
        (shipShippingFeeTotal > 0 ? '<div class="receipt-row"><span class="label">Shipping fee</span><span class="value">$' + shipShippingFeeTotal.toFixed(2) + '</span></div>' : '') +
        '<div class="receipt-row total"><span class="label">Total</span><span class="value">$' + shipSubtotal.toFixed(2) + '</span></div>' +
      '</div>'
    ) : (shipError && !bothInstantKinds ? (
      '<h2 style="margin-top:' + (physicalResult || digitalResult ? '26px' : '0') + ';color:var(--error);">Shipping items charge failed</h2>' +
      '<p>' + escapeHtml(shipError) + '</p>'
    ) : '');

    const instantErrorBlock = (bothInstantKinds && (digitalError || shipError)) ? (
      '<h2 style="margin-top:' + (physicalResult ? '26px' : '0') + ';color:var(--error);">Downloads &amp; shipping charge failed</h2>' +
      '<p>' + escapeHtml(digitalError || shipError) + '</p>'
    ) : '';

    const eyebrow = bakerName ? '<div class="eyebrow" style="text-align:center;">Receipt from ' + escapeHtml(bakerName) + '</div>' : '';

    content.innerHTML = '<div class="success-state">' + eyebrow + pickupBlock + digitalBlock + shipBlock + instantErrorBlock + '</div>';
  }

  function showNotFound() {
    content.innerHTML =
      '<div class="not-found">' +
        '<h2>Your cart session has expired</h2>' +
        '<p>Go back to the storefront and add your items again.</p>' +
        '<button id="back-btn">Go back</button>' +
      '</div>';
    document.getElementById('back-btn').addEventListener('click', function () { history.back(); });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
})();
</script>
</body>
</html>
