<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay Your Quote — Bakeri</title>
  <meta name="description" content="Pay a custom-order quote from your baker on Bakeri." />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    // See baker/theme.js for why: forces a fresh load instead of an in-app
    // browser (Instagram especially) silently resuming a stale, previously
    // visited state of this page from bfcache.
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) window.location.reload();
    });
  </script>

  <style>
    :root {
      --bg:      #FAF6EE;
      --ink:     #241712;
      --muted:   #948577;
      --bio:     #4A3E33;
      --error:   #C0392B;
      --line:    rgba(36,23,18,0.08);
      --sans:    -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17110C; --ink: #F6F1E6; --bio: #E4D9C8; --muted: #A69B8C; --line: rgba(246,241,230,0.10); }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--bio); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
    .hidden { display: none !important; }

    #page-shell { max-width: 720px; margin: 0 auto; background: var(--bg); position: relative; }

    /* Header image + logo — same treatment as baker/index.html and
       custom-order.html's identity block. Wrapped in a link (below) so
       tapping it takes the buyer back to the baker's storefront. */
    #profile-hero { position: relative; }
    #storefront-header {
      position: absolute; inset: 0; overflow: hidden;
      background: linear-gradient(135deg, #8a7a68, #5c5044);
    }
    #storefront-header img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    #header-scrim { position: absolute; inset: 0; background: rgba(20,15,10,.42); }
    #profile-block { text-align: center; padding: 40px 20px 26px; position: relative; z-index: 1; }
    #profile-link { display: block; text-decoration: none; }
    .avatar {
      width: 84px; height: 84px; margin: 0 auto; font-size: 28px;
      border-radius: 50%; background: #8a7a68; display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; overflow: hidden; position: relative;
      box-shadow: 0 2px 6px rgba(36,23,18,.15);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }
    #shop-name { font-size: 17px; font-weight: 700; color: var(--ink); margin-top: 12px; }
    #profile-hero.has-photo #shop-name { color: #fff; }

    /* Full-width white band directly under the hero, matching custom-order.html —
       one continuous surface, not a floating card. */
    #form-band { background: var(--surface, #fff); }
    @media (prefers-color-scheme: dark) { #form-band { --surface: #241a12; } }

    #page { width: 100%; max-width: 480px; margin: 0 auto; padding: 28px 20px 60px; box-sizing: border-box; }
    @media (min-width: 640px) { #page { padding: 48px 24px 60px; } }
    .eyebrow { font-size: 12px; font-weight: 700; color: var(--muted); }
    .item-name { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 4px; }
    .quote-note { font-size: 14px; color: var(--muted); margin-top: 10px; line-height: 1.5; font-style: italic; }
    .amount { font-size: 32px; font-weight: 700; color: var(--ink); margin-top: 18px; font-variant-numeric: tabular-nums; }
    .deposit-note { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    #payment-element { margin-top: 20px; }
    .btn-primary { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; margin-top: 22px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 700; border-radius: 9999px; border: none; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .submit-status { margin-top: 12px; text-align: center; font-size: 13px; color: var(--error); min-height: 16px; }
    .pickup-note { margin-top: 16px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .success-state { text-align: center; padding: 30px 0; }
    .success-state .icon {
      width: 54px; height: 54px; border-radius: 50%; background: #3FA672; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto;
    }
    .success-state h2 { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 16px; }
    .success-state p { font-size: 14px; color: var(--bio); margin-top: 10px; line-height: 1.6; }
    .not-found { text-align: center; color: var(--muted); padding: 40px 0; }
    .not-found h2 { font-size: 18px; margin-bottom: 8px; color: var(--ink); }
    .footer-links { margin-top: 30px; text-align: center; font-size: 12px; color: var(--muted); }
    .footer-links a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>

<div id="page-shell">
  <div id="profile-hero">
    <div id="storefront-header" class="hidden">
      <img id="header-img" alt="" />
      <div id="header-scrim"></div>
    </div>
    <a id="profile-link" href="https://bakeriapp.com" target="_blank" rel="noopener">
      <section id="profile-block">
        <div class="avatar" id="pb-avatar"><span id="pb-avatar-letter"></span></div>
        <div id="shop-name"></div>
      </section>
    </a>
  </div>

  <div id="form-band">
    <div id="page">
      <div class="card" id="card">
        <div class="eyebrow">Loading…</div>
      </div>
      <div class="footer-links">
        <a href="https://bakeriapp.com">bakeriapp.com</a> · <a href="https://bakeriapp.com/privacy-policy.html">Privacy</a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://aqhebjxaynvtvurwedrl.supabase.co';
  const ANON_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxaGVianhheW52dHZ1cndlZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTgwOTMsImV4cCI6MjA5MTM5NDA5M30.XgkgwDM5nyrmoJtNNNRDiBQePcBFGew13TbK76y_aOI';
  const STRIPE_PK    = 'pk_live_51TdqbXRpI8DhqX3Ful2hqNWdNtdd4Rt0QQC6IZVhxA5Du89YIEo1638vSaJmBmk5XqRbfxcbqiYJCsMJgpRWvzoP00NUFyirgh';
  const STORAGE_URL  = SUPABASE_URL + '/storage/v1/object/public';

  const params  = new URLSearchParams(window.location.search);
  const orderId = (params.get('order') || '').trim();
  const card    = document.getElementById('card');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showMessage(title, body) {
    card.innerHTML =
      '<div class="not-found">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(body) + '</p>' +
      '</div>';
  }

  if (!orderId) {
    showMessage('Link not found', 'This payment link looks incomplete.');
    return;
  }

  fetch(SUPABASE_URL + '/rest/v1/rpc/get_guest_quote_details', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
    body: JSON.stringify({ p_order_id: orderId })
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data) { showMessage('Quote not found', 'This link is no longer valid.'); return; }
    renderHeader(data);
    if (data.is_paid || data.marketplace_status === 'confirmed') {
      showMessage('Already paid', 'This quote has already been paid — thank you!');
      return;
    }
    if (data.marketplace_status !== 'quote_provided') {
      showMessage('Not available', 'This quote is no longer awaiting payment.');
      return;
    }
    renderQuote(data);
  })
  .catch(function () {
    showMessage('Something went wrong', 'Could not load this quote. Please try again later.');
  });

  // Same treatment as baker/index.html and custom-order.html's identity
  // block — a buyer reached this page via an emailed link, not by clicking
  // through the storefront, so it should still look like (and link back to)
  // the same store rather than a bare, unbranded payment form.
  function renderHeader(data) {
    const bakerId = data.baker_id;
    const name = data.business_name || 'Baker';
    document.getElementById('shop-name').textContent = name;

    const link = document.getElementById('profile-link');
    link.href = data.profile_slug
      ? 'https://bakeriapp.com/' + encodeURIComponent(data.profile_slug)
      : 'https://bakeriapp.com/baker/index.html?id=' + encodeURIComponent(bakerId);

    const letterEl = document.getElementById('pb-avatar-letter');
    letterEl.textContent = name.charAt(0).toUpperCase();
    const avatarImg = document.createElement('img');
    avatarImg.alt = name;
    avatarImg.onload = function () { avatarImg.style.display = 'block'; letterEl.style.display = 'none'; };
    avatarImg.src = STORAGE_URL + '/business-logos/' + String(bakerId).toUpperCase() + '/logo.jpg';
    document.getElementById('pb-avatar').appendChild(avatarImg);

    const hero = document.getElementById('profile-hero');
    const header = document.getElementById('storefront-header');
    const headerImg = document.getElementById('header-img');
    headerImg.alt = name;
    headerImg.onerror = function () { header.classList.add('hidden'); hero.classList.remove('has-photo'); };
    headerImg.onload = function () { header.classList.remove('hidden'); headerImg.style.display = 'block'; hero.classList.add('has-photo'); };
    headerImg.src = STORAGE_URL + '/storefront-headers/' + String(bakerId).toUpperCase() + '/header.jpg';
  }

  // Shows the buyer exactly what they asked for alongside the price — matches
  // send-guest-quote-email's renderRequestBlock so the record here is the
  // same one the buyer already saw in their quote email.
  function renderRequestBlock(answers) {
    if (!answers || !answers.length) return '';
    // Stacked label-above-value, not a two-column table: a nowrap label next
    // to a fixed-width value column squeezed the value into a sliver on a
    // phone screen once the label got long ("What colour palette and designs
    // did you have in mind?"), wrapping short answers like a date into
    // "2026-" / "08-30". Full-width rows have no column to squeeze.
    const rows = answers.map(function (a) {
      let valueHtml;
      if (a.fieldType === 'photo' && Array.isArray(a.photoPaths) && a.photoPaths.length > 0) {
        valueHtml = a.photoPaths.map(function (p) {
          return '<img src="' + STORAGE_URL + '/form-response-photos/' + p + '" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px;margin:2px 6px 2px 0;" />';
        }).join('');
      } else if (Array.isArray(a.choiceValues) && a.choiceValues.length > 0) {
        valueHtml = escapeHtml(a.choiceValues.join(', '));
      } else if (a.textValue && String(a.textValue).trim()) {
        valueHtml = escapeHtml(a.textValue);
      } else {
        return '';
      }
      return '<div style="padding:6px 0;">' +
        '<div style="color:var(--muted);font-size:11.5px;">' + escapeHtml(a.label) + '</div>' +
        '<div style="font-size:13.5px;margin-top:2px;">' + valueHtml + '</div>' +
        '</div>';
    }).filter(Boolean).join('');
    if (!rows) return '';
    return '<div style="margin:18px 0;padding:14px 16px;background:rgba(148,133,119,0.08);border-radius:10px;">' +
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;margin-bottom:2px;">What you requested</div>' +
      rows +
      '</div>';
  }

  function renderQuote(data) {
    // Guest checkout: the buyer pays exactly the quoted price — Bakeri's fee
    // comes out of the baker's side, not added here (see
    // create-guest-quote-payment-intent).
    const amount = Number(data.quoted_price || 0);
    const depositAmount = Number(data.deposit_amount_cents || 0) / 100;
    const isSplitQuote = depositAmount > 0 && depositAmount < amount;
    const depositNote = isSplitQuote
      ? '<div class="deposit-note">$' + depositAmount.toFixed(2) + ' non-refundable deposit due now &middot; $' +
        (amount - depositAmount).toFixed(2) + ' balance due later</div>'
      : '';
    card.innerHTML =
      '<div class="eyebrow">Quote from ' + escapeHtml(data.business_name) + '</div>' +
      '<div class="item-name">' + escapeHtml(data.order_name || 'Your order') + '</div>' +
      (data.quote_note ? '<div class="quote-note">"' + escapeHtml(data.quote_note) + '"</div>' : '') +
      renderRequestBlock(data.form_responses) +
      '<div class="amount">$' + amount.toFixed(2) + '</div>' +
      depositNote +
      '<button class="btn-primary" id="continue-btn">Continue to Payment</button>' +
      '<div class="submit-status" id="submit-status"></div>';

    document.getElementById('continue-btn').addEventListener('click', function () {
      const btn = document.getElementById('continue-btn');
      const status = document.getElementById('submit-status');
      btn.disabled = true;
      status.textContent = '';

      fetch(SUPABASE_URL + '/functions/v1/create-guest-quote-payment-intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
        body: JSON.stringify({ order_id: orderId })
      })
      .then(function (r) { return r.json(); })
      .then(function (piData) {
        if (piData.error || !piData.client_secret) {
          status.textContent = piData.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          return;
        }
        renderPayment(piData.client_secret, (piData.amount_cents != null ? piData.amount_cents / 100 : amount), piData.stripe_connect_account_id, piData.is_deposit === true, amount);
      })
      .catch(function () {
        status.textContent = 'Something went wrong. Please check your connection and try again.';
        btn.disabled = false;
      });
    });
  }

  function renderPayment(clientSecret, amount, connectedAccountId, isDeposit, fullAmount) {
    const balanceNote = isDeposit
      ? '<div class="pickup-note">This is a deposit of $' + amount.toFixed(2) + ' toward your total of $' + fullAmount.toFixed(2) + '. The baker will follow up separately to collect the remaining balance.</div>'
      : '';
    card.innerHTML =
      '<div class="eyebrow">' + (isDeposit ? 'Pay Deposit' : 'Pay Quote') + '</div>' +
      '<div class="item-name">$' + amount.toFixed(2) + '</div>' +
      '<div id="payment-element"></div>' +
      '<button class="btn-primary" id="pay-btn">Pay $' + amount.toFixed(2) + '</button>' +
      '<div class="submit-status" id="submit-status"></div>' +
      balanceNote +
      '<div class="pickup-note">📍 Exact pickup address is provided by email once your payment is confirmed.</div>';

    // A direct charge's PaymentIntent lives on the baker's own connected
    // account — Stripe.js must be told that account to confirm against it,
    // or the Payment Element mounts with no fields.
    const stripe = connectedAccountId ? Stripe(STRIPE_PK, { stripeAccount: connectedAccountId }) : Stripe(STRIPE_PK);
    const elements = stripe.elements({ clientSecret: clientSecret });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    document.getElementById('pay-btn').addEventListener('click', function () {
      const btn = document.getElementById('pay-btn');
      const status = document.getElementById('submit-status');
      btn.disabled = true;
      status.textContent = '';

      stripe.confirmPayment({ elements: elements, redirect: 'if_required' }).then(function (result) {
        if (result.error) {
          status.textContent = result.error.message || 'Payment failed. Please try again.';
          btn.disabled = false;
          return;
        }
        const intent = result.paymentIntent;
        if (!intent || intent.status !== 'succeeded') {
          status.textContent = 'Payment did not complete. Please try again.';
          btn.disabled = false;
          return;
        }
        finalize(intent.id);
      });
    });
  }

  function finalize(paymentIntentId) {
    fetch(SUPABASE_URL + '/functions/v1/finalize-guest-quote-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ order_id: orderId, payment_intent_id: paymentIntentId })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) {
        const status = document.getElementById('submit-status');
        if (status) status.textContent = 'Payment succeeded but we had trouble recording it — contact the baker with this reference: ' + paymentIntentId;
        return;
      }
      renderSuccess();
    });
  }

  function renderSuccess() {
    card.innerHTML =
      '<div class="success-state">' +
        '<div class="icon">✓</div>' +
        '<h2>Payment confirmed</h2>' +
        '<p>Your baker has been notified. You\'ll get pickup details by email shortly.</p>' +
      '</div>';
  }
})();
</script>
</body>
</html>
