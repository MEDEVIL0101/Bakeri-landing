<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAB · Bakeri storefront</title>
  <meta name="description" content="Private design sandbox — not a live storefront." />
  <!-- ══════════════════════════════════════════════════════════════════════
       DESIGN LAB — baker-lab/index.html
       A private, unindexed, unlinked copy of baker/index.html used to try
       layout changes against a real baker's LIVE data (default slug:
       cookiesbysteph; override with ?slug=). It only ever READS the public
       profile RPC — it never writes anything. Checkout / custom-order
       hand-offs are blocked (see labGo) so a test run can't place a real
       order. When a design lands here, port the same changes into
       baker/index.html (the real storefront) and delete nothing here.
       ══════════════════════════════════════════════════════════════════════ -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <!-- Without an explicit theme-color, iOS Safari/SFSafariViewController
       guesses the status-bar/toolbar tint itself — and evidently guesses
       the theme-tinted page background (a baker's pink/lavender/etc, from
       --bg) rather than the actual header bar color, showing as a stray
       color strip above #site-header-bar. --surface (unlike --bg) never
       varies per baker, so this can be a plain static value matching it
       exactly, with a dark-mode variant for the dark --surface. -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#241A14" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/favicon.png" />
  <script src="theme.js"></script>

  <style>
    :root {
      /* Overwritten at runtime by theme.js from the baker's chosen in-app
         theme (profiles.selected_theme) — pre-load fallback. */
      --theme-primary:   #1C1C1E;
      --theme-secondary: #A89B8C;
      --theme-bg:        #FAF6EE;
      --theme-gold:      #C49A6C;
      --theme-button-fg: #FFFFFF;

      /* Baker-adaptive */
      --bg:        var(--theme-bg);
      --accent:    var(--theme-primary);
      --accent-fg: var(--theme-button-fg);
      /* A faint wash of the baker's accent over the surface — used for the
         section/menu bar so it carries a hint of their theme colour
         without hurting the dark nav-label text. Bump the % for more. */
      --menu-bar:  color-mix(in srgb, var(--accent) 12%, var(--surface));
      /* Promotions / sale pricing — the existing red, not theme-tinted, so a
         markdown reads the same on every baker's storefront. */
      --sale:      var(--error);

      /* Fixed tokens from BakeriTheme.swift's storefront profile redesign
         (bakeriProfileInk/Muted/Bio/ChipText, bakeriProfileBadge*) — the
         same values used for the in-app baker profile, so the web page
         reads as the same product. */
      --surface:    #FFFFFF;
      --ink:        #241712;
      --muted:      #948577;
      --bio:        #4A3E33;
      --chip-text:  #7A6C5D;
      --line:       rgba(36,23,18,0.08);
      --line-soft:  rgba(36,23,18,0.06);
      --ready:      #3FA672;
      --preorder:   #C79A3D;
      --custom:     #A66A5B;
      --digital:    #5F92E6;
      --physical:   #7A8C5C;
      --error:      #C0392B;

      --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --theme-bg: #17110C;
        --surface:  #241A14;
        --ink:      #F6F1E6;
        --bio:      #E4D9C8;
        --muted:    #A69B8C;
        --chip-text:#C2B29E;
        --line:     rgba(246,241,230,0.10);
        --line-soft:rgba(246,241,230,0.08);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* iOS WKWebView paints the rubber-band overscroll area (pulling past the
       very top or bottom) using <html>'s background, not <body>'s — left
       unset, that region showed body's theme-tinted --bg (e.g. this baker's
       pale pink) instead of the header bar's actual white. Matches
       #site-header-bar's own --surface so the bounce reads as an extension
       of the bar, not a mismatched color peeking out above it. */
    html { scroll-behavior: smooth; background: var(--surface); }
    /* iOS Safari's chrome-color sampling (see html, above) reads body's
       background specifically — proven by swapping --bg for a test color
       and watching the strip follow it. Giving body its OWN opaque color
       (tried twice: --bg unconditionally, then --surface mobile-only)
       backfired both times: #theme-pattern-layer (theme.js) is a
       position:fixed, z-index:-1 div inserted as body's first child, and
       CSS's painting order puts a negative-z-index descendant BEHIND its
       ancestor's own in-flow box background — so as soon as body had a
       real painted background instead of being transparent, it covered
       the pattern everywhere body's box extends (confirmed live
       2026-08-21: every patterned baker's side-margin/overflow pattern
       disappeared). Left transparent, body paints nothing of its own —
       html's white shows through where nothing else does, and the pattern
       layer/#page-shell stay visible exactly where theme.js and the
       layout already intend them to be. Chrome-sampling on a patterned
       baker may pick up a faint tint from the pattern layer instead of
       pure white — an acceptable tradeoff next to hiding every baker's
       chosen pattern. */
    body {
      font-family: var(--sans);
      color: var(--bio);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font-family: inherit; }
    img { max-width: 100%; display: block; }
    .hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── Photo placeholder (used until a real image loads) ── */
    .ph-fallback {
      background: var(--line-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }

    /* ══════════════════════ Page shell ══════════════════════
       Everything (header through footer) lives in one width-constrained,
       opaque column — matches the in-app screen anatomy (flat cream band,
       white filter strip, then the pattern behind the product grid) and
       keeps every section the same width instead of some bleeding full-
       width and others not. The fixed pattern layer (theme.js) sits behind
       this whole shell, so on desktop it only shows in the side margins;
       on mobile the shell fills the viewport, so no margin — no pattern. */
    /* Flex column (not just block) so #site-header-bar and #profile-hero
       can swap places between mobile and desktop via `order` below,
       instead of existing as two separately-positioned/duplicated
       elements — the hamburger bar, the brand text, and both cart buttons
       are each a single DOM node shared across breakpoints. */
    #page-shell { max-width: 1200px; margin: 0 auto; background: var(--bg); position: relative; display: flex; flex-direction: column; }

    /* Auto-generated from the baker's shipping settings (free-shipping
       threshold + combined-shipping percentage, see updateAnnouncementBanner)
       — empty and hidden (.hidden, see global rule above) until a baker sets
       a free-shipping threshold on a store with physical listings. Always
       first in the shell regardless of breakpoint, so it reads above both
       the mobile hamburger bar and the desktop nav bar/hero. Colored from
       the same --accent/--accent-fg theme variables every other themed
       pill/button/badge on this page uses. */
    #announcement-banner {
      order: -2;
      background: var(--accent);
      color: var(--accent-fg);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .01em;
      padding: 10px 16px;
    }

    /* ══════════════════════ Site header bar ══════════════════════
       One shared bar: hamburger + centered brand + icons on mobile
       (renders above the hero photo, its default DOM position), brand +
       full nav row + icons on desktop (moved below the hero instead, via
       #profile-hero's order:-1 in the desktop media query — see below). */
    #site-header-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px; background: var(--menu-bar); border-bottom: 1px solid var(--line);
      position: relative; z-index: 3;
    }
    .icon-btn {
      width: 36px; height: 36px; flex-shrink: 0; border: none; background: none; color: var(--ink);
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    }
    /* The nav itself only renders inline on desktop (see media query below) —
       on mobile the same tabs render into #mobile-nav-drawer instead. */
    #section-nav-wrap { display: none; }
    .nav-bar-icons { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* Share/Cart on desktop — floats over the hero photo, same spot as the
       original overlay, rather than living in the nav row below the hero.
       Mobile uses the icons already in #site-header-bar's .nav-bar-icons
       instead (kept as a separate element, not moved via JS, so nothing
       here ever needs reparenting between breakpoints). */
    #site-header-desktop {
      display: none;
      position: absolute; top: 0; right: 0; z-index: 2;
      align-items: center; gap: 10px; padding: 14px 16px;
    }

    /* ══════════════════════ Mobile nav drawer ══════════════════════
       Opens directly below the hamburger bar — same tabs as the desktop
       inline nav, rendered as a simple stacked list instead of a wrapping
       pill row, since a vertical list reads better at hamburger-menu width. */
    #mobile-nav-drawer {
      background: var(--menu-bar); border-bottom: 1px solid var(--line);
      padding: 4px 16px 10px; display: flex; flex-direction: column;
    }
    .mobile-nav-item {
      background: none; border: none; border-bottom: 1px solid var(--line-soft);
      text-align: left; cursor: pointer; font-family: var(--sans);
      font-size: 15px; font-weight: 400; color: var(--ink); padding: 13px 4px;
    }
    .mobile-nav-item:last-child { border-bottom: none; }

    .circle-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(36,23,18,.08), 0 6px 16px rgba(36,23,18,.06);
    }
    #cart-btn { position: relative; }
    #cart-btn-count {
      position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 3px;
      border-radius: 9999px; background: var(--accent); color: var(--accent-fg);
      font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    #cart-btn-count:empty { display: none; }

    /* ══════════════════════ Header image ══════════════════════
       The photo is a full-bleed background behind the whole hero (logo,
       name, meta pill, bio). The hero is LOCKED to one aspect ratio
       (16:9, matching the ~16:9 source photos) so the image is cropped to
       the exact same shape at every screen width and just scales — it used
       to stretch to whatever height the text stack happened to be, which
       cropped the photo to a tall sliver on phones and a wide strip on
       desktop. The 350px floor covers the very narrowest phones, where
       16:9 would be too short for the centred text; there the photo shows
       a slightly taller centre crop, still the same centre subject.
       Falls back to a plain theme-colored gradient when the baker hasn't
       set one (img.onerror below).

       Height is a clamp() (not aspect-ratio) on purpose: aspect-ratio on a
       flex-column child makes Safari infer an intrinsic width of
       min-height x 16/9 (~622px), which overflows the phone and exposes the
       fixed theme pattern in the gap. 56.25vw == 9/16 of the viewport, so
       this still locks a 16:9 crop that just scales; 675px is exactly 16:9
       of the 1200px max page width, 350px is the small-phone floor. */
    #profile-hero { position: relative; width: 100%; height: clamp(350px, 56.25vw, 675px); overflow: hidden; background: var(--bg); }
    #storefront-header {
      position: absolute; inset: 0; overflow: hidden;
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
    }
    #storefront-header img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: none; }
    /* Flat scrim, not just a bottom gradient — text sits everywhere in the
       block now (avatar ring, name, meta pill, bio), not only at the
       bottom, so it all needs consistent legibility against the photo.
       Kept light (.42 was reported as visibly flattening/desaturating the
       baker's actual header photo, reading as dull instead of energetic)
       — legibility for the two plain-text elements now leans on their own
       text-shadow (below) instead of a heavy blanket wash, so the photo's
       real colour still comes through everywhere else. */
    #header-scrim { position: absolute; inset: 0; background: rgba(20,15,10,.2); }

    /* Fills the locked-ratio hero and centres its content, instead of being
       the flow child that DROVE the hero's height (which is what made the
       photo crop differently per screen size). position:absolute so it no
       longer contributes height; the hero's aspect-ratio / min-height win. */
    #profile-block {
      position: absolute; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      text-align: center; padding: 20px 20px 26px;
    }
    #profile-block .avatar {
      width: 96px; height: 96px; font-size: 34px; margin: 0 auto;
      box-shadow: 0 0 0 4px var(--bg), 0 2px 6px rgba(36,23,18,.15);
    }
    #shop-name { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 14px; }
    #shop-meta {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
      background: var(--line-soft); padding: 5px 12px; border-radius: 9999px;
    }
    #shop-meta span { font-size: 12.5px; font-weight: 500; color: var(--chip-text); }
    #shop-bio {
      font-size: 14.5px; line-height: 1.45; color: var(--bio);
      margin: 14px auto 0; max-width: 600px;
      /* Clamped so a long bio can't push past the fixed-height hero — the
         full text still lives in About. */
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* Social accounts (baker_links section literally named "Social") — small
       round icons in the hero, not rectangular rows in the body. Real
       platform icons (assets/social/*.png): a solid black circle with the
       logo cut out as transparent. Used as a CSS mask (not a plain <img>)
       on a var(--accent)-colored circle — the theme color paints the circle
       itself, the logo shape shows the wrapper's --bg behind it. Recoloring
       this way (vs. layering the image on top of a color) keeps the logo
       legible even for a near-black theme accent (Classic is #1C1C1E) —
       stacking the raw image over a same-toned color would make the cutout
       collapse into the circle with no contrast at all. */
    #social-icons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .social-icon {
      position: relative; width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; background: var(--bg);
      box-shadow: 0 1px 3px rgba(36,23,18,.15);
    }
    .social-icon-mask {
      position: absolute; inset: 0; background: var(--accent);
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      -webkit-mask-size: cover; mask-size: cover;
    }
    .social-icon-fallback { position: relative; font-size: 15px; }
    /* Once a header photo is showing, name/meta/bio switch to light text
       over the scrim instead of the plain-background dark ink tones. The
       icons themselves don't need a variant — they're already a solid
       black circle, legible against photo or plain background alike. */
    #profile-hero.has-photo #shop-name,
    #profile-hero.has-photo #shop-bio {
      color: #fff;
      /* Carries legibility for these two now that the scrim itself is
         lighter — a shadow only darkens right behind the letterforms,
         leaving the photo around them untouched, unlike raising the
         blanket scrim back up would. */
      text-shadow: 0 1px 6px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
    }
    #profile-hero.has-photo #shop-meta { background: rgba(255,255,255,.22); }
    #profile-hero.has-photo #shop-meta span { color: #fff; }

    /* About / Store policies — plain body sections further down the page,
       same treatment as FAQ/Hours, not disclosure rows in the header block
       anymore: they're real content, not something to tuck away. */
    /* Editorial — the portrait floats within the text (magazine-style pull
       image) instead of sitting in a fixed-size side column next to it, so
       it actually scales with the available width instead of staying a
       small fixed thumbnail regardless of how much room there is. Mobile
       width is a plain percentage; the >=860px override below pushes it out
       to roughly a quarter of the (up to 1200px) content column. */
    .profile-about-inner { margin-top: 12px; }
    .profile-about-inner::after { content: ""; display: table; clear: both; }
    .about-portrait {
      float: left; width: 42%; max-width: 220px; aspect-ratio: 4 / 5; height: auto;
      border-radius: 14px; object-fit: cover; background: var(--line-soft);
      margin: 0 18px 10px 0;
    }
    #pb-about p, #pb-policies p { font-size: 13.5px; line-height: 1.65; color: var(--bio); }
    /* ══════════════════════ Section bands ══════════════════════
       Every top-level content section (Menu, Links, About, FAQ, Store
       Policies, Store Hours) shares this — a plain white background, and a
       divider line automatic between any two of them regardless of which
       are hidden (a hidden one in between takes no visual space, so the
       divider still lands exactly at the seam a visitor actually sees).
       Footer is deliberately excluded — it reads as the page's close, not
       another content section. */
    .section-band { background: var(--surface); padding: 20px 20px 24px; }
    .section-band + .section-band { border-top: 1px solid var(--line); }
    /* #physical-feed (Ships to You) isn't a .section-band — it supplies its
       own per-category .category-block backgrounds — so the adjacency rule
       above can't draw the Menu→Ships to You→Digital Downloads seams. Its
       own .category-block:first-child border-top covers the top seam; this
       covers the seam into whatever .section-band follows it (Digital
       Downloads, or About when there are no digital items). */
    #physical-feed + .section-band { border-top: 1px solid var(--line); }
    .section-band h2 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    /* Sits outside #feed (the filter chips/grid are their own elements, not
       nested under one wrapper) so the heading can lead them both. */
    .section-band-heading {
      font-size: 16px; font-weight: 700; color: var(--ink);
      background: var(--surface); padding: 20px 20px 0;
    }

    /* ══════════════════════ Filter strip — white band ══════════════════ */
    #filter-strip { background: var(--surface); border-bottom: 1px solid var(--line); }
    #filter-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px;
      justify-content: center; scrollbar-width: none;
    }
    #filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; padding: 8px 16px; border-radius: 9999px; border: 1.5px solid var(--line);
      background: var(--bg); color: var(--ink); cursor: pointer;
      font-family: var(--sans); font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .filter-chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* ══════════════════════ Section nav ══════════════════════
       The section names themselves ARE the navigation — Menu, then each
       general-goods category, then Digital Downloads, then My Links/About/
       Store Hours/Store Policies — one flat scroll-to item per always-
       visible section, no separate heading text anywhere else, no
       redundant second label. Lives inline in #site-header-bar on desktop
       (see the media query below) and as a stacked list in
       #mobile-nav-drawer on mobile — #section-nav itself only wraps
       instead of scrolling for the rare desktop case where it's forced to. */
    #section-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }
    .section-tab {
      flex-shrink: 0; background: none; border: none; cursor: pointer; font-family: var(--sans);
      font-size: 15px; font-weight: 400; color: var(--muted); padding: 0 0 4px;
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .section-tab.active { color: var(--ink); border-bottom-color: var(--accent); }

    /* ══════════════════════ Link sections ══════════════════════
       Always visible, every configured section stacked at once — not one
       swapped in behind a nav click, which made Social links effectively
       invisible unless a visitor happened to tap the tab. */
    #links-feed { padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .link-section + .link-section { border-top: 1px solid var(--line); padding-top: 14px; }
    .link-list { display: flex; flex-direction: column; gap: 10px; }
    .link-row {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px;
      background: var(--bg); text-decoration: none; cursor: pointer;
    }
    .link-row .circle {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--line-soft);
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--muted);
    }
    .link-row .label { font-size: 14.5px; font-weight: 600; color: var(--ink); flex: 1; }
    .link-row .arrow { color: var(--muted); font-size: 14px; }

    /* ══════════════════════ Product Grid ══════════════════════
       Matches the app's own Market (listings) card exactly: photo with an
       overlaid kind badge, name + availability, a divider, then price +
       action on their own row — not an invented layout. The baker's
       chosen background pattern shows behind these cards (theme.js's
       #theme-pattern-layer). */
    #feed { padding: 18px 20px 28px; }
    #product-grid, .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

    /* ── Single-item Menu / category ──────────────────────────────────────
       When a grid holds exactly one card it is NOT a half-width tile in a
       2-col grid (dead space beside it). It is a fixed 220px tile — the
       SAME width the side-by-side feature card's photo uses — so the image
       size is continuous when the layout switches to side-by-side at
       >=560px, instead of the old "grow big while stacked, then snap to a
       smaller side-by-side photo at 860px". A second card drops the
       :only-child match and the normal grid takes over immediately. */
    #product-grid:has(> .p-card:only-child),
    .product-grid:has(> .p-card:only-child) { grid-template-columns: 220px; }

    @media (min-width: 560px) {
      /* Enough width for the 220px photo AND a text column beside it —
         flip the lone tile to the horizontal feature card. Photo stays
         220px square (its base width:100% + aspect-ratio:1/1 inside the
         fixed 220px track), so it doesn't change size across the switch.

         This card is the only thing in its section, so it earns a little
         more polish than a grid tile: softer rounding, a hairline border
         + hover lift, a divider between photo and copy, a larger name and
         price, and the price row pinned low instead of split off by a
         rule through the middle of the text. */
      #product-grid:has(> .p-card:only-child),
      .product-grid:has(> .p-card:only-child) {
        grid-template-columns: 1fr; max-width: 640px;
      }
      .product-grid:has(> .p-card:only-child) > .p-card {
        display: grid; grid-template-columns: 220px 1fr; align-items: stretch;
        border-radius: 20px; border: 1px solid var(--line-soft);
        box-shadow: 0 1px 2px rgba(36,23,18,.05), 0 14px 30px -14px rgba(36,23,18,.22);
        transition: transform .16s ease, box-shadow .16s ease;
      }
      .product-grid:has(> .p-card:only-child) > .p-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 3px 6px rgba(36,23,18,.06), 0 22px 42px -16px rgba(36,23,18,.3);
      }
      .product-grid:has(> .p-card:only-child) > .p-card .p-body {
        display: flex; flex-direction: column; justify-content: flex-start; overflow: hidden;
        padding: 24px; border-left: 1px solid var(--line-soft);
      }
      .product-grid:has(> .p-card:only-child) > .p-card .p-name {
        font-size: 17px; line-height: 1.3;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .product-grid:has(> .p-card:only-child) > .p-card .p-meta { font-size: 12.5px; margin-top: 6px; }
      /* Price row pinned to the bottom of the card — label up top, price
         down low — rather than a small cluster floating mid-height. */
      .product-grid:has(> .p-card:only-child) > .p-card .p-divider {
        border-top: 0; margin-top: auto; padding-top: 0;
      }
      .product-grid:has(> .p-card:only-child) > .p-card .p-price-row { justify-content: flex-start; gap: 16px; }
      .product-grid:has(> .p-card:only-child) > .p-card .p-price { font-size: 16px; }
    }

    /* ══════════════════════ Shop sections (categories) ══════════════════
       Physical items group into one headed block per category (Cookie
       Cutters, Cookie Stamps, ...) instead of one flat list — each block
       reuses .product-grid, the same photo-card grid the Menu section uses. */
    .category-block { padding: 18px 20px 8px; background: var(--surface); }
    .category-block h2 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
    .category-block:first-child { border-top: 1px solid var(--line); }
    .category-block:last-child { padding-bottom: 28px; }

    /* Digital Downloads render as plain rows, not photo-grid cards — a file
       isn't a physical product you're judging by its thumbnail the way a
       cake or cookie box is, and a lone item stretching to fill a whole
       grid cell looked broken (see 2026-08-01 screenshot report). */
    #digital-grid { display: flex; flex-direction: column; }
    .digital-row {
      display: flex; align-items: center; gap: 14px; padding: 12px 0;
      border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .digital-row:last-child { border-bottom: none; }
    .digital-row .thumb {
      width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0; position: relative;
      overflow: hidden; background: var(--line-soft);
    }
    .digital-row .thumb img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .digital-row .thumb .ph-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .digital-row .info { flex: 1; min-width: 0; }
    .digital-row .info .n { font-size: 14.5px; font-weight: 700; color: var(--ink); }
    .digital-row .info .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .digital-row .price { font-size: 14px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    /* "View all N" / "Show fewer" toggle — rendered under Digital Downloads
       and under any Ships to You category longer than its preview count
       (see renderDigitalFeed / renderPhysicalFeed). */
    .feed-toggle {
      width: fit-content; align-self: flex-start; margin-top: 14px;
      background: none; border: none; padding: 8px 0; cursor: pointer;
      font-family: var(--sans); font-size: 13.5px; font-weight: 700; color: var(--accent);
    }
    .p-card {
      cursor: pointer; background: var(--surface); border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 5px rgba(36,23,18,.08);
    }
    .p-card .p-photo { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--bg); }
    .p-card .p-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .p-badge {
      position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 9999px; color: #fff;
    }
    .p-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; }
    .p-body { padding: 10px 12px 11px; }
    .p-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
    .p-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .p-divider { border-top: 1px solid var(--line); margin-top: 9px; padding-top: 8px; }
    .p-price-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .p-price { font-size: 13.5px; font-weight: 700; color: var(--accent); }
    .p-price .from { font-size: 9.5px; font-weight: 400; color: var(--muted); display: block; }
    /* ── Sale pricing ── struck original + red current, plus a red pill on
       the photo. `.orig` is reused verbatim in the digital rows and the
       item sheet. */
    .orig { text-decoration: line-through; color: var(--muted); font-weight: 400; margin-right: 6px; }
    .p-price:has(.orig), .digital-row .price:has(.orig), .digital-row .price.on-sale { color: var(--sale); }
    .p-sale-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 10px; font-weight: 700; letter-spacing: .02em;
      padding: 4px 10px; border-radius: 9999px;
      background: var(--sale); color: #fff;
    }

    .add-btn, .qty-stepper { height: 32px; flex-shrink: 0; }
    .add-btn {
      width: 32px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-fg);
      font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .add-btn.added { background: var(--digital); font-size: 14px; }
    .qty-stepper {
      display: flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 9999px; overflow: hidden;
      animation: popIn .16s ease-out;
    }
    .qty-stepper button {
      width: 26px; height: 100%; border: none; background: transparent; color: var(--ink);
      font-size: 14px; cursor: pointer;
    }
    .qty-stepper .qty { font-size: 12px; padding: 0 2px; color: var(--ink); min-width: 12px; text-align: center; }
    @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }

    /* ══════════════════════ FAQ ══════════════════════ */
    .faq-row { border-bottom: 1px solid var(--line); }
    .faq-row:last-child { border-bottom: none; }
    .faq-q {
      width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between;
      background: none; border: none; text-align: left; cursor: pointer; padding: 10px 0;
      font-size: 14.5px; font-weight: 600; color: var(--ink);
    }
    .faq-q .ind { color: var(--muted); font-size: 18px; }
    .faq-a { max-height: 0; overflow: hidden; transition: max-height .2s ease-out; }
    .faq-a p { font-size: 13.5px; line-height: 1.7; color: var(--bio); padding-bottom: 14px; }
    .faq-row.open .faq-a { max-height: 400px; }

    /* Store Hours — free-flowing text elsewhere in these sections is fine
       filling the full-width container; a day/time list isn't. A
       space-between row stretched across the whole container would strand
       "Mon" and "9:00–17:00" at opposite edges with a long dead gap between
       them, so the row list itself stays a compact, natural width. */
    #hours-rows { max-width: 320px; }
    #hours-card .row { display: flex; justify-content: space-between; gap: 24px; padding: 4px 0; font-size: 13px; }
    #hours-card .day { color: var(--muted); }
    #hours-card .time { color: var(--ink); }

    /* ══════════════════════ Footer ══════════════════════ */
    #site-footer { background: var(--surface); border-top: 1px solid var(--line); padding: 20px 20px 120px; text-align: center; }
    #footer-contact { font-size: 12.5px; line-height: 1.7; color: var(--muted); }
    #footer-contact a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
    #footer-credit { margin-top: 18px; font-size: 12px; color: var(--muted); }
    #footer-credit a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

    /* ══════════════════════ Fixed Bottom Bar — only ever shows once the
       cart has something in it; an empty-cart CTA here would just repeat
       the page itself. ══════════════════════ */
    #action-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    }
    #action-bar-cart {
      display: none; align-items: center; justify-content: space-between; height: 56px;
      background: var(--accent); color: var(--accent-fg); border-radius: 9999px; padding: 0 8px 0 20px; cursor: pointer;
      border: none; width: 100%; box-shadow: 0 10px 30px -8px rgba(0,0,0,.35);
      animation: popIn .18s ease-out;
    }
    #action-bar-cart .l { text-align: left; }
    #action-bar-cart .l .t { font-size: 14.5px; font-weight: 700; }
    #action-bar-cart .l .s { font-size: 11px; color: var(--accent-fg); opacity: .75; margin-top: 2px; }
    #action-bar-cart .r {
      font-size: 14px; font-weight: 700; background: var(--surface); color: var(--ink);
      border-radius: 9999px; padding: 10px 16px;
    }

    /* ══════════════════════ Sheets / Modal / Toast ══════════════════════ */
    .scrim {
      position: fixed; inset: 0; background: rgba(20,15,10,.55); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .scrim.open { display: flex; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 480px; max-height: 90%; overflow: auto;
      overscroll-behavior: contain;
      border-radius: 24px 24px 0 0; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
      animation: riseIn .22s ease-out;
    }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sheet-close {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(20,15,10,.5); color: #fff; border: none; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 9999px; border: none; cursor: pointer; font-weight: 700; font-size: 15px;
      text-decoration: none; font-family: var(--sans);
    }
    .btn-primary { height: 50px; background: var(--accent); color: var(--accent-fg); }
    .btn-outline { height: 48px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

    /* Same 1/1 ratio as .p-card .p-photo in the grid — the detail sheet's
       photo should look like the same product photo, just larger, not a
       differently-cropped shape. */
    /* Photo stays pinned at the top; only the body scrolls internally — a
       long description used to drag the photo along with it inside one
       shared scroll area, which also let the sheet rubber-band past its own
       edges on touch and expose blank space behind the rounded corners. */
    /* Overrides .sheet's shared max-height: 90% — with real content (photo +
       fixed header + a long description) the sheet already reached that cap
       naturally, so raising it (not just replacing max-height with an equal
       height) is what actually reclaims the dimmed gap above it for the
       description to use. Cart sheet keeps the shared 90%; this is scoped
       to the item detail sheet specifically. */
    #item-sheet { display: flex; flex-direction: column; overflow: hidden; height: 96%; max-height: 96%; }
    #item-sheet-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    /* min-height: 0 overrides the flex-item default of min-height: auto —
       without it, a tall portrait source photo whose height:100% can't
       resolve against an aspect-ratio-only parent falls back to its natural
       aspect ratio and forces this box taller than its intended 1/1 square,
       eating into the space the scrollable body needs below it. */
    /* touch-action: none — the photo has no scrollable content of its own,
       so a touch/scroll gesture starting on it could otherwise fall through
       and pan the page behind the sheet on iOS Safari. This stops the
       gesture at its source instead of locking/restoring body scroll (which
       caused its own bug: the page jumping back to the tapped card's
       position when the sheet closed). */
    #item-sheet-photo { position: relative; aspect-ratio: 1/1; background: var(--line-soft); flex: none; min-height: 0; overflow: hidden; touch-action: none; }
    #item-sheet-photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
    /* Name/price/box-selector/cta stay put; only the description+specs
       scroll. Two flex children instead of one shared scroll area, same
       reasoning as the photo/body split above. */
    #item-sheet-body { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 14px 20px 14px; }
    #item-sheet-fixed { flex: none; }
    #item-sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    #item-sheet-name { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 6px; }
    #item-sheet-price { font-size: 16px; font-weight: 700; color: var(--accent); margin-top: 2px; }
    #item-sheet-price:has(.orig) { color: var(--sale); }
    /* Kept tight (10px, not 16) — on a has_variants listing especially, the
       photo (fixed 1:1) plus name/price/option-picker/CTA above already
       claim most of a typical viewport's height, and every px trimmed here
       is a px the description preview actually gets to use. */
    #item-sheet-desc { font-size: 14px; line-height: 1.6; color: var(--bio); margin-top: 10px; }
    /* Clamped by default so a short description never scrolls at all and a
       long one doesn't dominate the sheet on open — "Read more" only shows
       up when the text actually overflows the clamp (see openItemSheet).
       Kept short (2 lines, not 4) — the sheet's photo/price/options/CTA
       already fill most of the viewport above this, so 4 lines of preview
       often left barely any of the description actually visible before
       running into the bottom of the screen. A short, honest preview plus
       a reliably-reachable "Read more" (openDescSheet) beats a long one
       that mostly gets cut off anyway. */
    #item-sheet-desc.clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #item-sheet-desc.tappable { cursor: pointer; }
    #item-sheet-desc-toggle {
      display: none; background: none; border: none; padding: 0; margin-top: 8px;
      font-size: 13px; font-weight: 700; color: var(--accent); cursor: pointer; font-family: inherit;
    }
    .spec-list { margin-top: 8px; }
    .spec-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); color: var(--muted); }
    .spec-row b { color: var(--ink); font-weight: 600; }
    #item-sheet-body .btn { width: 100%; height: 46px; margin-top: 12px; }

    #item-sheet-box { margin-top: 12px; }
    .box-step-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin-bottom: 6px; }
    .box-tiers { display: flex; gap: 8px; margin-bottom: 10px; }
    .box-tier {
      flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 14px; background: transparent;
      padding: 8px 6px; text-align: center; cursor: pointer;
    }
    .box-tier.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .box-tier.disabled { opacity: .45; cursor: not-allowed; }
    /* Only the listing-variant picker (not Assorted Box's size tiers) ever
       renders one of these — an <img> with no matching remote file 404s
       and hides itself (onerror), so a plain Assorted Box tier with no
       thumb markup at all still looks identical to before. */
    .box-tier-thumb { display: block; width: 34px; height: 34px; object-fit: cover; border-radius: 8px; margin: 0 auto 6px; background: var(--line-soft); }
    .box-tier-label { font-size: 12.5px; font-weight: 700; color: var(--ink); }
    .box-tier-price { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .box-flavor-header { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    .box-flavor-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .box-flavor-thumb { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; background: var(--line-soft); flex-shrink: 0; }
    .box-flavor-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
    .box-flavor-row .stepper {
      display: flex; align-items: center; border: 1px solid var(--line); border-radius: 9999px; height: 32px; flex-shrink: 0;
    }
    .box-flavor-row .stepper button { width: 28px; height: 100%; border: none; background: none; font-size: 15px; cursor: pointer; color: var(--ink); }
    .box-flavor-row .stepper button:disabled { opacity: .3; cursor: default; }
    .box-flavor-row .stepper .qty { font-size: 13px; min-width: 16px; text-align: center; }

    #cart-sheet-body { padding: 18px 20px 24px; }
    #desc-sheet-body { padding: 4px 20px 28px; }
    #desc-sheet-title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
    #desc-sheet-text { font-size: 15px; line-height: 1.75; color: var(--bio); white-space: pre-wrap; }
    #cart-step-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin-bottom: 8px; }
    .cart-line { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cart-line .thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--line-soft); flex-shrink: 0; overflow: hidden; }
    .cart-line .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-line .info { flex: 1; min-width: 0; }
    .cart-line .info .n { font-size: 14px; font-weight: 600; color: var(--ink); }
    .cart-line .info .m { font-size: 11px; color: var(--muted); }
    .cart-line .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 9999px; height: 36px; }
    .cart-line .stepper button { width: 28px; height: 100%; border: none; background: none; font-size: 15px; cursor: pointer; color: var(--ink); }
    .cart-line .stepper .qty { font-size: 12px; min-width: 16px; text-align: center; }
    .cart-line .total { font-size: 13px; color: var(--ink); width: 56px; text-align: right; }
    .cart-line .remove-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 13px; cursor: pointer; flex-shrink: 0; }
    .cart-section-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--muted); margin: 16px 0 8px; }

    .cart-financial-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--bio); }
    .cart-financial-row.total { font-weight: 700; color: var(--ink); font-size: 16px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
    .cart-note { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 10px; }

    .field { margin-top: 12px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 14px;
    }

    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 9999px; font-size: 13px;
      z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .avatar {
      border-radius: 50%; background: var(--theme-secondary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; overflow: hidden; position: relative;
      box-shadow: 0 2px 6px rgba(36,23,18,.15);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }

    /* ══════════════════════ Desktop ══════════════════════ */
    @media (min-width: 860px) {
      /* Stands the column off the patterned backdrop showing in the side
         margins — on mobile the shell fills the viewport edge to edge, so
         there's no backdrop to separate from and no shadow needed there. */
      #page-shell { box-shadow: 0 8px 40px rgba(20,15,10,.14); }

      /* Swaps the hero above the header bar instead of below it — the only
         change needed to move #site-header-bar from "above the photo"
         (mobile) to "below the photo" (desktop). */
      #profile-hero { order: -1; }

      #mobile-menu-btn { display: none; }
      #mobile-nav-drawer { display: none !important; }
      /* The bar below the hero is nav-only on desktop — no brand text on
         either breakpoint (the name already reads prominently in the hero
         itself). Share/Cart move to #site-header-desktop (floating over
         the hero) instead of living in this bar, restoring their original
         top-of-page spot. */
      .nav-bar-icons { display: none; }
      #site-header-desktop { display: flex; }
      #site-header-bar { padding: 14px 20px; justify-content: center; }
      #section-nav-wrap { display: block; flex: 1; }

      /* auto-fit (not auto-fill) — with only a few cards, auto-fill still
         reserves the grid columns unfilled cards WOULD have used, leaving
         a dead gap where a phantom next card should be. auto-fit collapses
         those, letting the real cards stretch to actually fill the row. */
      #product-grid, .product-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; }
      .p-card:hover .p-photo { opacity: .92; }

      /* Roughly a quarter of the (up to 1200px) content column, not the 42%
         the narrower mobile width uses — at this width 42% would swallow
         the paragraph down to a sliver next to it. */
      .about-portrait { width: 25%; max-width: 300px; margin: 0 28px 10px 0; }

      #action-bar { display: none; }
      #desktop-cart-btn { display: flex !important; }
      #cart-btn { display: none; }

      .scrim { align-items: center; }
      #cart-sheet { max-width: 800px; width: 90%; border-radius: 24px; max-height: 88vh; }
      /* Narrower than cart-sheet — at 800px wide, even a same-ratio square
         photo was too large a presence. Image stays stacked on top (not
         side-by-side with the details column, which forced it to stretch
         via aspect-ratio: auto; height: 100% to match whatever height the
         details column happened to be, visibly rescaling as more content —
         a chosen size, then flavors — appeared). */
      #item-sheet { max-width: 560px; width: 90%; border-radius: 24px; max-height: 92vh; height: 92vh; }

      #cart-sheet { max-width: 440px; margin-left: auto; margin-right: 0; height: 100%; max-height: 100%; border-radius: 0; box-shadow: -20px 0 50px -20px rgba(0,0,0,.4); }
      .scrim:has(#cart-sheet) { justify-content: flex-end; }
    }
    /* ── DESIGN LAB ribbon ── (baker-lab only; not in baker/index.html) */
    #lab-ribbon {
      position: sticky; top: 0; z-index: 9999;
      background: repeating-linear-gradient(45deg, #1c1c1e, #1c1c1e 12px, #2b2b2e 12px, #2b2b2e 24px);
      color: #fff; font-family: var(--sans);
      font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      text-align: center; padding: 6px 12px; line-height: 1.35;
    }
    #lab-ribbon span { opacity: .7; text-transform: none; font-weight: 500; letter-spacing: 0; }
  </style>
</head>
<body>

<div id="lab-ribbon">Design lab — not a live storefront

<script>
(function () {

  const params  = new URLSearchParams(window.location.search);

  const slug    = (params.get('slug') || 'cookiesbysteph').trim().toLowerCase();
  const bakerID = (params.get('id')   || '').trim();
  const isCleanRedirect = params.get('clean') === '1';

  const WEEKDAY_LABELS = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };
  const WEEKDAY_ORDER  = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

  // pickup_hours_json stores open/close as 24h "HH:mm" (see PickupHours.swift)
  // — convert to standard 12h "h:mm AM/PM" for display.
  function formatTime12h(hhmm) {
    const parts = (hhmm || '').split(':');
    const h24 = parseInt(parts[0], 10);
    const min = parts[1] || '00';
    if (isNaN(h24)) return hhmm;
    const period = h24 >= 12 ? 'PM' : 'AM';
    const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
    return h12 + ':' + min + ' ' + period;
  }
  const FILTERS = [
    { key: 'all',     label: 'All' },
    { key: 'now',     label: 'Ready Now' },
    { key: 'pre',     label: 'Pre-order' },
    { key: 'custom',  label: 'Custom' }
  ];

  let profile = null;
  let allListings = [];
  let allLinks = [];
  let resolvedBakerId = bakerID;
  let tab = 'all';
  let cart = {}; // { itemId: qty } — ready_now items only; preorder always uses preorderCartLines below
  let boxCartLines = []; // Assorted Box lines: { lineId, menuItemId, tierId, tierLabel, unitCount, price, qty, variants: [{variantId, name, qty}] }
  let boxState = null; // in-progress box picker: { item, tierId, chosen: {variantId: qty} }

  let preorderCartLines = [];
  let preorderState = null; // in-progress preorder date picker: { item, chosenISO }
  let cartStep = 0; // 0 order, 1 customer info, 2 confirmed
  let toastTimer = null;
  // Digital Downloads and each Ships to You category show a preview of this
  // many items, then a "View all N" tap that expands the rest inline (and a
  // "Show fewer" to re-collapse). Only kicks in past the preview count — a
  // short list doesn't need hiding. The Menu is deliberately NOT capped:
  // every ready_now/preorder/custom listing always shows in full.
  // See renderDigitalFeed / renderPhysicalFeed.
  const DIGITAL_PREVIEW_COUNT = 6;
  const PHYSICAL_PREVIEW_COUNT = 6;
  let digitalExpanded = false;
  let physicalExpanded = {}; // { [categorySlug]: true } once "View all" tapped
  // Digital downloads have their own tiny cart — just a set of item ids
  // (qty is always 1, no dates/tiers/variants to track) — kept separate
  // from the pickup cart above since it can check out on its own straight
  // to digital-checkout.html, or combine with the pickup cart into one

  let digitalCart = [];
  // Ships (physical) items also get their own small cart, same reasoning as
  // digitalCart above (checks out independently, or chains into the pickup
  // checkout when mixed — see goToCheckout) — but unlike digital these are
  // stock-bound, so it's a { itemId: qty } map rather than a bare id list.
  let shipCart = {};
  // Digital/physical items with listing_variants (a picked size/option, its
  // own price and — physical only — its own stock) can't fit shipCart's
  // flat { itemId: qty } map or digitalCart's bare-id list, since the same
  // base item can appear more than once with different options chosen.
  // Kept as their own line arrays, same pattern as boxCartLines above.
  let shipVariantCartLines = [];    // { lineId, menuItemId, variantId, variantLabel, price, qty }
  let digitalVariantCartLines = []; // { lineId, menuItemId, variantId, variantLabel, price }
  let variantState = null; // in-progress listing-variant picker: { item, variantId }
  // Direct checkout (ready_now / preorder) needs the baker's Stripe Connect
  // payout wired up; custom-quote inquiries don't touch payment at intake
  // time (submit-custom-order-inquiry lands a pending_quote lead), so those
  // stay open even before onboarding finishes.
  let stripeReady = false;

  // ── Cart persistence — keyed per baker so a visitor's cart from one
  // storefront never bleeds into another's. ──
  function cartStorageKey() { return 'bakeri_cart_' + resolvedBakerId; }
  function loadCart() {
    try {
      const raw = JSON.parse(sessionStorage.getItem(cartStorageKey()) || '{}');
      // Backward compatible with sessions saved before Assorted Box shipped,
      // when this key held the flat { itemId: qty } map directly, and with
      // sessions saved before per-date preorder lines shipped, when a
      // preorder's date lived in a flat { itemId: isoString } map (raw.preorderDates)
      // instead of preorderCartLines — that old shape is simply dropped, since
      // sessionStorage is ephemeral and re-picking a date is a one-click fix.
      if (raw && (raw.cart || raw.boxLines || raw.preorderLines || raw.preorderDates)) {
        cart = raw.cart || {};
        boxCartLines = raw.boxLines || [];
        preorderCartLines = raw.preorderLines || [];
        digitalCart = raw.digitalCart || [];
        shipCart = raw.shipCart || {};
        shipVariantCartLines = raw.shipVariantLines || [];
        digitalVariantCartLines = raw.digitalVariantLines || [];
      } else {
        cart = raw || {};
        boxCartLines = [];
        preorderCartLines = [];
        digitalCart = [];
        shipCart = {};
        shipVariantCartLines = [];
        digitalVariantCartLines = [];
      }
    } catch (e) {
      cart = {}; boxCartLines = []; preorderCartLines = []; digitalCart = []; shipCart = {};
      shipVariantCartLines = []; digitalVariantCartLines = [];
    }
  }
  function saveCart() {
    try {
      sessionStorage.setItem(cartStorageKey(), JSON.stringify({
        cart: cart, boxLines: boxCartLines, preorderLines: preorderCartLines,
        digitalCart: digitalCart, shipCart: shipCart,
        shipVariantLines: shipVariantCartLines, digitalVariantLines: digitalVariantCartLines
      }));
    } catch (e) {}
  }

  if (!slug && !bakerID) {
    showNotFound('No baker specified', 'This link appears to be invalid.');
    return;
  }

  const rpcName = slug ? 'get_baker_web_profile_by_slug' : 'get_baker_web_profile_by_id';
  const rpcBody = slug ? { p_slug: slug } : { p_user_id: bakerID };

  fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpcName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
    body: JSON.stringify(rpcBody)
  })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    if (!data || !data.profile) { showNotFound('Baker not found', 'No baker found at this link.'); return; }
    profile = data.profile;
    resolvedBakerId = profile.id;
    // LAB: name the baker whose live data is on screen
    try {
      var _lr = document.getElementById('lab-ribbon-sub');
      if (_lr) _lr.textContent = ' — live data: ' + (profile.business_name || slug);
    } catch (e) {}
    loadCart();
    // LAB: ?theme= / ?pattern= force a specific look regardless of what the
    // baker has set — for visualising the storefront across the 13 themes
    // and 5 patterns. e.g. ?slug=cookiesbysteph&theme=Sprinkle&pattern=Polka%20Dot
    var themeOverride = params.get('theme');
    var patternOverride = params.get('pattern');
    if (themeOverride) profile.selected_theme = themeOverride;
    if (patternOverride) profile.background_pattern = patternOverride;
    if (window.BakeriTheme) window.BakeriTheme.apply(profile);
    render(profile, data.listings || [], data.faqs || [], data.links || []);
    if (isCleanRedirect && slug && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '/' + slug);
    }
  })
  .catch(function () { showNotFound('Something went wrong', 'Could not load this profile. Try again later.'); });

  // ══════════════════════ Render ══════════════════════

  // Auto-generated from the baker's own shipping settings — no freeform
  // banner-text field exists, this always just reflects whatever's
  // actually configured (see WebShopShippingSheet), so it can never go
  // stale relative to the real checkout math. Silent for the common case
  // (no threshold set, or no physical listings at all); only mentions the
  // additional-item percentage once it's not the no-op 100% default.
  function updateAnnouncementBanner(profile, listings) {
    const banner = document.getElementById('announcement-banner');
    if (!banner) return;
    const threshold = profile.shipping_free_over_threshold || 0;
    const hasPhysical = listings.some(function (l) { return l.listing_kind === 'physical'; });
    if (threshold <= 0 || !hasPhysical) {
      banner.classList.add('hidden');
      banner.textContent = '';
      return;
    }
    let text = 'Free shipping over $' + threshold.toFixed(2);
    const percent = profile.shipping_additional_item_percent;
    if (percent != null && percent < 100 && percent > 0) {
      text += ' · ' + Math.round(100 - percent) + '% off shipping on extra items';
    } else if (percent === 0) {
      text += ' · Free shipping on every extra item';
    }
    banner.textContent = text;
    banner.classList.remove('hidden');
  }

  function render(profile, listings, faqs, links) {
    // A custom listing with no intake form attached has no working way to
    // actually collect a request — customOrderURL would build a link with
    // an empty &form= param, which custom-order.html correctly rejects as

    // it the same as any other not-actually-ready-to-show content (see the

    // until the baker finishes setting it up.
    allListings = listings.filter(function (l) { return l.listing_kind !== 'custom' || l.intake_form_id; });
    allListings.forEach(applyListingPromo);
    allLinks = links;
    updateAnnouncementBanner(profile, listings);
    const name = profile.business_name || profile.user_name || 'Baker';
    const location = profile.neighbourhood
      ? [profile.neighbourhood, profile.pickup_province].filter(Boolean).join(', ')
      : [profile.pickup_city, profile.pickup_province].filter(Boolean).join(', ') || profile.location || '';

    document.title = 'LAB · ' + name;
    document.querySelector('meta[name="description"]').content = name + ' — handcrafted bakes on Bakeri. ' + (profile.bio || '');

    stripeReady = profile.stripe_connect_onboarding_complete === true;

    renderAvatar(name);
    renderHeaderImage(name);

    document.getElementById('shop-name').textContent = name;
    if (location) {
      document.getElementById('shop-meta-text').textContent = location;
      document.getElementById('shop-meta').classList.remove('hidden');
    }

    if (profile.bio) {
      document.getElementById('shop-bio').textContent = profile.bio;
      document.getElementById('shop-bio').classList.remove('hidden');
    }
    renderSocialIcons();

    renderHours(profile.pickup_hours_json);
    renderAboutAndPolicies(profile, name);
    renderFAQ(faqs);
    renderDigitalFeed();
    renderPhysicalFeed();
    renderLinkSections();
    renderFooter(profile, name);

    document.getElementById('share-btn').addEventListener('click', shareLink);
    document.getElementById('share-btn-mobile').addEventListener('click', shareLink);
    document.getElementById('mobile-menu-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      document.getElementById('mobile-nav-drawer').classList.toggle('hidden');

    // Closes the mobile nav drawer on any click outside it — wired once
    // here rather than inside renderSectionNav, since the drawer's
    // contents get rebuilt on every render but this document-level

      const drawer = document.getElementById('mobile-nav-drawer');
      if (!drawer.classList.contains('hidden') && !drawer.contains(e.target)) {
        closeMobileNav();
      }
    });

    updateFeedVisibility();
    renderFilterBar();
    renderGrid();
    renderSectionNav();
    updateCartUI();
    updateDigitalCartUI();
    updateShipCartUI();

    document.getElementById('cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('desktop-cart-btn').addEventListener('click', openCartSheet);
    document.getElementById('action-bar-cart').addEventListener('click', openCartSheet);
    document.getElementById('item-sheet-close').addEventListener('click', closeItemSheet);
    document.getElementById('cart-sheet-close').addEventListener('click', closeCartSheet);
    document.getElementById('desc-sheet-close').addEventListener('click', closeDescSheet);

  function renderAvatar(name) {
    const logoURL = STORAGE_URL + '/business-logos/' + resolvedBakerId.toUpperCase() + '/logo.jpg';
    const initial = name.charAt(0).toUpperCase();
    const el = document.getElementById('pb-avatar');

  function renderHeaderImage(name) {
    const hero = document.getElementById('profile-hero');

    img.alt = name;
    img.onerror = function () { header.classList.add('hidden'); hero.classList.remove('has-photo'); };
    img.onload = function () { header.classList.remove('hidden'); img.style.display = 'block'; hero.classList.add('has-photo'); };

  // Only renders if the baker has actually configured hours in the app (the
  // Pickup & Hours editor) — an untouched profile has an empty object, and
  // showing a fake "closed every day" table would be worse than showing
