<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakeri — Invitation Only</title>
  <link rel="icon" href="1024.png" />
  <link rel="apple-touch-icon" href="1024.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: #FAF5EE;
      color: #1A0808;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 18px;
      overflow: hidden;
      margin: 0 auto 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      color: #6B1212;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    p {
      font-size: 1rem;
      color: #8C5858;
      max-width: 340px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="icon"><img src="1024.png" alt="Bakeri" /></div>
  <h1>This page is<br>invitation only.</h1>
  <p>If you received an invitation, please use the link that was sent to you.</p>
</body>
</html>
